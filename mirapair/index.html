<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミラペア</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* ミラペア 試作品：ふたりの相性と未来を毎日のぞくアプリ。データは端末のブラウザだけに保存。 */
:root{
  --bg:#FFF7F3; --card:#FFFFFF; --card2:#FFF1EC; --ink:#2A1F3D; --muted:#776C84; --line:#F0E0DA;
  --pink:#E3507A; --pink-soft:#FDE5EC; --sky:#5B63E8; --sky-soft:#E9EAFF; --sun:#E89B12; --ok:#1C9467; --ok-soft:#DFF4EC; --warn-soft:#FFF0D6;
  --hero1:#FF8FA3; --hero2:#8C7BFF;
  --f-head:"Zen Maru Gothic","Noto Sans JP",system-ui,sans-serif; --f-body:"Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111F; --card:#201A2D; --card2:#281F37; --ink:#F3EEF8; --muted:#A79DB5; --line:#372D47;
  --pink:#FF7EA2; --pink-soft:#41233A; --sky:#9AA2FF; --sky-soft:#272A4D; --sun:#FFC25C; --ok:#5FD3A2; --ok-soft:#173A2E; --warn-soft:#3A2D16;
  --hero1:#B8476A; --hero2:#5A4BC8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111F; --card:#201A2D; --card2:#281F37; --ink:#F3EEF8; --muted:#A79DB5; --line:#372D47;
  --pink:#FF7EA2; --pink-soft:#41233A; --sky:#9AA2FF; --sky-soft:#272A4D; --sun:#FFC25C; --ok:#5FD3A2; --ok-soft:#173A2E; --warn-soft:#3A2D16;
  --hero1:#B8476A; --hero2:#5A4BC8; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.7; -webkit-tap-highlight-color:transparent}
#app{max-width:480px; margin:0 auto; min-height:100vh; padding:0 16px calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-head); font-weight:900; margin:0; line-height:1.35}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:.82rem} .center{text-align:center}
.top{display:flex; align-items:center; gap:10px; padding:16px 0 10px}
.logo{font-family:var(--f-head); font-weight:900; font-size:1.35rem; letter-spacing:.02em}
.logo b{color:var(--pink)}
.top .sp{flex:1}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:.75rem; font-weight:700; padding:2px 10px; border-radius:99px; background:var(--pink-soft); color:var(--pink)}
.pill.sky{background:var(--sky-soft); color:var(--sky)} .pill.ok{background:var(--ok-soft); color:var(--ok)}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin:12px 0}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.hero{background:linear-gradient(140deg,var(--hero1),var(--hero2)); color:#fff; border:0; position:relative; overflow:hidden}
.hero .muted{color:rgba(255,255,255,.85)}
.hero .big{font-family:var(--f-head); font-weight:900; font-size:2.6rem; line-height:1}
.row{display:flex; align-items:center; gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn{appearance:none; border:0; border-radius:14px; padding:12px 16px; font:700 .95rem var(--f-body); cursor:pointer; background:var(--pink); color:#fff; width:100%}
.btn.sub{background:var(--card2); color:var(--ink); border:1px solid var(--line)}
.btn.ghost{background:transparent; color:var(--muted); border:0; width:auto; padding:8px}
.btn.white{background:#fff; color:#5a3a7a}
.btn:disabled{opacity:.45; cursor:default}
.btn.sm{padding:8px 12px; font-size:.85rem; width:auto; border-radius:12px}
.back{appearance:none; border:0; background:var(--card); border:1px solid var(--line); color:var(--ink); width:38px; height:38px; border-radius:12px; font-size:1.1rem; cursor:pointer}
label.f{display:block; font-size:.82rem; font-weight:700; color:var(--muted); margin:12px 0 4px}
input,select{width:100%; font:500 1rem var(--f-body); padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink)}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{appearance:none; flex:1 1 auto; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:9px 10px; font:500 .88rem var(--f-body); cursor:pointer}
.seg button.on{background:var(--pink); border-color:var(--pink); color:#fff; font-weight:700}
.opts{display:grid; gap:8px; margin-top:10px}
.opt{appearance:none; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:14px; padding:12px 14px; font:500 .95rem var(--f-body); cursor:pointer}
.opt.on{border-color:var(--pink); background:var(--pink-soft); font-weight:700}
.nav{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:5}
.nav .in{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.nav button{appearance:none; border:0; background:none; color:var(--muted); padding:8px 0 10px; font:700 .7rem var(--f-body); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px}
.nav button svg{width:24px; height:24px}
.nav button.on{color:var(--pink)}
.bar{height:10px; border-radius:99px; background:var(--card2); overflow:hidden}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--hero1),var(--hero2)); border-radius:99px}
.item{display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
.item:first-child,h3+.item{border-top:0}
.item>.btn{align-self:center; white-space:nowrap}
.ic{flex:none; width:36px; height:36px; border-radius:12px; display:grid; place-items:center; font-weight:900; font-family:var(--f-head)}
.ic.fun{background:var(--ok-soft); color:var(--ok)} .ic.hard{background:var(--warn-soft); color:var(--sun)}
.note{background:var(--warn-soft); border-radius:12px; padding:10px 12px; font-size:.82rem; margin:10px 0}
.lock{position:relative}
.lockmask{border:1px dashed var(--line); border-radius:14px; padding:14px; text-align:center; background:var(--card2); margin-top:10px}
table.t{width:100%; border-collapse:collapse; font-size:.85rem}
table.t th,table.t td{padding:7px 4px; border-bottom:1px solid var(--line); text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted); font-size:.75rem}
.toggle{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); gap:10px}
.toggle:first-of-type{border-top:0}
.sw{appearance:none; width:46px; height:28px; border-radius:99px; background:var(--line); position:relative; cursor:pointer; flex:none; border:0; padding:0}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s}
.sw.on{background:var(--pink)} .sw.on::after{left:21px}
.toast{position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(440px,calc(100% - 32px)); background:var(--ink); color:var(--bg); border-radius:14px; padding:12px 14px; font-size:.85rem; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed; inset:0; background:rgba(20,10,30,.55); z-index:30; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--bg); width:100%; max-width:480px; max-height:92vh; overflow:auto; border-radius:22px 22px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.cmp{display:grid; grid-template-columns:1fr 64px 96px; font-size:.85rem; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--card)}
.cmp div{padding:8px 10px; border-top:1px solid var(--line)}
.cmp .h{font-weight:700; font-size:.75rem; color:var(--muted); border-top:0; background:var(--card2)}
.cmp .c{text-align:center}
.cmp .p{color:var(--pink); font-weight:900}
.price{display:grid; gap:8px; margin:12px 0}
.price button{appearance:none; text-align:left; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:14px; padding:12px 14px; cursor:pointer; font:500 .9rem var(--f-body)}
.price button.on{border-color:var(--pink)}
.price b{font-family:var(--f-head); font-size:1.15rem}
.handoff{text-align:center; padding:40px 10px}
.handoff .circle{width:96px; height:96px; border-radius:50%; margin:0 auto 14px; background:linear-gradient(140deg,var(--hero1),var(--hero2)); display:grid; place-items:center; color:#fff; font:900 2rem var(--f-head)}
.reveal{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.reveal div{background:var(--card2); border-radius:12px; padding:10px}
.reveal b{display:block; font-size:.75rem; color:var(--muted)}
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:12px}
.scale button{appearance:none; aspect-ratio:1; border-radius:50%; border:2px solid var(--line); background:var(--card); cursor:pointer}
.scale button.on{background:var(--pink); border-color:var(--pink)}
.poles{display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); margin-top:6px; gap:10px}
.poles span:last-child{text-align:right}
.photo{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.slot{aspect-ratio:1; border-radius:18px; border:2px dashed var(--line); display:grid; place-items:center; text-align:center; font-size:.8rem; color:var(--muted); overflow:hidden; position:relative; cursor:pointer; background:var(--card)}
.slot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.slot input{position:absolute; inset:0; opacity:0; cursor:pointer}
.scenes{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.scene{border-radius:16px; background:linear-gradient(160deg,var(--card2),var(--sky-soft)); aspect-ratio:3/4; padding:10px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--line)}
.scene .faces{display:flex; justify-content:center}
.scene .faces img{width:48px; height:48px; border-radius:50%; object-fit:cover; border:2px solid var(--card); margin:0 -6px}
.scene .ph{flex:1; display:grid; place-items:center; font-size:.72rem; color:var(--muted); text-align:center}
.range{position:relative; height:54px; margin:8px 0 4px}
.range .axis{position:absolute; left:0; right:0; top:26px; height:2px; background:var(--line)}
.range .span{position:absolute; top:18px; height:18px; border-radius:99px; opacity:.85}
.range .mid{position:absolute; top:12px; width:3px; height:30px; border-radius:2px; background:var(--ink)}
.range .lab{position:absolute; top:0; font-size:.72rem; font-weight:700; transform:translateX(-50%); white-space:nowrap}
.range .tick{position:absolute; top:40px; font-size:.65rem; color:var(--muted); transform:translateX(-50%)}
.weather{width:64px; height:64px; flex:none}
.stat{background:var(--card2); border-radius:14px; padding:10px 12px}
.stat b{font-family:var(--f-head); font-size:1.4rem}
.stat span{display:block; font-size:.72rem; color:var(--muted)}
.list-tight p{margin:2px 0}
hr{border:0; border-top:1px solid var(--line); margin:14px 0}
a{color:var(--sky)}
</style>
</head>

<div id="app"></div>
<script>
/* ========== 保存 ========== */
const KEY='mirapair.v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

if(S&&S.done){S.prep=S.prep||false;S.wed=S.wed||{style:'party',guests:50,save:5}}

/* ========== 小道具 ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmt(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
function weekKey(s){const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return fmt(d)}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const man=v=>`${Math.round(v).toLocaleString()}万円`;
function age(b){if(!b)return 0;const d=parse(b),t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a}
const ym=()=>today().slice(0,7);

/* ========== 区分 ========== */
const SEGNAME={hs:'高校生',uni:'大学生・専門学生',new:'新社会人',work:'社会人',thirty:'30代'};
function seg(p){const a=age(p.birth);if(p.status==='hs'||a<18)return 'hs';if(p.status==='uni')return 'uni';if(a<=25)return 'new';if(a<=29)return 'work';return 'thirty'}
const isStudentSeg=s=>s==='hs'||s==='uni';
function adultPair(){return S&&seg(S.me)!=='hs'&&seg(S.pt)!=='hs'}
function priceOf(){const st=isStudentSeg(seg(S.me));return st?{m:380,y:3200,label:'学生料金'}:{m:680,y:5800,label:'通常料金'}}
const HS_CAP=1500;
function notifTimes(){const st=isStudentSeg(seg(S.me));return st?{daily:'7:30',streak:'21:00'}:{daily:'7:45',streak:'21:30'}}

const SIZES=[['big','大きい会社（1000人以上）',1],['mid','中くらい（100〜999人）',2],['small','小さい会社（99人以下）',3],['unk','わからない',0]];
const HOLIDAY=[['weekend','土日が休み'],['shift','平日・シフト'],['mixed','ばらばら']];
const TRANSFER=[['yes','あり'],['no','なし'],['unk','わからない']];
const OVERTIME=[['low','少ない'],['mid','ふつう'],['high','多い']];
const STATUS=[['hs','高校生'],['uni','大学・専門学生'],['work','社会人'],['other','その他']];
const GENDER=[['f','女性'],['m','男性'],['x','答えない']];
const lookup=(arr,k)=>(arr.find(a=>a[0]===k)||[])[1]||'';
/* 年収（万円）＝ きまって支給する現金給与額×12 ＋ 年間賞与その他特別給与額。
   厚生労働省「令和7年賃金構造基本統計調査」一般労働者・男女計・学歴計（e-Stat 第1表、2026-03-24公表）。

 if(['work','thirty'].includes(seg(S.me))||['work','thirty'].includes(seg(S.pt)))pts++;

function milestones(){
 const since=S.since;if(!since)return null;const t=today();const list=[];
 [100,200,300,500,700,1000,1500,2000,3000].forEach(n=>list.push([addDays(since,n-1),`${n}日目`]));
 const d=parse(since);
 [1,3,6].forEach(m=>{const x=new Date(d);x.setMonth(x.getMonth()+m);list.push([fmt(x),`${m}か月`])});
 for(let y=1;y<=10;y++){const x=new Date(d);x.setFullYear(x.getFullYear()+y);list.push([fmt(x),`${y}周年`])}
 const fut=list.filter(([dt])=>dt>=t).sort((a,b)=>a[0]<b[0]?-1:1);
 return{day:dayDiff(since,t)+1,next:fut[0]}}
function dailyIdx(){const pool=DAILY.map((q,i)=>[q,i]).filter(([q])=>adultPair()||!q[2]);return pool[hash('q'+today()+(S.since||''))%pool.length][1]}
function streakView(){const st=S.streak;if(!st.last)return{count:0,state:'none'};const g=dayDiff(st.last,today());
 if(g===0)return{count:st.count,state:'done'};if(g===1)return{count:st.count,state:'open'};
 if(g===2&&st.freezeWeek!==weekKey(today()))return{count:st.count,state:'freeze'};return{count:0,state:'broken'}}
function bumpStreak(){const st=S.streak,t=today();if(st.last===t)return false;const g=st.last?dayDiff(st.last,t):99;let used=false;
 if(g===1)st.count++;else if(g===2&&st.freezeWeek!==weekKey(t)){st.count++;st.freezeWeek=weekKey(t);used=true}else st.count=1;
 st.last=t;st.best=Math.max(st.best||0,st.count);return used}

  const a=income(me,0),b=income(pt,0);if(a&&b&&Math.max(a,b)/Math.min(a,b)>=1.5)out.push(['hard','収入に差がある','どちらが上でも、お金の出し方を「割合」で決めておくと気持ちよく暮らせます。どちらかが我慢する形は長続きしにくいです。']);

 }
 if(me.status==='uni'||pt.status==='uni')out.push(['hard','就職で住む場所が変わるかも','就活の時期は、勤務地の希望をおたがいに早めに共有して。遠距離になっても、会う頻度を先に決めておくと続きやすいです。']);

 const h=heights();if(h)out.push(['fun','子どもの身長は',`男の子なら${h.boy.toFixed(0)}cm前後、女の子なら${h.girl.toFixed(0)}cm前後が目安（±9cmほどの幅があります）。`]);

 memory(){if(!confirm('ふたりのデータを消して、思い出カードだけ残しますか？'))return;const ms=milestones();const mem=(S.memories||[]).concat([{name:S.pt.name,since:S.since,days:ms?ms.day:0,best:S.streak.best||0}]);
  try{localStorage.setItem(KEY,JSON.stringify({memories:mem}))}catch(e){}S={memories:mem};UI={...UI,step:0,view:null,tab:'home',modal:null};render()},
 wipe(){if(!confirm('すべてのデータを消します。元に戻せません。'))return;try{localStorage.removeItem(KEY)}catch(e){}S=null;UI={...UI,step:0,view:null,tab:'home',modal:null};render()}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
 if(el.dataset.a==='closeModal'&&el.classList.contains('modal')&&e.target!==el)return;
 if(el.tagName==='INPUT'&&el.type==='checkbox'){ACT[el.dataset.a](el.dataset.v,el,e);return}
 e.preventDefault();ACT[el.dataset.a]&&ACT[el.dataset.a](el.dataset.v,el,e)});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.wed){S.wed[el.dataset.wed]=Math.max(0,+el.value||0);save();render();return}
 if(el.dataset.photo){const f=el.files&&el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{UI.photos[el.dataset.photo]=rd.result;UI.photoDone=false;render()};rd.readAsDataURL(f);return}
 if(el.tagName==='SELECT'||el.type==='date'){const onb=!S||!S.done;if(onb&&(UI.step===1||UI.step===2)){const who=UI.step===1?'me':'pt';readForm(UI.draft[who]);render()}else if(UI.view==='edit'){readForm(UI.draft[UI.who]);render()}}});
render();
