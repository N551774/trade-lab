<title>経理ラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: スマホアプリのシェル（最大480px）＋下部タブバー。帳簿の罫線・朱肉の判子・電卓をモチーフに。 */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface2:#E8EEEA; --line:#D3DDD7;
  --ink:#16261F; --muted:#5F7068;
  --green:#14A06B; --green-d:#0C7A50; --green-soft:#D7F2E5;
  --shu:#E5432F; --shu-d:#B42C1C; --shu-soft:#FCE3DE;
  --gold:#F2A516; --gold-d:#C27F00; --gold-soft:#FDF0D2;
  --blue:#2F6FE4; --blue-d:#1F4FAE; --violet:#8A5CF0; --violet-d:#6438C9;
  --cat-asset:#2F6FE4; --cat-liab:#E5432F; --cat-eq:#14A06B; --cat-rev:#F2A516; --cat-exp:#8A5CF0;
  --shadow:0 10px 30px rgba(22,38,31,.10);
  --f-disp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --surface:#17241E; --surface2:#203029; --line:#2C3E35; --ink:#ECF4EF; --muted:#94A69C;
  --green:#22C383; --green-d:#13905E; --green-soft:#173B2C; --shu:#FF6A54; --shu-d:#C9402D; --shu-soft:#3E211C;
  --gold:#F7B532; --gold-d:#C98A0C; --gold-soft:#3A2F17; --blue:#5A8EF2; --blue-d:#3565C4; --violet:#A584F6; --violet-d:#7656D6;
  --cat-asset:#5A8EF2; --cat-liab:#FF6A54; --cat-eq:#22C383; --cat-rev:#F7B532; --cat-exp:#A584F6;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1915; --surface:#17241E; --surface2:#203029; --line:#2C3E35; --ink:#ECF4EF; --muted:#94A69C;
  --green:#22C383; --green-d:#13905E; --green-soft:#173B2C; --shu:#FF6A54; --shu-d:#C9402D; --shu-soft:#3E211C;
  --gold:#F7B532; --gold-d:#C98A0C; --gold-soft:#3A2F17; --blue:#5A8EF2; --blue-d:#3565C4; --violet:#A584F6; --violet-d:#7656D6;
  --cat-asset:#5A8EF2; --cat-liab:#FF6A54; --cat-eq:#22C383; --cat-rev:#F7B532; --cat-exp:#A584F6;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); margin:0; -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.app{max-width:480px; margin:0 auto; min-height:100%; position:relative; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.disp{font-family:var(--f-disp); font-weight:800; letter-spacing:-.01em; text-wrap:balance; margin:0}
.num{font-family:var(--f-disp); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.8rem}

/* トップバー */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding-block:10px; display:flex; align-items:center; gap:8px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
.stat{display:flex; align-items:center; gap:5px; padding:6px 10px; border-radius:999px; font-family:var(--f-disp); font-weight:800; font-size:.95rem}
.stat svg{width:20px; height:20px}
.stat.fire{color:#FF7A1A} .stat.coin{color:var(--gold-d)} .stat.heart{color:var(--shu)}
.topbar .grow{flex:1}
.pro-pill{font-family:var(--f-disp); font-weight:800; font-size:.78rem; padding:7px 12px; border-radius:999px; color:#fff;
  background:linear-gradient(135deg,#7B4DFF,#E5432F 60%,#F2A516); box-shadow:0 3px 0 #5A2FCF}
.pro-pill.on{box-shadow:none; opacity:.95}

/* 3Dボタン */
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px 18px; border-radius:16px;
  font-family:var(--f-disp); font-weight:800; font-size:1.05rem; letter-spacing:.04em; transition:transform .08s, box-shadow .08s, filter .2s}
.btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 0 0 transparent !important}
.btn-primary{background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-d)}
.btn-danger{background:var(--shu); color:#fff; box-shadow:0 4px 0 var(--shu-d)}
.btn-gold{background:var(--gold); color:#2B1D00; box-shadow:0 4px 0 var(--gold-d)}
.btn-pro{background:linear-gradient(135deg,#7B4DFF,#C83CB4 55%,#F2703A); color:#fff; box-shadow:0 4px 0 #4E25B8}
.btn-ghost{background:var(--surface); color:var(--ink); box-shadow:0 4px 0 var(--line); border:2px solid var(--line)}
.btn:disabled{filter:grayscale(1); opacity:.5; cursor:default}

/* タブバー */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:2px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:4px}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; border-radius:14px; font-size:.68rem; color:var(--muted); font-weight:700}
.tab svg{width:26px; height:26px}
.tab.on{color:var(--green); background:var(--green-soft)}

/* カード */
.card{background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:16px}
.section-title{font-family:var(--f-disp); font-weight:800; font-size:1.05rem; margin:22px 0 10px; display:flex; align-items:center; gap:8px}

/* デイリー目標 */
.daily{display:flex; gap:14px; align-items:center}
.ring{width:74px; height:74px; flex:none; position:relative}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-disp); font-size:.95rem}
.ring circle{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}

/* 学習マップ */
.unit{margin-top:24px; border-radius:var(--r); padding:16px 18px; color:#fff; position:relative; overflow:hidden}
.unit h2{font-size:1.2rem}
.unit p{margin:4px 0 0; opacity:.9; font-size:.85rem}
.unit::after{content:""; position:absolute; right:-20px; top:-20px; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.12)}
.path{display:flex; flex-direction:column; align-items:center; gap:34px; padding:58px 0 22px}
.node{width:76px; height:70px; border-radius:50%; display:grid; place-items:center; position:relative; transition:transform .1s}
.node .face{width:76px; height:70px; border-radius:50%; display:grid; place-items:center; color:#fff}
.node .face svg{width:34px; height:34px}
.node:active .face{transform:translateY(5px); box-shadow:none !important}
.node.locked .face{background:var(--surface2) !important; color:var(--muted); box-shadow:0 6px 0 var(--line) !important}
.node.done .face{background:var(--gold) !important; box-shadow:0 6px 0 var(--gold-d) !important}
.node.current::before{content:""; position:absolute; inset:-10px; border-radius:50%; border:4px solid var(--green); opacity:.35; animation:pulse 1.6s infinite}
.node .lbl{position:absolute; top:78px; white-space:nowrap; font-size:.72rem; font-weight:700; color:var(--muted)}
.node .bubble{position:absolute; bottom:84px; background:var(--surface); border:2px solid var(--line); color:var(--green); font-family:var(--f-disp);
  font-weight:800; padding:6px 12px; border-radius:12px; white-space:nowrap; animation:bob 1.8s ease-in-out infinite; font-size:.85rem}
.node .crown{position:absolute; top:-8px; right:-6px; width:26px; height:26px}
@keyframes pulse{0%{transform:scale(.9); opacity:.5}100%{transform:scale(1.25); opacity:0}}
@keyframes bob{50%{transform:translateY(-5px)}}

/* プロモ */
.promo{display:flex; gap:12px; align-items:center; border-radius:var(--r); padding:14px 16px; color:#fff;
  background:linear-gradient(120deg,#5B32E0,#B43BB8 55%,#F2703A); box-shadow:var(--shadow)}
.promo b{font-family:var(--f-disp); font-size:1.02rem}
.promo .x{margin-left:auto; flex:none}

/* オーバーレイ画面（レッスン・キャリア・ペイウォール等） */
.screen{position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
.screen .inner{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
  padding-top:calc(10px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@keyframes slideIn{from{transform:translateY(30px); opacity:0}}
.lhead{display:flex; align-items:center; gap:12px; padding-block:8px}
.xbtn{width:36px; height:36px; display:grid; place-items:center; border-radius:10px; color:var(--muted)}
.xbtn svg{width:26px; height:26px}
.pbar{flex:1; height:16px; border-radius:99px; background:var(--surface2); overflow:hidden}
.pbar i{display:block; height:100%; border-radius:99px; background:var(--green); transition:width .45s cubic-bezier(.2,.8,.2,1);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.qkind{font-family:var(--f-disp); font-weight:800; color:var(--violet); font-size:.85rem; letter-spacing:.06em; margin-top:16px}
.qtext{font-family:var(--f-disp); font-weight:800; font-size:1.25rem; line-height:1.55; margin:8px 0 16px}
.qbody{flex:1}
.opts{display:grid; gap:10px}
.opt{text-align:left; padding:14px 16px; border-radius:16px; border:2px solid var(--line); background:var(--surface); box-shadow:0 4px 0 var(--line);
  font-weight:700; line-height:1.5; transition:transform .08s}
.opt:active{transform:translateY(3px); box-shadow:none}
.opt.sel{border-color:var(--blue); background:color-mix(in srgb,var(--blue) 12%,var(--surface)); box-shadow:0 4px 0 var(--blue)}
.opt.right{border-color:var(--green); background:var(--green-soft); box-shadow:0 4px 0 var(--green)}
.opt.wrong{border-color:var(--shu); background:var(--shu-soft); box-shadow:0 4px 0 var(--shu)}
.acct-big{font-family:var(--f-disp); font-weight:800; font-size:2.2rem; text-align:center; padding:34px 10px; border-radius:22px;
  background:var(--surface); border:2px solid var(--line); box-shadow:var(--shadow); margin-bottom:18px}
.cats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.cats .opt{text-align:center; color:#fff; border:0}
.cats .opt:last-child{grid-column:span 2}

/* 仕訳ビルダー */
.je{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.zone{min-height:118px; border-radius:16px; border:2px dashed var(--line); padding:10px; display:flex; flex-direction:column; gap:8px; background:var(--surface);
  transition:border-color .2s, background .2s}
.zone.on{border-style:solid; border-color:var(--blue); background:color-mix(in srgb,var(--blue) 7%,var(--surface))}
.zone h4{margin:0; font-family:var(--f-disp); font-size:.85rem; color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.zone h4 em{font-style:normal; font-size:.66rem; background:var(--blue); color:#fff; padding:2px 7px; border-radius:6px}
.zone.on h4{color:var(--blue)}
.bank{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px 0}
.chip{padding:10px 14px; border-radius:12px; border:2px solid var(--line); background:var(--surface); box-shadow:0 3px 0 var(--line); font-weight:700;
  display:inline-flex; align-items:center; gap:6px; animation:pop .2s}
.chip .dot{width:9px; height:9px; border-radius:3px}
.chip.ghost{visibility:hidden}
@keyframes pop{from{transform:scale(.7); opacity:0}}
.hint{font-size:.78rem; color:var(--muted); text-align:center}

/* 証憑（紙） */
.paper{background:#FFFEF8; color:#222; border-radius:6px; padding:16px 18px; box-shadow:0 12px 28px rgba(0,0,0,.18); position:relative;
  background-image:repeating-linear-gradient(transparent 0 33px,#E6E1D0 33px 34px)}
.paper .kind{font-family:var(--f-disp); font-weight:800; font-size:1.2rem; letter-spacing:.35em; text-align:center; border-bottom:2px solid #222; padding-bottom:4px}
.paper .sub{text-align:center; font-size:.75rem; color:#666; margin:4px 0 6px}
.paper table{width:100%; border-collapse:collapse; font-size:.85rem}
.paper td{padding:6px 2px; vertical-align:top; line-height:1.45}
.paper td:first-child{color:#777; width:36%}
.toggles{display:grid; gap:8px; margin-top:16px}

/* フィードバックシート */
.sheet{position:sticky; bottom:0; padding-top:14px; padding-bottom:calc(14px + env(safe-area-inset-bottom,0px)); margin-top:16px; background:var(--bg)}
.fb{border-radius:20px 20px 0 0; padding:16px 18px; margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) -16px; animation:sheetUp .3s cubic-bezier(.2,.8,.2,1)}
.fb.ok{background:var(--green-soft)} .fb.ng{background:var(--shu-soft)}
.fb h3{font-size:1.3rem; display:flex; align-items:center; gap:8px}
.fb.ok h3{color:var(--green-d)} .fb.ng h3{color:var(--shu-d)}
:root[data-theme="dark"] .fb.ok h3{color:var(--green)} :root[data-theme="dark"] .fb.ng h3{color:var(--shu)}
.fb p{margin:8px 0 14px; line-height:1.65; font-size:.92rem}
@keyframes sheetUp{from{transform:translateY(100%)}}
.entry{width:100%; border-collapse:collapse; font-size:.85rem; margin:6px 0 2px; background:var(--surface); border-radius:10px; overflow:hidden}
.entry th{font-weight:700; color:var(--muted); font-size:.72rem; padding:6px 8px; text-align:left; border-bottom:1px solid var(--line)}
.entry td{padding:6px 8px; border-bottom:1px dashed var(--line)}
.entry td.a{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--f-disp)}

/* 判子 */
.hanko{position:fixed; left:50%; top:38%; z-index:90; width:132px; height:132px; margin:-66px 0 0 -66px; border-radius:50%;
  border:7px solid var(--shu); color:var(--shu); display:grid; place-items:center; font-family:var(--f-disp); font-weight:800; font-size:4rem;
  pointer-events:none; animation:stamp .7s cubic-bezier(.2,1.6,.4,1) forwards; mix-blend-mode:multiply; background:rgba(255,255,255,.04)}
:root[data-theme="dark"] .hanko{mix-blend-mode:normal}
@keyframes stamp{0%{transform:scale(2.4) rotate(-25deg); opacity:0}35%{transform:scale(.92) rotate(-12deg); opacity:.95}
  55%{transform:scale(1.04) rotate(-12deg)}80%{opacity:.95}100%{transform:scale(1) rotate(-12deg); opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.combo{position:fixed; left:50%; top:22%; transform:translateX(-50%); z-index:91; font-family:var(--f-disp); font-weight:800; font-size:1.6rem;
  color:var(--gold-d); pointer-events:none; animation:comboUp 1s forwards; white-space:nowrap}
@keyframes comboUp{0%{opacity:0; transform:translate(-50%,10px) scale(.6)}25%{opacity:1; transform:translate(-50%,0) scale(1.1)}100%{opacity:0; transform:translate(-50%,-30px)}}

/* 結果画面 */
.result{text-align:center; padding-top:24px}
.result h1{font-size:1.8rem; color:var(--gold-d); margin-top:8px}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:22px 0}
.tile{border-radius:16px; border:2px solid; overflow:hidden; text-align:center}
.tile .h{font-size:.72rem; font-weight:800; color:#fff; padding:5px}
.tile .v{font-family:var(--f-disp); font-weight:800; font-size:1.35rem; padding:12px 4px; display:flex; align-items:center; justify-content:center; gap:4px}
.tile .v svg{width:20px; height:20px}

/* マスコット */
.mascot{width:120px; height:120px; margin:0 auto; display:block}
.mascot.bounce{animation:mbounce 1.2s ease-in-out infinite}
@keyframes mbounce{50%{transform:translateY(-6px)}}

/* キャリア */
.stages{display:grid; gap:12px; position:relative}
.stage{display:flex; gap:14px; align-items:center; padding:14px; border-radius:var(--r); background:var(--surface); border:2px solid var(--line); text-align:left; width:100%}
.stage .ic{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-size:1.6rem; flex:none; background:var(--surface2)}
.stage.cleared .ic{background:var(--gold-soft)} .stage.now{border-color:var(--green); box-shadow:0 4px 0 var(--green)}
.stage.locked{opacity:.6}
.stage .t{font-family:var(--f-disp); font-weight:800}
.stage .badge{margin-left:auto; font-size:.7rem; font-weight:800; padding:4px 8px; border-radius:8px; white-space:nowrap}
.chat{display:flex; flex-direction:column; gap:10px; padding:12px 0}
.msg{display:flex; gap:8px; align-items:flex-end; animation:pop .25s}
.msg .av{width:40px; height:40px; border-radius:50%; background:var(--surface2); display:grid; place-items:center; font-size:1.3rem; flex:none}
.msg .b{max-width:80%; padding:11px 14px; border-radius:18px 18px 18px 4px; background:var(--surface); border:2px solid var(--line); line-height:1.6; font-size:.95rem}
.msg .nm{font-size:.7rem; color:var(--muted); margin-bottom:2px; font-weight:700}
.msg.me{justify-content:flex-end} .msg.me .b{background:var(--blue); color:#fff; border-color:var(--blue); border-radius:18px 18px 4px 18px}
.msg.sys .b{background:var(--gold-soft); border-color:transparent}
.typing span{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--muted); margin:0 2px; animation:typ 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes typ{50%{transform:translateY(-4px); opacity:.4}}
.trust{display:flex; align-items:center; gap:10px; font-size:.8rem; font-weight:700}
.trust .pbar{height:12px}
.trust .pbar i{background:linear-gradient(90deg,var(--gold),var(--green))}
.trust .line{position:relative}
.delta{font-family:var(--f-disp); font-weight:800}
.replies{display:grid; gap:8px}

/* 辞令 */
.jirei{background:#FFFEF8; color:#222; border:3px double #8B6B2E; border-radius:6px; padding:26px 20px; text-align:center; position:relative;
  box-shadow:var(--shadow); animation:unfold .6s cubic-bezier(.2,.8,.2,1)}
.jirei .h{font-family:var(--f-disp); font-weight:800; font-size:1.7rem; letter-spacing:.6em; padding-left:.6em}
.jirei .r{font-family:var(--f-disp); font-weight:800; font-size:1.5rem; margin:16px 0 6px}
.jirei .seal{position:absolute; right:18px; bottom:16px; width:64px; height:64px; border:4px solid var(--shu); color:var(--shu); border-radius:6px;
  display:grid; place-items:center; font-family:var(--f-disp); font-weight:800; font-size:.95rem; line-height:1.1; transform:rotate(-8deg);
  animation:seal .5s .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes unfold{from{transform:scaleY(.2); opacity:0}}
@keyframes seal{from{transform:scale(2.2) rotate(-20deg); opacity:0}}

/* スワイプゲーム */
.arena{position:relative; height:330px; margin:12px 0 18px; touch-action:none}
.sw{position:absolute; inset:20px 18px; border-radius:24px; background:var(--surface); border:2px solid var(--line); box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; user-select:none; cursor:grab}
.sw .n{font-family:var(--f-disp); font-weight:800; font-size:2.1rem}
.sw .lab{position:absolute; top:18px; font-family:var(--f-disp); font-weight:800; padding:4px 10px; border-radius:8px; border:3px solid; opacity:0; font-size:1.05rem}
.sw .lab.l{left:16px; color:var(--blue); transform:rotate(-12deg)} .sw .lab.r{right:16px; color:var(--shu); transform:rotate(12deg)}
.sw.under{transform:scale(.94) translateY(14px); opacity:.6; pointer-events:none}
.gamehud{display:flex; justify-content:space-between; align-items:center; font-family:var(--f-disp); font-weight:800}
.timer{height:10px; border-radius:99px; background:var(--surface2); overflow:hidden; margin-top:8px}
.timer i{display:block; height:100%; background:var(--gold); transition:width 1s linear}
.sides{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* ショップ */
.shop{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.item{background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:14px 12px; display:flex; flex-direction:column; gap:6px; text-align:left}
.item .ic{font-size:1.9rem; line-height:1.2}
.item .t{font-family:var(--f-disp); font-weight:800; font-size:.95rem}
.item .d{font-size:.74rem; color:var(--muted); flex:1; line-height:1.45}
.price{display:inline-flex; align-items:center; gap:4px; font-family:var(--f-disp); font-weight:800; color:var(--gold-d); margin-top:4px}
.price svg{width:18px; height:18px}
.own{font-size:.72rem; font-weight:800; color:var(--green-d)}
:root[data-theme="dark"] .own{color:var(--green)}
.packs{display:grid; gap:10px}
.pack{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface); border:2px solid var(--line); border-radius:16px; text-align:left; position:relative}
.pack .ic{font-size:1.8rem}
.pack .t{font-family:var(--f-disp); font-weight:800}
.pack .yen{margin-left:auto; font-family:var(--f-disp); font-weight:800; background:var(--green); color:#fff; padding:8px 12px; border-radius:12px; box-shadow:0 3px 0 var(--green-d)}
.ribbon{position:absolute; top:-9px; left:12px; font-size:.66rem; font-weight:800; color:#fff; background:var(--shu); padding:2px 8px; border-radius:6px}

/* ペイウォール */
.pw-hero{border-radius:24px; padding:24px 18px 20px; color:#fff; text-align:center; position:relative; overflow:hidden;
  background:radial-gradient(120% 90% at 20% 0%,#9B6BFF 0%,#5B32E0 40%,#2A1474 100%)}
.pw-hero h1{font-size:1.75rem; margin-top:6px}
.pw-hero .spark{position:absolute; width:6px; height:6px; border-radius:50%; background:#fff; opacity:.7; animation:twinkle 2.4s infinite}
@keyframes twinkle{50%{opacity:.1; transform:scale(.4)}}
.compare{width:100%; border-collapse:collapse; margin:16px 0; font-size:.86rem}
.compare th,.compare td{padding:10px 6px; border-bottom:1px solid var(--line); text-align:center}
.compare td:first-child,.compare th:first-child{text-align:left}
.compare .pro{color:var(--violet); font-weight:800}
.plans{display:grid; gap:10px}
.plan{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:16px; border:2px solid var(--line); background:var(--surface); text-align:left; position:relative}
.plan.sel{border-color:var(--violet); box-shadow:0 4px 0 var(--violet)}
.plan .radio{width:22px; height:22px; border-radius:50%; border:3px solid var(--line); flex:none}
.plan.sel .radio{border-color:var(--violet); background:radial-gradient(circle,var(--violet) 45%,transparent 50%)}
.plan .p{margin-left:auto; text-align:right; font-family:var(--f-disp); font-weight:800}
.plan .p small{display:block; font-size:.7rem; color:var(--muted); font-family:var(--f-body)}
.demo-note{font-size:.72rem; color:var(--muted); line-height:1.6; text-align:center; margin-top:10px}

/* マイページ */
.prof{display:flex; gap:14px; align-items:center}
.prof .mascot{width:96px; height:96px; margin:0}
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kpi{display:flex; gap:10px; align-items:center; padding:12px; border:2px solid var(--line); border-radius:16px; background:var(--surface)}
.kpi svg{width:26px; height:26px; flex:none}
.kpi b{font-family:var(--f-disp); font-size:1.15rem; display:block}
.kpi span{font-size:.72rem; color:var(--muted)}
.week{display:flex; align-items:flex-end; gap:8px; height:120px; padding-top:8px}
.week .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end}
.week .bar{width:100%; border-radius:8px 8px 3px 3px; background:var(--green); min-height:4px; transition:height .8s cubic-bezier(.2,.8,.2,1)}
.week .bar.today{background:var(--gold)}
.week .col span{font-size:.68rem; color:var(--muted)}
.week .col em{font-style:normal; font-size:.66rem; font-family:var(--f-disp); color:var(--muted)}
.badges{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.bdg{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; font-size:.66rem; font-weight:700; color:var(--muted)}
.bdg .m{width:58px; height:58px; border-radius:18px; display:grid; place-items:center; font-size:1.7rem; background:var(--surface2); filter:grayscale(1); opacity:.45}
.bdg.got{color:var(--ink)} .bdg.got .m{filter:none; opacity:1; background:var(--gold-soft); box-shadow:0 4px 0 var(--gold)}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.seg{display:flex; gap:6px}
.seg button{padding:6px 10px; border-radius:10px; border:2px solid var(--line); font-weight:700; font-size:.8rem}
.seg button.on{border-color:var(--green); color:var(--green-d); background:var(--green-soft)}
:root[data-theme="dark"] .seg button.on{color:var(--green)}
.switch{width:50px; height:30px; border-radius:99px; background:var(--line); position:relative; transition:background .2s; flex:none}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .2s}
.switch.on{background:var(--green)} .switch.on::after{left:23px}

/* モーダル・トースト */
.modal{position:fixed; inset:0; z-index:80; background:rgba(10,20,15,.55); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s}
.modal .box{width:100%; max-width:480px; background:var(--bg); border-radius:26px 26px 0 0; padding:22px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  animation:sheetUp .3s cubic-bezier(.2,.8,.2,1); display:grid; gap:10px; text-align:center}
@keyframes fade{from{opacity:0}}
.toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:100; background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:14px; font-weight:700; font-size:.88rem; box-shadow:var(--shadow); animation:toast 2.4s forwards; max-width:90vw}
@keyframes toast{0%{opacity:0; transform:translate(-50%,-12px)}10%,85%{opacity:1; transform:translate(-50%,0)}100%{opacity:0}}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:95; width:100%; height:100%}
.quest{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .qi{font-size:1.5rem; width:36px; text-align:center}
.quest .qb{flex:1; min-width:0}
.quest .qb b{font-size:.88rem; display:block}
.mini{height:10px; border-radius:99px; background:var(--surface2); overflow:hidden; margin-top:6px}
.mini i{display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .6s}
.claim{padding:8px 12px; border-radius:12px; font-weight:800; font-size:.78rem; background:var(--gold); color:#2B1D00; box-shadow:0 3px 0 var(--gold-d)}
.claim:disabled{background:var(--surface2); color:var(--muted); box-shadow:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}}
</style>

<script>
const DATA = {"accounts":{"現金":{"cat":"資産","desc":"手元にあるお金（紙幣・硬貨）。他人振出の小切手も現金で処理する。"},"小口現金":{"cat":"資産","desc":"日々の少額の支払いのために部署に渡しておく現金。"},"普通預金":{"cat":"資産","desc":"銀行の普通預金口座の残高。"},"当座預金":{"cat":"資産","desc":"小切手・手形の決済に使う無利息の預金。"},"売掛金":{"cat":"資産","desc":"商品・サービスを掛け（後払い）で売ったときの、まだ受け取っていない代金。"},"受取手形":{"cat":"資産","desc":"売上代金として受け取った約束手形。"},"電子記録債権":{"cat":"資産","desc":"でんさい等で電子的に記録された債権。手形の代わりとして普及。"},"繰越商品":{"cat":"資産","desc":"決算時に売れ残っている商品（在庫）。三分法で使う。"},"前払金":{"cat":"資産","desc":"商品を受け取る前に払った手付金・内金。"},"前払費用":{"cat":"資産","desc":"翌期以降のサービスに対して先に払った費用。"},"未収入金":{"cat":"資産","desc":"本業の商品以外（固定資産の売却など）の代金の未回収分。"},"未収収益":{"cat":"資産","desc":"当期に発生したが、まだ受け取っていない収益（利息など）。"},"仮払金":{"cat":"資産","desc":"支払ったが内容・金額が未確定のときに一時的に使う。"},"立替金":{"cat":"資産","desc":"他人が払うべきお金を一時的に立て替えたもの。"},"貸付金":{"cat":"資産","desc":"他者に貸したお金。"},"仮払消費税":{"cat":"資産","desc":"仕入・経費の支払いで払った消費税（税抜経理）。"},"建物":{"cat":"資産","desc":"事務所・店舗・倉庫などの建物。"},"車両運搬具":{"cat":"資産","desc":"営業車・トラックなど。"},"備品":{"cat":"資産","desc":"パソコン・机・コピー機など（10万円以上が目安）。"},"土地":{"cat":"資産","desc":"事業用の土地。減価償却しない。"},"ソフトウェア":{"cat":"資産","desc":"購入・開発したソフトウェア（無形固定資産）。"},"買掛金":{"cat":"負債","desc":"商品を掛け（後払い）で仕入れたときの、まだ払っていない代金。"},"支払手形":{"cat":"負債","desc":"仕入代金の支払いのために振り出した約束手形。"},"電子記録債務":{"cat":"負債","desc":"でんさい等で電子的に記録された債務。"},"未払金":{"cat":"負債","desc":"本業の商品以外（備品・経費など）の代金の未払い分。"},"未払費用":{"cat":"負債","desc":"当期に発生した継続的サービスの費用で、まだ払っていないもの。"},"未払消費税":{"cat":"負債","desc":"決算で計算した、納める消費税の額。"},"未払法人税等":{"cat":"負債","desc":"決算で計算した、納める法人税・住民税・事業税。"},"前受金":{"cat":"負債","desc":"商品を渡す前に受け取った手付金・内金。"},"前受収益":{"cat":"負債","desc":"翌期以降の分を先に受け取った収益。"},"預り金":{"cat":"負債","desc":"一時的に預かっているお金。給与から天引きした税金・社会保険料など。"},"仮受金":{"cat":"負債","desc":"受け取ったが内容が未確定のときに一時的に使う。"},"仮受消費税":{"cat":"負債","desc":"売上で受け取った消費税（税抜経理）。"},"借入金":{"cat":"負債","desc":"銀行などから借りたお金。"},"資本金":{"cat":"純資産","desc":"株主から出資を受けた元手。"},"利益準備金":{"cat":"純資産","desc":"配当時に会社法で積み立てが求められる準備金。"},"繰越利益剰余金":{"cat":"純資産","desc":"過去からの利益の蓄積（配当などの元になる）。"},"売上":{"cat":"収益","desc":"本業で商品・サービスを販売した収益。"},"受取利息":{"cat":"収益","desc":"預金・貸付金から受け取る利息。"},"受取手数料":{"cat":"収益","desc":"仲介などで受け取る手数料。"},"受取家賃":{"cat":"収益","desc":"建物などを貸して受け取る家賃。"},"雑収入":{"cat":"収益","desc":"本業以外の少額・臨時の収益。"},"仕入":{"cat":"費用","desc":"販売するための商品を買ったときの費用（三分法）。"},"給料":{"cat":"費用","desc":"従業員に支払う給与（総支給額）。"},"法定福利費":{"cat":"費用","desc":"社会保険料などの会社負担分。"},"福利厚生費":{"cat":"費用","desc":"従業員全員を対象にした福利厚生の費用。"},"旅費交通費":{"cat":"費用","desc":"業務で移動したときの交通費・出張費。"},"通信費":{"cat":"費用","desc":"電話・インターネット・郵便などの費用。"},"水道光熱費":{"cat":"費用","desc":"電気・ガス・水道の料金。"},"消耗品費":{"cat":"費用","desc":"文房具など、使ってなくなるもの・10万円未満の物品。"},"支払家賃":{"cat":"費用","desc":"事務所・店舗などの家賃。（地代家賃とも言う）"},"広告宣伝費":{"cat":"費用","desc":"不特定多数への宣伝のための費用。"},"交際費":{"cat":"費用","desc":"取引先との接待・贈答の費用。（接待交際費とも言う）"},"会議費":{"cat":"費用","desc":"打ち合わせ・会議のための費用。"},"支払手数料":{"cat":"費用","desc":"振込手数料や専門家への報酬など。"},"保険料":{"cat":"費用","desc":"損害保険などの保険料。"},"租税公課":{"cat":"費用","desc":"費用になる税金・印紙代など。"},"減価償却費":{"cat":"費用","desc":"固定資産の取得価額を使う期間に配分した費用。"},"貸倒損失":{"cat":"費用","desc":"売掛金などが回収できなくなった損失。"},"支払利息":{"cat":"費用","desc":"借入金に対して払う利息。"},"雑費":{"cat":"費用","desc":"どの科目にも当てはまらない少額の費用。"},"法人税等":{"cat":"費用","desc":"当期の利益に対する法人税・住民税・事業税。"}},"drill":[{"id":"b01","tag":"基本","q":"商品 50,000円を仕入れ、代金は掛けとした。","dr":[["仕入",50000]],"cr":[["買掛金",50000]],"exp":"商品を買ったら費用の「仕入」が増える（借方）。後払いの義務は負債の「買掛金」が増える（貸方）。"},{"id":"b02","tag":"基本","q":"商品 80,000円を売り上げ、代金は掛けとした。","dr":[["売掛金",80000]],"cr":[["売上",80000]],"exp":"後で代金を受け取る権利は資産の「売掛金」（借方）。収益の「売上」が増える（貸方）。"},{"id":"b03","tag":"基本","q":"得意先から売掛金 80,000円が普通預金に振り込まれた。","dr":[["普通預金",80000]],"cr":[["売掛金",80000]],"exp":"預金（資産）が増えて借方、売掛金（資産）が減るので貸方。経理ではこれを「入金消込」と呼ぶ。"},{"id":"b04","tag":"基本","q":"仕入先への買掛金 50,000円を普通預金から振り込んだ。","dr":[["買掛金",50000]],"cr":[["普通預金",50000]],"exp":"負債の買掛金が減る → 借方。資産の預金が減る → 貸方。"},{"id":"b05","tag":"基本","q":"事務用のボールペンとノートを 3,300円で購入し、現金で支払った。","dr":[["消耗品費",3300]],"cr":[["現金",3300]],"exp":"文房具などすぐ使うものは「消耗品費」。10万円未満の物品も通常は消耗品費で処理する。"},{"id":"b06","tag":"基本","q":"営業先への電車代 1,200円を現金で支払った。","dr":[["旅費交通費",1200]],"cr":[["現金",1200]],"exp":"業務の移動にかかった費用は「旅費交通費」。"},{"id":"b07","tag":"基本","q":"今月の携帯電話代 8,800円が普通預金から引き落とされた。","dr":[["通信費",8800]],"cr":[["普通預金",8800]],"exp":"電話・ネット・郵便は「通信費」。引き落としは預金の減少（貸方）。"},{"id":"b08","tag":"基本","q":"事務所の今月分の家賃 100,000円を普通預金から支払った。","dr":[["支払家賃",100000]],"cr":[["普通預金",100000]],"exp":"家賃の支払いは費用の「支払家賃」（地代家賃）。"},{"id":"b09","tag":"基本","q":"振込手数料 440円が普通預金から引き落とされた。","dr":[["支払手数料",440]],"cr":[["普通預金",440]],"exp":"銀行の振込手数料は「支払手数料」。少額でも毎回きちんと記帳するのが経理の基本。"},{"id":"b10","tag":"基本","q":"会社設立にあたり株式を発行し、1,000,000円が普通預金に払い込まれた。","dr":[["普通預金",1000000]],"cr":[["資本金",1000000]],"exp":"株主からの出資は純資産の「資本金」が増える（貸方）。"},{"id":"b11","tag":"基本","q":"銀行から 1,000,000円を借り入れ、普通預金に入金された。","dr":[["普通預金",1000000]],"cr":[["借入金",1000000]],"exp":"返済義務は負債の「借入金」。お金は増えるが利益ではない点に注意。"},{"id":"b12","tag":"基本","q":"借入金のうち 100,000円と利息 2,000円を普通預金から返済した。","dr":[["借入金",100000],["支払利息",2000]],"cr":[["普通預金",102000]],"exp":"元本の返済は負債の減少、利息は費用の「支払利息」。借方が2行になる（複合仕訳）。"},{"id":"b13","tag":"基本","q":"業務用のパソコン 200,000円を購入し、代金は翌月末払いとした。","dr":[["備品",200000]],"cr":[["未払金",200000]],"exp":"10万円以上のPCは固定資産の「備品」。商品以外の後払いは「買掛金」ではなく「未払金」。"},{"id":"b14","tag":"基本","q":"取引先との会食代 22,000円を会社のクレジットカードで支払った（後日引き落とし）。","dr":[["交際費",22000]],"cr":[["未払金",22000]],"exp":"接待は「交際費」。カード払いは引き落とし日まで「未払金」で負債計上する。"},{"id":"b15","tag":"基本","q":"契約書に貼る収入印紙 2,000円を現金で購入した。","dr":[["租税公課",2000]],"cr":[["現金",2000]],"exp":"収入印紙は税金の一種なので「租税公課」。"},{"id":"b16","tag":"基本","q":"Web広告の掲載料 55,000円を普通預金から支払った。","dr":[["広告宣伝費",55000]],"cr":[["普通預金",55000]],"exp":"不特定多数に向けた宣伝は「広告宣伝費」。"},{"id":"t01","tag":"仮勘定・前受","q":"出張に行く従業員に、旅費の概算額 30,000円を現金で渡した。","dr":[["仮払金",30000]],"cr":[["現金",30000]],"exp":"使い道・金額がまだ確定しないので一時的に資産の「仮払金」で処理する。"},{"id":"t02","tag":"仮勘定・前受","q":"出張から戻った従業員の精算で、旅費は 26,000円とわかり、残りは現金で返金された（概算払い 30,000円）。","dr":[["旅費交通費",26000],["現金",4000]],"cr":[["仮払金",30000]],"exp":"確定した金額を旅費交通費へ振り替え、戻ってきた現金を計上。仮払金は全額消す。"},{"id":"t03","tag":"仮勘定・前受","q":"普通預金に、内容不明の入金 15,000円があった。","dr":[["普通預金",15000]],"cr":[["仮受金",15000]],"exp":"理由がわかるまで負債の「仮受金」で受けておく。"},{"id":"t04","tag":"仮勘定・前受","q":"先日の内容不明の入金 15,000円は、得意先からの売掛金の回収だと判明した。","dr":[["仮受金",15000]],"cr":[["売掛金",15000]],"exp":"仮受金を消して、正しい科目（売掛金の減少）に振り替える。"},{"id":"t05","tag":"仮勘定・前受","q":"得意先から商品の注文を受け、内金 10,000円を現金で受け取った。","dr":[["現金",10000]],"cr":[["前受金",10000]],"exp":"商品を渡す前なので売上ではない。商品を渡す義務として負債の「前受金」。"},{"id":"t06","tag":"仮勘定・前受","q":"内金 10,000円を受け取っていた商品 50,000円を引き渡し、残額は掛けとした。","dr":[["前受金",10000],["売掛金",40000]],"cr":[["売上",50000]],"exp":"引き渡した時点で売上を計上。受け取り済みの前受金を充当し、残りが売掛金。"},{"id":"t07","tag":"仮勘定・前受","q":"売掛金 50,000円について、得意先の承諾を得て電子記録債権の発生記録を行った。","dr":[["電子記録債権",50000]],"cr":[["売掛金",50000]],"exp":"売掛金が「でんさい」に置き換わる。資産から資産への振替。"},{"id":"p01","tag":"給与","q":"給料 300,000円を支給。源泉所得税 8,000円・住民税 12,000円・社会保険料（本人負担分）45,000円を差し引き、残額を普通預金から振り込んだ。","dr":[["給料",300000]],"cr":[["預り金",65000],["普通預金",235000]],"exp":"給料は総支給額で費用計上。天引き分は会社が後で納める義務があるので「預り金」（負債）。8,000＋12,000＋45,000＝65,000円。"},{"id":"p02","tag":"給与","q":"給与から預かっていた源泉所得税 8,000円と住民税 12,000円を普通預金から納付した。","dr":[["預り金",20000]],"cr":[["普通預金",20000]],"exp":"預り金を納付すると負債が減る。源泉所得税・住民税は原則、翌月10日までに納付。"},{"id":"p03","tag":"給与","q":"社会保険料を普通預金から納付した。本人負担分（預り金）45,000円、会社負担分 45,000円。","dr":[["預り金",45000],["法定福利費",45000]],"cr":[["普通預金",90000]],"exp":"本人負担分は預り金の減少、会社負担分は費用の「法定福利費」。社会保険料は翌月末に引き落とされる。"},{"id":"p04","tag":"給与","q":"従業員の健康診断の費用 11,000円を現金で支払った（全員が対象）。","dr":[["福利厚生費",11000]],"cr":[["現金",11000]],"exp":"全従業員が対象の健康診断は「福利厚生費」。社会保険料の会社負担（法定福利費）と区別する。"},{"id":"c01","tag":"消費税","q":"【税抜経理】商品を 110,000円（税込、うち消費税 10,000円）で仕入れ、代金は掛けとした。","dr":[["仕入",100000],["仮払消費税",10000]],"cr":[["買掛金",110000]],"exp":"税抜経理では本体価格を仕入、消費税部分を「仮払消費税」（資産）に分ける。"},{"id":"c02","tag":"消費税","q":"【税抜経理】商品を 220,000円（税込、うち消費税 20,000円）で売り上げ、代金は掛けとした。","dr":[["売掛金",220000]],"cr":[["売上",200000],["仮受消費税",20000]],"exp":"受け取った消費税は国に納める預かりもの → 「仮受消費税」（負債）。"},{"id":"c03","tag":"消費税","q":"【決算】仮受消費税 20,000円と仮払消費税 10,000円を相殺し、納付額を計上した。","dr":[["仮受消費税",20000]],"cr":[["仮払消費税",10000],["未払消費税",10000]],"exp":"仮受−仮払＝納付額。差額 10,000円を「未払消費税」として負債計上する。"},{"id":"c04","tag":"消費税","q":"【税抜経理】事務用品 5,500円（税込、うち消費税 500円）を現金で購入した。","dr":[["消耗品費",5000],["仮払消費税",500]],"cr":[["現金",5500]],"exp":"経費でも税抜経理なら消費税部分を分ける。"},{"id":"k01","tag":"決算","q":"【決算】備品について当期の減価償却費 40,000円を計上した（直接法）。","dr":[["減価償却費",40000]],"cr":[["備品",40000]],"exp":"固定資産は使った期間に費用配分する。直接法では資産（備品）を直接減らす。"},{"id":"k02","tag":"決算","q":"得意先が倒産し、当期に発生した売掛金 30,000円が回収不能となった。","dr":[["貸倒損失",30000]],"cr":[["売掛金",30000]],"exp":"回収できない売掛金は消して、費用の「貸倒損失」。（引当金がある場合は別処理）"},{"id":"k03","tag":"決算","q":"【決算】借入金の利息のうち、当期分なのに未払いのもの 3,000円を計上した。","dr":[["支払利息",3000]],"cr":[["未払費用",3000]],"exp":"発生主義：払っていなくても当期の費用は当期に計上。相手は「未払費用」。"},{"id":"k04","tag":"決算","q":"【決算】当期に支払った保険料のうち、翌期分 12,000円を前払費用に振り替えた。","dr":[["前払費用",12000]],"cr":[["保険料",12000]],"exp":"翌期分は当期の費用ではないので、資産の「前払費用」に移す。"},{"id":"k05","tag":"決算","q":"【決算】当期の法人税・住民税・事業税 120,000円を計上した（中間納付なし）。","dr":[["法人税等",120000]],"cr":[["未払法人税等",120000]],"exp":"申告・納付は決算日から2か月以内。それまでは「未払法人税等」として負債計上。"},{"id":"k06","tag":"決算","q":"【決算】貸付金の利息のうち、当期分なのに未収のもの 5,000円を計上した。","dr":[["未収収益",5000]],"cr":[["受取利息",5000]],"exp":"当期に発生した収益は受け取っていなくても計上（発生主義）。相手は「未収収益」。"}],"checks":{"l01":[{"q":"月次の仕事として最も適切なものは？","choices":["年末調整","売掛金の入金消込","法人税の申告","株主総会の招集"],"a":1,"exp":"入金消込は毎月の売掛金管理の中心業務。年末調整・法人税申告は年次。"},{"q":"仕訳の根拠となる請求書・領収書などを何と呼ぶ？","choices":["証憑（しょうひょう）","伝票","元帳","試算表"],"a":0,"exp":"取引の事実を証明する書類を証憑と呼ぶ。原則7年間の保存が必要。"}],"l02":[{"q":"貸借対照表の等式として正しいのは？","choices":["資産＝負債−純資産","資産＝負債＋純資産","収益＝費用＋資産","負債＝資産＋純資産"],"a":1,"exp":"資産の調達元が、他人から（負債）か自分たち（純資産）かを表す。"},{"q":"「未払金」はどの要素？","choices":["資産","負債","収益","費用"],"a":1,"exp":"将来支払う義務なので負債。"}],"l03":[{"q":"費用が増えたとき、仕訳のどちら側に書く？","choices":["借方（左）","貸方（右）"],"a":0,"exp":"費用のホームポジションは借方。"},{"q":"借入金を返済した。借入金はどちら側？","choices":["借方（左）","貸方（右）"],"a":0,"exp":"負債の減少は借方。"}],"l04":[{"q":"事務所用の机（備品）を後払いで買った。貸方の科目は？","choices":["買掛金","未払金","売掛金","前受金"],"a":1,"exp":"商品以外の後払いは未払金。"},{"q":"請求書と入金を突き合わせて売掛金を消す作業は？","choices":["棚卸","入金消込","年末調整","減価償却"],"a":1,"exp":"入金消込は売掛金管理の基本業務。"}],"l05":[{"q":"給与から天引きした源泉所得税の納付期限（原則）は？","choices":["当月末","翌月10日","翌月末","年末"],"a":1," 納める制度は？","choices":["年末調整","源泉徴収","確定申告","特別徴収"],"a":1,"exp":"差し引いた所得税は原則、翌月10日までに納付。"},{"q":"1年間の源泉所得税の過不足を12月の給与などで精算する手続きは？","choices":["年末調整","確定申告","算定基礎届","年度更新"],"a":0,"exp":"従業員の扶養控除・保険料控除などを反映し、源泉所得税を精算する。"},{"q":"給与支払報告書・源泉徴収票などの法定調書の提出期限は？","choices":["12月31日","1月31日","3月15日","3月31日"],"a":1,"exp":"毎年1月31日まで。償却資産申告も同じく1月31日まで。"},{"q":"社会保険料の基準となる標準報酬月額を決めるため、毎年7月に提出する書類は？","choices":["算定基礎届","月額変更届","年度更新申告書","扶養控除等申告書"],"a":0,"exp":"4〜6月の報酬をもとに7月1日〜10日に提出する。"},{"q":"労働保険（労災・雇用保険）の保険料を申告・納付する毎年の手続きは？","choices":["算定基礎","年度更新","年末調整","賞与支払届"],"a":1,"exp":"毎年6月1日〜7月10日に行う。"},{"q":"法人税の確定申告の期限（原則）は？","choices":["決算日から1か月以内","決算日から2か月以内","決算日から3か月以内","翌年3月15日"],"a":1,"exp":"事業年度終了の翌日から2か月以内。延長の特例もある。"},{"q":"仕入税額控除を受けるために原則として保存が必要な書類は？","choices":["見積書","納品書","適格請求書（インボイス）","発注書"],"a":2,"exp":"2023年10月からインボイス制度が始まった。"},{"q":"電子帳簿保存法で、2024年1月から電子保存が義務になったのは？","choices":["紙の領収書","電子取引のデータ（メール添付の請求書など）","仕訳帳","現金出納帳"],"a":1,"exp":"電子で受け取った請求書等は、印刷保存ではなく電子データのまま保存する。"},{"q":"帳簿書類の保存期間（法人税法上の原則）は？","choices":["3年","5年","7年","永久"],"a":2,"exp":"原則7年。欠損金がある事業年度は10年。"},{"q":"すべての勘定科目の残高・合計を集計し、貸借の一致を確かめる表は？","choices":["精算表","試算表","元帳","伝票"],"a":1,"exp":"月次・年次の決算で必ず作成する。"},{"q":"勘定科目ごとに取引を集計した帳簿は？","choices":["仕訳帳","総勘定元帳","現金出納帳","補助簿"],"a":1,"exp":"仕訳帳と総勘定元帳を主要簿と呼ぶ。"},{"q":"売上高から売上原価を引いた利益は？","choices":["営業利益","経常利益","売上総利益（粗利）","当期純利益"],"a":2,"exp":"粗利。商品・サービスそのものの儲け。"},{"q":"流動資産 ÷ 流動負債 で計算する指標は？","choices":["自己資本比率","流動比率","ROE","売上高利益率"],"a":1,"exp":"短期的な支払能力を示す。一般に高いほど安全。"},{"q":"1年以内に現金化・支払期限が来るかで流動・固定を分ける基準は？","choices":["正常営業循環基準","1年基準（ワン・イヤー・ルール）","重要性の原則","継続性の原則"],"a":1,"exp":"営業取引で生じた売掛金・買掛金などは正常営業循環基準で流動になる。"},{"q":"一度採用した会計処理を、正当な理由なく変更してはいけないという原則は？","choices":["継続性の原則","保守主義の原則","明瞭性の原則","単一性の原則"],"a":0,"exp":"期間比較ができなくなるのを防ぐため。企業会計原則の一般原則のひとつ。"},{"q":"取引先と債権・債務の残高を確認し合う書類は？","choices":["残高確認書","納品書","見積書","検収書"],"a":0,"exp":"監査や決算時に、売掛金・買掛金の残高が正しいか確認するために使う。"},{"q":"中小企業の少額減価償却資産の特例で、一括で費用にできるのは1個いくら未満？","choices":["10万円未満","20万円未満","30万円未満","50万円未 hoices":[["納品は3月なので、3月の売上として計上します。請求書はすぐ発行しましょう",15,"正解。売上は「請求した日」ではなく「納品・役務提供した日」に計上する（出荷基準・検収基準など会社のルールに従う）。"],["請求書の日付が4月なので、4月の売上にします",-15,"これが「期ズレ」。3月決算の会社なら、前期の売上が今期にずれて決算が不正確になる。"],["入金されたときに売上にします",-10,"それは現金主義。会社の会計は発生主義が原則。"]],"point":"売上・費用の計上時期は「いつ請求したか」ではなく「いつ取引が発生したか」。月末・期末の計上もれ（期ズレ）は監査でも重点的に見られる。"},{"day":"4月5日（金）","who":"支払処理","icon":"🧾","tag":"二重払い","text":"同じ取引先から、郵送の請求書とPDFの請求書が届いた。金額は同じ 330,000円、請求書番号も同じ「INV-0412」。","choices":[["同じ請求書の重複なので、1回だけ支払う。請求書番号で支払済みかも確認する",15,"正解。二重払いは経理で一番多いミスのひとつ。請求書番号・金額・日付で突き合わせよう。"],["2通届いたので2回支払う",-20,"二重払い。返金してもらうのは手間がかかり、取引先にも迷惑。"],["念のため両方とも支払わない",-10,"支払遅延になってしまう。期日どおりに払うのも経理の大切な仕事。"]],"point":"支払前チェック：①請求書番号の重複 ②発注・納品（検収）との一致 ③金額・振込先 ④承認者の承認。"},{"day":"4月10日（水）","who":"カレンダー","icon":"📅","tag":"期限","text":"今日は10日。何か忘れていない？","choices":[["3月分の給与で預かった源泉所得税と住民税の納付期限！",15,"正解。毎月10日は源泉所得税・住民税の納付期限（納期の特例を受けていない場合）。遅れると延滞税などがかかる。"],["社会保険料の納付日",-5,"社会保険料は翌月末の口座振替。10日ではない。"],["特に何もない",-15,"源泉所得税の納付を忘れると、不納付加算税と延滞税がかかる。"]],"point":"毎月のルーティン期限：10日＝源泉所得税・住民税、月末＝社会保険料の引き落とし。"},{"day":"4月26日（金）","who":"月次締め","icon":"🔍","tag":"残高照合","text":"月末の預金残高照合。通帳の残高が、帳簿より 5,500円少ない。","choices":[["通帳の明細と帳簿を1件ずつ突き合わせて、記帳もれの引き落としを探す",15,"正解。口座振替の手数料やサブスク料金の引き落としの記帳もれがよくある原因。必ず原因を特定する。"],["差額を雑損失にして合わせる",-15,"原因を調べずに差額を埋めるのは最悪の対応。不正や大きなミスを見逃すことになる。"],["来月になれば合うかもしれないので、そのままにする",-10,"差異は放置すると原因がどんどん追えなくなる。"]],"point":"預金・現金・売掛金・買掛金は毎月「外部の証拠（通帳・取引先）」と残高を照合する。合わないときは、まず原因の特定。"}]},{"rank":"担当者","years":"入社2〜3年目","icon":"📗","intro":"ひとりで支払・入金・経費を任されるように。取引先や社内とのやりとりで判断力が試される。","events":[{"day":"4月3日（水）","who":"メール","icon":"📧","tag":"不正防止","text":"取引先「株式会社ミドリ物産」から急ぎのメール：「口座を変更しました。本日支払い分から、新しい口座（海外の銀行）へお振込みください。至急お願いします」","choices":[["登録済みの電話番号に電話して、担当者に直接確認する",20,"完璧。これは「ビジネスメール詐欺（BEC）」の典型的な手口。メール以外の、もともと知っている連絡先で確認するのが鉄則。"],["このメールに返信して、本当か確認する",-10,"メールが乗っ取られていたら、返信先も詐欺師。メールで確認しても意味がない。"],["至急とのことなので、口座を変更して振り込む",-25,"これで数千万円をだまし取られる被害が実際に起きている。急がせるのは詐欺の常套手段。"]],"point":"振込先の変更依頼は、必ずメール以外の既知の連絡先で確認。変更は書面＋上長承認など社内ルールに沿って行う。"},{"day":"4月8日（月）","who":"広報部","icon":"🎨","tag":"源泉徴収","text":"個人で活動しているデザイナーさんにロゴを作ってもらった。デザイン料 100,000円（税抜）の請求書が来たので、そのまま振り込んでほしいとのこと。","choices":[["個人へのデザイン料なので、源泉所得税（10.21%）を差し引いて支払う",20,"正解。個人へのデザイン料・原稿料・講演料・士業報酬などは源泉徴収が必要。100,000円 × 10.21% ＝ 10,210円を差し引き、翌月10日までに納付する。"],["請求どおり全額を振り込む",-15,"源泉徴収もれ。後から会社が不足分と不納付加算税を納めることになる。"],["法人と同じなので特に何もしない",-10,"法人への支払いは原則源泉徴収不要だが、個人への一定の報酬は必要。"]],"point":"源泉徴収が必要な報酬：原稿料・デザイン料・講演料・税理士/弁護士等の報酬など（支払先が個人の場合）。100万円以下は10.21%、超える部分は20.42%。"},{"day":"4月11日（木）","who":"入金確認","icon":"🏦","tag":"入金消込","text":"株式会社アオバ商事への請求 220,000円に対し、入金は 219,560円。440円足りない。","choices":[["振込手数料が差し引かれていると考え、契約条件を確認。当社負担で問題なければ支払手数料として処理する",15,"正解。契約で「振込手数料は買い手負担」なら先方に連絡、慣行で当社負担なら差額を費用処理する。"],["440円の未入金として、毎月督促し続ける",-5,"契約上請求できるなら連絡は必要だが、まず原因を推測・確認しよう。"],["差額は放置して、売掛金を全額消す",-15,"差額の仕訳をしないと売掛金や預金の残高が合わなくなる。"]],"point":"入金差額の原因あるある：振込手数料の差引、まとめ払い、値引き・相殺、過入金、別の会社名義での入金。"},{"day":"4月12日（金）","who":"営業部長","icon":"🍽️","tag":"交際費","text":"取引先と4人で会食して、飲食代は 36,000円でした。精算をお願いします。","choices":[["1人あたり9,000円。1万円以下の飲食費なので、参加者・人数などを記録すれば交際費から除外できる。記録を出してもらう",20,"正解。2024年4月以降、1人あたり1万円以下の飲食費は、相手先・人数などを記録すれば税務上の交際費から除外できる（会議費などで処理）。"],["飲食代はすべて会議費にする",-10,"1人1万円を超える接待は交際費。科目を変えても税務上は交際費として扱われる。"],["領収書だけあれば、記録はいらない",-5,"1万円基準の適用には、日付・参加者の氏名と関係・人数・金額・店名などの記録が必要。"]],"point":"交際費か会議費か：社外との飲食で1人1万円以下（2024年4月〜）なら記録の保存を条件に交際費から除外可。社内だけの飲食は対象外。"},{"day":"4月22日（月）","who":"メール","icon":"📎","tag":"電子帳簿保存法","text":"取引先から、請求書のPDFがメールで届いた。","choices":[["PDFのまま、取引日・取引先・金額で検索できるようにして保存する",15,"正解。電子帳簿保存法により、電子で受け取った請求書等は電子データのまま保存する（2024年1月から義務化）。"],["印刷して紙のファイルに綴じれば十分",-10,"紙に印刷しただけの保存は、電子取引データの保存としては認められない。"],["処理が終わったら削除する",-15,"請求書は原則7年間の保存義務がある。"]],"point":"電子取引データの保存要件：①改ざん防止（訂正削除の記録が残るシステム or 事務処理規程など） ②検索性（日付・金額・取引先）。"}]},{"rank":"主任","years":"入社4〜6年目","icon":"📘","intro":"月次決算の中心メンバーに。科目判断・決算処理・後輩指導を任される。","events":[{"day":"4月15日（月）","who":"総務部","icon":"💻","tag":"固定資産","text":"新しいノートPCを 250,000円（税抜）で1台購入しました。経理処理をお願いします。（当社は中小企業・青色申告）","choices":[["30万円未満なので、中小企業者等の少額減価償却資産の特例で、全額をその期の費用（損金）にできる",20,"正解。中小企業者等は30万円未満の資産を一括で損金算入できる（年間合計300万円まで）。固定資産台帳への記録と償却資産税の申告も忘れずに。"],["10万円以上なので、必ず4年で減価償却する",0,"原則はそのとおりだが、中小企業には特例がある。会社の方針で選ぶ。"],["消耗品費で処理する",-10,"消耗品費として一括処理できるのは原則10万円未満。"]],"point":"金額の目安：10万円未満＝消耗品費／20万円未満＝一括償却資産（3年均等）も可／30万円未満＝中小企業の特例／それ以上＝固定資産として減価償却。"},{"day":"4月17日（水）","who":"施設管理","icon":"🔧","tag":"修繕費","text":"壊れた空調の修理で 180,000円かかりました。元の状態に戻しただけです。","choices":[["元の状態に戻す修理で20万円未満なので、修繕費として費用処理する",15,"正解。原状回復の修理は修繕費。性能アップや耐用年数を延ばす支出は資本的支出（資産計上）になる。"],["高額なので建物（資産）に計上する",-10,"価値を高める改良ではないので、資産計上は不要。"],["消耗品費で処理する",-5,"修理代は修繕費が適切。"]],"point":"修繕費と資本的支出：原状回復・維持管理は修繕費、価値の向上・耐用年数の延長は資本的支出。20万円未満や3年以内の周期の修理は修繕費にできる形式基準もある。"},{"day":"3月31日（決算日）","who":"決算準備","icon":"📦","tag":"決算","text":"3月中に工事は完了しているが、業者からの請求書（約500,000円）がまだ届いていない。決算はどうする？","choices":[["作業は当期に完了しているので、見積額で未払計上する（請求書到着後に差額を調整）",20,"正解。費用も発生主義。請求書がなくても、当期に発生した費用は当期に計上する。"],["請求書が届いてから、翌期の費用にする",-15,"期ズレで当期の利益が過大になる。"],["決算を締めるのを待ってもらう",-5,"申告期限があるので、見積もりで計上して進めるのが実務。"]],"point":"決算での「未払計上」：期末までに納品・役務提供を受けたもので請求書が未着のものは、見積額で計上する。"},{"day":"4月30日（火）","who":"経理課長","icon":"🧑‍💼","tag":"月次分析","text":"月次試算表を見たら、広告宣伝費が先月の3倍になっている。明日の役員会に出すけど、大丈夫？","choices":[["増えた理由（キャンペーン実施など）を担当部署に確認し、コメントを添えて報告する",15,"正解。数字を作るだけでなく「なぜそうなったか」を説明できるのが経理の価値。誤計上（科目違い・二重計上）の発見にもつながる。"],["数字は正しく集計しているので、そのまま出す",-5,"集計が正しくても、科目間違いや二重計上が隠れているかもしれない。"],["目立つので、一部を翌月に回して平らにする",-25,"これは利益操作。絶対にやってはいけない。"]],"point":"月次分析の基本：前月比・前年同月比・予算比で大きく動いた科目は、原因を確認してコメントをつける。"},{"day":"入社3年目の春","who":"新入社員","icon":"🧑‍🎓","tag":"後輩指導","text":"新しく入った後輩が、10万円の応接テーブルを「消耗品費」で入力していた。どうする？","choices":[["なぜ備品（固定資産）になるのか理由を説明し、迷いやすい判断をチェックリストにまとめて共有する",15,"正解。直すだけでなく「なぜ」を伝え、仕組みで再発を防ぐのが主任の仕事。"],["黙って自分で修正しておく",-5,"後輩は同じミスを繰り返す。教える機会を逃している。"],["みんなの前で厳しく注意する",-10,"萎縮するとミスを隠すようになる。経理ではそれが一番怖い。"]],"point":"ミスの再発防止は「人を責める」より「仕組みで防ぐ」。チェックリスト・マニュアル・ダブルチェック。"}]},{"rank":"係長","years":"入社7〜9年目","icon":"📙","intro":"チームのまとめ役。監査・税務調査の窓口となり、チームの仕組みづくりも担う。","events":[{"day":"4月19日（金）","who":"社長","icon":"👔","tag":"公私混同","text":"この家族旅行のホテル代、会社の経費で落としておいて。","choices":[["業務に関係ない支出は経費にできないことを説明し、個人負担にしてもらう（会社が払った場合は役員への貸付などで処理）",20,"勇気ある正解。私的な支出を経費にすると、税務調査で否認され、役員賞与扱い・重加算税の対象になることも。会社と社長を守るのも経理の役目。"],["社長の指示なので、旅費交通費で処理する",-25,"粉飾・脱税に加担することになる。経理担当者も責任を問われかねない。"],["福利厚生費で処理する",-15,"家族旅行は福利厚生費にもならない。"]],"point":"経費になるのは「事業のための支出」だけ。立場が上の人の依頼でも、ルールにもとづいて説明できるのが信頼される経理。"},{"day":"係長1年目","who":"経費精算の確認","icon":"🕵️","tag":"社内不正","text":"部下Aさんのタクシー領収書を見ていたら、毎月同じタクシー会社で、領収書の連番が飛び飛びに続いている。金額は毎回ちょうど上限ぎりぎり。","choices":[["事実（日付・金額・連番）を整理して上長・内部監査に報告し、調査は会社の手続きに沿って進める",20,"正解。不正の疑いは、証拠を整理し、決められたルートで報告する。決めつけず、ひとりで抱え込まない。"],["本人をすぐに呼び出して問い詰め、チームにも共有する",-5,"まだ疑いの段階。証拠が散逸したり、名誉の問題になったりする。"],["気まずいので見なかったことにする",-25,"見逃すと不正は拡大する。発見できる立場の人が動かないと、組織は守れない。"]],"point":"不正の兆候：同じパターンの繰り返し、上限ぎりぎりの金額、連番の領収書、休日・深夜の多用。発見したら事実を整理して正式なルートで報告。"},{"day":"係長1年目","who":"税務調査官","icon":"🏛️","tag":"税務調査","text":"税務調査で調査官から「この 120,000円の会議費、相手は誰で何の会議ですか？」と聞かれた。すぐには思い出せない。","choices":[["「確認してお答えします」と伝え、証憑と記録を調べて事実を回答する",15,"正解。わからないことを推測で答えるのは厳禁。記録にもとづいて正確に回答する。"],["たぶん○○社との打ち合わせだったと思います、とその場で答える",-10,"推測の回答が事実と違うと、全体の信頼性を疑われる。"],["関係する資料を見せないようにする",-25,"調査の妨げは重いペナルティの対象。誠実な対応が結局一番の近道。"]],"point":"税務調査対応：①聞かれたことに事実で答える ②わからないことは持ち帰って確認 ③日頃から証憑と記録を整理しておくのが最大の対策。"},{"day":"係長1年目","who":"監査法人","icon":"📋","tag":"債権管理","text":"監査法人から「期末の売掛金のうち、1年以上入金がない取引先がありますね」と指摘された。","choices":[["営業部と回収状況・相手の経営状態を確認し、回収可能性に応じて貸倒引当金の計上や貸倒処理を検討する",15,"正解。回収できない可能性がある債権は、資産として過大にならないよう評価する。"],["そのうち入金されるはずなので、何もしない",-10,"回収できない売掛金を資産に残すと、資産と利益が過大になる。"],["指摘された分だけ、こっそり消しておく",-15,"根拠なく消すのも誤り。確認・判断・承認の手続きが必要。"]],"point":"売掛金は「年齢調べ（エイジング）」で滞留を管理。長期滞留は回収可能性を評価し、貸倒引当金・貸倒損失を検討する。"},{"day":"係長2年目","who":"経理部長","icon":"🧑‍💼","tag":"決算早期化","text":"うちの月次決算は締めに15日かかっている。経営陣から「もっと早く数字がほしい」と言われた。どう改善する？","choices":[["締めのスケジュールと作業を洗い出し、見積計上の活用・残高照合の前倒し・他部署からの資料提出期限の設定で短縮する",15,"正解。早期化は「作業の並べ替え」と「他部署を巻き込むルールづくり」がカギ。"],["全員で残業して乗り切る",-5,"一時的には早くなっても続かない。仕組みが変わっていない。"],["チェック作業を省いて早くする",-15,"早くても間違った数字では意味がない。"]],"point":"決算早期化のコツ：①作業の標準化・マニュアル化 ②締め日前に終わる作業は前倒し ③請求書・経費の提出期限を全社ルールに ④重要性の低いものは見積もりで計上。"}]},{"rank":"課長","years":"入社10〜14年目","icon":"💼","intro":"経理課を率いる管理職。会社のお金と計画を守り、他部門とも渡り合う。","events":[{"day":"課長1年目","who":"資金繰り表","icon":"💰","tag":"資金繰り","text":"資金繰り表を更新したら、大口の入金が翌月にずれ込み、来月末の支払い（仕入代金・給与）に約3,000万円足りないことがわかった。","choices":[["すぐに経営陣へ報告し、取引銀行に短期借入や当座貸越の相談をする。並行して入金の前倒し交渉も検討する",20,"正解。資金不足は「早く気づいて早く動く」がすべて。銀行は直前の相談を嫌う。"],["仕入先への支払いを、連絡せずに遅らせる",-15,"信用を一気に失い、取引停止につながりかねない。"],["支払日の前日まで様子を見る",-20,"直前では銀行も対応できない。利益が出ていても資金が尽きれば倒産する（黒字倒産）。"]],"point":"資金繰り表で「いつ・いくら足りないか」を数か月先まで予測するのが課長の重要任務。"},{"day":"課長1年目","who":"営業本部長","icon":"📈","tag":"売上の押し込み","text":"期末直前、営業本部長から「目標まで少し足りない。取引先に大量出荷して今期の売上にして、来期に返品してもらう約束はついてるから」と言われた。","choices":[["返品前提の出荷は売上の実態がなく計上できないと説明し、必要なら上層部や監査役にも相談する",20,"正解。いわゆる「押し込み販売」。返品が前提なら売上計上は認められず、粉飾につながる。"],["本部長の指示なので、出荷どおり売上に計上する",-25,"粉飾決算に加担することになる。発覚すれば会社も担当者も重い責任を負う。"],["売上には計上するが、メモだけ残しておく",-15,"メモを残しても不正な計上であることは変わらない。"]],"point":"売上は「実態」で判断。期末の異常な出荷、翌期の大量返品、異例の取引条件は、監査でも重点的に確認される。"},{"day":"課長2年目","who":"予算会議","icon":"🎯","tag":"予算管理","text":"各部から出てきた来期予算を積み上げたら、会社の利益目標に5,000万円届かない。","choices":[["各部の前提（単価・数量・人員計画）を確認し、経営方針と照らし合わせて各部と調整する",15,"正解。経理は数字の「つじつま合わせ」ではなく、前提を確認して実現可能な計画にするファシリテーター。"],["経理の判断で各部の経費を一律カットする",-10,"現場の納得がない予算は達成されない。"],["売上予算を目標に合うように上乗せしておく",-15,"根拠のない予算は、未達になったときに誰も責任を持てない。"]],"point":"予算管理：前提を明確にした予算を作り、毎月「予算と実績の差（予実差異）」を分析して打ち手につなげる。"},{"day":"課長2年目","who":"経理チーム","icon":"🤖","tag":"経理DX","text":"請求書の受け取り・入力・支払いの処理に毎月チームで100時間以上かかっている。どう改善する？","choices":[["今の業務フローを洗い出してムダを見直した上で、電子請求書の受領や自動仕訳などのシステムを導入し、効果を測る",15,"正解。「業務の見直し→システム化→効果測定」の順番が大事。"],["高機能なシステムを入れれば全部解決する",-5,"今の非効率なフローのままシステム化すると、ムダも一緒に自動化される。"],["人を増やして対応する",0,"短期的には有効でも、根本的な解決にはならない。"]],"point":"経理DX：ペーパーレス化（電子帳簿保存法対応）、銀行明細の自動取込、請求書の電子受領、自動仕訳など。まずは業務フローの見直しから。"}]},{"rank":"経理部長","years":"入社15年目〜","icon":"🏆","intro":"経営陣の一員として、会社の数字に最終責任を持つ立場。最後の試練に挑もう。","events":[{"day":"経理部長1年目","who":"社長（経営会議）","icon":"👔","tag":"利益とキャッシュ","text":"社長「今期は過去最高益なのに、なぜ会社の現金は減ったんだ？ 経理のミスじゃないのか？」","choices":[["キャッシュフロー計算書をもとに、売掛金・在庫の増加、設備投資、借入返済などで現金が出ていったことを説 let S = load();
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s ? { ...DEF, ...s } : { ...DEF }; } catch (e) { return { ...DEF }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const HEART_MAX = 5, HEART_MIN = 20; // 20分で1回復
function regenHearts() {
  if (S.hearts >= HEART_MAX) { S.heartTs = Date.now(); return; }
  const n = Math.floor((Date.now() - S.heartTs) / (HEART_MIN * 6e4));
  if (n > 0) { S.hearts = Math.min(HEART_MAX, S.hearts + n); S.heartTs += n * HEART_MIN * 6e4; save(); }
}
function nextHeartMin() { return Math.max(1, HEART_MIN - Math.floor((Date.now() - S.heartTs) / 6e4)); }
function daily() {
  const t = todayStr();
  if (S.quests.date !== t) S.quests = { date:t, lessons:0, correct:0, swipe:0, claimed:[] };
  if (S.plays.date !== t) S.plays = { date:t, n:0 };
  // 連続日数が途切れたか（フリーズで守る）
  if (S.lastDay && dayDiff(S.lastDay, t) > 1) {
    const missed = dayDiff(S.lastDay, t) - 1;
    if (S.freeze >= missed) { S.freeze -= missed; S.lastDay = todayStr(new Date(Date.now() - 864e5)); toast(`ストリークフリーズで連続記録を守りました（${missed}個使用）`); }
    else S.streak = 0;
  }
  save();
}
const boost = () => S.boostUntil > Date.now();
const level = xp => Math.floor(Math.sqrt(xp / 25)) + 1;
const RANKS = ['新入社員','担当者','主任','係長','課長','経理部長'];

function addXp(n) { const t = todayStr(); S.xp += n; S.hist[t] = (S.hist[t] || 0) + n; }
function touchStreak() {
  const t = todayStr();
  if (S.lastDay === t) return false;
  S.streak = S.lastDay && dayDiff(S.lastDay, t) === 1 ? S.streak + 1 : 1;
  S.lastDay = t; S.bestStreak = Math.max(S.bestStreak, S.streak);

}

/* ───────── 効果音・振動・紙吹雪 ───────── */
let AC;
function beep(kind) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { ok:[[660,.07],[990,.12]], ng:[[220,.18]], tap:[[520,.04]], win:[[523,.1],[659,.1],[784,.1],[1047,.22]], coin:[[1200,.05],[1600,.08]] }[kind];
    let t = AC.currentTime;
    for (const [f, d] of seq) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === 'ng' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .9;
    }
  } catch (e) {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function confetti(n = 140) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  const cols = ['#14A06B','#E5432F','#F2A516','#2F6FE4','#8A5CF0','#FFC94A'];
  const P = Array.from({length:n}, () => ({ x:c.width/2 + (Math.random()-.5)*c.width*.3, y:c.height*.35, vx:(Math.random()-.5)*18*devicePixelRatio,
    vy:(-Math.random()*16-6)*devicePixelRatio, r:(4+Math.random()*5)*devicePixelRatio, c:rnd(cols), a:Math.random()*6, s:Math.random()*.3+.1 }));
  let f = 0;
  (function tick() {
    x.clearRect(0,0,c.width,c.height);
    for (const p of P) { p.vy += .55*devicePixelRatio; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.s;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r,-p.r/2,p.r*2,p.r); x.restore(); }
    if (++f < 150) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height);
  })();
}

function swipeGame() {
  const deck = shuffle(Object.keys(A).concat(Object.keys(A)));
  let i = 0, score = 0, combo = 0, time = 45, ok = 0, ng = 0, over = false;
  const scr = layer(`<div class="inner wrap">
    <div class="lhead"><button class="xbtn" id="gx" aria-label="やめる">${I.x}</button><div style="flex:1">
      <div class="gamehud"><span>スコア <span class="num" id="sc" style="color:var(--gold-d)">0</span></span><span id="cb" class="small"></span><span class="num" id="tm">45</span></div>
      <div class="timer"><i id="tb" style="width:100%"></i></div></div></div>
    <div class="arena" id="ar"></div>
    <div class="sides"><button class="btn" style="background:var(--blue); color:#fff; box-shadow:0 4px 0 var(--blue-d)" id="bl">← 借方</button>
      <button class="btn btn-danger" id="br">貸方 →</button></div>
    <p class="hint" style="margin-top:12px">借方グループ＝資産・費用　／　貸方グループ＝負債・純資産・収益</p></div>`);
  const ar = $('#ar', scr);
  const card = (a, under) => `<div class="sw ${under?'under':''}"><span class="lab l">借方</span><span class="lab r">貸方</span>
    <span class="small muted">勘定科目</span><span class="n">${esc(a)}</span></div>`;
  const draw = () => { ar.innerHTML = card(deck[(i+1)%deck.length], true) + card(deck[i%deck.length]); bindDrag(ar.lastElementChild); };
  const judge = side => {
    if (over) return;
    const a = deck[i % deck.length], dr = ['資産','費用'].includes(A[a].cat), right = (side === 'L') === dr;
    const top = ar.lastElementChild;
    top.style.transition = 'transform .25s, opacity .25s'; top.style.transform = `translateX(${side==='L'?-420:420}px) rotate(${side==='L'?-25:25}deg)`; top.style.opacity = 0;
    if (right) { combo++; ok++; const g = 10 * (combo >= 10 ? 3 : combo >= 5 ? 2 : 1); score += g; beep('ok'); buzz(12); if (combo === 5 || combo === 10) floatText(`${combo}連続！ ×${combo>=10?3:2}`); }
    else { combo = 0; ng++; beep('ng'); buzz([30,40,30]); toast(`${a} は ${A[a].cat}（${dr?'借方':'貸方'}グループ）`); }
    $('#sc', scr).textContent = score; $('#cb', scr).textContent = combo >= 2 ? `🔥 ${combo}連続` : '';
    i++; setTimeout(draw, 200);
  };
  const bindDrag = el => {
    let x0 = null, dx = 0;
    el.onpointerdown = e => { x0 = e.clientX; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; };
    el.onpointermove = e => { if (x0 === null) return; dx = e.clientX - x0; el.style.transform = `translateX(${dx}px) rotate(${dx/14}deg)`;
      el.querySelector('.lab.l').style.opacity = Math.max(0, -dx/80); el.querySelector('.lab.r').style.opacity = Math.max(0, dx/80); };
    el.onpointerup = el.onpointercancel = () => { if (x0 === null) return; x0 = null;
      if (Math.abs(dx) > 80) judge(dx < 0 ? 'L' : 'R'); else { el.style.transition = 'transform .2s'; el.style.transform = ''; el.querySelectorAll('.lab').forEach(l => l.style.opacity = 0); } dx = 0; };
  };
  $('#bl', scr).onclick = () => judge('L'); $('#br', scr).onclick = () => judge('R');
  const key = e => { if (e.key === 'ArrowLeft') judge('L'); if (e.key === 'ArrowRight') judge('R'); };
  document.addEventListener('keydown', key);
  const timer = setInterval(() => {
    time--; $('#tm', scr).textContent = time; $('#tb', scr).style.width = (time / 45 * 100) + '%';
    if (time <= 0) end();
  }, 1000);
  const end = () => {
    if (over) return; over = true; clearInterval(timer); document.removeEventListener('keydown', key);
    const best = score > S.swipeBest; S.swipeBest = Math.max(S.swipeBest, score); S.quests.swipe = Math.max(S.quests.swipe, score);
    const coins = Math.floor(score / 20) * (S.pro ? 2 : 1); S.coins += coins; addXp(Math.min(20, Math.floor(score / 15)));
    if (score >= 100) addBadge('swipe100');
    touchStreak(); checkBadges(); save(); beep('win'); if (best) confetti();
    scr.innerHTML = `<div class="inner wrap" style="justify-content:center; text-align:center">${mascot(S.wear, 'happy', 'bounce')}
      <h1 style="margin-top:8px">${best ? 'ベスト更新！' : 'タイムアップ！'}</h1>
      <div class="tiles"><div class="tile" style="border-color:var(--gold)"><div class="h" style="background:var(--gold)">スコア</div><div class="v" style="color:var(--gold-d)">${score}</div></div>
        <div class="tile" style="border-color:var(--green)"><div class="h" style="background:var(--green)">正解</div><div class="v" style="color:var(--green-d)">${ok}</div></div>
        <div class="tile" style="border-color:var(--shu)"><div class="h" style="background:var(--shu)">ミス</div><div class="v" style="color:var(--shu)">${ng}</div></div></div>
      <p class="disp" style="color:var(--gold-d)">+${coins} コイン</p><div style="height:16px"></div>
      <button class="btn btn-primary" id="again">もう一度</button><div style="height:10px"></div><button class="btn btn-ghost" id="ok">おわる</button></div>`;
    $('#again', scr).onclick = () => { closeLayer(); ACTIONS.swipe(); };
    $('#ok', scr).onclick = () => { closeLayer(); render(); };
  };
  $('#gx', scr).onclick = () => { over = true; clearInterval(timer); document.removeEventListener('keydown', key); closeLayer(); render(); };
  draw();
}

    je:p => ({ dr:exTax('消耗品費', p), cr:[['現金', p]], note:'社内イベント用なら消耗品費や福利厚生費で処理します。' }) },
  { id:'calc', ic:'🖩', t:'12桁電卓', p:800, d:'経理の相棒。億単位も一発',
    je:p => ({ dr:exTax('消耗品費', p), cr:[['現金', p]], note:'電卓は10万円未満なので備品ではなく消耗品費。' }) },
  { id:'goldcalc', ic:'✨', t:'黄金の電卓', p:0, pro:true, d:'Pro メンバー限定' },
];
const FUNDING = [
  { c:500, y:120, t:'創業資金', ic:'🌱', r:'' }, { c:1200, y:250, t:'増資', ic:'📈', r:'人気' }, { c:3000, y:480, t:'IPO（上場）', ic:'🔔', r:'いちばんお得' },
];
const DEPOSIT = { amt:500, rate:.05, hours:24, wh:.20315 };
function receipt({ title, rows, dr, cr, note }) {
  const n = Math.max(dr.length, cr.length);
  const lines = Array.from({length:n}, (_, i) => `<tr><td>${dr[i] ? esc(dr[i][0]) : ''}</td><td class="a">${dr[i] ? yen(dr[i][1]) : ''}</td><td>${cr[i] ? esc(cr[i][0]) : ''}</td><td class="a">${cr[i] ? yen(cr[i][1]) : ''}</td></tr>`).join('');
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box" style="text-align:left">
    <div class="paper" style="animation:unfold .45s cubic-bezier(.2,.8,.2,1)"><div class="kind">${esc(title)}</div>
      <div class="sub">経理ラボ購買部　${todayStr().replaceAll('-', '/')}</div>
      <table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>
      <div class="seal" style="position:absolute; right:14px; bottom:12px; width:48px; height:48px; border:3px solid var(--shu); color:var(--shu); border-radius:50%;
        display:grid; place-items:center; font-family:var(--f-disp); font-weight:800; font-size:.8rem; transform:rotate(-10deg); animation:seal .45s .35s cubic-bezier(.2,1.6,.4,1) both">領収</div></div>
    <div class="disp small" style="margin-top:6px">この取引の仕訳</div>
    ${n ? `<table class="entry"><tr><th>借方</th><th style="text-align:right">金額</th><th>貸方</th><th style="text-align:right">金額</th></tr>${lines}</table>`
        : `<div class="card" style="padding:10px 12px; font-weight:800; color:var(--shu)">仕訳なし（会社の経費ではありません）</div>`}
    <p class="small" style="line-height:1.7; margin:4px 0 6px">💡 ${esc(note)}</p>
    <button class="btn btn-primary" id="rc-ok">OK</button></div>`;
  document.body.append(m); $('#rc-ok', m).onclick = () => { m.remove(); render(); };
}
const priceRows = (name, p, coinLabel = 'コイン') => [['品名', esc(name)], ['金額', `<b>${yen(p)} ${coinLabel}</b>（税込）`], ['内消費税', `${yen(taxIn(p))}（10%）`]];
function depositCard() {
  const d = S.deposit;
  if (!d) return `<div class="card" style="display:grid; gap:8px">
      <div style="display:flex; gap:12px; align-items:center"><span style="font-size:2rem">🏦</span><div style="min-width:0"><b class="disp">定期預金</b>
      <div class="small muted" style="line-height:1.6">${DEPOSIT.amt}コインを${DEPOSIT.hours}時間預けると、利息${DEPOSIT.amt*DEPOSIT.rate}コイン。<br>ただし利息からは税金 20.315% が源泉徴収されます。</div></div></div>
      <button class="btn btn-gold" data-act="deposit" ${S.coins < DEPOSIT.amt ? 'disabled' : ''}>${DEPOSIT.amt} コインを預ける</button></div>`;
  const left = d.ts + DEPOSIT.hours * 36e5 - Date.now();
  return `<div class="card" style="display:grid; gap:8px"><div style="display:flex; gap:12px; align-items:center"><span style="font-size:2rem">🏦</span>
      <div style="min-width:0"><b class="disp">定期預金 ${yen(d.amt)} コイン</b><div class="small muted">${left > 0 ? `満期まであと ${Math.floor(left/36e5)}時間${Math.ceil(left%36e5/6e4)}分` : '満期になりました！'}</div></div></div>
      <button class="btn btn-primary" data-act="withdraw" ${left > 0 ? 'disabled' : ''}>${left > 0 ? '満期を待っています' : '利息を受け取る'}</button></div>`;
}
function viewShop() {
  return `<div style="padding-top:8px; display:flex; align-items:center; gap:12px">${mascot(S.wear, 'happy', 'bounce').replace('class="mascot', 'style="width:84px;height:84px;margin:0" class="mascot')}
    <div style="min-width:0"><h1 style="font-size:1.4rem">購買部</h1><p class="muted small" style="margin:4px 0 0; line-height:1.6">買うたびに領収書と仕訳が切られます。<br>経費になる？ ならない？ 当ててみよう</p></div></div>
    ${S.pro ? '' : `<button class="promo" style="width:100%; margin-top:14px; text-align:left" data-act="paywall"><div style="font-size:2rem">✨</div>
      <div style="min-width:0"><b>経理ラボ Pro</b><div class="small" style="opacity:.9">ハート無制限・全ステージ・黄金の電卓</div></div>
      <span class="x disp" style="background:#fff; color:#5B32E0; padding:8px 12px; border-radius:12px">7日無料</span></button>`}
    <div class="section-title">事務用品・福利厚生</div>
    <div class="shop">${ITEMS.map(it => `<button class="item" data-act="buy:${it.id}" ${it.can() ? '' : 'disabled style="opacity:.5"'}>
      <span class="ic">${it.ic}</span><span class="t">${it.t}</span><span class="d">${it.d}</span>
      ${it.id==='freeze' ? `<span class="own">所持 ${S.freeze}/2</span>` : ''}${it.id==='hint' ? `<span class="own">所持 ${S.hints}本</span>` : ''}${it.id==='boost' && boost() ? '<span class="own">発動中</span>' : ''}
      <span class="price">${I.coin}${yen(it.p)}<span class="small muted" style="font-family:var(--f-body); font-weight:500">税込</span></span></button>`).join('')}</div>
    <div class="section-title">チョーボの装備</div>
    <div class="shop">${OUTFITS.map(o => { const own = S.owned.includes(o.id) || (o.pro && S.pro), wear = S.wear.includes(o.id);
      return `<button class="item" data-act="outfit:${o.id}"><span class="ic">${o.ic}</span><span class="t">${o.t}</span><span class="d">${o.d}</span>
        ${own ? `<span class="own">${wear ? '着用中（タップで外す）' : '所持（タップで着る）'}</span>` : o.pro ? '<span class="pro-pill" style="box-shadow:none; font-size:.66rem; padding:4px 8px; align-self:flex-start">PRO</span>' : `<span class="price">${I.coin}${yen(o.p)}</span>`}</button>`; }).join('')}</div>
    <div class="section-title">財務</div>${depositCard()}
    <div class="section-title">資金調達</div>
    <div class="packs">${FUNDING.map(f => `<button class="pack" data-act="pack:${f.c}">
      ${f.r ? `<span class="ribbon">${f.r}</span>` : ''}<span class="ic">${f.ic}</span>
      <span><span class="t">${f.t}</span><br><span class="small muted num">${yen(f.c)} コイン${f.c >= 1200 ? `（${Math.round((1 - f.y / f.c / (120/500)) * 100)}%お得）` : ''}</span></span><span class="yen">¥${f.y}</span></button>`).join('')}</div>
    <p class="demo-note">デモ版のため、資金調達は実際の支払いなしでコインが追加されます。</p><div style="height:16px"></div>`;
}
ACTIONS.buy = id => {
  const it = ITEMS.find(x => x.id === id);
  if (!it.can()) return;
  if (S.coins < it.p) { toast(`コインが ${yen(it.p - S.coins)} 足りません（資金ショート！）`); buzz(30); return; }
  S.coins -= it.p;
  if (id === 'refill') S.hearts = HEART_MAX;
  if (id === 'freeze') S.freeze++;
  if (id === 'hint') S.hints += 3;
  if (id === 'boost') S.boostUntil = Math.max(Date.now(), S.boostUntil) + 15 * 6e4;
  if (id === 'ticket') S.tickets += 3;
  S.receipts = (S.receipts || 0) + 1; checkBadges(); save(); beep('coin');
  receipt({ title:'領収書', rows:priceRows(it.t, it.p), ...it.je(it.p) });
};
ACTIONS.outfit = id => {
  const o = OUTFITS.find(x => x.id === id), own = S.owned.includes(id) || (o.pro && S.pro);
  if (!own) {
    if (o.pro) return paywall('黄金の電卓は Pro メンバー限定です');
    if (S.coins < o.p) { toast(`コインが ${yen(o.p - S.coins)} 足りません（資金ショート！）`); buzz(30); return; }
    S.coins -= o.p; S.owned.push(id); S.wear.push(id); S.receipts = (S.receipts || 0) + 1; beep('coin'); confetti(60);
    checkBadges(); save(); receipt({ title:'領収書', rows:priceRows(o.t, o.p), ...o.je(o.p) }); return;
  }
  S.wear = S.wear.includes(id) ? S.wear.filter(w => w !== id) : [...S.wear, id];
  checkBadges(); save(); render();
};
ACTIONS.pack = c => {
  const f = FUNDING.find(x => x.c === +c); S.coins += f.c; checkBadges(); save(); beep('coin'); confetti(90);
  receipt({ title:'払込証明', rows:[['内容', `${f.t}（デモ）`], ['払込額', `<b>${yen(f.c)} コイン</b>`], ['消費税', '不課税（出資は消費税の対象外）']],
    dr:[['普通預金', f.c]], cr:[['資本金', f.c]], note: f.c >= 3000 ? '上場すると株主が一気に増え、四半期ごとの開示や内部統制の監査（J-SOX）が求められます。経理の腕の見せどころ！' : '株主からの出資は返済不要。借入金（負債）ではなく資本金（純資産）が増えます。' });
};
ACTIONS.deposit = () => {
  if (S.coins < DEPOSIT.amt) return;
  S.coins -= DEPOSIT.amt; S.deposit = { amt:DEPOSIT.amt, ts:Date.now() }; save(); beep('coin');
  receipt({ title:'預金証書', rows:[['種類', '定期預金（1日もの）'], ['預入額', `<b>${yen(DEPOSIT.amt)} コイン</b>`], ['利率', '5%（ゲーム内の特別金利）']],
    dr:[['定期預金', DEPOSIT.amt]], cr:[['普通預金', DEPOSIT.amt]], note:'定期預金も会社のお金（資産）。普通預金から振り替えるだけなので、損も得もまだ出ていません。' });
};
ACTIONS.withdraw = () => {
  const d = S.deposit; if (!d || Date.now() < d.ts + DEPOSIT.hours * 36e5) return;
  const interest = Math.round(d.amt * DEPOSIT.rate), tax = Math.floor(interest * DEPOSIT.wh), net = d.amt + interest - tax;
  S.coins += net; S.deposit = null; S.receipts = (S.receipts || 0) + 1; addBadge('interest'); save(); beep('win'); confetti(70);
  receipt({ title:'利息計算書', rows:[['元本', `${yen(d.amt)} コイン`], ['利息', `${interest} コイン`], ['源泉徴収税（20.315%）', `△${tax} コイン`], ['お受取額', `<b>${yen(net)} コイン</b>`]],
    dr:[['普通預金', net], ['法人税等', tax]], cr:[['定期預金', d.amt], ['受取利息', interest]],
    note:'預金利息からは所得税・復興特別所得税15.315%と住民税5%（法人は所得税等のみの場合あり）が天引きされます。引かれた税金は法人税等（または仮払税金）で処理し、確定申告で精算します。' });
};
/* ───────── マイページ ───────── */
const BADGES = [
  { id:'first', ic:'🌱', t:'はじめの一歩', ok:() => Object.keys(S.done).length >= 1 },
  { id:'s3', ic:'🔥', t:'3日連続', ok:() => S.bestStreak >= 3 },
  { id:'s7', ic:'🏅', t:'7日連続', ok:() => S.bestStreak >= 7 },
  { id:'perfect', ic:'💯', t:'パーフェクト', ok:() => Object.keys(S.perfect).length >= 1 },
  { id:'unit2', ic:'📗', t:'取引マスター', ok:() => ['u2a','u2b','u2c'].every(n => S.done[n]) },
  { id:'bec', ic:'🛡️', t:'詐欺を見抜いた', ok:() => false },
  { id:'swipe100', ic:'🃏', t:'仕分け100点', ok:() => false },
  { id:'kacho', ic:'💼', t:'課長就任', ok:() => S.career.cleared.includes(3) },
  { id:'bucho', ic:'🏆', t:'経理部長', ok:() => false },
  { id:'fashion', ic:'🧤', t:'経理の正装', ok:() => S.owned.includes('armcover') && S.owned.includes('calc') },
  { id:'receipts', ic:'🧾', t:'領収書10枚', ok:() => (S.receipts || 0) >= 10 },
  { id:'interest', ic:'🏦', t:'利息生活', ok:() => false },
  { id:'akapen', ic:'🖍️', t:'赤ペン先生', ok:() => (S.hintUsed || 0) >= 5 },
  { id:'kessan', ic:'📊', t:'決算を締めた', ok:() => ['u6a','u6b'].every(n => S.done[n]) },
  { id:'lv10', ic:'⭐', t:'レベル10', ok:() => level(S.xp) >= 10 },
  { id:'pro', ic:'👑', t:'Pro メンバー', ok:() => S.pro },
];
function addBadge(id) { if (!S.badges.includes(id)) { S.badges.push(id); const b = BADGES.find(x => x.id === id); b && setTimeout(() => toast(`バッジ獲得：${b.t}`), 600); } }
function checkBadges() { BADGES.forEach(b => { if (b.ok()) addBadge(b.id); }); }
function viewMe() {
  const lv = level(S.xp), cur = 25 * (lv - 1) ** 2, nxt = 25 * lv ** 2;
  const days = Array.from({length:7}, (_, i) => { const d = new Date(Date.now() - (6 - i) * 864e5); return [todayStr(d), '日月火水木金土'[d.getDay()]]; });
  const mx = Math.max(S.goal, ...days.map(([d]) => S.hist[d] || 0));
  return `<div class="card prof" style="margin-top:8px">${mascot(S.wear, 'happy', 'bounce')}<div style="min-width:0; flex:1">
      <div class="small muted">Lv.${lv} · ${rankName()}</div><h2 style="font-size:1.3rem">あなたの経理ラボ</h2>
      <div class="mini" style="height:12px"><i style="width:0%; background:var(--green)" data-anim-w="${(S.xp-cur)/(nxt-cur)*100}%"></i></div>
      <div class="small muted num" style="margin-top:4px">次のレベルまで ${nxt - S.xp} XP</div></div></div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi" style="color:#FF7A1A">${I.fire}<div><b>${S.streak}日</b><span>連続（最高 ${S.bestStreak}）</span></div></div>
      <div class="kpi" style="color:var(--gold-d)">${I.bolt}<div><b class="num">${yen(S.xp)}</b><span>累計XP</span></div></div>
      <div class="kpi" style="color:var(--green)">${I.star}<div><b>${Object.keys(S.done).length}/${ALL_NODES.length}</b><span>クリアしたレッスン</span></div></div>
      <div class="kpi" style="color:var(--violet)">${I.career}<div><b>${esc(DATA.career[S.career.stage].rank)}</b><span>キャリア</span></div></div></div>
    <div class="section-title">今週の XP</div>
    <div class="card"><div class="week">${days.map(([d, w], i) => { const v = S.hist[d] || 0;
      return `<div class="col"><em>${v || ''}</em><div class="bar ${i===6?'today':''}" style="height:0" data-anim-h="${Math.max(4, v / mx * 90)}px"></div><span>${w}</span></div>`; }).join('')}</div></div>
    <div class="section-title">バッジ <span class="small muted">${S.badges.length}/${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b => `<div class="bdg ${S.badges.includes(b.id)?'got':''}"><span class="m">${b.ic}</span>${b.t}</div>`).join('')}</div>
    <div class="section-title">設定</div>
    <div class="card" style="padding-block:4px">
      <div class="row"><span>1日の目標</span><div class="seg">${[10,20,30,50].map(g => `<button class="${S.goal===g?'on':''}" data-act="goal:${g}">${g}</button>`).join('')}</div></div>
      <div class="row"><span>効果音</span><button class="switch ${S.sound?'on':''}" data-act="sound" aria-label="効果音" role="switch" aria-checked="${S.sound}"></button></div>
      <div class="row"><span>Pro</span><button class="pro-pill" data-act="paywall">${S.pro ? '利用中・管理' : '詳しく見る'}</button></div>
      <div class="row" style="border:0"><span class="muted small">データはこの端末のブラウザに保存されます</span><button class="small" style="color:var(--shu); font-weight:700" data-act="reset">リセット</button></div></div>
    <p class="demo-note">経理ラボ · 登場する会社名・人名はすべて架空です</p><div style="height:12px"></div>`;
}
ACTIONS.goal = g => { S.goal = +g; save(); render(); };
ACTIONS.sound = () => { S.sound = !S.sound; save(); render(); };
ACTIONS.reset = () => {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><h2>学習データを消しますか？</h2><p class="muted small">XP・連続記録・コイン・キャリアがすべて最初に戻ります。</p>
    <button class="btn btn-danger" id="y">すべて消す</button><button class="btn btn-ghost" id="n">やめる</button></div>`;
  document.body.append(m);
  $('#n', m).onclick = () => m.remove();
  $('#y', m).onclick = () => { S = { ...DEF, heartTs:Date.now() }; save(); m.remove(); TAB = 'learn'; render(); };
};

/* 起動 */
setInterval(() => { const h = S.hearts; regenHearts(); if (h !== S.hearts && !document.querySelector('.screen')) render(); }, 30000);
render();
</script>
