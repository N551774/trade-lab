<title>バランスシート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: 縦持ちスマホの1画面ゲーム。上にHUD、中央に画面、下に中央が浮いたタブ。物語・バトルは全画面。
   質感：夜のオフィス（紺）にすりガラスのパネル、金（報酬・★）と朱（朱書き＝攻撃・判子）。数字は細身の太字。 */
:root{
  --bg:#080B12; --bg2:#0F1420; --glass:rgba(22,28,42,.72); --glass2:rgba(34,42,60,.78); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#F1F3F8; --muted:#97A1B5; --gold:#F1C76A; --gold2:#FFE7A6; --gold3:#B88A2E; --shu:#FF5A3C; --shu2:#C7351E; --teal:#38D6A4; --blue:#7FB2FF; --violet:#A98BFF;
  --work:#7FB2FF; --family:#FF9D5C; --health:#38D6A4; --money:#F1C76A;
  --r3:#A9B7CC; --r4:#B98BFF; --r5:#F1C76A;
  --f-head:"Noto Serif JP","Hiragino Mincho ProN",serif; --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif; --f-num:"Barlow Condensed","Noto Sans JP",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:radial-gradient(120% 80% at 50% -10%,#1A2440 0%,var(--bg) 60%); color:var(--ink); font-family:var(--f-body); overscroll-behavior:none; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; position:relative}
button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.app{max-width:480px; height:100%; margin:0 auto; position:relative; overflow:hidden; display:flex; flex-direction:column; background:var(--bg); box-shadow:0 0 60px rgba(0,0,0,.6)}
#app > *:not(.modal):not(.toast):not(.ovl){animation:scrIn .34s var(--ease) backwards}
@keyframes scrIn{from{opacity:0; transform:translateY(10px) scale(.985); filter:blur(3px)}}
#fx{position:fixed; inset:0; pointer-events:none; z-index:100}
.side{padding-left:max(14px,env(safe-area-inset-left,0px)); padding-right:max(14px,env(safe-area-inset-right,0px))}
.scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.num{font-family:var(--f-num); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.02em}
.serif{font-family:var(--f-head)}
.muted{color:var(--muted)}
.small{font-size:.78rem}
.ripple{position:absolute; border-radius:50%; background:rgba(255,255,255,.35); transform:scale(0); animation:rip .5s ease-out forwards; pointer-events:none}
@keyframes rip{to{transform:scale(1); opacity:0}}
button{overflow:hidden}
.tab,.rbtn,.ep{overflow:visible}
.glass{background:var(--glass); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); border:1px solid var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.35)}

/* HUD */
.hud{display:flex; align-items:center; gap:6px; padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px; position:relative; z-index:6; background:linear-gradient(rgba(8,11,18,.92),rgba(8,11,18,.55)); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.lv{display:flex; align-items:center; gap:8px; min-width:0; flex:1}
.lvring{width:40px; height:40px; flex:none; position:relative; display:grid; place-items:center}
.lvring svg{position:absolute; inset:0; transform:rotate(-90deg)}
.lvring b{font-family:var(--f-num); font-size:1.05rem; line-height:1}
.lvring small{position:absolute; bottom:-3px; font-size:.5rem; letter-spacing:.1em; color:var(--gold); background:var(--bg); padding:0 3px; border-radius:3px}
.lv .t{min-width:0}
.lv .t b{display:block; font-size:.84rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lv .t span{display:inline-block; font-size:.6rem; letter-spacing:.08em; color:#1A1408; background:linear-gradient(90deg,var(--gold2),var(--gold)); padding:1px 8px; clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.cur{display:flex; align-items:center; gap:4px; background:rgba(0,0,0,.4); border:1px solid var(--line); border-radius:999px; padding:3px 9px 3px 3px; font-family:var(--f-num); font-size:.95rem; font-weight:700; line-height:1}
.cur .ic{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-family:var(--f-body); font-size:.6rem; font-weight:900; color:#1A1408; box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.cur.sta .ic{background:linear-gradient(#7CF2C6,var(--teal))} .cur.coin .ic{background:linear-gradient(var(--gold2),var(--gold))} .cur.so .ic{background:linear-gradient(135deg,#D9C4FF,#7B5CE0); color:#fff}
.cur.so::after{content:"+"; margin-left:3px; width:14px; height:14px; border-radius:50%; background:var(--violet); color:#fff; display:grid; place-items:center; font-size:.7rem}

/* タブ（中央が浮く） */
.tabs{position:relative; display:grid; grid-template-columns:repeat(5,1fr); align-items:end; background:linear-gradient(rgba(15,20,32,.6),rgba(8,11,18,.98)); border-top:1px solid var(--line); padding:4px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px)); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); z-index:6}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.62rem; color:var(--muted); padding:6px 0 2px; transition:color .2s}
.tab svg{width:24px; height:24px; transition:transform .25s var(--ease)}
.tab.on{color:var(--gold)} .tab.on svg{transform:translateY(-2px) scale(1.12); filter:drop-shadow(0 0 6px rgba(241,199,106,.6))}
.tab.mid{margin-top:-26px}
.tab.mid .orb{width:62px; height:62px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 45%,var(--gold3)); color:#2A1D05; box-shadow:0 0 0 4px var(--bg),0 0 0 5px rgba(241,199,106,.4),0 8px 22px rgba(241,199,106,.35); animation:orb 2.6s ease-in-out infinite}
.tab.mid .orb svg{width:28px; height:28px}
.tab.mid span{color:var(--gold); font-weight:700}
@keyframes orb{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 7px rgba(241,199,106,.25),0 8px 30px rgba(241,199,106,.55)}}
.dot{position:absolute; top:4px; right:24%; min-width:9px; height:9px; border-radius:9px; background:var(--shu); box-shadow:0 0 0 2px var(--bg); animation:dotp 1.6s infinite}
@keyframes dotp{50%{transform:scale(1.3)}}

/* ボタン */
.btn{display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px; width:100%; padding:14px; font-weight:900; font-size:1rem; letter-spacing:.06em; line-height:1.3; clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); transition:transform .1s, filter .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold) 50%,#D9A84A); color:#2A1D05; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.gold::after,.shine::after{content:""; position:absolute; inset:0; background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%); transform:translateX(-120%); animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.btn.shu{background:linear-gradient(180deg,#FF8A6E,var(--shu) 55%,var(--shu2)); color:#fff}
.btn.dark{background:var(--glass2); border:1px solid var(--line2); color:var(--ink)}
.btn.so{background:linear-gradient(135deg,#C6A8FF,#7C5CE8 60%,#5A3EC0); color:#fff}
.btn:disabled{filter:grayscale(1) brightness(.7); opacity:.6}
.card{background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.sec{font-family:var(--f-head); font-weight:900; font-size:1.02rem; margin:20px 0 10px; display:flex; align-items:center; gap:8px}
.sec::before{content:""; width:4px; height:16px; background:linear-gradient(var(--gold2),var(--gold3)); transform:skewX(-14deg)}
.sec small{font-family:var(--f-body); font-weight:500; color:var(--muted); font-size:.72rem}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:.7rem; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--muted); border:1px solid var(--line)}
.new{display:inline-block; font-family:var(--f-num); font-size:.7rem; font-weight:800; color:#fff; background:var(--shu); padding:1px 7px; letter-spacing:.08em; clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%); animation:dotp 1.6s infinite}

/* ホーム */
.home{flex:1; position:relative; overflow:hidden}
.home .bgx{position:absolute; inset:-20px; background:
  radial-gradient(60% 40% at 70% 20%,rgba(127,178,255,.18),transparent 70%),
  radial-gradient(50% 35% at 20% 60%,rgba(241,199,106,.10),transparent 70%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 64px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 48px),
  linear-gradient(180deg,#1C2945 0%,#0E1424 55%,#080B12 100%); animation:bgdrift 18s ease-in-out infinite alternate}
@keyframes bgdrift{to{transform:translate(10px,-8px) scale(1.03)}}
.dust{position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,231,166,.7),transparent),radial-gradient(1.5px 1.5px at 70% 60%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 40% 80%,rgba(241,199,106,.5),transparent),radial-gradient(1.5px 1.5px at 85% 25%,rgba(255,255,255,.5),transparent),radial-gradient(2.5px 2.5px at 55% 15%,rgba(127,178,255,.5),transparent); background-size:100% 100%; animation:dust 12s linear infinite; opacity:.8}
@keyframes dust{from{transform:translateY(20px)}to{transform:translateY(-40px)}}
.home .stand{position:absolute; left:0; right:0; bottom:150px; top:4px; display:flex; justify-content:center; align-items:flex-end; pointer-events:none; transition:transform .4s var(--ease)}
.home .stand img,.home .stand svg{height:100%; width:auto; max-width:none; filter:drop-shadow(0 18px 40px rgba(0,0,0,.65)); animation:breathe 5s ease-in-out infinite, standIn .7s var(--ease) backwards; transform-origin:bottom center; -webkit-mask-image:linear-gradient(#000 80%,transparent); mask-image:linear-gradient(#000 80%,transparent)}
@keyframes breathe{50%{transform:scale(1.01) translateY(-3px)}}
@keyframes standIn{from{opacity:0; transform:translateX(30px)}}
.home .tapzone{position:absolute; left:18%; right:22%; top:30px; bottom:240px; z-index:2}
.bubble{position:absolute; left:36%; right:76px; top:96px; z-index:4; background:rgba(250,247,240,.97); color:#1B1B1B; border-radius:16px; padding:10px 14px; font-size:.88rem; line-height:1.6; box-shadow:0 10px 30px rgba(0,0,0,.45); animation:bub .35s var(--ease)}
.bubble::after{content:""; position:absolute; left:30%; bottom:-9px; border:10px solid transparent; border-top-color:rgba(250,247,240,.97); border-bottom:0}
.bubble b{display:block; font-size:.66rem; letter-spacing:.1em; color:#9A6A1A}
@keyframes bub{from{opacity:0; transform:translateY(8px) scale(.94)}}
.hm-right{position:absolute; right:max(10px,env(safe-area-inset-right,0px)); top:12px; display:grid; gap:12px; z-index:3}
.rbtn{width:52px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.58rem; color:var(--ink); text-shadow:0 1px 4px #000; overflow:visible}
.rbtn .o{width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:var(--glass2); border:1px solid var(--line2); box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.15); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.rbtn svg{width:24px; height:24px}
.rbtn .dot{top:0; right:2px}
.hm-left{position:absolute; left:max(10px,env(safe-area-inset-left,0px)); top:12px; display:grid; gap:10px; z-index:3; width:118px}
.lbanner{border-radius:12px; overflow:hidden; height:70px; text-align:left; padding:8px 10px; background:linear-gradient(135deg,var(--c1),var(--c2)); border:1px solid var(--line2); box-shadow:0 8px 20px rgba(0,0,0,.45); display:flex; flex-direction:column; justify-content:flex-end}
.lbanner img{position:absolute; right:-14px; bottom:-6px; height:120%; width:auto; opacity:.85; -webkit-mask-image:linear-gradient(90deg,transparent,#000 40%); mask-image:linear-gradient(90deg,transparent,#000 40%)}
.lbanner b{position:relative; font-family:var(--f-head); font-size:.86rem; line-height:1.2; text-shadow:0 2px 6px rgba(0,0,0,.8)}
.lbanner span{position:relative; font-size:.58rem; color:var(--gold2); letter-spacing:.06em; text-shadow:0 1px 4px #000}
.hm-bottom{position:absolute; left:0; right:0; bottom:0; padding-bottom:10px; display:grid; gap:8px; z-index:3; background:linear-gradient(transparent,rgba(8,11,18,.85) 40%)}
.bsstrip{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:8px 10px; border-radius:12px}
.bsstrip div{font-size:.58rem; color:var(--muted); display:grid; gap:3px}
.bsstrip i{height:4px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; display:block}
.bsstrip i s{display:block; height:100%; border-radius:4px; transition:width .8s var(--ease)}
.story-cta{display:flex; align-items:center; gap:12px; padding:12px 14px; text-align:left; background:linear-gradient(110deg,rgba(60,44,14,.95),rgba(30,24,14,.92) 60%,rgba(20,18,16,.9)); border:1px solid rgba(241,199,106,.5); clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); box-shadow:inset 0 0 30px rgba(241,199,106,.12)}
.story-cta .k{font-size:.62rem; letter-spacing:.14em; color:var(--gold)}
.story-cta b{display:block; font-family:var(--f-head); font-size:1.08rem; line-height:1.4}
.story-cta .go{margin-left:auto; flex:none; display:grid; place-items:center; width:54px; height:54px; border-radius:50%; background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 50%,var(--gold3)); color:#2A1D05; font-weight:900; font-size:.72rem; animation:orb 2.2s ease-in-out infinite}

/* ミッション */
.mis{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line)}
.mis:last-child{border-bottom:0}
.mis .t{flex:1; min-width:0; font-size:.86rem}
.mis .t i{display:block; height:6px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:6px}
.mis .t i s{display:block; height:100%; background:linear-gradient(90deg,var(--gold3),var(--gold2))}
.claim{flex:none; font-size:.75rem; font-weight:900; padding:8px 12px; background:linear-gradient(var(--gold2),var(--gold)); color:#2A1D05; clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.claim:disabled{background:rgba(255,255,255,.08); color:var(--muted)}

/* ノベル */
.vn{flex:1; display:flex; flex-direction:column; position:relative; overflow:hidden}
.vn .stage{flex:1; position:relative; overflow:hidden; background:var(--scene,linear-gradient(#1A2130,#080B12))}
.vn .stage::before{content:""; position:absolute; inset:0; background:radial-gradient(80% 60% at 50% 30%,transparent,rgba(0,0,0,.55)); z-index:2; pointer-events:none}
.vn .stage::after{content:""; position:absolute; inset:0; background:linear-gradient(transparent 55%,rgba(8,11,18,.85)); pointer-events:none; z-index:2}
.vn .dust{z-index:1}
.vn .place{position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); left:0; z-index:4; font-size:.68rem; letter-spacing:.12em; color:var(--ink); background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,0)); padding:6px 30px 6px max(14px,env(safe-area-inset-left,0px)); max-width:70%; border-left:3px solid var(--gold); animation:placeIn .6s var(--ease)}
.vn .place:empty{display:none}
@keyframes placeIn{from{transform:translateX(-30px); opacity:0}}
.vn .ctl{position:absolute; top:calc(8px + env(safe-area-inset-top,0px)); right:max(10px,env(safe-area-inset-right,0px)); z-index:5; display:flex; gap:6px}
.vn .ctl button{font-family:var(--f-num); font-size:.78rem; font-weight:800; letter-spacing:.1em; padding:5px 10px; border-radius:999px; background:rgba(0,0,0,.45); border:1px solid var(--line2)}
.vn .ctl button.on{background:var(--gold); color:#2A1D05; border-color:var(--gold)}
.vn .who{position:absolute; inset:auto 0 0 0; height:92%; display:flex; justify-content:center; align-items:flex-end; z-index:1}
.vn .who img,.vn .who svg{height:100%; width:auto; max-width:none; animation:whoIn .5s var(--ease), breathe 5s ease-in-out .5s infinite; transform-origin:bottom center}
.vn .who img.cg{-webkit-mask-image:radial-gradient(70% 62% at 50% 42%,#000 55%,transparent 100%); mask-image:radial-gradient(70% 62% at 50% 42%,#000 55%,transparent 100%)}
@keyframes whoIn{from{opacity:0; transform:translateY(18px) scale(.98); filter:brightness(1.6) blur(2px)}}
.box{position:relative; z-index:3; min-height:172px; margin:-30px 10px 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); background:linear-gradient(rgba(16,21,33,.88),rgba(10,13,22,.96)); border:1px solid var(--line2); border-bottom:0; border-radius:16px 16px 0 0; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 -10px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(241,199,106,.35)}
.name{position:absolute; top:-14px; left:14px; display:inline-flex; align-items:baseline; gap:8px; font-family:var(--f-head); font-weight:900; font-size:.98rem; padding:4px 16px 4px 12px; background:linear-gradient(90deg,var(--c,var(--gold)),rgba(0,0,0,.85)); clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%); box-shadow:0 4px 12px rgba(0,0,0,.4)}
.name small{font-family:var(--f-body); font-weight:500; color:rgba(255,255,255,.75); font-size:.66rem}
.text{font-size:1.02rem; line-height:1.9; min-height:3.8em; white-space:pre-wrap; padding-top:6px; text-shadow:0 1px 2px rgba(0,0,0,.5)}
.text.narr{font-family:var(--f-head); color:#D7DCE6; text-align:center}
.nx{position:absolute; right:18px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); width:0; height:0; border:7px solid transparent; border-top:9px solid var(--gold); border-bottom:0; animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.choices{display:grid; gap:8px; margin-top:6px}
.choice{text-align:left; padding:12px 14px 12px 18px; line-height:1.55; font-size:.9rem; background:linear-gradient(90deg,rgba(241,199,106,.12),rgba(34,42,60,.9) 30%); border:1px solid var(--line2); border-left:3px solid var(--gold); animation:choiceIn .35s var(--ease) backwards}
.choice:nth-child(2){animation-delay:.06s} .choice:nth-child(3){animation-delay:.12s}
.choice:active{background:linear-gradient(90deg,rgba(241,199,106,.35),rgba(34,42,60,.9) 60%)}
.choice small{display:block; color:var(--gold); font-size:.66rem; margin-top:2px; letter-spacing:.08em}
@keyframes choiceIn{from{opacity:0; transform:translateX(-14px)}}
.fx{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.fx span{font-size:.74rem; font-weight:700; padding:3px 9px; background:rgba(255,255,255,.07); clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%); animation:fxIn .4s var(--ease) backwards}
.fx span:nth-child(2){animation-delay:.08s} .fx span:nth-child(3){animation-delay:.16s}
.fx .up{color:var(--teal)} .fx .dn{color:var(--shu)}
@keyframes fxIn{from{opacity:0; transform:translateY(6px) scale(.9)}}
.point{margin-top:4px; font-size:.84rem; line-height:1.75; background:linear-gradient(90deg,rgba(241,199,106,.14),rgba(241,199,106,.03)); border-left:3px solid var(--gold); padding:9px 11px; color:#EFE6CE}
.chap{position:absolute; inset:0; z-index:8; display:grid; place-items:center; text-align:center; background:#000; animation:chapOut 2.6s forwards; pointer-events:none}
.chap span{display:block; color:var(--gold); font-size:.78rem; letter-spacing:.4em}
.chap b{display:block; font-family:var(--f-head); font-size:2.6rem; letter-spacing:.3em; margin:8px 0; animation:chapB 1.4s var(--ease)}
.chap i{display:block; height:1px; width:0; margin:0 auto; background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:chapL 1.2s .3s var(--ease) forwards}
@keyframes chapB{from{letter-spacing:1em; opacity:0; filter:blur(6px)}}
@keyframes chapL{to{width:220px}}
@keyframes chapOut{0%,75%{opacity:1}100%{opacity:0}}

/* バトル */
.bt{flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; background:radial-gradient(90% 50% at 50% 0%,var(--bt1,#3A1E2A),transparent 70%),linear-gradient(#120E18,#080B12)}
.bt::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg,rgba(255,255,255,.02) 0 2px,transparent 2px 22px); pointer-events:none}
.bt-top{position:relative; padding-block:calc(10px + env(safe-area-inset-top,0px)) 8px}
.foe{display:flex; gap:12px; align-items:center}
.foe-card{flex:1; min-width:0; position:relative; background:linear-gradient(#FBF8EF,#E9E2D0); color:#1B1B1B; padding:9px 12px 8px; transform:rotate(-1.2deg); box-shadow:0 14px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.08); clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.foe-card::after{content:""; position:absolute; right:0; top:0; width:14px; height:14px; background:linear-gradient(225deg,transparent 50%,#CFC6AF 50%)}
.foe-card .k{display:inline-block; font-family:var(--f-num); font-size:.66rem; font-weight:800; letter-spacing:.16em; color:#fff; background:var(--shu); padding:0 7px; clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.foe-card b{display:block; font-family:var(--f-head); font-size:1.08rem; line-height:1.35; margin-top:3px}
.foe-card p{margin:0; font-size:.68rem; color:#5A5448}
.foe-card.hit{animation:hit .4s}
.foe-card.aura{box-shadow:0 14px 30px rgba(0,0,0,.55), 0 0 26px rgba(255,90,60,.45)}
@keyframes hit{20%{transform:translateX(-10px) rotate(-5deg); filter:brightness(1.8) saturate(.4)}55%{transform:translateX(8px) rotate(2deg)}}
.cdring{width:58px; height:58px; flex:none; position:relative; display:grid; place-items:center; text-align:center}
.cdring svg{position:absolute; inset:0; transform:rotate(-90deg)}
.cdring circle{transition:stroke-dashoffset .5s var(--ease)}
.cdring b{font-family:var(--f-num); font-size:1.6rem; line-height:1; color:var(--shu)}
.cdring span{position:absolute; bottom:-12px; font-size:.56rem; color:var(--muted); white-space:nowrap}
.cdring.warn b{animation:warn .7s infinite}
@keyframes warn{50%{transform:scale(1.25); color:#fff}}
.hpx{position:relative; height:12px; margin-top:16px; background:rgba(0,0,0,.5); border:1px solid var(--line2); transform:skewX(-14deg); overflow:hidden}
.hpx i{position:absolute; left:0; top:0; bottom:0; display:block}
.hpx .lag{background:#fff; transition:width .9s .35s ease-out}
.hpx .cur{background:linear-gradient(#FF8A6E,var(--shu) 60%,var(--shu2)); transition:width .2s}
.hpx span{position:absolute; right:6px; top:50%; transform:translateY(-50%) skewX(14deg); font-family:var(--f-num); font-size:.72rem; font-weight:700; text-shadow:0 1px 3px #000}
.combo-big{position:absolute; right:max(14px,env(safe-area-inset-right,0px)); top:132px; z-index:7; text-align:right; pointer-events:none; font-family:var(--f-num); font-weight:800; line-height:.9}
.combo-big b{display:block; font-size:2.6rem; background:linear-gradient(var(--gold2),var(--gold) 60%,var(--gold3)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.combo-big span{font-size:.8rem; letter-spacing:.2em; color:var(--gold)}
.combo-big.pop{animation:cpop .35s var(--ease)}
@keyframes cpop{from{transform:scale(1.6); opacity:.2}}
.bt-q{flex:1; overflow-y:auto; padding-block:6px 12px; position:relative}
.qbar{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.qk{font-size:.64rem; letter-spacing:.14em; color:var(--gold); white-space:nowrap}
.timer{flex:1; height:6px; background:rgba(255,255,255,.08); overflow:hidden; transform:skewX(-14deg)}
.timer s{display:block; height:100%; background:linear-gradient(90deg,var(--gold3),var(--gold2)); transform-origin:left; box-shadow:0 0 10px rgba(241,199,106,.6)}
.timer.low s{background:linear-gradient(90deg,var(--shu2),#FF8A6E); box-shadow:0 0 12px rgba(255,90,60,.8); animation:tlow .5s infinite}
@keyframes tlow{50%{opacity:.5}}
.qt{font-family:var(--f-head); font-weight:700; font-size:1.06rem; line-height:1.7; margin:2px 0 12px; animation:qIn .35s var(--ease)}
@keyframes qIn{from{opacity:0; transform:translateY(8px)}}
.opt{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--glass2); border:1px solid var(--line2); padding:12px 14px; margin-bottom:8px; line-height:1.5; font-size:.92rem; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); animation:optIn .3s var(--ease) backwards; transition:background .15s, transform .1s}
.opt:nth-of-type(2){animation-delay:.04s} .opt:nth-of-type(3){animation-delay:.08s} .opt:nth-of-type(4){animation-delay:.12s}
.opt:active{transform:scale(.98)}
.opt .lt{flex:none; width:24px; height:24px; display:grid; place-items:center; font-family:var(--f-num); font-weight:800; font-size:.85rem; background:rgba(241,199,106,.15); color:var(--gold); clip-path:polygon(25% 0,100% 0,75% 100%,0 100%)}
.opt.sel{border-color:var(--gold); background:linear-gradient(90deg,rgba(241,199,106,.25),var(--glass2))}
.opt.good{border-color:var(--teal); background:linear-gradient(90deg,rgba(56,214,164,.35),var(--glass2)); animation:good .4s}
.opt.bad{border-color:var(--shu); background:linear-gradient(90deg,rgba(255,90,60,.35),var(--glass2)); animation:shk .35s}
@keyframes good{40%{transform:scale(1.03)}}
.opt.gone{opacity:.18; text-decoration:line-through; pointer-events:none}
@keyframes optIn{from{opacity:0; transform:translateX(16px)}}
.cats{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.cats .opt{margin:0; justify-content:center; font-weight:900; font-size:1rem; padding:16px 10px; background:linear-gradient(160deg,var(--cc),rgba(20,26,40,.95) 75%); border-color:color-mix(in srgb,var(--cc) 60%,transparent)}
.cats .opt:last-child{grid-column:1/-1}
.acct{font-family:var(--f-head); font-size:1.9rem; font-weight:900; text-align:center; padding:22px 0; background:linear-gradient(#FBF8EF,#E9E2D0); color:#1B1B1B; margin-bottom:12px; box-shadow:0 10px 24px rgba(0,0,0,.45); transform:rotate(-1deg); animation:qIn .35s var(--ease)}
.je{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px}
.zone{min-height:84px; border:1px dashed var(--line2); padding:8px; display:flex; flex-direction:column; gap:5px; align-items:flex-start; transition:background .2s, border-color .2s}
.zone.on{border:1px solid var(--gold); background:linear-gradient(rgba(241,199,106,.12),transparent); box-shadow:inset 0 0 20px rgba(241,199,106,.12)}
.zone h4{margin:0; font-size:.68rem; color:var(--muted); font-weight:500; letter-spacing:.1em}
.zone.on h4{color:var(--gold)}
.ch{display:inline-block; padding:8px 12px; background:var(--glass2); border:1px solid var(--line2); font-size:.86rem; margin:3px; clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%); animation:fxIn .25s var(--ease) backwards}
.zone .ch{background:linear-gradient(90deg,rgba(241,199,106,.3),var(--glass2))}
.ch.used{visibility:hidden}
.bank{text-align:center}
.paper{background:linear-gradient(#FBF8EF,#EAE3D2); color:#1B1B1B; padding:10px 12px; margin-bottom:10px; box-shadow:0 10px 24px rgba(0,0,0,.4)}
.paper .pk{font-family:var(--f-head); font-weight:900; text-align:center; letter-spacing:.3em; border-bottom:1.5px solid #1B1B1B; padding-bottom:3px}
.paper table{width:100%; border-collapse:collapse; font-size:.78rem; margin-top:4px}
.paper td{padding:3px 2px; vertical-align:top}
.paper td:first-child{color:#6A6455; width:36%}
.ans{position:sticky; bottom:0; padding-top:10px; background:linear-gradient(transparent,#0A0D15 28%)}
.exp{background:var(--glass2); border:1px solid var(--line2); border-left:3px solid var(--shu); padding:10px 12px; font-size:.84rem; line-height:1.75; margin-bottom:8px; animation:qIn .3s var(--ease)}
.exp b.ng{color:var(--shu); font-family:var(--f-num); letter-spacing:.06em}
table.ent{width:100%; border-collapse:collapse; font-size:.8rem; margin:4px 0}
table.ent td,table.ent th{padding:3px 5px; border-bottom:1px solid var(--line); text-align:left}
table.ent td.a{text-align:right; font-family:var(--f-num)}
.bt-bot{position:relative; padding-block:8px calc(10px + env(safe-area-inset-bottom,0px)); background:linear-gradient(rgba(8,11,18,0),rgba(8,11,18,.95) 30%); border-top:1px solid var(--line)}
.teamhp{display:flex; align-items:center; gap:8px; font-size:.62rem; color:var(--muted); margin-bottom:8px}
.teamhp i{flex:1; height:8px; background:rgba(0,0,0,.5); border:1px solid var(--line2); transform:skewX(-14deg); overflow:hidden; display:block}
.teamhp i s{display:block; height:100%; background:linear-gradient(#7CF2C6,var(--teal) 60%,#1E9C74); transition:width .4s}
.teamhp b{font-family:var(--f-num); font-size:.9rem; color:var(--ink)}
.party{display:flex; gap:8px; align-items:stretch}
.pc{flex:1; max-width:96px; height:84px; position:relative; overflow:hidden; background:var(--glass2) center 14%/cover; border:1px solid var(--line2); clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.pc .g{position:absolute; left:0; right:0; bottom:0; height:calc(var(--g)*1%); background:linear-gradient(transparent,rgba(241,199,106,.55)); transition:height .4s var(--ease); mix-blend-mode:screen}
.pc .nm{position:absolute; left:0; right:0; bottom:0; padding:12px 6px 4px; font-size:.6rem; font-weight:700; background:linear-gradient(transparent,rgba(0,0,0,.85)); text-align:left; white-space:nowrap; overflow:hidden}
.pc .ini{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-head); font-size:2rem; font-weight:900; color:rgba(255,255,255,.3)}
.pc.full{border-color:var(--gold); animation:ready .9s infinite}
.pc.full::after{content:"必殺"; position:absolute; top:4px; right:4px; font-size:.6rem; font-weight:900; color:#2A1D05; background:var(--gold); padding:1px 6px; clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
@keyframes ready{50%{box-shadow:inset 0 0 22px rgba(241,199,106,.7); filter:brightness(1.2)}}
.item{flex:none; width:64px; display:grid; place-items:center; align-content:center; gap:2px; background:var(--glass2); border:1px solid var(--line2); font-size:.58rem; text-align:center; line-height:1.2; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.item svg{width:24px; height:24px; color:var(--gold)}
.item:disabled{opacity:.35}
.dmg{position:absolute; left:50%; top:46%; z-index:9; font-family:var(--f-num); font-weight:800; font-size:2.6rem; color:#fff; -webkit-text-stroke:2px #3A1A08; paint-order:stroke; text-shadow:0 4px 14px rgba(0,0,0,.6); animation:dmg 1s var(--ease) forwards; pointer-events:none; white-space:nowrap}
.dmg.crit{color:var(--gold2); font-size:3.2rem}
.dmg.crit::before{content:"CRITICAL"; position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:.8rem; letter-spacing:.2em; color:var(--shu); -webkit-text-stroke:0}
@keyframes dmg{0%{transform:translate(-50%,10px) scale(.3); opacity:0}20%{transform:translate(-50%,-8px) scale(1.25); opacity:1}35%{transform:translate(-50%,-6px) scale(1)}100%{transform:translate(-50%,-46px); opacity:0}}
.flash{position:absolute; inset:0; pointer-events:none; z-index:8; animation:fl .45s forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.ovl{position:absolute; inset:0; z-index:30}
.cutin{display:flex; align-items:center; overflow:hidden; background:rgba(0,0,0,.6); animation:fade 1.6s forwards}
.cutin::before{content:""; position:absolute; inset:-50%; background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 4deg,transparent 4deg 12deg); animation:spin 1.6s linear}
.cutin .band{position:relative; width:100%; height:46%; background:linear-gradient(100deg,var(--c) 0 58%,rgba(0,0,0,.2) 58.3%); animation:band .45s var(--ease); box-shadow:0 0 40px rgba(0,0,0,.6)}
.cutin .band::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(100deg,rgba(255,255,255,.12) 0 2px,transparent 2px 14px); animation:lines .4s linear infinite}
.cutin .band img{position:absolute; right:-8%; bottom:0; height:135%; width:auto; z-index:1; animation:slide .55s var(--ease); filter:drop-shadow(-10px 0 20px rgba(0,0,0,.5))}
.cutin .band b{position:absolute; left:6%; top:50%; transform:translateY(-50%); z-index:2; font-family:var(--f-head); font-weight:900; font-size:2rem; color:#fff; text-shadow:0 3px 14px rgba(0,0,0,.7); max-width:58%; line-height:1.25; animation:cutT .5s .15s var(--ease) backwards}
.cutin .band b small{display:block; font-family:var(--f-body); font-size:.74rem; letter-spacing:.16em; opacity:.9}
@keyframes band{from{transform:scaleY(0)}}
@keyframes slide{from{transform:translateX(70%); opacity:0}}
@keyframes lines{to{background-position:28px 0}}
@keyframes cutT{from{transform:translate(-30px,-50%); opacity:0; letter-spacing:.4em}}
@keyframes spin{to{transform:rotate(30deg)}}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
.splash{display:grid; place-items:center; background:rgba(0,0,0,.55); animation:fade 1.5s forwards}
.splash .bars{position:absolute; left:0; right:0; top:50%; height:120px; transform:translateY(-50%) skewY(-6deg); background:linear-gradient(90deg,var(--shu2),var(--shu) 40%,#2A0E08); animation:barsIn .4s var(--ease)}
.splash .t{position:relative; text-align:center; animation:cutT .5s .1s var(--ease) backwards}
.splash .t span{display:block; font-family:var(--f-num); letter-spacing:.4em; font-weight:800; color:var(--gold2); font-size:.9rem}
.splash .t b{display:block; font-family:var(--f-head); font-size:1.7rem; font-weight:900; text-shadow:0 3px 10px rgba(0,0,0,.5)}
@keyframes barsIn{from{transform:translateY(-50%) skewY(-6deg) scaleX(0)}}
.hanko{display:grid; place-items:center; background:rgba(0,0,0,.35); pointer-events:none}
.hanko .s{width:170px; height:170px; border-radius:50%; border:9px solid var(--shu); color:var(--shu); display:grid; place-items:center; font-family:var(--f-head); font-weight:900; font-size:5rem; transform:rotate(-14deg); animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both; background:rgba(255,90,60,.06); text-shadow:0 0 1px var(--shu)}
.hanko .s.gray{border-color:#8A93A3; color:#8A93A3}
.hanko p{position:absolute; bottom:22%; font-family:var(--f-num); font-size:1.1rem; letter-spacing:.4em; color:var(--gold2); animation:fxIn .4s .4s backwards}
@keyframes stamp{0%{transform:scale(3) rotate(-30deg); opacity:0}60%{transform:scale(.92) rotate(-14deg); opacity:1}100%{transform:scale(1) rotate(-14deg)}}
.tip{position:absolute; left:50%; transform:translateX(-50%); z-index:15; background:linear-gradient(var(--gold2),var(--gold)); color:#2A1D05; font-weight:900; font-size:.85rem; padding:9px 16px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.5); white-space:nowrap; animation:tipb 1.2s ease-in-out infinite; pointer-events:none}
.tip::after{content:""; position:absolute; left:50%; margin-left:-8px; border:8px solid transparent; top:100%; border-top-color:var(--gold)}
@keyframes tipb{50%{transform:translate(-50%,-4px)}}

/* 結果 */
.res{flex:1; overflow-y:auto; text-align:center; position:relative; padding-block:calc(30px + env(safe-area-inset-top,0px)) 20px}
.res::before{content:""; position:absolute; left:50%; top:120px; width:900px; height:900px; margin:-450px 0 0 -450px; background:repeating-conic-gradient(from 0deg,rgba(241,199,106,.10) 0 8deg,transparent 8deg 22deg); animation:rays 30s linear infinite; pointer-events:none; -webkit-mask-image:radial-gradient(circle,#000 20%,transparent 60%); mask-image:radial-gradient(circle,#000 20%,transparent 60%)}
@keyframes rays{to{transform:rotate(360deg)}}
.res > *{position:relative}
.res h1{font-family:var(--f-head); font-weight:900; font-size:2.1rem; margin:6px 0; letter-spacing:.12em; background:linear-gradient(var(--gold2),var(--gold) 55%,var(--gold3)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:chapB .8s var(--ease)}
.res .sub{display:inline-block; font-size:.72rem; letter-spacing:.14em; color:var(--muted); border-bottom:1px solid var(--line2); padding-bottom:3px}
.stars{font-size:2.6rem; letter-spacing:.15em; color:rgba(255,255,255,.12); margin:4px 0}
.stars span{display:inline-block}
.stars span.on{color:var(--gold); text-shadow:0 0 18px rgba(241,199,106,.7); animation:star .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes star{from{transform:scale(3) rotate(-30deg); opacity:0}}
.rank{font-family:var(--f-num); font-weight:800; font-size:5rem; line-height:1; background:linear-gradient(var(--gold2),var(--gold) 50%,var(--gold3)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 16px rgba(241,199,106,.4)); animation:star .6s cubic-bezier(.2,1.6,.4,1) .2s backwards}
.rew{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:16px 0}
.rew div{min-width:76px; background:var(--glass2); border:1px solid var(--line2); padding:8px 10px; font-size:.7rem; color:var(--muted); clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); animation:fxIn .4s var(--ease) backwards}
.rew div:nth-child(2){animation-delay:.1s} .rew div:nth-child(3){animation-delay:.2s} .rew div:nth-child(4){animation-delay:.3s} .rew div:nth-child(5){animation-delay:.4s}
.rew b{display:block; font-family:var(--f-num); font-size:1.4rem; color:var(--gold2)}
.lvup{display:inline-block; font-family:var(--f-num); font-weight:800; font-size:1.3rem; letter-spacing:.14em; padding:8px 22px; color:#2A1D05; background:linear-gradient(var(--gold2),var(--gold)); clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%); animation:star .6s cubic-bezier(.2,1.6,.4,1) .5s backwards}
.miss{text-align:left; margin-top:14px}
.miss details{background:var(--glass); border:1px solid var(--line); border-left:3px solid var(--shu); margin-bottom:6px}
.miss summary{padding:10px 12px; font-size:.85rem; cursor:pointer}
.miss details div{padding:0 12px 10px; font-size:.82rem; line-height:1.7}

/* スカウト */
.banner{position:relative; height:210px; overflow:hidden; text-align:left; background:linear-gradient(120deg,#4A1E12,#1E1026 62%); border:1px solid rgba(241,199,106,.45); clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.banner::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 26px)}
.banner img{position:absolute; right:-14px; bottom:0; height:120%; width:auto; filter:drop-shadow(-12px 0 24px rgba(0,0,0,.5))}
.banner .t{position:absolute; left:16px; top:16px; right:44%}
.banner .t span{display:inline-block; font-size:.62rem; font-weight:900; letter-spacing:.14em; color:#2A1D05; background:var(--gold); padding:1px 8px; clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.banner .t b{display:block; font-family:var(--f-head); font-size:1.32rem; line-height:1.35; margin-top:6px; text-shadow:0 2px 10px rgba(0,0,0,.7)}
.banner .t p{font-size:.72rem; color:#D9CDBE; margin:8px 0 0}
.rates{font-size:.76rem}
.rates table{width:100%; border-collapse:collapse}
.rates td{padding:5px 4px; border-bottom:1px solid var(--line)}
.env-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding-block:16px; perspective:600px}
.env{aspect-ratio:3/4; background:linear-gradient(#F3EDDD,#E2D8C0); position:relative; box-shadow:0 8px 18px rgba(0,0,0,.5); display:grid; place-items:center; animation:drop .5s cubic-bezier(.2,1.3,.4,1) backwards; overflow:hidden; border-radius:4px}
.env::before{content:""; position:absolute; left:0; right:0; top:0; height:44%; background:linear-gradient(160deg,#E8DEC6 50%,transparent 50.5%),linear-gradient(200deg,#E8DEC6 50%,transparent 50.5%)}
.env i{width:34%; aspect-ratio:1; border-radius:50%; background:var(--seal); position:relative; z-index:1; box-shadow:0 2px 4px rgba(0,0,0,.3)}
.env.r5{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(255,231,166,.95); animation:drop .5s cubic-bezier(.2,1.3,.4,1) backwards, gl 1s infinite}
.env.r4{box-shadow:0 0 0 2px var(--r4),0 0 16px rgba(185,139,255,.6)}
@keyframes gl{50%{filter:brightness(1.2)}}
.env.open{background:none; box-shadow:none; animation:none; display:block; overflow:visible}
.env.open::before{display:none}

function judge(q, st) {

/* 1問を出して答えを待つ → {ok, fast, timeout} */
function askIn(el, q, o = {}) {

      bank: q.t === 'je' ? shuffle([...right, ...shuffle(Object.keys(A).filter(a => !right.includes(a) && right.some(r => A[r].cat === A[a].cat))).slice(0, 3), ...shuffle(Object.keys(A).filter(a => !right.includes(a))).slice(0, 1)]) : [] };
    if (o.hint) {
      if (q.t === 'mcq') shuffle(q.choices.map((_, i) => i).filter(i => i !== q.a)).slice(0, Math.max(0, q.choices.length - 2)).forEach(i => st.gone.add(i));
      if (q.t === 'cat') shuffle(CATS.filter(c => c !== A[q.acct].cat)).slice(0, 3).forEach(c => st.gone.add(c));
      if (q.t === 'je') st.placed.借方.push(q.dr[0][0]);

      el.innerHTML = qBody(q, st) + (needConfirm ? `<div class="ans"><button class="btn gold" id="qgo" ${q.t === 'je' && !(st.placed.借方.length && st.placed.貸方.length) ? 'disabled' : ''}>${q.t === 'doc' && !st.picked.length ? '問題なし' : '決定'}</button></div>` : '');

      if (!ok && q.t === 'cat') { const g = el.querySelector(`[data-c="${A[q.acct].cat}"]`); if (g) g.classList.add('good'); }
      resolve({ ok, fast, timeout, from: src && src.isConnected ? center(src) : null });

      if (done) return;

        if (b.dataset.c) { st.sel = b.dataset.c; lastBtn = b; return finish(); }
        if (b.dataset.t !== undefined) { const i = +b.dataset.t; st.picked = st.picked.includes(i) ? st.picked.filter(x => x !== i) : [...st.picked, i]; }
        else if (b.dataset.b) { const a = b.dataset.b; if (!st.placed.借方.includes(a) && !st.placed.貸方.includes(a)) st.placed[st.side].push(a); }

const RATES = { 5:3, 4:17, 3:80 };
const PITY = 60;
function pull(n, guarantee4) {
  const out = [];
  for (let i = 0; i < n; i++) {
    G.pity++;
    const r = Math.random() * 100; let rar = r < RATES[5] ? 5 : r < RATES[5] + RATES[4] ? 4 : 3;
    if (G.pity >= PITY) rar = 5;
    if (guarantee4 && i === n - 1 && !out.some(c => CARD[c].r >= 4) && rar < 4) rar = 4;
    let pool = CARDS.filter(c => c.r === rar);
    if (rar === 5 && Math.random() < .5) pool = pool.filter(c => c.pickup);
    if (rar === 5) G.pity = 0;
    out.push(rnd(pool).id);
  }
  return out;
}
function addCards(ids) {
  const isNew = {};
  ids.forEach(id => { if (G.cards[id]) G.cards[id].dup = Math.min(5, G.cards[id].dup + 1); else { G.cards[id] = { lv:1, dup:0 }; isNew[id] = true; } });
  for (const id of Object.keys(G.cards).sort((a, b) => CARD[b].r - CARD[a].r)) { if (G.party.length >= 2) break; if (!G.party.some(p => CARD[p].char === CARD[id].char)) G.party.push(id); }
  save(); return isNew;
}
const cardHtml = (id, extra = '') => { const c = CARD[id]; return `<div class="ccard r${c.r}" style="--rc:var(--r${c.r}); ${face(c.char) ? `background-image:url(${face(c.char)})` : `background:linear-gradient(160deg,${P[c.char].c},#151A22)`}" ${extra}>${face(c.char) ? '' : `<span class="serif" style="position:absolute; inset:0; display:grid; place-items:center; font-size:2.4rem; font-weight:900; color:rgba(255,255,255,.35)">${P[c.char].ch}</span>`}<span class="st">${'★'.repeat(c.r)}</span><div class="bar"><b>${esc(c.title)}</b>${esc(P[c.char].name)}</div></div>`; };
async function openEnvelopes(ids) {

function chatView(who) {
  const threads = [...new Set(CHAT.filter(c => c.when()).map(c => c.from))];
  if (!who) {
    $('#app').innerHTML = hud() + `<div class="scroll side"><div class="sec">社内チャット <small>Kasane Chat</small></div>
      ${threads.length ? threads.map(f => { const ms = CHAT.filter(c => c.from === f && c.when()), last = ms[ms.length - 1], un = ms.filter(m => G.chat[m.id] === undefined).length;
        return `<button class="thread" data-f="${f}"><span class="av" ${avatarStyle(f)}></span><span class="t"><b>${esc(P[f].name)}</b> ${un ? `<span class="new">${un}</span>` : ''}<p>${esc(last.text)}</p></span><span class="small muted">${last.time}</span></button>`; }).join('') : '<p class="muted small">まだメッセージはありません。ストーリーを進めると届きます。</p>'}
      <div style="height:16px"></div></div>` + tabs('home');
    bindTabs(); $('.scroll').onclick = e => { const b = e.target.closest('[data-f]'); if (b) chatView(b.dataset.f); }; return;
  }
  const ms = CHAT.filter(c => c.from === who && c.when());
  const draw = () => {
    $('#app').innerHTML = `<div class="hud side"><button class="chip" id="back">← 戻る</button><b style="margin-left:6px">${esc(P[who].name)}</b><span class="chip" style="margin-left:auto">絆 Lv.${bondLv(who)}</span></div>
      <div class="scroll side"><div class="msgs">${ms.map(m => { const r = G.chat[m.id]; return `<div class="msg"><span class="av" ${avatarStyle(who)}></span><div><div class="b">${esc(m.text)}</div><span class="tm">${m.time}</span></div></div>`
        + (r !== undefined ? `<div class="msg me"><div class="b">${esc(m.replies[r].t)}</div></div><div class="msg"><span class="av" ${avatarStyle(who)}></span><div class="b">${esc(m.replies[r].back)}</div></div>`
        : `<div class="choices">${m.replies.map((x, i) => `<button class="choice" data-m="${m.id}" data-i="${i}">${esc(x.t)}</button>`).join('')}</div>`); }).join('')}</div></div>`;
    $('#back').onclick = () => chatView();
    $('.msgs').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; const m = CHAT.find(c => c.id === b.dataset.m), i = +b.dataset.i; G.chat[m.id] = i; bump({ ['b_' + who]: m.replies[i].b }); sfx('ok'); toast(`${P[who].name.split(' ')[0]}との絆 +${m.replies[i].b}`); draw(); };
    const sc = $('.scroll'); sc.scrollTop = sc.scrollHeight;
  };
  draw();
}

function tabs(on) {

  return `<nav class="tabs">${T.map(([k, l]) => { const dot = (k === 'scout' && free && G.tutScout) || (k === 'story' && nextEp() && on !== 'story');

      : `<button class="tab ${on === k ? 'on' : ''}" data-tab="${k}">${ICON[k]}${l}${dot ? '<span class="dot"></span>' : ''}</button>`; }).join('')}</nav>`;
}

  kirishima:['根拠を示してください。','……次は、間違えません。','妥協はしません。'],
  nagisa:['ちゃんと寝てますか？','点滴中に仕訳しないでください。','今日は何の日か、覚えてる？'],
  amagi:['前例がないなら、つくればいい！','それ、明日までにできる？','来年、プライム市場に行こう！','数字は、なんとかなるだろ？'],
};
const LB = [[50,'SO'],[300,'円'],[50,'SO'],[3,'研修資料'],[50,'SO'],[500,'円'],[150,'SO']];
function loginBonus() {
  const t = today(); if (G.login.last === t) return false;
  const y = new Date(Date.now() - 864e5), ys = `${y.getFullYear()}-${y.getMonth() + 1}-${y.getDate()}`;
  G.login.streak = G.login.last === ys ? G.login.streak + 1 : 1; G.login.last = t; G.login.total++;
  const day = ((G.login.total - 1) % 7) + 1, [rew, kind] = LB[day - 1];
  if (kind === 'SO') G.so += rew; else if (kind === '円') G.coins += rew; else G.mats += rew;
  save();
  modal(`<h2>ログインボーナス</h2><p class="muted small">${G.login.total}日目　連続 ${G.login.streak}日</p>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:12px 0">${LB.map(([r, k], i) => `<div style="text-align:center; font-size:.6rem; padding:6px 0; border-radius:8px; background:${i + 1 === day ? 'var(--gold)' : i + 1 < day ? 'var(--panel2)' : 'var(--panel)'}; color:${i + 1 === day ? '#2A1D05' : 'var(--muted)'}">${i + 1}日<br><b>${r}</b><br>${k === '研修資料' ? '資料' : k}</div>`).join('')}</div>
    <p style="text-align:center"><b style="color:var(--gold); font-size:1.2rem">${kind} +${rew}</b></p><button class="btn gold" id="lbok">受け取る</button>`, m => $('#lbok', m).onclick = () => { m.remove(); render(); });
  return true;
}
const MISSIONS = [{ k:'story', t:'ストーリーを1話クリア', n:1, so:50 }, { k:'run', t:'月次決算ランをクリア', n:1, so:50 }, { k:'scout', t:'スカウトを1回する', n:1, so:30 }];
function viewHome() {
  const ep = nextEp(), hc = G.party[0] && CARD[G.party[0]] ? CARD[G.party[0]].char : G.home;
  const free = Date.now() >= G.freeTs, un = unreadChat(), canClaim = MISSIONS.filter(m => G.daily.m[m.k] >= m.n && !G.daily.claimed.includes(m.k)).length;
  $('#app').innerHTML = hud() + `<div class="home"><div class="bgx"></div><div class="dust"></div><div class="stand" id="stand">${portrait(hc)}</div><button class="tapzone" id="tz" aria-label="${esc(P[hc].name)}に話しかける"></button>
    <div class="hm-left">
      <button class="lbanner" data-go="run" style="--c1:#24365A; --c2:#0F1626">${face('sumiya') ? `<img src="${face('sumiya')}" alt="">` : ''}<span>気力10</span><b>月次決算<br>ラン</b></button>
      <button class="lbanner" data-go="scout" style="--c1:#5A2414; --c2:#1E1026">${face('akeno') ? `<img src="${face('akeno')}" alt="">` : ''}<span>${free ? '無料1回' : 'ピックアップ'}</span><b>辞令封筒</b>${free ? '<span class="dot" style="top:6px; right:6px"></span>' : ''}</button>
    </div>
    <div class="hm-right">
      <button class="rbtn" id="chatBtn"><span class="o">${ICON.chat}</span>チャット${un ? '<span class="dot"></span>' : ''}</button>
      <button class="rbtn" id="misBtn"><span class="o">${ICON.mission}</span>ミッション${canClaim ? '<span class="dot"></span>' : ''}</button>
      <button class="rbtn" id="lbBtn"><span class="o">${ICON.cal}</span>ログボ</button>
      <button class="rbtn" data-go="party"><span class="o">${ICON.gear}</span>設定</button>
    </div>
    <div class="hm-bottom side">
      <div class="bsstrip glass">${STAT.map(([k, l, c]) => `<div><span>${l}</span><i><s style="width:0; background:var(${c})" data-w="${G.stat[k]}"></s></i></div>`).join('')}</div>
      <button class="story-cta shine" id="cta"><span><span class="k">${ep ? `STORY　${CHAPS[ep.ch - 1].no}「${CHAPS[ep.ch - 1].title}」` : 'STORY'}</span><b>${ep ? `${ep.no}「${ep.title}」` : 'エンディング'}</b><span class="small muted">${ep ? esc(ep.desc) : '終章「貸借一致」をもう一度見る'}</span></span><span class="go">PLAY</span></button>
    </div></div>` + tabs('home');
  bindTabs();
  requestAnimationFrame(() => document.querySelectorAll('.bsstrip s').forEach(e => e.style.width = e.dataset.w + '%'));
  $('#cta').onclick = () => { sfx('tap'); ep ? playEpisode(ep) : epDone('e35') ? ending() : go('run'); };
  document.querySelectorAll('.home [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $('#chatBtn').onclick = () => chatView();
  $('#misBtn').onclick = () => missionModal();
  $('#lbBtn').onclick = () => modal(`<h2>ログインボーナス</h2><p class="muted small">通算 ${G.login.total}日　連続 ${G.login.streak}日。今日の分は受け取り済みです。</p>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:12px 0">${LB.map(([r, k], i) => `<div style="text-align:center; font-size:.6rem; padding:6px 0; border-radius:8px; background:${i < ((G.login.total - 1) % 7) + 1 ? 'rgba(241,199,106,.25)' : 'rgba(255,255,255,.05)'}; color:var(--muted)">${i + 1}日<br><b class="num" style="font-size:.9rem; color:var(--ink)">${r}</b><br>${k === '研修資料' ? '資料' : k}</div>`).join('')}</div><button class="btn dark" onclick="this.closest('.modal').remove()">閉じる</button>`);
  const home = $('.home'), stand = $('#stand');
  home.onpointermove = e => { const r = home.getBoundingClientRect(); const dx = (e.clientX - r.left) / r.width - .5, dy = (e.clientY - r.top) / r.height - .5; stand.style.transform = `translate(${-dx * 14}px,${-dy * 8}px)`; };
  $('#tz').onclick = () => { sfx('tap'); const old = $('.bubble'); if (old) old.remove(); const d = document.createElement('div'); d.className = 'bubble'; d.innerHTML = `<b>${esc(P[hc].name)}</b><span></span>`; home.append(d); const t = rnd(HOME_LINES[hc] || ['……']); let k = 0; const sp = d.querySelector('span'); const iv = setInterval(() => { sp.textContent = t.slice(0, ++k); if (k >= t.length) clearInterval(iv); }, 35); setTimeout(() => d.remove(), 3600); };
  if (G.tutScout) loginBonus();
}
function missionModal() {
  modal(`<h2>デイリーミッション</h2><p class="muted small">毎日0時に更新</p>${MISSIONS.map(m => { const v = Math.min(m.n, G.daily.m[m.k]), got = G.daily.claimed.includes(m.k);
    return `<div class="mis"><span class="t">${m.t}<i><s style="width:${v / m.n * 100}%"></s></i></span><button class="claim" data-k="${m.k}" ${v < m.n || got ? 'disabled' : ''}>${got ? '受取済' : 'SO ' + m.so}</button></div>`; }).join('')}`, md => {
    md.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const m = MISSIONS.find(x => x.k === b.dataset.k); G.daily.claimed.push(m.k); G.so += m.so; save(); sfx('win'); toast(`SO +${m.so}`); md.remove(); render(); });
  });
}

/* ストーリー一覧 */
const CHAP_ART = { 1:{ face:'akeno', c1:'#4A2018' }, 2:{ face:'nagisa', c1:'#4A3818' }, 3:{ face:'yui', c1:'#2A2A5A' }, 4:{ face:'sumiya', c1:'#23342A' }, 5:{ face:'hayase', c1:'#4A2A14' }, 6:{ face:'father', c1:'#2A2A30' }, 7:{ face:'amagi', c1:'#4A3A14' } };
function viewStory() {
  $('#app').innerHTML = hud() + `<div class="scroll side">${CHAPS.map(c => { const eps = EPISODES.filter(e => e.ch === c.ch), done = eps.filter(e => epDone(e.id)).length, art = CHAP_ART[c.ch];
    return `<div class="chaphead" style="--c1:${art.c1}">${face(art.face) ? `<img src="${face(art.face)}" alt="">` : ''}<span>CHAPTER ${c.ch}</span><b>${c.no}「${c.title}」</b><span style="letter-spacing:.06em; font-family:var(--f-body)">${c.sub}　${done}/${eps.length}話</span><i><s style="width:${done / eps.length * 100}%"></s></i></div>
      <div class="timeline">${eps.map(e => { const i = EPISODES.indexOf(e), d = epDone(e.id), open = i === 0 || epDone(EPISODES[i - 1].id);
        return `<button class="ep ${d ? 'done' : ''} ${open ? '' : 'lock'}" data-e="${i}"><span class="no">EP.${String(i + 1).padStart(2, '0')}</span><span style="flex:1; min-width:0"><b>${e.title}</b><br><span class="small muted">${esc(e.desc)}</span></span><span class="small" style="flex:none; color:${d ? 'var(--teal)' : 'var(--muted)'}">${d ? 'CLEAR' : open ? '<span class="new">NEW</span>' : 'LOCK'}</span></button>`; }).join('')}</div>`; }).join('')}
    ${epDone('e35') ? `<button class="chaphead" id="endBtn" style="--c1:#5A4214; width:100%; text-align:left"><span>FINAL</span><b>終章「貸借一致」</b><span style="font-family:var(--f-body)">エンディングをもう一度見る</span></button>` : ''}
    <p class="small muted">ストーリーは気力を使わずに読めます。</p><div style="height:12px"></div></div>` + tabs('story');
  bindTabs();
  $('.scroll').onclick = e => { if (e.target.closest('#endBtn')) return ending(); const b = e.target.closest('[data-e]'); if (!b) return; const i = +b.dataset.e; if (i > 0 && !epDone(EPISODES[i - 1].id)) return toast('前の話をクリアすると読めます'); playEpisode(EPISODES[i]); };
}

/* スカウト */
function viewScout() {
  const free = Date.now() >= G.freeTs;
  $('#app').innerHTML = hud() + `<div class="scroll side"><div class="sec">スカウト <small>辞令封筒</small></div>
    <div class="banner">${face('akeno') ? `<img src="${face('akeno')}" alt="">` : ''}<div class="t"><span>ピックアップ</span><b>★5「8月の第1週」<br>朱野志乃</b><p>試験前の1週間、彼女は誰とも話さない。</p></div></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px">
      <button class="btn ${free ? 'gold' : 'dark'}" id="p1">${free ? '無料で1通' : 'SO 100 で1通'}</button><button class="btn so" id="p10">SO 1000 で10通<span style="font-size:.64rem; font-weight:500">★4以上1通確定</span></button></div>
    <p class="small muted">次の無料：${free ? '今すぐ' : Math.ceil((G.freeTs - Date.now()) / 36e5) + '時間後'}（12時間ごと）／天井まであと ${PITY - G.pity} 通（★5確定）</p>
    <details class="card rates" style="margin-top:8px"><summary class="small"><b>提供割合</b></summary><table><tr><td>★5</td><td>${RATES[5]}%（うちピックアップ ${RATES[5] / 2}%）</td></tr><tr><td>★4</td><td>${RATES[4]}%</td></tr><tr><td>★3</td><td>${RATES[3]}%</td></tr>
      ${CARDS.map(c => `<tr><td>${'★'.repeat(c.r)}</td><td>「${esc(c.title)}」${esc(P[c.char].name)}</td></tr>`).join('')}</table><p class="small muted">${PITY}通で★5が1通確定します。同じ仲間が出ると「限界突破」で強くなります（最大5回）。</p></details>
    <div class="sec">SOを手に入れる <small>デモ・実際の請求は発生しません</small></div>
    <div style="display:grid; gap:8px">${[[300, 480], [980, 1480], [2500, 3600]].map(([s, y]) => `<button class="card" data-buy="${s}" style="display:flex; justify-content:space-between; align-items:center"><b>SO ${yen(s)}</b><span class="chip" style="background:var(--gold); color:#2A1D05; font-weight:900">¥${yen(y)}</span></button>`).join('')}
      <button class="card" data-buy="pass" style="display:flex; justify-content:space-between; align-items:center; text-align:left"><span><b>月間パス</b><br><span class="small muted">30日間、毎日SO 60（合計1,800）</span></span><span class="chip" style="background:var(--gold); color:#2A1D05; font-weight:900">¥610</span></button></div>
    <p class="small muted">課金はデモです。ボタンを押してもSOが増えるだけで、支払い情報の入力や請求はありません。</p><div style="height:16px"></div></div>` + tabs('scout');
  bindTabs();
  $('#p1').onclick = async () => { if (!free) { if (G.so < 100) return toast('SOが足りません'); G.so -= 100; } else G.freeTs = Date.now() + 12 * 36e5; G.daily.m.scout++; save(); await openEnvelopes(pull(1)); go('scout'); };
  $('#p10').onclick = async () => { if (G.so < 1000) return toast('SOが足りません'); G.so -= 1000; G.daily.m.scout++; save(); await openEnvelopes(pull(10, true)); go('scout'); };
  $('.scroll').addEventListener('click', e => { const b = e.target.closest('[data-buy]'); if (!b) return; const v = b.dataset.buy === 'pass' ? 60 : +b.dataset.buy; G.so += v; save(); sfx('win'); toast(`SO +${v}（デモ）`); go('scout'); });
}

/* 仲間 */
function viewParty() {
  const own = Object.keys(G.cards).sort((a, b) => CARD[b].r - CARD[a].r);
  $('#app').innerHTML = hud() + `<div class="scroll side"><div class="sec">編成 <small>決算ランなどに出る2人</small></div>
    <div class="pslot">${[0, 1].map(i => G.party[i] ? `<button data-c="${G.party[i]}">${cardHtml(G.party[i])}</button>` : `<div class="ccard" style="--rc:var(--line); display:grid; place-items:center; color:var(--muted)">空き</div>`).join('')}</div>
    <div class="sec">仲間 <small>${own.length}/${CARDS.length}種　研修資料 ${G.mats}</small></div>
    ${own.length ? `<div class="cgrid">${own.map(id => `<button data-c="${id}" style="position:relative">${cardHtml(id)}<span class="chip" style="position:absolute; right:4px; top:4px; font-size:.58rem">Lv${G.cards[id].lv}${G.cards[id].dup ? '+' + G.cards[id].dup : ''}</span></button>`).join('')}</div>` : '<p class="muted small">まだ仲間がいません。ストーリーを進めよう。</p>'}
    <div class="sec">設定</div><div class="card" style="display:grid; gap:8px"><button class="btn dark" id="snd">効果音：${SND ? 'オン' : 'オフ'}</button><button class="btn dark" id="rename">名前を変える</button><button class="btn dark" id="reset" style="color:var(--shu)">データを消して最初から</button></div><div style="height:16px"></div></div>` + tabs('party');
  bindTabs();
  $('.scroll').addEventListener('click', e => { const c = e.target.closest('[data-c]'); if (c) cardModal(c.dataset.c); });
  $('#snd').onclick = () => { SND = !SND; go('party'); };
  $('#rename').onclick = () => modal(`<h2>名前を変える</h2><input class="nm" id="rn" maxlength="8" value="${esc(G.name)}"><button class="btn gold" id="rnok">変更</button>`, m => $('#rnok', m).onclick = () => { G.name = $('#rn', m).value.trim() || G.name; save(); m.remove(); go('party'); });
  $('#reset').onclick = () => modal(`<h2>データを消しますか？</h2><p class="muted small">レベル・仲間・ストーリーの進み具合がすべて消えます。</p><div style="display:grid; gap:8px"><button class="btn shu" id="ry">消して最初から</button><button class="btn dark" id="rnn">やめる</button></div>`, m => { $('#ry', m).onclick = () => { G = NEW(); save(); m.remove(); boot(); }; $('#rnn', m).onclick = () => m.remove(); });
}
function cardModal(id) {
  const c = CARD[id], o = G.cards[id], p = cardPow(id), canLv = o.lv < maxLv(c.r);
  modal(`<div style="display:grid; grid-template-columns:110px 1fr; gap:12px; align-items:start">${cardHtml(id)}<div><div class="small" style="color:var(--r${c.r})">${'★'.repeat(c.r)}</div><h2>「${esc(c.title)}」<br>${esc(P[c.char].name)}</h2><p class="small muted">「${esc(c.quote)}」</p></div></div>
    <div class="card small" style="margin-top:10px; line-height:1.8">Lv ${o.lv}/${maxLv(c.r)}　限界突破 ${o.dup}/5<br>攻撃力 ${p.atk}　必殺技の威力 ×${p.ult.toFixed(2)}<br><b>必殺技「${esc(SKILL[c.char].name)}」</b>：${esc(SKILL[c.char].desc)}<br>絆 Lv.${bondLv(c.char)}</div>
    <div style="display:grid; gap:8px; margin-top:10px"><button class="btn gold" id="lvup" ${canLv && G.mats >= 1 && G.coins >= 100 ? '' : 'disabled'}>研修する（資料1・100円で Lv+3）</button>
    <button class="btn dark" id="setp">${G.party.includes(id) ? '編成から外す' : '編成に入れる'}</button></div>`, m => {
    $('#lvup', m).onclick = () => { G.mats--; G.coins -= 100; o.lv = Math.min(maxLv(c.r), o.lv + 3); save(); sfx('ok'); m.remove(); cardModal(id); };
    $('#setp', m).onclick = () => { if (G.party.includes(id)) G.party = G.party.filter(x => x !== id); else { G.party = G.party.filter(x => CARD[x].char !== c.char); if (G.party.length >= 2) G.party.shift(); G.party.push(id); } save(); m.remove(); go('party'); };
  });
}

/* ═════════ ルーター ═════════ */
let VIEW = 'home';
function go(v) { VIEW = v; daily(); regen(); save(); ({ home:viewHome, story:viewStory, run:runSetup, scout:viewScout, party:viewParty })[v](); }
const render = () => go(VIEW);
function boot() { daily(); if (!G.cold) return coldOpen(); if (!G.tutScout && epDone('e1')) return tutorialScout().then(() => go('home')); go('home'); }
setInterval(() => { const b = document.querySelector('.cur.sta span:last-child'); if (b) { regen(); b.textContent = `${G.sta}/${staMax()}`; } }, 30000);
boot();
</script>
