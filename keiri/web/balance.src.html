<title>バランスシート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
/* Layout: 縦持ちスマホの1画面アプリ。上にHUD、中央に画面、下にタブ。物語・バトル・ランは全画面。
   色：夜のオフィス（紺）を地に、金（報酬・★）、朱（経理の朱書き＝攻撃・警告）。 */
:root{
  --bg:#0E1117; --bg2:#151A22; --panel:#1B212B; --panel2:#242B37; --line:#313A48; --ink:#EEF1F5; --muted:#98A2B3;
  --gold:#E2B85C; --gold2:#F6D88E; --shu:#E2573D; --green:#4FC08F; --blue:#6FA0E6; --violet:#A98BE6;
  --work:#6FA0E6; --family:#E79C5C; --health:#4FC08F; --money:#E2B85C;
  --r3:#8FA3BF; --r4:#B98BEA; --r5:#E2B85C;
  --f-head:"Noto Serif JP","Hiragino Mincho ProN",serif; --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); overscroll-behavior:none; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.app{max-width:480px; height:100%; margin:0 auto; position:relative; overflow:hidden; display:flex; flex-direction:column; background:var(--bg)}
.side{padding-left:max(14px,env(safe-area-inset-left,0px)); padding-right:max(14px,env(safe-area-inset-right,0px))}
.scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--f-head)}
.muted{color:var(--muted)}
.small{font-size:.78rem}

/* HUD */
.hud{display:flex; align-items:center; gap:8px; padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px; background:linear-gradient(var(--bg2),rgba(21,26,34,.85)); border-bottom:1px solid var(--line); position:relative; z-index:5}
.lv{display:flex; align-items:center; gap:8px; min-width:0; flex:1}
.lv .b{width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#2B3446,#1A2030); border:1px solid var(--line); display:grid; place-items:center; font-weight:900; font-size:.8rem; line-height:1}
.lv .b small{display:block; font-size:.55rem; color:var(--muted); font-weight:500}
.lv .t{min-width:0}
.lv .t b{display:block; font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lv .t i{display:block; height:4px; width:88px; border-radius:4px; background:var(--panel2); overflow:hidden; margin-top:3px}
.lv .t i s{display:block; height:100%; background:var(--blue)}
.cur{display:flex; align-items:center; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px 9px 3px 4px; font-size:.78rem; font-weight:700}
.cur .ic{width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:.62rem; font-weight:900; color:#1A1408}
.cur.sta .ic{background:var(--green)} .cur.coin .ic{background:var(--gold)} .cur.so .ic{background:linear-gradient(135deg,#C9A6FF,#7B5CE0); color:#fff}

/* タブ */
.tabs{display:grid; grid-template-columns:repeat(5,1fr); background:var(--bg2); border-top:1px solid var(--line); padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.64rem; color:var(--muted); padding:5px 0; border-radius:10px; position:relative}
.tab svg{width:24px; height:24px}
.tab.on{color:var(--gold); background:rgba(226,184,92,.1)}
.dot{position:absolute; top:3px; right:22%; width:8px; height:8px; border-radius:50%; background:var(--shu); box-shadow:0 0 0 2px var(--bg2)}

/* 共通 */
.btn{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:14px; border-radius:14px; font-weight:900; font-size:1rem; letter-spacing:.04em; transition:transform .08s; flex-direction:column; line-height:1.3}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#2A1D05; box-shadow:0 4px 0 #9C7A2C}
.btn.shu{background:linear-gradient(180deg,#F07A5E,var(--shu)); color:#fff; box-shadow:0 4px 0 #973522}
.btn.dark{background:var(--panel2); border:1px solid var(--line); color:var(--ink)}
.btn.so{background:linear-gradient(135deg,#B48CFF,#6C4BD8); color:#fff; box-shadow:0 4px 0 #43308E}
.btn:disabled{filter:grayscale(1); opacity:.45}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px}
.sec{font-family:var(--f-head); font-weight:900; font-size:1rem; margin:18px 0 8px; display:flex; align-items:center; gap:8px}
.sec small{font-family:var(--f-body); font-weight:500; color:var(--muted); font-size:.72rem}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:.7rem; padding:2px 8px; border-radius:999px; background:var(--panel2); color:var(--muted)}
.new{font-size:.6rem; font-weight:900; color:#fff; background:var(--shu); padding:1px 6px; border-radius:6px; letter-spacing:.06em}

/* ホーム */
.home{flex:1; position:relative; overflow:hidden; display:flex; flex-direction:column}
.home .bgx{position:absolute; inset:0; background:
  linear-gradient(180deg,rgba(14,17,23,0) 40%,rgba(14,17,23,.95) 78%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 60px),
  linear-gradient(180deg,#22304A 0%,#141A26 70%)}
.home .stand{position:absolute; left:0; right:0; bottom:190px; top:12px; display:flex; justify-content:center; align-items:flex-end; pointer-events:none}
.home .stand img,.home .stand svg{height:100%; width:auto; max-width:none; filter:drop-shadow(0 10px 30px rgba(0,0,0,.6)); animation:breathe 5s ease-in-out infinite; transform-origin:bottom center}
@keyframes breathe{50%{transform:scale(1.008) translateY(-2px)}}
.home .tapzone{position:absolute; left:15%; right:15%; top:40px; bottom:220px}
.bubble{position:absolute; left:50%; top:24px; transform:translateX(-50%); max-width:86%; background:rgba(245,242,234,.96); color:#1B1B1B; border-radius:14px; padding:10px 14px; font-size:.86rem; line-height:1.6; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:pop .25s; z-index:3}
.bubble b{display:block; font-size:.7rem; color:#8A6A2A}
@keyframes pop{from{transform:translate(-50%,6px) scale(.92); opacity:0}}
.home .bottom{position:relative; margin-top:auto; display:grid; gap:8px; padding-bottom:10px}
.cta{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:linear-gradient(135deg,#3A2E14,#22201A); border:1px solid #6E5826; text-align:left; box-shadow:0 0 0 1px rgba(226,184,92,.15), 0 8px 24px rgba(0,0,0,.4)}
.cta .k{font-size:.66rem; color:var(--gold); letter-spacing:.12em}
.cta b{display:block; font-family:var(--f-head); font-size:1.05rem}
.cta .go{margin-left:auto; flex:none; background:var(--gold); color:#2A1D05; font-weight:900; border-radius:10px; padding:8px 12px; font-size:.85rem; animation:glow 1.8s infinite}
@keyframes glow{50%{box-shadow:0 0 18px rgba(246,216,142,.7)}}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.tile{background:rgba(27,33,43,.92); border:1px solid var(--line); border-radius:14px; padding:10px 6px; text-align:center; position:relative}
.tile b{display:block; font-size:.82rem}
.tile span{font-size:.64rem; color:var(--muted)}
.tile .ic{font-size:1.3rem; line-height:1.3}
.bsmini{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:.66rem; color:var(--muted)}
.bsmini div{display:grid; grid-template-columns:2.2em 1fr; gap:6px; align-items:center}
.bsmini i{height:4px; border-radius:4px; background:var(--panel2); overflow:hidden}
.bsmini i s{display:block; height:100%}

/* ミッション */
.mis{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
.mis:last-child{border-bottom:0}
.mis .t{flex:1; min-width:0; font-size:.85rem}
.mis .t i{display:block; height:5px; border-radius:5px; background:var(--panel2); overflow:hidden; margin-top:5px}
.mis .t i s{display:block; height:100%; background:var(--gold)}
.claim{flex:none; font-size:.75rem; font-weight:900; padding:7px 10px; border-radius:10px; background:var(--gold); color:#2A1D05}
.claim:disabled{background:var(--panel2); color:var(--muted)}

/* 物語（ノベル） */
.vn{flex:1; display:flex; flex-direction:column; position:relative; overflow:hidden}
.vn .stage{flex:1; position:relative; overflow:hidden; background:var(--scene,linear-gradient(#1A2130,#0E1117))}
.vn .stage::after{content:""; position:absolute; inset:0; background:linear-gradient(transparent 60%, rgba(0,0,0,.6)); pointer-events:none}
.vn .place{position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); left:max(14px,env(safe-area-inset-left,0px)); z-index:3; font-size:.7rem; letter-spacing:.1em; color:rgba(255,255,255,.8); background:rgba(0,0,0,.4); padding:4px 10px; border-radius:6px; max-width:55%}
.vn .place:empty{display:none}
.vn .ctl{position:absolute; top:calc(8px + env(safe-area-inset-top,0px)); right:max(10px,env(safe-area-inset-right,0px)); z-index:4; display:flex; gap:6px}
.vn .ctl button{font-size:.68rem; font-weight:900; letter-spacing:.08em; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.2)}
.vn .ctl button.on{background:var(--gold); color:#2A1D05; border-color:var(--gold)}
.vn .who{position:absolute; inset:auto 0 0 0; height:90%; display:flex; justify-content:center; align-items:flex-end; z-index:1}
.vn .who img,.vn .who svg{height:100%; width:auto; max-width:none; animation:in .4s cubic-bezier(.2,.8,.2,1)}
.vn .who img.cg{-webkit-mask-image:radial-gradient(70% 62% at 50% 42%,#000 55%,transparent 100%); mask-image:radial-gradient(70% 62% at 50% 42%,#000 55%,transparent 100%)}
@keyframes in{from{opacity:0; transform:translateY(14px)}}
.box{position:relative; min-height:168px; background:linear-gradient(rgba(27,33,43,.97),var(--panel)); border-top:1px solid var(--line); padding-block:12px calc(14px + env(safe-area-inset-bottom,0px))}
.name{display:inline-block; font-family:var(--f-head); font-weight:900; font-size:.98rem; padding:0 10px; border-left:4px solid var(--c,var(--gold)); margin-bottom:4px}
.name small{font-family:var(--f-body); font-weight:400; color:var(--muted); font-size:.68rem; margin-left:6px}
.text{font-size:1rem; line-height:1.85; min-height:3.6em; white-space:pre-wrap}
.text.narr{font-family:var(--f-head); color:#CDD3DE}
.nx{position:absolute; right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(10px + env(safe-area-inset-bottom,0px)); color:var(--gold); font-size:.8rem; animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.choices{display:grid; gap:8px; margin-top:4px}
.choice{text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:11px 13px; line-height:1.55; font-size:.9rem}
.choice small{display:block; color:var(--gold); font-size:.68rem; margin-top:2px; letter-spacing:.06em}
.fx{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.fx span{font-size:.72rem; padding:2px 8px; border-radius:6px; background:var(--panel2)}
.fx .up{color:var(--green)} .fx .dn{color:var(--shu)}
.point{margin-top:6px; font-size:.84rem; line-height:1.7; background:rgba(226,184,92,.09); border-left:3px solid var(--gold); padding:8px 10px; border-radius:6px; color:#E9E1CB}
.chap{position:absolute; inset:0; z-index:6; display:grid; place-items:center; text-align:center; background:#000; animation:fade 2.6s forwards; pointer-events:none}
.chap span{display:block; color:var(--muted); font-size:.8rem; letter-spacing:.2em}
.chap b{display:block; font-family:var(--f-head); font-size:2.2rem; letter-spacing:.2em; margin:6px 0}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}

/* バトル */
.bt{flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative}
.bt-top{padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px; background:radial-gradient(120% 100% at 50% 0%,#2C2232,var(--bg) 75%); border-bottom:1px solid var(--line); position:relative}
.enemy{display:flex; gap:10px; align-items:center}
.enemy .doc{flex:1; min-width:0; background:#F2EEE3; color:#1B1B1B; border-radius:6px; padding:8px 12px; transform:rotate(-1deg); box-shadow:0 8px 20px rgba(0,0,0,.5)}
.enemy .doc .k{font-size:.58rem; letter-spacing:.18em; color:#7A6F5A}
.enemy .doc b{display:block; font-family:var(--f-head); font-size:1.05rem; line-height:1.35}
.enemy .doc p{margin:0; font-size:.68rem; color:#5A5448}
.enemy .doc.hit{animation:hit .35s}
@keyframes hit{25%{transform:translateX(-9px) rotate(-4deg); filter:brightness(1.5)}60%{transform:translateX(7px) rotate(2deg)}}
.cd{flex:none; text-align:center; font-size:.6rem; color:var(--muted); width:52px}
.cd b{display:block; font-family:var(--f-head); font-size:1.5rem; color:var(--shu); line-height:1.1}
.cd.warn b{animation:warn .8s infinite}
@keyframes warn{50%{transform:scale(1.2)}}
.hpbar{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; font-size:.66rem; color:var(--muted); margin-top:8px}
.hpbar i{height:9px; border-radius:9px; background:var(--panel2); overflow:hidden; display:block}
.hpbar i s{display:block; height:100%; transition:width .45s; border-radius:9px}
.bt-q{flex:1; overflow-y:auto; padding-block:12px}
.qk{font-size:.66rem; letter-spacing:.14em; color:var(--gold)}
.qt{font-family:var(--f-head); font-weight:700; font-size:1.05rem; line-height:1.65; margin:4px 0 12px}
.opt{display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:7px; line-height:1.5; font-size:.92rem}
.opt.sel{border-color:var(--gold); background:#2E2A1E}
.opt.gone{opacity:.2; text-decoration:line-through; pointer-events:none}
.cats{display:grid; grid-template-columns:1fr 1fr; gap:7px}
.cats .opt{margin:0; text-align:center; font-weight:700}
.acct{font-family:var(--f-head); font-size:1.7rem; font-weight:900; text-align:center; padding:18px 0; background:#F2EEE3; color:#1B1B1B; border-radius:6px; margin-bottom:12px}
.je{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:8px}
.zone{min-height:80px; border:1px dashed var(--line); border-radius:12px; padding:7px; display:flex; flex-direction:column; gap:5px; align-items:flex-start}
.zone.on{border-style:solid; border-color:var(--gold); background:#221F17}
.zone h4{margin:0; font-size:.7rem; color:var(--muted); font-weight:500}
.zone.on h4{color:var(--gold)}
.ch{display:inline-block; padding:8px 11px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); font-size:.86rem; margin:3px}
.ch.used{visibility:hidden}
.bank{text-align:center}
.paper{background:#F2EEE3; color:#1B1B1B; border-radius:6px; padding:10px 12px; margin-bottom:10px}
.paper .pk{font-family:var(--f-head); font-weight:900; text-align:center; letter-spacing:.3em; border-bottom:1.5px solid #1B1B1B; padding-bottom:3px}
.paper table{width:100%; border-collapse:collapse; font-size:.78rem; margin-top:4px}
.paper td{padding:3px 2px; vertical-align:top}
.paper td:first-child{color:#6A6455; width:36%}
.ans{position:sticky; bottom:0; padding-top:8px; background:linear-gradient(transparent,var(--bg) 30%)}
.exp{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:.84rem; line-height:1.7; margin-bottom:8px}
.exp b.ng{color:var(--shu)}
table.ent{width:100%; border-collapse:collapse; font-size:.8rem; margin:4px 0}
table.ent td,table.ent th{padding:3px 5px; border-bottom:1px solid var(--line); text-align:left}
table.ent td.a{text-align:right; font-variant-numeric:tabular-nums}
.bt-bot{border-top:1px solid var(--line); background:var(--bg2); padding-block:8px calc(10px + env(safe-area-inset-bottom,0px))}
.timer{height:6px; border-radius:6px; background:var(--panel2); overflow:hidden; margin-bottom:8px}
.timer s{display:block; height:100%; background:var(--gold); transform-origin:left}
.party{display:flex; gap:8px; align-items:center}
.mem{position:relative; width:58px; height:58px; flex:none; border-radius:50%; padding:4px; background:conic-gradient(var(--gold) calc(var(--g)*1%), var(--panel2) 0)}
.mem .f{width:100%; height:100%; border-radius:50%; background:var(--panel) center 12%/cover; display:grid; place-items:center; font-family:var(--f-head); font-weight:900}
.mem.full{animation:ready 1s infinite}
.mem.full::after{content:"TAP"; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); font-size:.55rem; font-weight:900; background:var(--gold); color:#2A1D05; padding:1px 6px; border-radius:6px}
@keyframes ready{50%{box-shadow:0 0 16px rgba(246,216,142,.8)}}
.team{flex:1; min-width:0}
.team b{font-size:.72rem}
.combo{font-family:var(--f-head); font-weight:900; color:var(--gold); font-size:.8rem}
.item{flex:none; width:50px; height:50px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); font-size:.58rem; display:grid; place-items:center; line-height:1.15; text-align:center}
.item:disabled{opacity:.4}
.dmg{position:absolute; left:50%; top:46%; font-family:var(--f-head); font-weight:900; font-size:2.2rem; color:var(--gold2); text-shadow:0 2px 10px #000; animation:dmg .9s forwards; pointer-events:none; z-index:9; white-space:nowrap}
.dmg.crit{color:#FF7A5C; font-size:2.6rem}
@keyframes dmg{0%{transform:translate(-50%,0) scale(.5); opacity:0}25%{transform:translate(-50%,-14px) scale(1.15); opacity:1}100%{transform:translate(-50%,-50px); opacity:0}}
.flash{position:absolute; inset:0; pointer-events:none; z-index:8; animation:fl .45s forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.cutin{position:absolute; inset:0; z-index:20; display:flex; align-items:center; overflow:hidden; background:rgba(0,0,0,.55); animation:fade 1.5s forwards}
.cutin .band{position:relative; width:100%; height:44%; background:linear-gradient(100deg,var(--c) 0 55%,transparent 55.2%), linear-gradient(100deg,rgba(0,0,0,.3),rgba(0,0,0,.6)); animation:band .5s cubic-bezier(.2,.8,.2,1)}
.cutin .band img{position:absolute; right:-6%; bottom:0; height:130%; width:auto; animation:slide .6s cubic-bezier(.2,.8,.2,1)}
.cutin .band b{position:absolute; left:6%; top:50%; transform:translateY(-50%); font-family:var(--f-head); font-weight:900; font-size:1.8rem; color:#fff; text-shadow:0 3px 12px rgba(0,0,0,.6); max-width:60%; line-height:1.3}
.cutin .band b small{display:block; font-family:var(--f-body); font-size:.75rem; letter-spacing:.14em; opacity:.9}
@keyframes band{from{transform:scaleY(0)}}
@keyframes slide{from{transform:translateX(60%); opacity:0}}
.tip{position:absolute; left:50%; transform:translateX(-50%); z-index:15; background:var(--gold); color:#2A1D05; font-weight:900; font-size:.85rem; padding:8px 14px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.5); white-space:nowrap; animation:pop .3s; pointer-events:none}
.tip::after{content:""; position:absolute; left:50%; margin-left:-7px; border:7px solid transparent; top:100%; border-top-color:var(--gold)}

/* 結果 */
.res{flex:1; overflow-y:auto; text-align:center; padding-block:calc(26px + env(safe-area-inset-top,0px)) 20px; background:radial-gradient(100% 60% at 50% 0%,#3A3018,var(--bg) 70%)}
.res h1{font-family:var(--f-head); font-weight:900; font-size:2rem; margin:6px 0; letter-spacing:.1em}
.stars{font-size:2.2rem; letter-spacing:.2em; color:var(--panel2)}
.stars span{display:inline-block}
.stars span.on{color:var(--gold); animation:star .5s backwards}
@keyframes star{from{transform:scale(2.4) rotate(-20deg); opacity:0}}
.rew{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:14px 0}
.rew div{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px; font-size:.8rem}
.rew b{display:block; font-size:1.05rem; color:var(--gold)}
.miss{text-align:left; margin-top:12px}
.miss details{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:6px}
.miss summary{padding:10px 12px; font-size:.85rem; cursor:pointer}
.miss details div{padding:0 12px 10px; font-size:.82rem; line-height:1.7}

/* スカウト */

/* ═════════ 効果音・振動 ═════════ */

/* ═════════ 問題 ═════════ */
const A = DATA.accounts, CATS = ['資産','負債','純資産','収益','費用'];

/* 1問を出して答えを待つ → {ok, fast, timeout} */
function askIn(el, q, o = {}) {
  return new Promise(resolve => {
    const right = q.t === 'je' ? [...new Set([...q.dr, ...q.cr].map(x => x[0]))] : [];
    const st = { sel:null, picked:[], side:'借方', placed:{ 借方:[], 貸方:[] }, gone:new Set(),
      bank: q.t === 'je' ? shuffle([...right, ...shuffle(Object.keys(A).filter(a => !right.includes(a) && right.some(r => A[r].cat === A[a].cat))).slice(0, 3), ...shuffle(Object.keys(A).filter(a => !right.includes(a))).slice(0, 1)]) : [] };
    if (o.hint) {
      if (q.t === 'mcq') shuffle(q.choices.map((_, i) => i).filter(i => i !== q.a)).slice(0, Math.max(0, q.choices.length - 2)).forEach(i => st.gone.add(i));
      if (q.t === 'cat') shuffle(CATS.filter(c => c !== A[q.acct].cat)).slice(0, 3).forEach(c => st.gone.add(c));
      if (q.t === 'je') st.placed.借方.push(q.dr[0][0]);
    }
    const limit = (o.limit ?? TL[q.t]) * 1000, t0 = Date.now();
    let done = false, timerId = null;
    const tbar = o.timerEl;
    if (tbar) { tbar.style.transition = 'none'; tbar.style.transform = 'scaleX(1)'; void tbar.offsetWidth; tbar.style.transition = `transform ${limit}ms linear`; tbar.style.transform = 'scaleX(0)'; }
    const needConfirm = q.t === 'je' || q.t === 'doc';
    const draw = () => {
      el.innerHTML = qBody(q, st) + (needConfirm ? `<div class="ans"><button class="btn gold" id="qgo" ${q.t === 'je' && !(st.placed.借方.length && st.placed.貸方.length) ? 'disabled' : ''}>${q.t === 'doc' && !st.picked.length ? '問題なし' : '決定'}</button></div>` : '');
      const g = $('#qgo', el); if (g) g.onclick = e => { e.stopPropagation(); finish(); };
    };
    const finish = (timeout = false) => {
      if (done) return; done = true; clearTimeout(timerId); el.onclick = null;
      if (tbar) { const cs = getComputedStyle(tbar).transform; tbar.style.transition = 'none'; tbar.style.transform = cs; }
      const ok = !timeout && judge(q, st), fast = ok && Date.now() - t0 < limit * .45;
      resolve({ ok, fast, timeout });
    };
    el.onclick = e => {
      if (done) return;
      const b = e.target.closest('button'), z = e.target.closest('[data-z]');
      if (b && b.id === 'qgo') return;
      if (b) {
        sfx('tap');
        if (b.dataset.i !== undefined) { st.sel = +b.dataset.i; b.classList.add('sel'); return finish(); }
        if (b.dataset.c) { st.sel = b.dataset.c; b.classList.add('sel'); return finish(); }
        if (b.dataset.t !== undefined) { const i = +b.dataset.t; st.picked = st.picked.includes(i) ? st.picked.filter(x => x !== i) : [...st.picked, i]; }
        else if (b.dataset.b) { const a = b.dataset.b; if (!st.placed.借方.includes(a) && !st.placed.貸方.includes(a)) st.placed[st.side].push(a); }
        else if (b.dataset.p) { const [s, a] = b.dataset.p.split('|'); st.placed[s] = st.placed[s].filter(x => x !== a); }
        draw(); return;
      }
      if (z) { st.side = z.dataset.z; draw(); }
    };
    draw(); el.scrollTop = 0;
    timerId = setTimeout(() => finish(true), limit);
  });
}
function showExplain(el, q, r) {
  return new Promise(res => {
    el.insertAdjacentHTML('beforeend', `<div class="ans"><div class="exp"><b class="ng">${r.timeout ? '時間切れ' : '処理ミス'}</b>　${explain(q)}</div><button class="btn dark" id="qnx">次へ</button></div>`);
    el.scrollTop = el.scrollHeight;
    $('#qnx', el).onclick = e => { e.stopPropagation(); res(); };
  });
}

/* ═════════ スカウト（辞令封筒） ═════════ */
const RATES = { 5:3, 4:17, 3:80 };
const PITY = 60;
function pull(n, guarantee4) {
  const out = [];
  for (let i = 0; i < n; i++) {
    G.pity++;
    const r = Math.random() * 100; let rar = r < RATES[5] ? 5 : r < RATES[5] + RATES[4] ? 4 : 3;
    if (G.pity >= PITY) rar = 5;
    if (guarantee4 && i === n - 1 && !out.some(c => CARD[c].r >= 4) && rar < 4) rar = 4;
    let pool = CARDS.filter(c => c.r === rar);
    if (rar === 5 && Math.random() < .5) pool = pool.filter(c => c.pickup);
    if (rar === 5) G.pity = 0;
    out.push(rnd(pool).id);
  }
  return out;
}
function addCards(ids) {
  const isNew = {};
  ids.forEach(id => { if (G.cards[id]) G.cards[id].dup = Math.min(5, G.cards[id].dup + 1); else { G.cards[id] = { lv:1, dup:0 }; isNew[id] = true; } });
  for (const id of Object.keys(G.cards).sort((a, b) => CARD[b].r - CARD[a].r)) { if (G.party.length >= 2) break; if (!G.party.some(p => CARD[p].char === CARD[id].char)) G.party.push(id); }
  save(); return isNew;
}
const cardHtml = (id, extra = '') => { const c = CARD[id]; return `<div class="ccard r${c.r}" style="--rc:var(--r${c.r}); ${face(c.char) ? `background-image:url(${face(c.char)})` : `background:linear-gradient(160deg,${P[c.char].c},#151A22)`}" ${extra}>${face(c.char) ? '' : `<span class="serif" style="position:absolute; inset:0; display:grid; place-items:center; font-size:2.4rem; font-weight:900; color:rgba(255,255,255,.35)">${P[c.char].ch}</span>`}<span class="st">${'★'.repeat(c.r)}</span><div class="bar"><b>${esc(c.title)}</b>${esc(P[c.char].name)}</div></div>`; };
async function openEnvelopes(ids) {

async function playRun(sup) {
  const R = { week:1, prog:0, acc:20, hp:100, chars:sup.map(id => CARD[id].char) };
  const bonus = sup.reduce((s, id) => s + cardPow(id).atk, 0);
  const view = inner => { $('#app').innerHTML = `<div class="scroll side" style="padding-top:calc(12px + env(safe-area-inset-top,0px)); padding-bottom:20px"><div style="display:flex; align-items:center; justify-content:space-between"><b class="serif">月次決算ラン</b><span class="chip">${R.week <= 4 ? '第' + R.week + '週' : '締め日'}</span></div>
    <div class="weeks">${[1,2,3,4,5].map(i => `<i class="${i < R.week ? 'on' : i === R.week ? 'now' : ''}"></i>`).join('')}</div>
    <div class="run-h"><div><b>${R.prog}</b><span>処理（締めの準備）</span></div><div><b>${R.acc}</b><span>正確さ</span></div><div><b>${R.hp}</b><span>元気</span></div></div>
    <div style="display:flex; gap:6px; margin:10px 0">${R.chars.map(c => `<span class="chip"><span style="width:18px; height:18px; border-radius:50%; background:var(--panel) center 12%/cover; ${face(c) ? `background-image:url(${face(c)})` : ''}"></span>${esc(P[c].name)}</span>`).join('')}</div>
    <div id="rv">${inner}</div></div>`; };
  const pick = sel => new Promise(res => $(sel).onclick = e => { const b = e.target.closest('[data-i]'); if (b) { sfx('tap'); res(+b.dataset.i); } });
  const quiz = async (poolFn, n) => {
    let ok = 0;
    for (let i = 0; i < n; i++) {
      $('#rv').innerHTML = `<div class="timer"><s id="rt"></s></div><div id="rq"></div>`;
      const q = rnd(poolFn()), r = await askIn($('#rq'), q, { timerEl:$('#rt') });
      if (r.ok) { ok++; sfx('ok'); toast(r.fast ? '速い！ 正確さ＋3' : '処理完了'); if (r.fast) R.acc = clamp(R.acc + 3); await sleep(450); }
      else { sfx('ng'); if (!G.mistakes.includes(q.key)) G.mistakes.push(q.key); await showExplain($('#rq'), q, r); }
    }
    return ok;
  };
  for (; R.week <= 4; R.week++) {
    const hand = shuffle(ACTS.filter(a => a.id !== 'ask' || R.chars.some(c => c === 'akeno' || c === 'sumiya'))).slice(0, 3);
    view(`<div class="sec">今週の行動を1つ選ぶ</div><div class="acts">${hand.map((a, i) => `<button class="act" data-i="${i}" style="animation-delay:${i * .08}s"><span class="ic">${a.ic}</span><b>${a.t}</b><p>${a.d}</p><em>${a.eff}</em></button>`).join('')}</div>`);
    const a = hand[await pick('.acts')];
    if (a.id === 'je') { const ok = await quiz(rnd([POOLS.basic, POOLS.expense, POOLS.close]), 2); R.prog += ok * (14 + Math.round(bonus / 3)); }
    if (a.id === 'doc') { const ok = await quiz(() => DATA.docs.map(d => Q.doc(d.id)), 1); R.prog += ok * 10; R.acc += ok * 12; }
    if (a.id === 'study') { R.acc += 15; R.hp -= 8; }
    if (a.id === 'rest') R.hp += 25;
    if (a.id === 'ot') { R.prog += 20; R.hp -= 20; bump({ family:-2 }); }
    if (a.id === 'ask') { R.acc += 10; R.prog += 6; bump({ ['b_' + R.chars.find(c => c === 'akeno' || c === 'sumiya')]: 4 }); }
    R.hp = clamp(R.hp); R.acc = clamp(R.acc);
    if (Math.random() < .7) {
      const ev = rnd(RUN_EVENTS);
      view(`<div class="card" style="display:flex; gap:12px; align-items:flex-start"><span style="width:52px; height:52px; border-radius:50%; flex:none; background:var(--panel2) center 12%/cover; ${face(ev.who) ? `background-image:url(${face(ev.who)})` : ''}"></span><div><b>${esc(P[ev.who].name)}</b><p style="margin:4px 0 0; line-height:1.7">${esc(ev.text)}</p></div></div>
        <div class="choices" style="margin-top:10px" id="evc">${ev.opts.map((o, i) => `<button class="choice" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>`);
      const o = ev.opts[await pick('#evc')];
      R.prog += o.fx.prog || 0; R.acc = clamp(R.acc + (o.fx.acc || 0)); R.hp = clamp(R.hp + (o.fx.hp || 0)); if (o.fx.amagi) bump({ b_amagi:o.fx.amagi });
      view(`<div class="card"><b>${esc(P[ev.who].name)}</b><p style="margin:4px 0 0">「${esc(o.say)}」</p></div><div style="height:10px"></div><button class="btn dark" id="rn">${R.week < 4 ? '次の週へ' : '締め日へ'}</button>`);
      await new Promise(res => $('#rn').onclick = res);
    }
  }
  view(`<div class="card" style="text-align:center"><div class="small muted">月末</div><b class="serif" style="font-size:1.4rem">締め日</b><p class="small">準備した処理が多いほど、締めは楽になる。</p></div><div style="height:10px"></div><button class="btn shu" id="rb">締めに挑む</button>`);
  await new Promise(res => $('#rb').onclick = res);
  const hp = Math.max(60, 240 - R.prog * 2), atk = Math.max(5, 16 - Math.round(R.acc / 8));
  const r = await battle({ enemy:'締め日', kind:'月次決算ラン', desc:`残りの処理 ${hp}件。正確さ ${R.acc}。`, hp, atk, every:3, pool:POOLS.all, party:partyFrom(sup), teamHp:Math.max(30, R.hp), taunts:['未処理の請求書が届いた','社長「まだ？」','差異が合わない'] });
  const score = (r.win ? 50 : 0) + Math.min(30, R.prog / 4) + R.acc / 5 + r.stars * 5;
  const rank = !r.win ? 'D' : score >= 95 ? 'S' : score >= 80 ? 'A' : score >= 65 ? 'B' : 'C';
  const mult = { S:2, A:1.6, B:1.3, C:1, D:.4 }[rank];
  R.chars.forEach(c => bump({ ['b_' + c]: Math.round(6 * mult) }));
  if (r.win) G.daily.m.run++;
  await result({ title:'締め完了', sub:'月次決算ラン', rank, win:r.win, missed:r.missed, exp:Math.round(35 * mult), coins:Math.round(300 * mult), mats:Math.round(3 * mult), so:rank === 'S' ? 20 : 0, bond:`${R.chars.map(c => P[c].name.split(' ')[0]).join('・')} +${Math.round(6 * mult)}`, next:'ホームへ' });
  go('home');
}

function hud() {
  regen();
  return `<div class="hud side"><div class="lv"><span class="b">${G.lv}<small>Lv</small></span><span class="t"><b>${esc(G.name || '新人')}</b><span class="small muted">${RANKS[chapsCleared()]}</span><i><s style="width:${G.exp / expNext() * 100}%"></s></i></span></div>
    <span class="cur sta"><span class="ic">気</span><span class="num">${G.sta}/${staMax()}</span></span><span class="cur coin"><span class="ic">円</span><span class="num">${yen(G.coins)}</span></span><button class="cur so" id="soBtn" aria-label="SOを手に入れる"><span class="ic">S</span><span class="num">${yen(G.so)}</span></button></div>`;
}
function tabs(on) {
  const free = Date.now() >= G.freeTs;
  const T = [['home','ホーム'],['story','ストーリー'],['run','決算ラン'],['scout','スカウト'],['party','仲間']];
  return `<nav class="tabs">${T.map(([k, l]) => `<button class="tab ${on === k ? 'on' : ''}" data-tab="${k}">${ICON[k]}${l}${(k === 'scout' && free && G.tutScout) || (k === 'story' && nextEp() && on !== 'story') ? '<span class="dot"></span>' : ''}</button>`).join('')}</nav>`;
}
function bindTabs() { document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { sfx('tap'); go(b.dataset.tab); }); const so = $('#soBtn'); if (so) so.onclick = () => go('scout'); }
function modal(html, bind, closable = true) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="sheet">${html}</div>`; if (closable) m.onclick = e => { if (e.target === m) m.remove(); }; $('#app').append(m); bind && bind(m); return m; }

/* ═════════ ホーム ═════════ */
const HOME_LINES = {
  akeno:['証憑は？','8月の第1週は、話しかけないで。','赤ペン、また1本使い切った。','根拠のない数字は、1円も入れない。','……あなた、伸びるよ。'],
  sumiya:['検算はしましたか。','1円合わないのは、1円の問題じゃありません。','そろばんは、手が覚えています。','……今日は、早く帰りなさい。'],
  hayase:['これ、経費で落ちる？','宛名、上様でいいよね？','今月の売上、見た？ 俺のおかげ！','焼肉行こうぜ！ 割り勘で！'],
  kirishima:['根拠を示してください。','……次は、間違えません。'],
  nagisa:['ちゃんと寝てますか？','点滴中に仕訳しないでください。','今日は何の日か、覚えてる？'],
  amagi:['前例がないなら、つくればいい！','それ、明日までにできる？','来年、プライム市場に行こう！','数字は、なんとかなるだろ？'],
};
const LB = [[50,'SO'],[300,'円'],[50,'SO'],[3,'研修資料'],[50,'SO'],[500,'円'],[150,'SO']];
function loginBonus() {
  const t = today(); if (G.login.last === t) return false;
  const y = new Date(Date.now() - 864e5), ys = `${y.getFullYear()}-${y.getMonth() + 1}-${y.getDate()}`;
  G.login.streak = G.login.last === ys ? G.login.streak + 1 : 1; G.login.last = t; G.login.total++;
  const day = ((G.login.total - 1) % 7) + 1, [rew, kind] = LB[day - 1];
  if (kind === 'SO') G.so += rew; else if (kind === '円') G.coins += rew; else G.mats += rew;
  save();
  modal(`<h2>ログインボーナス</h2><p class="muted small">${G.login.total}日目　連続 ${G.login.streak}日</p>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:12px 0">${LB.map(([r, k], i) => `<div style="text-align:center; font-size:.6rem; padding:6px 0; border-radius:8px; background:${i + 1 === day ? 'var(--gold)' : i + 1 < day ? 'var(--panel2)' : 'var(--panel)'}; color:${i + 1 === day ? '#2A1D05' : 'var(--muted)'}">${i + 1}日<br><b>${r}</b><br>${k === '研修資料' ? '資料' : k}</div>`).join('')}</div>
    <p style="text-align:center"><b style="color:var(--gold); font-size:1.2rem">${kind} +${rew}</b></p><button class="btn gold" id="lbok">受け取る</button>`, m => $('#lbok', m).onclick = () => { m.remove(); render(); });
  return true;
}
const MISSIONS = [{ k:'story', t:'ストーリーを1話クリア', n:1, so:50 }, { k:'run', t:'月次決算ランをクリア', n:1, so:50 }, { k:'scout', t:'スカウトを1回する', n:1, so:30 }];
function viewHome() {
  const ep = nextEp(), hc = G.party[0] && CARD[G.party[0]] ? CARD[G.party[0]].char : G.home;
  const free = Date.now() >= G.freeTs, un = unreadChat(), canClaim = MISSIONS.filter(m => G.daily.m[m.k] >= m.n && !G.daily.claimed.includes(m.k)).length;
  $('#app').innerHTML = hud() + `<div class="home"><div class="bgx"></div><div class="stand">${portrait(hc)}</div><button class="tapzone" id="tz" aria-label="${esc(P[hc].name)}に話しかける"></button>
    <div class="bottom side">
      <div class="bsmini card" style="padding:8px 12px">${STAT.map(([k, l, c]) => `<div><span>${l}</span><i><s style="width:${G.stat[k]}%; background:var(${c})"></s></i></div>`).join('')}</div>
      ${ep ? `<button class="cta" id="cta"><span><span class="k">ストーリー　${CHAPS[ep.ch - 1].no}「${CHAPS[ep.ch - 1].title}」</span><b>${ep.no}「${ep.title}」</b><span class="small muted">${esc(ep.desc)}</span></span><span class="go">つづき</span></button>`
           : `<button class="cta" id="cta"><span><span class="k">ストーリー</span><b>3章「連結」は制作中</b><span class="small muted">月次決算ランで仲間を育てよう</span></span><span class="go">決算ラン</span></button>`}
      <div class="tiles"><button class="tile" data-go="run"><span class="ic">🧾</span><b>決算ラン</b><span>気力10</span></button>
        <button class="tile" data-go="scout"><span class="ic">✉️</span><b>スカウト</b><span>${free ? '<span style="color:var(--gold)">無料1回</span>' : '無料まで ' + Math.ceil((G.freeTs - Date.now()) / 36e5) + '時間'}</span></button>
        <button class="tile" id="chatBtn"><span class="ic">💬</span><b>社内チャット</b><span>${un ? `<span style="color:var(--shu)">未読 ${un}</span>` : 'Kasane Chat'}</span>${un ? '<span class="dot" style="right:12px"></span>' : ''}</button></div>
      <button class="card" id="misBtn" style="display:flex; justify-content:space-between; align-items:center; padding:9px 12px"><b class="small">デイリーミッション</b><span class="small ${canClaim ? '' : 'muted'}" style="${canClaim ? 'color:var(--gold)' : ''}">${canClaim ? '受け取れる報酬あり' : `${G.daily.claimed.length}/3 受取済`}</span></button>
    </div></div>` + tabs('home');
  bindTabs();
  $('#cta').onclick = () => { sfx('tap'); ep ? playEpisode(ep) : go('run'); };
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $('#chatBtn').onclick = () => chatView();
  $('#misBtn').onclick = () => missionModal();
  $('#tz').onclick = () => { sfx('tap'); const old = $('.bubble'); if (old) old.remove(); const d = document.createElement('div'); d.className = 'bubble'; d.innerHTML = `<b>${esc(P[hc].name)}</b>${esc(rnd(HOME_LINES[hc] || ['……']))}`; $('.home').append(d); setTimeout(() => d.remove(), 3200); };
  if (G.tutScout) loginBonus();
}
function missionModal() {
  modal(`<h2>デイリーミッション</h2><p class="muted small">毎日0時に更新</p>${MISSIONS.map(m => { const v = Math.min(m.n, G.daily.m[m.k]), got = G.daily.claimed.includes(m.k);
    return `<div class="mis"><span class="t">${m.t}<i><s style="width:${v / m.n * 100}%"></s></i></span><button class="claim" data-k="${m.k}" ${v < m.n || got ? 'disabled' : ''}>${got ? '受取済' : 'SO ' + m.so}</button></div>`; }).join('')}`, md => {
    md.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const m = MISSIONS.find(x => x.k === b.dataset.k); G.daily.claimed.push(m.k); G.so += m.so; save(); sfx('win'); toast(`SO +${m.so}`); md.remove(); render(); });
  });
}

/* ストーリー一覧 */
function viewStory() {
  $('#app').innerHTML = hud() + `<div class="scroll side">${CHAPS.map(c => `<div class="sec">${c.no}「${c.title}」 <small>${c.sub}</small></div>`
    + EPISODES.filter(e => e.ch === c.ch).map(e => { const i = EPISODES.indexOf(e), done = epDone(e.id), open = i === 0 || epDone(EPISODES[i - 1].id);
      return `<button class="card" data-e="${i}" style="display:flex; gap:12px; align-items:center; width:100%; text-align:left; margin-bottom:8px; ${open ? '' : 'opacity:.45'}"><span class="serif" style="font-size:.8rem; color:var(--gold); width:3.6em; flex:none">${e.no}</span><span style="flex:1; min-width:0"><b>${e.title}</b><br><span class="small muted">${esc(e.desc)}</span></span><span class="small" style="flex:none; color:${done ? 'var(--green)' : 'var(--muted)'}">${done ? 'クリア' : open ? '<span class="new">NEW</span>' : 'ロック'}</span></button>`; }).join('')).join('')}
    <div class="sec">3章「連結」 <small>主任・28歳</small></div><div class="card small muted">制作中。後輩・新堂結の入社、志乃の8回目の挑戦、そして結婚。</div>
    <p class="small muted" style="margin-top:12px">ストーリーは気力を使わずに読めます。</p><div style="height:12px"></div></div>` + tabs('story');
  bindTabs();
  $('.scroll').onclick = e => { const b = e.target.closest('[data-e]'); if (!b) return; const i = +b.dataset.e; if (i > 0 && !epDone(EPISODES[i - 1].id)) return toast('前の話をクリアすると読めます'); playEpisode(EPISODES[i]); };
}

/* スカウト */
function viewScout() {
  const free = Date.now() >= G.freeTs;
  $('#app').innerHTML = hud() + `<div class="scroll side"><div class="sec">スカウト <small>辞令封筒</small></div>
    <div class="banner">${face('akeno') ? `<img src="${face('akeno')}" alt="">` : ''}<div class="t"><span>ピックアップ</span><b>★5「8月の第1週」<br>朱野志乃</b><p>試験前の1週間、彼女は誰とも話さない。</p></div></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px">
      <button class="btn ${free ? 'gold' : 'dark'}" id="p1">${free ? '無料で1通' : 'SO 100 で1通'}</button><button class="btn so" id="p10">SO 1000 で10通<span style="font-size:.64rem; font-weight:500">★4以上1通確定</span></button></div>
    <p class="small muted">次の無料：${free ? '今すぐ' : Math.ceil((G.freeTs - Date.now()) / 36e5) + '時間後'}（12時間ごと）／天井まであと ${PITY - G.pity} 通（★5確定）</p>
    <details class="card rates" style="margin-top:8px"><summary class="small"><b>提供割合</b></summary><table><tr><td>★5</td><td>${RATES[5]}%（うちピックアップ ${RATES[5] / 2}%）</td></tr><tr><td>★4</td><td>${RATES[4]}%</td></tr><tr><td>★3</td><td>${RATES[3]}%</td></tr>
      ${CARDS.map(c => `<tr><td>${'★'.repeat(c.r)}</td><td>「${esc(c.title)}」${esc(P[c.char].name)}</td></tr>`).join('')}</table><p class="small muted">${PITY}通で★5が1通確定します。同じ仲間が出ると「限界突破」で強くなります（最大5回）。</p></details>
    <div class="sec">SOを手に入れる <small>デモ・実際の請求は発生しません</small></div>
    <div style="display:grid; gap:8px">${[[300, 480], [980, 1480], [2500, 3600]].map(([s, y]) => `<button class="card" data-buy="${s}" style="display:flex; justify-content:space-between; align-items:center"><b>SO ${yen(s)}</b><span class="chip" style="background:var(--gold); color:#2A1D05; font-weight:900">¥${yen(y)}</span></button>`).join('')}
      <button class="card" data-buy="pass" style="display:flex; justify-content:space-between; align-items:center; text-align:left"><span><b>月間パス</b><br><span class="small muted">30日間、毎日SO 60（合計1,800）</span></span><span class="chip" style="background:var(--gold); color:#2A1D05; font-weight:900">¥610</span></button></div>
    <p class="small muted">課金はデモです。ボタンを押してもSOが増えるだけで、支払い情報の入力や請求はありません。</p><div style="height:16px"></div></div>` + tabs('scout');
  bindTabs();
  $('#p1').onclick = async () => { if (!free) { if (G.so < 100) return toast('SOが足りません'); G.so -= 100; } else G.freeTs = Date.now() + 12 * 36e5; G.daily.m.scout++; save(); await openEnvelopes(pull(1)); go('scout'); };
  $('#p10').onclick = async () => { if (G.so < 1000) return toast('SOが足りません'); G.so -= 1000; G.daily.m.scout++; save(); await openEnvelopes(pull(10, true)); go('scout'); };
  $('.scroll').addEventListener('click', e => { const b = e.target.closest('[data-buy]'); if (!b) return; const v = b.dataset.buy === 'pass' ? 60 : +b.dataset.buy; G.so += v; save(); sfx('win'); toast(`SO +${v}（デモ）`); go('scout'); });
}

/* 仲間 */
function viewParty() {
  const own = Object.keys(G.cards).sort((a, b) => CARD[b].r - CARD[a].r);
  $('#app').innerHTML = hud() + `<div class="scroll side"><div class="sec">編成 <small>決算ランなどに出る2人</small></div>
    <div class="pslot">${[0, 1].map(i => G.party[i] ? `<button data-c="${G.party[i]}">${cardHtml(G.party[i])}</button>` : `<div class="ccard" style="--rc:var(--line); display:grid; place-items:center; color:var(--muted)">空き</div>`).join('')}</div>
    <div class="sec">仲間 <small>${own.length}/${CARDS.length}種　研修資料 ${G.mats}</small></div>
    ${own.length ? `<div class="cgrid">${own.map(id => `<button data-c="${id}" style="position:relative">${cardHtml(id)}<span class="chip" style="position:absolute; right:4px; top:4px; font-size:.58rem">Lv${G.cards[id].lv}${G.cards[id].dup ? '+' + G.cards[id].dup : ''}</span></button>`).join('')}</div>` : '<p class="muted small">まだ仲間がいません。ストーリーを進めよう。</p>'}
    <div class="sec">設定</div><div class="card" style="display:grid; gap:8px"><button class="btn dark" id="snd">効果音：${SND ? 'オン' : 'オフ'}</button><button class="btn dark" id="rename">名前を変える</button><button class="btn dark" id="reset" style="color:var(--shu)">データを消して最初から</button></div><div style="height:16px"></div></div>` + tabs('party');
  bindTabs();
  $('.scroll').addEventListener('click', e => { const c = e.target.closest('[data-c]'); if (c) cardModal(c.dataset.c); });
  $('#snd').onclick = () => { SND = !SND; go('party'); };
  $('#rename').onclick = () => modal(`<h2>名前を変える</h2><input class="nm" id="rn" maxlength="8" value="${esc(G.name)}"><button class="btn gold" id="rnok">変更</button>`, m => $('#rnok', m).onclick = () => { G.name = $('#rn', m).value.trim() || G.name; save(); m.remove(); go('party'); });
  $('#reset').onclick = () => modal(`<h2>データを消しますか？</h2><p class="muted small">レベル・仲間・ストーリーの進み具合がすべて消えます。</p><div style="display:grid; gap:8px"><button class="btn shu" id="ry">消して最初から</button><button class="btn dark" id="rnn">やめる</button></div>`, m => { $('#ry', m).onclick = () => { G = NEW(); save(); m.remove(); boot(); }; $('#rnn', m).onclick = () => m.remove(); });
}
function cardModal(id) {
  const c = CARD[id], o = G.cards[id], p = cardPow(id), canLv = o.lv < maxLv(c.r);
  modal(`<div style="display:grid; grid-template-columns:110px 1fr; gap:12px; align-items:start">${cardHtml(id)}<div><div class="small" style="color:var(--r${c.r})">${'★'.repeat(c.r)}</div><h2>「${esc(c.title)}」<br>${esc(P[c.char].name)}</h2><p class="small muted">「${esc(c.quote)}」</p></div></div>
    <div class="card small" style="margin-top:10px; line-height:1.8">Lv ${o.lv}/${maxLv(c.r)}　限界突破 ${o.dup}/5<br>攻撃力 ${p.atk}　必殺技の威力 ×${p.ult.toFixed(2)}<br><b>必殺技「${esc(SKILL[c.char].name)}」</b>：${esc(SKILL[c.char].desc)}<br>絆 Lv.${bondLv(c.char)}</div>
    <div style="display:grid; gap:8px; margin-top:10px"><button class="btn gold" id="lvup" ${canLv && G.mats >= 1 && G.coins >= 100 ? '' : 'disabled'}>研修する（資料1・100円で Lv+3）</button>
    <button class="btn dark" id="setp">${G.party.includes(id) ? '編成から外す' : '編成に入れる'}</button></div>`, m => {
    $('#lvup', m).onclick = () => { G.mats--; G.coins -= 100; o.lv = Math.min(maxLv(c.r), o.lv + 3); save(); sfx('ok'); m.remove(); cardModal(id); };
    $('#setp', m).onclick = () => { if (G.party.includes(id)) G.party = G.party.filter(x => x !== id); else { G.party = G.party.filter(x => CARD[x].char !== c.char); if (G.party.length >= 2) G.party.shift(); G.party.push(id); } save(); m.remove(); go('party'); };
  });
}

/* ═════════ ルーター ═════════ */
let VIEW = 'home';
function go(v) { VIEW = v; daily(); regen(); save(); ({ home:viewHome, story:viewStory, run:runSetup, scout:viewScout, party:viewParty })[v](); }
const render = () => go(VIEW);
function boot() { daily(); if (!G.cold) return coldOpen(); if (!G.tutScout && epDone('e1')) return tutorialScout().then(() => go('home')); go('home'); }
setInterval(() => { const b = document.querySelector('.cur.sta .num'); if (b) { regen(); b.textContent = `${G.sta}/${staMax()}`; } }, 30000);
boot();
</script>
