」。"},{"id":"b07","tag":"基本","q":"今月の携帯電話代 8,800円が普通預金から引き落とされた。","dr":[["通信費",8800]],"cr":[["普通預金",8800]],"exp":"電話・ネット・郵便は「通信費」。引き落としは預金の減少（貸方）。"},{"id":"b08","tag":"基本","q":"事務所の今月分の家賃 100,000円を普通預金から支払った。","dr":[["支払家賃",100000]],"cr":[["普通預金",100000]],"exp":"家賃の支払いは費用の「支払家賃」（地代家賃）。"},{"id":"b09","tag":"基本","q":"振込手数料 440円が普通預金から引き落とされた。","dr":[["支払手数料",440]],"cr":[["普通預金",440]],"exp":"銀行の振込手数料は「支払手数料」。少額でも毎回きちんと記帳するのが経理の基本。"},{"id":"b10","tag":"基本","q":"会社設立にあたり株式を発行し、1,000,000円が普通預金に払い込まれた。","dr":[["普通預金",1000000]],"cr":[["資本金",1000000]],"exp":"株主からの出資は純資産の「資本金」が増える（貸方）。"},{"id":"b11","tag":"基本","q":"銀行から 1,000,000円を借り入れ、普通預金に入金された。","dr":[["普通預金",1000000]],"cr":[["借入金",1000000]],"exp":"返済義務は負債の「借入金」。お金は増えるが利益ではない点に注意。"},{"id":"b12","tag":"基本","q":"借入金のうち 100,000円と利息 2,000円を普通預金から返済した。","dr":[["借入金",100000],["支払利息",2000]],"cr":[["普通預金",102000]],"exp":"元本の返済は負債の減少、利息は費用の「支払利息」。借方が2行になる（複合仕訳）。"},{"id":"b13","tag":"基本","q":"業務用のパソコン 200,000円を購入し、代金は翌月末払いとした。","dr":[["備品",200000]],"cr":[["未払金",200000]],"exp":"10万円以上のPCは固定資産の「備品」。商品以外の後払いは「買掛金」ではなく「未払金」。"},{"id":"b14","tag":"基本","q":"取引先との会食代 22,000円を会社のクレジットカードで支払った（後日引き落とし）。","dr":[["交際費",22000]],"cr":[["未払金",22000]],"exp":"接待は「交際費」。カード払いは引き落とし日まで「未払金」で負債計上する。"},{"id":"b15","tag":"基本","q":"契約書に貼る収入印紙 2,000円を現金で購入した。","dr":[["租税公課",2000]],"cr":[["現金",2000]],"exp":"収入印紙は税金の一種なので「租税公課」。"},{"id":"b16","tag":"基本","q":"Web広告の掲載料 55,000円を普通預金から支払った。","dr":[["広告宣伝費",55000]],"cr":[["普通預金",55000]],"exp":"不特定多数に向けた宣伝は「広告宣伝費」。"},{"id":"t01","tag":"仮勘定・前受","q":"出張に行く従業員に、旅費の概算額 30,000円を現金で渡した。","dr":[["仮払金",30000]],"cr":[["現金",30000]],"exp":"使い道・金額がまだ確定しないので一時的に資産の「仮払金」で処理する。"},{"id":"t02","tag":"仮勘定・前受","q":"出張から戻った従業員の精算で、旅費は 26,000円とわかり、残りは現金で返金された（概算払い 30,000円）。","dr":[["旅費交通費",26000],["現金",4000]],"cr":[["仮払金",30000]],"exp":"確定した金額を旅費交通費へ振り替え、戻ってきた現金を計上。仮払金は全額消す。"},{"id":"t03","tag":"仮勘定・前受","q":"普通預金に、内容不明の入金 15,000円があった。","dr":[["普通預金",15000]],"cr":[["仮受金",15000]],"exp":"理由がわかるまで負債の「仮受金」で受けておく。"},{"id":"t04","tag":"仮勘定・前受","q":"先日の内容不明の入金 15,000円は、得意先からの売掛金の回収だと判明した。","dr":[["仮受金",15000]],"cr":[["売掛金",15000]],"exp":"仮受金を消して、正しい科目（売掛金の減少）に振り替える。"},{"id":"t05","tag":"仮勘定・前受","q":"得意先から商品の注文を受け、内金 10,000円を現金で受け取った。","dr":[["現金",10000]],"cr":[["前受金",10000]],"exp":"商品を渡す前なので売上ではない。商品を渡す義務として負債の「前受金」。"},{"id":"t06","tag":"仮勘定・前受","q":"内金 10,000円を受け取っていた商品 50,000円を引き渡し、残額は掛けとした。","dr":[["前受金",10000],["売掛金",40000]],"cr":[["売上",50000]],"exp":"引き渡した時点で売上を計上。受け取り済みの前受金を充当し、残りが売掛金。"},{"id":"t07","tag":"仮勘定・前受","q":"売掛金 50,000円について、得意先の承諾を得て電子記録債権の発生記録を行った。","dr":[["電子記録債権",50000]],"cr":[["売掛金",50000]],"exp":"売掛金が「でんさい」に置き換わる。資産から資産への振替。"},{"id":"p01","tag":"給与","q":"給料 300,000円を支給。源泉所得税 8,000円・住民税 12,000円・社会保険料（本人負担分）45,000円を差し引き、残額を普通預金から振り込んだ。","dr":[["給料",300000]],"cr":[["預り金",65000],["普通預金",235000]],"exp":"給料は総支給額で費用計上。天引き分は会社が後で納める義務があるので「預り金」（負債）。8,000＋12,000＋45,000＝65,000円。"},{"id":"p02","tag":"給与","q":"給与から預かっていた源泉所得税 8,000円と住民税 12,000円を普通預金から納付した。","dr":[["預り金",20000]],"cr":[["普通預金",20000]],"exp":"預り金を納付すると負債が減る。源泉所得税・住民税は原則、翌月10日までに納付。"},{"id":"p03","tag":"給与","q":"社会保険料を普通預金から納付した。本人負担分（預り金）45,000円、会社負担分 45,000円。","dr":[["預り金",45000],["法定福利費",45000]],"cr":[["普通預金",90000]],"exp":"本人負担分は預り金の減少、会社負担分は費用の「法定福利費」。社会保険料は翌月末に引き落とされる。"},{"id":"p04","tag":"給与","q":"従業員の健康診断の費用 11,000円を現金で支払った（全員が対象）。","dr":[["福利厚生費",11000]],"cr":[["現金",11000]],"exp":"全従業員が対象の健康診断は「福利厚生費」。社会保険料の会社負担（法定福利費）と区別する。"},{"id":"c01","tag":"消費税","q":"【税抜経理】商品を 110,000円（税込、うち消費税 10,000円）で仕入れ、代金は掛けとした。","dr":[["仕入",100000],["仮払消費税",10000]],"cr":[["買掛金",110000]],"exp":"税抜経理では本体価格を仕入、消費税部分を「仮払消費税」（資産）に分ける。"},{"id":"c02","tag":"消費税","q":"【税抜経理】商品を 220,000円（税込、うち消費税 20,000円）で売り上げ、代金は掛けとした。","dr":[["売掛金",220000]],"cr":[["売上",200000],["仮受消費税",20000]],"exp":"受け取った消費税は国に納める預かりもの → 「仮受消費税」（負債）。"},{"id":"c03","tag":"消費税","q":"【決算】仮受消費税 20,000円と仮払消費税 10,000円を相殺し、納付額を計上した。","dr":[["仮受消費税",20000]],"cr":[["仮払消費税",10000],["未払消費税",10000]],"exp":"仮受−仮払＝納付額。差額 10,000円を「未払消費税」として負債計上する。"},{"id":"c04","tag":"消費税","q":"【税抜経理】事務用品 5,500円（税込、うち消費税 500円）を現金で購入した。","dr":[["消耗品費",5000],["仮払消費税",500]],"cr":[["現金",5500]],"exp":"経費でも税抜経理なら消費税部分を分ける。"},{"id":"k01","tag":"決算","q":"【決算】備品について当期の減価償却費 40,000円を計上した（直接法）。","dr":[["減価償却費",40000]],"cr":[["備品",40000]],"exp":"固定資産は使った期間に費用配分する。直接法では資産（備品）を直接減らす。"},{"id":"k02","tag":"決算","q":"得意先が倒産し、当期に発生した売掛金 30,000円が回収不能となった。","dr":[["貸倒損失",30000]],"cr":[["売掛金",30000]],"exp":"回収できない売掛金は消して、費用の「貸倒損失」。（引当金がある場合は別処理）"},{"id":"k03","tag":"決算","q":"【決算】借入金の利息のうち、当期分なのに未払いのもの 3,000円を計上した。","dr":[["支払利息",3000]],"cr":[["未払費用",3000]],"exp":"発生主義：払っていなくても当期の費用は当期に計上。相手は「未払費用」。"},{"id":"k04","tag":"決算","q":"【決算】当期に支払った保険料のうち、翌期分 12,000円を前払費用に振り替えた。","dr":[["前払費用",12000]],"cr":[["保険料",12000]],"exp":"翌期分は当期の費用ではないので、資産の「前払費用」に移す。"},{"id":"k05","tag":"決算","q":"【決算】当期の法人税・住民税・事業税 120,000円を計上した（中間納付なし）。","dr":[["法人税等",120000]],"cr":[["未払法人税等",120000]],"exp":"申告・納付は決算日から2か月以内。それまでは「未払法人税等」として負債計上。"},{"id":"k06","tag":"決算","q":"【決算】貸付金の利息のうち、当期分なのに未収のもの 5,000円を計上した。","dr":[["未収収益",5000]],"cr":[["受取利息",5000]],"exp":"当期に発生した収益は受け取っていなくても計上（発生主義）。相手は「未収収益」。"}],"checks":{"l01":[{"q":"月次の仕事として最も適切なものは？","choices":["年末調整","売掛金の入金消込","法人税の申告","株主総会の招集"],"a":1,"exp":"入金消込は毎月の売掛金管理の中心業務。年末調整・法人税申告は年次。"},{"q":"仕訳の根拠となる請求書・領収書などを何と呼ぶ？","choices":["証憑（しょうひょう）","伝票","元帳","試算表"],"a":0,"exp":"取引の事実を証明する書類を証憑と呼ぶ。原則7年間の保存が必要。"}],"l02":[{"q":"貸借対照表の等式として正しいのは？","choices":["資産＝負債−純資産","資産＝負債＋純資産","収益＝費用＋資産","負債＝資産＋純資産"],"a":1,"exp":"資産の調達元が、他人から（負債）か自分たち（純資産）かを表す。"},{"q":"「未払金」はどの要素？","choices":["資産","負債","収益","費用"],"a":1,"exp":"将来支払う義務なので負債。"}],"l03":[{"q":"費用が増えたとき、仕訳のどちら側に書く？","choices":["借方（左）","貸方（右）"],"a":0,"exp":"費用のホームポジションは借方。"},{"q":"借入金を返済した。借入金はどちら側？","choices":["借方（左）","貸方（右）"],"a":0,"exp":"負債の減少は借方。"}],"l04":[{"q":"事務所用の机（備品）を後払いで買った。貸方の科目は？","choices":["買掛金","未払金","売掛金","前受金"],"a":1,"exp":"商品以外の後払いは未払金。"},{"q":"請求書と入金を突き合わせて売掛金を消す作業は？","choices":["棚卸","入金消込","年末調整","減価償却"],"a":1,"exp":"入金消込は売掛金管理の基本業務。"}],"l05":[{"q":"給与から天引きした源泉所得税の納付期限（原則）は？","choices":["当月末","翌月10日","翌月末","年末"],"a":1,"exp":"源泉所得税は原則、支払った月の翌月10日まで。"},{"q":"社会保険料の会社負担分の科目は？","choices":["福利厚生費","法定福利費","預り金","給料"],"a":1,"exp":"法律で負担が決まっている保険料なので法定福利費。"}],"l06":[{"q":"売上のときに受け取った消費税の科目は（税抜経理）？","choices":["仮払消費税","仮受消費税","租税公課","売上"],"a":1,"exp":"国に納めるために預かった税なので仮受消費税（負債）。"},{"q":"インボイスの登録番号の形式は？","choices":["T＋13桁","法人番号＋J","数字10桁","I＋8桁"],"a":0,"exp":"「T」に続けて13桁の数字（法人は法人番号と同じ数字）。"}],"l07":[{"q":"取得価額 300,000円、耐用年数5年の備品の定額法による年間償却費は？","choices":["30,000円","50,000円","60,000円","75,000円"],"a":2,"exp":"300,000 ÷ 5 ＝ 60,000円。"},{"q":"1年分の保険料を払ったが、一部が翌期分だった。決算で使う科目は？","choices":["未払費用","前払費用","前受収益","未収収益"],"a":1,"exp":"先に払った翌期分の費用は前払費用（資産）。"}],"l08":[{"q":"試算表で見つけられるミスは？","choices":["科目の選び間違い","取引の記帳もれ","借方と貸方の金額の不一致","貸借両方を同じ額で間違えた"],"a":2,"exp":"試算表は貸借の合計が一致するかを確かめる。他のミスは別のチェックが必要。"},{"q":"帳簿上の現金残高がマイナス。考えられることは？","choices":["問題ない","記帳もれ・誤記の可能性が高い","利益が出ている","借入金が多い"],"a":1,"exp":"現金がマイナスになることは現実にはありえない。入金の記帳もれなどを疑う。"}],"l09":[{"q":"本業の儲けを表す利益は？","choices":["売上総利益","営業利益","経常利益","当期純利益"],"a":1,"exp":"営業利益＝粗利から販売費及び一般管理費を引いたもの。"},{"q":"支払利息は P/L のどこに入る？","choices":["売上原価","販管費","営業外費用","特別損失"],"a":2,"exp":"本業以外の財務的な費用なので営業外費用。"}],"l10":[{"q":"中小企業がPCを1台28万円で購入。特例を使うとどう処理できる？","choices":["消耗品費で処理","全額をその期の損金にできる","3年で均等償却しかできない","必ず4年で減価償却"],"a":1,"exp":"中小企業者等の少額減価償却資産の特例（30万円未満）。"},{"q":"個人の講師への講演料 200,000円。源泉徴収税額は？","choices":["0円（不要）","10,000円","20,420円","40,840円"],"a":2,"exp":"200,000 × 10.21% ＝ 20,420円。"}],"l11":[{"q":"支払前に照合する「三点」の組み合わせは？","choices":["見積書・発注書・契約書","発注書・納品書（検収）・請求書","請求書・領収書・通帳","伝票・元帳・試算表"],"a":1,"exp":"注文した内容・届いた内容・請求された内容が一致しているかを確かめる。"},{"q":"振込データの作成と承認を別の人にする目的は？","choices":["作業を速くするため","ミスや不正を防ぐため","法律で全社に義務づけられているため","銀行の手数料を下げるため"],"a":1,"exp":"相互チェック（内部統制）のため。ひとりで完結できると、ミスも不正も発見されにくい。"}]},"terms":[{"q":"取引の発生した期間に収益・費用を計上する考え方は？","choices":["現金主義","発生主義","実現主義","保守主義"],"a":1,"exp":"現金の出入りではなく、発生した時点で計上する。企業会計の基本。"},{"q":"固定資産の取得価額を、使用する期間に配分して費用にする手続きは？","choices":["減価償却","棚卸","貸倒","引当"],"a":0,"exp":"建物・備品・車両など。土地は減価償却しない。"},{"q":"給与や報酬を支払う会社が、所得税を差し引いて国に納める制度は？","choices":["年末調整","源泉徴収","確定申告","特別徴収"],"a":1,"exp":"差し引いた所得税は原則、翌月10日までに納付。"},{"q":"1年間の源泉所得税の過不足を12月の給与などで精算する手続きは？","choices":["年末調整","確定申告","算定基礎届","年度更新"],"a":0,"exp":"従業員の扶養控除・保険料控除などを反映し、源泉所得税を精算する。"},{"q":"給与支払報告書・源泉徴収票などの法定調書の提出期限は？","choices":["12月31日","1月31日","3月15日","3月31日"],"a":1,"exp":"毎年1月31日まで。償却資産申告も同じく1月31日まで。"},{"q":"社会保険料の基準となる標準報酬月額を決めるため、毎年7月に提出する書類は？","choices":["算定基礎届","月額変更届","年度更新申告書","扶養控除等申告書"],"a":0,"exp":"4〜6月の報酬をもとに7月1日〜10日に提出する。"},{"q":"労働保険（労災・雇用保険）の保険料を申告・納付する毎年の手続きは？","choices":["算定基礎","年度更新","年末調整","賞与支払届"],"a":1,"exp":"毎年6月1日〜7月10日に行う。"},{"q":"法人税の確定申告の期限（原則）は？","choices":["決算日から1か月以内","決算日から2か月以内","決算日から3か月以内","翌年3月15日"],"a":1,"exp":"事業年度終了の翌日から2か月以内。延長の特例もある。"},{"q":"仕入税額控除を受けるために原則として保存が必要な書類は？","choices":["見積書","納品書","適格請求書（インボイス）","発注書"],"a":2,"exp":"2023年10月からインボイス制度が始まった。"},{"q":"電子帳簿保存法で、2024年1月から電子保存が義務になったのは？","choices":["紙の領収書","電子取引のデータ（メール添付の請求書など）","仕訳帳","現金出納帳"],"a":1,"exp":"電子で受け取った請求書等は、印刷保存ではなく電子データのまま保存する。"},{"q":"帳簿書類の保存期間（法人税法上の原則）は？","choices":["3年","5年","7年","永久"],"a":2,"exp":"原則7年。欠損金がある事業年度は10年。"},{"q":"すべての勘定科目の残高・合計を集計し、貸借の一致を確かめる表は？","choices":["精算表","試算表","元帳","伝票"],"a":1,"exp":"月次・年次の決算で必ず作成する。"},{"q":"勘定科目ごとに取引を集計した帳簿は？","choices":["仕訳帳","総勘定元帳","現金出納帳","補助簿"],"a":1,"exp":"仕訳帳と総勘定元帳を主要簿と呼ぶ。"},{"q":"売上高から売上原価を引いた利益は？","choices":["営業利益","経常利益","売上総利益（粗利）","当期純利益"],"a":2,"exp":"粗利。商品・サービスそのものの儲け。"},{"q":"流動資産 ÷ 流動負債 で計算する指標は？","choices":["自己資本比率","流動比率","ROE","売上高利益率"],"a":1,"exp":"短期的な支払能力を示す。一般に高いほど安全。"},{"q":"1年以内に現金化・支払期限が来るかで流動・固定を分ける基準は？","choices":["正常営業循環基準","1年基準（ワン・イヤー・ルール）","重要性の原則","継続性の原則"],"a":1,"exp":"営業取引で生じた売掛金・買掛金などは正常営業循環基準で流動になる。"},{"q":"一度採用した会計処理を、正当な理由なく変更してはいけないという原則は？","choices":["継続性の原則","保守主義の原則","明瞭性の原則","単一性の原則"],"a":0,"exp":"期間比較ができなくなるのを防ぐため。企業会計原則の一般原則のひとつ。"},{"q":"取引先と債権・債務の残高を確認し合う書類は？","choices":["残高確認書","納品書","見積書","検収書"],"a":0,"exp":"監査や決算時に、売掛金・買掛金の残高が正しいか確認するために使う。"},{"q":"中小企業の少額減価償却資産の特例で、一括で費用にできるのは1個いくら未満？","choices":["10万円未満","20万円未満","30万円未満","50万円未満"],"a":2,"exp":"青色申告の中小企業者等は30万円未満を一括損金算入できる（年間合計300万円まで）。10万円未満は通常の消耗品扱い。"},{"q":"支払期日・取引先・金額をまとめ、資金の出入りを予測する表は？","choices":["資金繰り表","試算表","精算表","予算実績表"],"a":0,"exp":"黒字倒産を防ぐために、経理が作成・管理する重要な表。"}],"docs":[{"id":"d1","kind":"請求書","title":"株式会社ソラ印刷 → 当社","fields":[["請求書番号","S-2031"],["発行日","2026年4月30日"],["宛名","株式会社○○ 御中"],["内容","会社案内パンフレット 印刷 1,000部"],["金額（税抜）","200,000円"],["消費税（10%）","20,000円"],["合計","220,000円"],["登録番号","（記載なし）"]],"issues":["登録番号（T＋13桁）がない","取引内容が不明確","消費税の計算が誤っている","宛名がない"],"answer":[0],"exp":"インボイスには登録番号の記載が必要。登録番号がないと、原則として仕入税額控除が受けられない（経過措置の範囲を除く）。取引先が登録事業者かどうか、国税庁の公表サイトで確認するのも実務の基本。"},{"id":"d2","kind":"領収書","title":"文具店のレシート（手書き領収書）","fields":[["日付","（空欄）"],["宛名","上様"],["金額","¥8,800-"],["但し書き","お品代として"],["発行者","まちの文具店 T1234567890123"]],"issues":["日付が空欄","但し書きが「お品代」で内容がわからない","宛名が「上様」","金額が1万円を超えている"],"answer":[0,1],"exp":"日付がないと、いつの取引か確認できない。「お品代」では何を買ったか分からないので、購入内容のわかるレシートか明細をもらう。小売店などの簡易インボイスは宛名の省略が認められているため「上様」自体は問題になりにくい（社内ルールで宛名を求める会社もある）。"},{"id":"d3","kind":"請求書","title":"株式会社カワセミ食品 → 当社","fields":[["請求書番号","K-551"],["発行日","2026年4月25日"],["登録番号","T9876543210987"],["内容","社内イベント用 お菓子詰め合わせ ※"],["8%対象 合計","54,000円（うち消費税 4,000円）"],["10%対象 合計","11,000円（うち消費税 1,000円）"],["請求合計","75,000円"],["備考","※は軽減税率対象"]],"issues":["登録番号がない","請求合計が明細の合計と一致しない","軽減税率対象の表示がない","税率ごとの消費税額がない"],"answer":[1],"exp":"54,000＋11,000＝65,000円なのに、請求合計は75,000円。請求書の計算ミスは意外と多いので、検算は必須。軽減税率の対象（※）や税率ごとの消費税額はきちんと書かれている。"},{"id":"d4","kind":"経費精算","title":"営業部メンバーの経費精算書","fields":[["日付","2026年4月13日（日）"],["内容","タクシー代"],["区間","銀座 → 自宅"],["時刻","23:40"],["金額","6,800円"],["目的","（空欄）"],["添付","領収書あり"]],"issues":["休日の利用で、業務目的が書かれていない","自宅までの利用で、業務との関係を確認する必要がある","領収書がない","金額が高すぎて精算できない"],"answer":[0,1],"exp":"休日・深夜・自宅まで、という条件が重なると私的利用の可能性もある。否定するのではなく「業務目的（誰と・何のため）」を書いてもらうのが実務。社内の経費規程（深夜タクシーのルールなど）も確認する。"},{"id":"d5","kind":"請求書","title":"合同会社ハヤブサ物流 → 当社","fields":[["請求書番号","HY-0098"],["発行日","2026年4月30日"],["宛名","株式会社○○ 御中"],["登録番号","T5555666677778"],["内容","4月分 配送料（明細別紙）"],["金額（税抜）","120,000円"],["消費税（10%）","12,000円"],["合計","132,000円"],["振込先","いつもと同じ口座"]],"issues":["登録番号がない","消費税の計算が誤っている","合計が誤っている","特に不備はない"],"answer":[3],"exp":"不備なし。「何もない」と判断できることも大事。疑いすぎて支払いを止めると、期日遅延になってしまう。あとは発注・納品の記録と照合して支払処理へ。"},{"id":"d6","kind":"経費精算","title":"営業部長の経費精算書","fields":[["日付","2026年4月20日"],["内容","取引先との会食（相手：株式会社ミドリ物産 2名）"],["参加人数","4名（当社2名）"],["金額","56,000円"],["申請科目","会議費"],["添付","領収書あり"]],"issues":["1人あたり14,000円で1万円を超えるので、会議費ではなく交際費","参加者の記録がない","領収書がない","社外の人との飲食は経費にできない"],"answer":[0],"exp":"56,000円÷4名＝14,000円。1人1万円を超える社外との飲食は交際費。相手先・人数の記録はきちんとある。科目の誤りは税務申告に影響するので、経理で正しく直す。"},{"id":"d7","kind":"請求書","title":"フリーランス・デザイナー（個人）→ 当社","fields":[["発行日","2026年4月28日"],["登録番号","T1111222233334"],["内容","Webバナー制作 5点"],["金額（税抜）","50,000円"],["消費税（10%）","5,000円"],["源泉徴収税","（記載なし）"],["ご請求額","55,000円"]],"issues":["個人へのデザイン料なのに、源泉徴収の計算がない","登録番号がない","消費税の計算が誤っている","特に不備はない"],"answer":[0],"exp":"請求書に書かれていなくても、個人へのデザイン料は支払う側に源泉徴収義務がある。50,000円×10.21%＝5,105円を差し引いて49,895円を支払い、翌月10日までに納付する（消費税額が明確に区分されていれば税抜金額を基準にできる）。"},{"id":"d8","kind":"請求書","title":"株式会社ツバメ商会 → 当社（PDFで受信）","fields":[["請求書番号","TB-7781"],["発行日","2026年4月30日"],["登録番号","T2222333344445"],["内容","事務用品一式"],["合計","33,000円（うち消費税 3,000円）"],["振込先","海外銀行の口座（前回までと異なる）"],["メール本文","「至急、本日中にお振込みください」"]],"issues":["振込先がいつもと違い、急がせている（詐欺の疑い）","登録番号がない","合計が誤っている","特に不備はない"],"answer":[0],"exp":"振込先の変更＋急がせる文面は、ビジネスメール詐欺の典型。登録済みの電話番号で取引先に確認するまで、支払いを止める。"}],"career":[{"rank":"新入社員","years":"入社1年目","icon":"🌱","intro":"経理部に配属された新入社員。まずは日々の業務と「経理の基本姿勢」を身につけよう。","events":[{"day":"4月1日（月）","who":"経理課長","icon":"🧑‍💼","tag":"心構え","text":"ようこそ経理課へ。最初に聞いておきたい。経理の仕事で一番大事なことは何だと思う？","choices":[["証憑（証拠書類）にもとづいて、期日どおり正確に処理すること",10,"そのとおり。「根拠」「期日」「正確さ」が経理の三本柱だ。"],["とにかく早く仕訳を入力すること",-5,"スピードも大事だが、根拠のない仕訳は後で必ず問題になる。"],["頼まれたら、なんでも経費にしてあげること",-10,"それをやると税務調査で否認され、会社が追徴課税を受けることになる。"]],"point":"経理は「証憑主義」。請求書・領収書・契約書などの根拠がない取引は記帳しない。"},{"day":"4月2日（火）","who":"営業部のメンバー","icon":"🧑‍💻","tag":"期ズレ","text":"3月28日に納品した案件、請求書をまだ出してなかった！ 今日出すから、4月の売上ってことでいいよね？","choices":[["納品は3月なので、3月の売上として計上します。請求書はすぐ発行しましょう",15,"正解。売上は「請求した日」ではなく「納品・役務提供した日」に計上する（出荷基準・検収基準など会社のルールに従う）。"],["請求書の日付が4月なので、4月の売上にします",-15,"これが「期ズレ」。3月決算の会社なら、前期の売上が今期にずれて決算が不正確になる。"],["入金されたときに売上にします",-10,"それは現金主義。会社の会計は発生主義が原則。"]],"point":"売上・費用の計上時期は「いつ請求したか」ではなく「いつ取引が発生したか」。月末・期末の計上もれ（期ズレ）は監査でも重点的に見られる。"},{"day":"4月5日（金）","who":"支払処理","icon":"🧾","tag":"二重払い","text":"同じ取引先から、郵送の請求書とPDFの請求書が届いた。金額は同じ 330,000円、請求書番号も同じ「INV-0412」。","choices":[["同じ請求書の重複なので、1回だけ支払う。請求書番号で支払済みかも確認する",15,"正解。二重払いは経理で一番多いミスのひとつ。請求書番号・金額・日付で突き合わせよう。"],["2通届いたので2回支払う",-20,"二重払い。返金してもらうのは手間がかかり、取引先にも迷惑。"],["念のため両方とも支払わない",-10,"支払遅延になってしまう。期日どおりに払うのも経理の大切な仕事。"]],"point":"支払前チェック：①請求書番号の重複 ②発注・納品（検収）との一致 ③金額・振込先 ④承認者の承認。"},{"day":"4月10日（水）","who":"カレンダー","icon":"📅","tag":"期限","text":"今日は10日。何か忘れていない？","choices":[["3月分の給与で預かった源泉所得税と住民税の納付期限！",15,"正解。毎月10日は源泉所得税・住民税の納付期限（納期の特例を受けていない場合）。遅れると延滞税などがかかる。"],["社会保険料の納付日",-5,"社会保険料は翌月末の口座振替。10日ではない。"],["特に何もない",-15,"源泉所得税の納付を忘れると、不納付加算税と延滞税がかかる。"]],"point":"毎月のルーティン期限：10日＝源泉所得税・住民税、月末＝社会保険料の引き落とし。"},{"day":"4月26日（金）","who":"月次締め","icon":"🔍","tag":"残高照合","text":"月末の預金残高照合。通帳の残高が、帳簿より 5,500円少ない。","choices":[["通帳の明細と帳簿を1件ずつ突き合わせて、記帳もれの引き落としを探す",15,"正解。口座振替の手数料やサブスク料金の引き落としの記帳もれがよくある原因。必ず原因を特定する。"],["差額を雑損失にして合わせる",-15,"原因を調べずに差額を埋めるのは最悪の対応。不正や大きなミスを見逃すことになる。"],["来月になれば合うかもしれないので、そのままにする",-10,"差異は放置すると原因がどんどん追えなくなる。"]],"point":"預金・現金・売掛金・買掛金は毎月「外部の証拠（通帳・取引先）」と残高を照合する。合わないときは、まず原因の特定。"}]},{"rank":"担当者","years":"入社2〜3年目","icon":"📗","intro":"ひとりで支払・入金・経費を任されるように。取引先や社内とのやりとりで判断力が試される。","events":[{"day":"4月3日（水）","who":"メール","icon":"📧","tag":"不正防止","text":"取引先「株式会社ミドリ物産」から急ぎのメール：「口座を変更しました。本日支払い分から、新しい口座（海外の銀行）へお振込みください。至急お願いします」","choices":[["登録済みの電話番号に電話して、担当者に直接確認する",20,"完璧。これは「ビジネスメール詐欺（BEC）」の典型的な手口。メール以外の、もともと知っている連絡先で確認するのが鉄則。"],["このメールに返信して、本当か確認する",-10,"メールが乗っ取られていたら、返信先も詐欺師。メールで確認しても意味がない。"],["至急とのことなので、口座を変更して振り込む",-25,"これで数千万円をだまし取られる被害が実際に起きている。急がせるのは詐欺の常套手段。"]],"point":"振込先の変更依頼は、必ずメール以外の既知の連絡先で確認。変更は書面＋上長承認など社内ルールに沿って行う。"},{"day":"4月8日（月）","who":"広報部","icon":"🎨","tag":"源泉徴収","text":"個人で活動しているデザイナーさんにロゴを作ってもらった。デザイン料 100,000円（税抜）の請求書が来たので、そのまま振り込んでほしいとのこと。","choices":[["個人へのデザイン料なので、源泉所得税（10.21%）を差し引いて支払う",20,"正解。個人へのデザイン料・原稿料・講演料・士業報酬などは源泉徴収が必要。100,000円 × 10.21% ＝ 10,210円を差し引き、翌月10日までに納付する。"],["請求どおり全額を振り込む",-15,"源泉徴収もれ。後から会社が不足分と不納付加算税を納めることになる。"],["法人と同じなので特に何もしない",-10,"法人への支払いは原則源泉徴収不要だが、個人への一定の報酬は必要。"]],"point":"源泉徴収が必要な報酬：原稿料・デザイン料・講演料・税理士/弁護士等の報酬など（支払先が個人の場合）。100万円以下は10.21%、超える部分は20.42%。"},{"day":"4月11日（木）","who":"入金確認","icon":"🏦","tag":"入金消込","text":"株式会社アオバ商事への請求 220,000円に対し、入金は 219,560円。440円足りない。","choices":[["振込手数料が差し引かれていると考え、契約条件を確認。当社負担で問題なければ支払手数料として処理する",15,"正解。契約で「振込手数料は買い手負担」なら先方に連絡、慣行で当社負担なら差額を費用処理する。"],["440円の未入金として、毎月督促し続ける",-5,"契約上請求できるなら連絡は必要だが、まず原因を推測・確認しよう。"],["差額は放置して、売掛金を全額消す",-15,"差額の仕訳をしないと売掛金や預金の残高が合わなくなる。"]],"point":"入金差額の原因あるある：振込手数料の差引、まとめ払い、値引き・相殺、過入金、別の会社名義での入金。"},{"day":"4月12日（金）","who":"営業部長","icon":"🍽️","tag":"交際費","text":"取引先と4人で会食して、飲食代は 36,000円でした。精算をお願いします。","choices":[["1人あたり9,000円。1万円以下の飲食費なので、参加者・人数などを記録すれば交際費から除外できる。記録を出してもらう",20,"正解。2024年4月以降、1人あたり1万円以下の飲食費は、相手先・人数などを記録すれば税務上の交際費から除外できる（会議費などで処理）。"],["飲食代はすべて会議費にする",-10,"1人1万円を超える接待は交際費。科目を変えても税務上は交際費として扱われる。"],["領収書だけあれば、記録はいらない",-5,"1万円基準の適用には、日付・参加者の氏名と関係・人数・金額・店名などの記録が必要。"]],"point":"交際費か会議費か：社外との飲食で1人1万円以下（2024年4月〜）なら記録の保存を条件に交際費から除外可。社内だけの飲食は対象外。"},{"day":"4月22日（月）","who":"メール","icon":"📎","tag":"電子帳簿保存法","text":"取引先から、請求書のPDFがメールで届いた。","choices":[["PDFのまま、取引日・取引先・金額で検索できるようにして保存する",15,"正解。電子帳簿保存法により、電子で受け取った請求書等は電子データのまま保存する（2024年1月から義務化）。"],["印刷して紙のファイルに綴じれば十分",-10,"紙に印刷しただけの保存は、電子取引データの保存としては認められない。"],["処理が終わったら削除する",-15,"請求書は原則7年間の保存義務がある。"]],"point":"電子取引データの保存要件：①改ざん防止（訂正削除の記録が残るシステム or 事務処理規程など） ②検索性（日付・金額・取引先）。"}]},{"rank":"主任","years":"入社4〜6年目","icon":"📘","intro":"月次決算の中心メンバーに。科目判断・決算処理・後輩指導を任される。","events":[{"day":"入社4〜6年目","who":"総務部","icon":"💻","tag":"固定資産","text":"新しいノートPCを 250,000円（税抜）で1台購入しました。経理処理をお願いします。（カサネは資本金1億円超の上場会社です）","choices":[["備品（固定資産）に計上し、耐用年数4年で減価償却する",20,"正解。10万円以上は原則として固定資産。20万円未満なら3年で均等に費用にする一括償却資産も選べるが、25万円なので通常どおり減価償却する。"],["30万円未満なので、少額減価償却資産の特例で全額をその期の費用にする",-10,"これは中小企業者等（資本金1億円以下など）だけが使える特例。資本金1億円超のカサネは使えない。"],["消耗品費で処理する",-10,"消耗品費として一括で費用にできるのは、原則10万円未満。"]],"point":"金額の目安：10万円未満＝消耗品費／20万円未満＝一括償却資産（3年均等）も可／30万円未満＝中小企業者等だけの特例／それ以上＝固定資産として減価償却。会社の規模によって使える特例が変わる。"},{"day":"4月17日（水）","who":"施設管理","icon":"🔧","tag":"修繕費","text":"壊れた空調の修理で 180,000円かかりました。元の状態に戻しただけです。","choices":[["元の状態に戻す修理で20万円未満なので、修繕費として費用処理する",15,"正解。原状回復の修理は修繕費。性能アップや耐用年数を延ばす支出は資本的支出（資産計上）になる。"],["高額なので建物（資産）に計上する",-10,"価値を高める改良ではないので、資産計上は不要。"],["消耗品費で処理する",-5,"修理代は修繕費が適切。"]],"point":"修繕費と資本的支出：原状回復・維持管理は修繕費、価値の向上・耐用年数の延長は資本的支出。20万円未満や3年以内の周期の修理は修繕費にできる形式基準もある。"},{"day":"3月31日（決算日）","who":"決算準備","icon":"📦","tag":"決算","text":"3月中に工事は完了しているが、業者からの請求書（約500,000円）がまだ届いていない。決算はどうする？","choices":[["作業は当期に完了しているので、見積額で未払計上する（請求書到着後に差額を調整）",20,"正解。費用も発生主義。請求書がなくても、当期に発生した費用は当期に計上する。"],["請求書が届いてから、翌期の費用にする",-15,"期ズレで当期の利益が過大になる。"],["決算を締めるのを待ってもらう",-5,"申告期限があるので、見積もりで計上して進めるのが実務。"]],"point":"決算での「未払計上」：期末までに納品・役務提供を受けたもので請求書が未着のものは、見積額で計上する。"},{"day":"4月30日（火）","who":"経理課長","icon":"🧑‍💼","tag":"月次分析","text":"月次試算表を見たら、広告宣伝費が先月の3倍になっている。明日の役員会に出すけど、大丈夫？","choices":[["増えた理由（キャンペーン実施など）を担当部署に確認し、コメントを添えて報告する",15,"正解。数字を作るだけでなく「なぜそうなったか」を説明できるのが経理の価値。誤計上（科目違い・二重計上）の発見にもつながる。"],["数字は正しく集計しているので、そのまま出す",-5,"集計が正しくても、科目間違いや二重計上が隠れているかもしれない。"],["目立つので、一部を翌月に回して平らにする",-25,"これは利益操作。絶対にやってはいけない。"]],"point":"月次分析の基本：前月比・前年同月比・予算比で大きく動いた科目は、原因を確認してコメントをつける。"},{"day":"入社3年目の春","who":"新入社員","icon":"🧑‍🎓","tag":"後輩指導","text":"新しく入った後輩が、10万円の応接テーブルを「消耗品費」で入力していた。どうする？","choices":[["なぜ備品（固定資産）になるのか理由を説明し、迷いやすい判断をチェックリストにまとめて共有する",15,"正解。直すだけでなく「なぜ」を伝え、仕組みで再発を防ぐのが主任の仕事。"],["黙って自分で修正しておく",-5,"後輩は同じミスを繰り返す。教える機会を逃している。"],["みんなの前で厳しく注意する",-10,"萎縮するとミスを隠すようになる。経理ではそれが一番怖い。"]],"point":"ミスの再発防止は「人を責める」より「仕組みで防ぐ」。チェックリスト・マニュアル・ダブルチェック。"}]},{"rank":"係長","years":"入社7〜9年目","icon":"📙","intro":"チームのまとめ役。監査・税務調査の窓口となり、チームの仕組みづくりも担う。","events":[{"day":"4月19日（金）","who":"社長","icon":"👔","tag":"公私混同","text":"この家族旅行のホテル代、会社の経費で落としておいて。","choices":[["業務に関係ない支出は経費にできないことを説明し、個人負担にしてもらう（会社が払った場合は役員への貸付などで処理）",20,"勇気ある正解。私的な支出を経費にすると、税務調査で否認され、役員賞与扱い・重加算税の対象になることも。会社と社長を守るのも経理の役目。"],["社長の指示なので、旅費交通費で処理する",-25,"粉飾・脱税に加担することになる。経理担当者も責任を問われかねない。"],["福利厚生費で処理する",-15,"家族旅行は福利厚生費にもならない。"]],"point":"経費になるのは「事業のための支出」だけ。立場が上の人の依頼でも、ルールにもとづいて説明できるのが信頼される経理。"},{"day":"係長1年目","who":"経費精算の確認","icon":"🕵️","tag":"社内不正","text":"部下Aさんのタクシー領収書を見ていたら、毎月同じタクシー会社で、領収書の連番が飛び飛びに続いている。金額は毎回ちょうど上限ぎりぎり。","choices":[["事実（日付・金額・連番）を整理して上長・内部監査に報告し、調査は会社の手続きに沿って進める",20,"正解。不正の疑いは、証拠を整理し、決められたルートで報告する。決めつけず、ひとりで抱え込まない。"],["本人をすぐに呼び出して問い詰め、チームにも共有する",-5,"まだ疑いの段階。証拠が散逸したり、名誉の問題になったりする。"],["気まずいので見なかったことにする",-25,"見逃すと不正は拡大する。発見できる立場の人が動かないと、組織は守れない。"]],"point":"不正の兆候：同じパターンの繰り返し、上限ぎりぎりの金額、連番の領収書、休日・深夜の多用。発見したら事実を整理して正式なルートで報告。"},{"day":"係長1年目","who":"税務調査官","icon":"🏛️","tag":"税務調査","text":"税務調査で調査官から「この 120,000円の会議費、相手は誰で何の会議ですか？」と聞かれた。すぐには思い出せない。","choices":[["「確認してお答えします」と伝え、証憑と記録を調べて事実を回答する",15,"正解。わからないことを推測で答えるのは厳禁。記録にもとづいて正確に回答する。"],["たぶん○○社との打ち合わせだったと思います、とその場で答える",-10,"推測の回答が事実と違うと、全体の信頼性を疑われる。"],["関係する資料を見せないようにする",-25,"調査の妨げは重いペナルティの対象。誠実な対応が結局一番の近道。"]],"point":"税務調査対応：①聞かれたことに事実で答える ②わからないことは持ち帰って確認 ③日頃から証憑と記録を整理しておくのが最大の対策。"},{"day":"係長1年目","who":"監査法人","icon":"📋","tag":"債権管理","text":"監査法人から「期末の売掛金のうち、1年以上入金がない取引先がありますね」と指摘された。","choices":[["営業部と回収状況・相手の経営状態を確認し、回収可能性に応じて貸倒引当金の計上や貸倒処理を検討する",15,"正解。回収できない可能性がある債権は、資産として過大にならないよう評価する。"],["そのうち入金されるはずなので、何もしない",-10,"回収できない売掛金を資産に残すと、資産と利益が過大になる。"],["指摘された分だけ、こっそり消しておく",-15,"根拠なく消すのも誤り。確認・判断・承認の手続きが必要。"]],"point":"売掛金は「年齢調べ（エイジング）」で滞留を管理。長期滞留は回収可能性を評価し、貸倒引当金・貸倒損失を検討する。"},{"day":"係長2年目","who":"経理部長","icon":"🧑‍💼","tag":"決算早期化","text":"うちの月次決算は締めに15日かかっている。経営陣から「もっと早く数字がほしい」と言われた。どう改善する？","choices":[["締めのスケジュールと作業を洗い出し、見積計上の活用・残高照合の前倒し・他部署からの資料提出期限の設定で短縮する",15,"正解。早期化は「作業の並べ替え」と「他部署を巻き込むルールづくり」がカギ。"],["全員で残業して乗り切る",-5,"一時的には早くなっても続かない。仕組みが変わっていない。"],["チェック作業を省いて早くする",-15,"早くても間違った数字では意味がない。"]],"point":"決算早期化のコツ：①作業の標準化・マニュアル化 ②締め日前に終わる作業は前倒し ③請求書・経費の提出期限を全社ルールに ④重要性の低いものは見積もりで計上。"}]},{"rank":"課長","years":"入社10〜14年目","icon":"💼","intro":"経理課を率いる管理職。会社のお金と計画を守り、他部門とも渡り合う。","events":[{"day":"課長1年目","who":"資金繰り表","icon":"💰","tag":"資金繰り","text":"資金繰り表を更新したら、大口の入金が翌月にずれ込み、来月末の支払い（仕入代金・給与）に約3,000万円足りないことがわかった。","choices":[["すぐに経営陣へ報告し、取引銀行に短期借入や当座貸越の相談をする。並行して入金の前倒し交渉も検討する",20,"正解。資金不足は「早く気づいて早く動く」がすべて。銀行は直前の相談を嫌う。"],["仕入先への支払いを、連絡せずに遅らせる",-15,"信用を一気に失い、取引停止につながりかねない。"],["支払日の前日まで様子を見る",-20,"直前では銀行も対応できない。利益が出ていても資金が尽きれば倒産する（黒字倒産）。"]],"point":"資金繰り表で「いつ・いくら足りないか」を数か月先まで予測するのが課長の重要任務。"},{"day":"課長1年目","who":"営業本部長","icon":"📈","tag":"売上の押し込み","text":"期末直前、営業本部長から「目標まで少し足りない。取引先に大量出荷して今期の売上にして、来期に返品してもらう約束はついてるから」と言われた。","choices":[["返品前提の出荷は売上の実態がなく計上できないと説明し、必要なら上層部や監査役にも相談する",20,"正解。いわゆる「押し込み販売」。返品が前提なら売上計上は認められず、粉飾につながる。"],["本部長の指示なので、出荷どおり売上に計上する",-25,"粉飾決算に加担することになる。発覚すれば会社も担当者も重い責任を負う。"],["売上には計上するが、メモだけ残しておく",-15,"メモを残しても不正な計上であることは変わらない。"]],"point":"売上は「実態」で判断。期末の異常な出荷、翌期の大量返品、異例の取引条件は、監査でも重点的に確認される。"},{"day":"課長2年目","who":"予算会議","icon":"🎯","tag":"予算管理","text":"各部から出てきた来期予算を積み上げたら、会社の利益目標に5,000万円届かない。","choices":[["各部の前提（単価・数量・人員計画）を確認し、経営方針と照らし合わせて各部と調整する",15,"正解。経理は数字の「つじつま合わせ」ではなく、前提を確認して実現可能な計画にするファシリテーター。"],["経理の判断で各部の経費を一律カットする",-10,"現場の納得がない予算は達成されない。"],["売上予算を目標に合うように上乗せしておく",-15,"根拠のない予算は、未達になったときに誰も責任を持てない。"]],"point":"予算管理：前提を明確にした予算を作り、毎月「予算と実績の差（予実差異）」を分析して打ち手につなげる。"},{"day":"課長2年目","who":"経理チーム","icon":"🤖","tag":"経理DX","text":"請求書の受け取り・入力・支払いの処理に毎月チームで100時間以上かかっている。どう改善する？","choices":[["今の業務フローを洗い出してムダを見直した上で、電子請求書の受領や自動仕訳などのシステムを導入し、効果を測る",15,"正解。「業務の見直し→システム化→効果測定」の順番が大事。"],["高機能なシステムを入れれば全部解決する",-5,"今の非効率なフローのままシステム化すると、ムダも一緒に自動化される。"],["人を増やして対応する",0,"短期的には有効でも、根本的な解決にはならない。"]],"point":"経理DX：ペーパーレス化（電子帳簿保存法対応）、銀行明細の自動取込、請求書の電子受領、自動仕訳など。まずは業務フローの見直しから。"}]},{"rank":"経理部長","years":"入社15〜17年目","icon":"🏆","intro":"経営陣の一員として、会社の数字に最終責任を持つ立場。最後の試練に挑もう。","events":[{"day":"経理部長1年目","who":"社長（経営会議）","icon":"👔","tag":"利益とキャッシュ","text":"社長「今期は過去最高益なのに、なぜ会社の現金は減ったんだ？ 経理のミスじゃないのか？」","choices":[["キャッシュフロー計算書をもとに、売掛金・在庫の増加、設備投資、借入返済などで現金が出ていったことを説明する",20,"正解。利益と現金は一致しない。その差を経営者にわかる言葉で説明できるのが経理部長。"],["申し訳ありません、確認します（とりあえず謝る）",-10,"ミスではない。根拠を示して説明するべき場面。"],["会計とはそういうものです、と答える",-15,"経営者が判断できるように、具体的に説明する責任がある。"]],"point":"利益が出ても現金が減る主な理由：売掛金の増加（未回収）、在庫の増加、設備投資、借入金の返済、法人税の支払い。"},{"day":"経理部長1年目","who":"社長","icon":"👔","tag":"粉飾の誘惑","text":"社長「このままだと、公表済みの業績予想を大きく下回る。株価は暴落するし、銀行との融資契約の条件（財務制限条項）にも引っかかる。年間契約の売上、今期に全部入れれば予想どおりだろ？」","choices":[["年間契約の売上は契約期間に応じて計上するしかないと説明し、業績予想の修正をすぐに適時開示して、銀行にも改善計画を説明することを提案する",25,"最高の答え。サブスクの売上はサービスを提供した期間に応じて計上する。業績予想から大きくずれる見込みになったら、速やかに修正を開示するのが上場会社の義務。隠せば株主を欺くことになる。"],["言われたとおり、年間契約の売上を今期に一括で計上する",-30,"まだ提供していないサービスの売上を前倒しする粉飾。有価証券報告書の虚偽記載として、会社も役員も重い責任を問われる。"],["今期の費用の一部を来期に回す",-25,"これも利益操作。監査・税務調査で発覚し、会社の信用を失う。"]],"point":"上場会社は、売上・利益の見込みが公表済みの業績予想から一定以上ずれる場合（売上高は10%、利益は30%が目安）、すぐに修正を開示する必要がある。悪いニュースほど早く・正確に。"},{"day":"経理部長2年目","who":"人事部","icon":"👥","tag":"組織づくり","text":"経理部で退職が続き、「あの人しかわからない業務」があちこちにある。","choices":[["業務の棚卸しとマニュアル化を進め、ジョブローテーションと育成計画で属人化を解消する",15,"正解。属人化はミス・不正・業務停止のリスク。仕組みとして引き継げる組織が強い。"],["部長自ら全部の業務を覚えて対応する",-10,"部長が倒れたら全部止まる。根本解決にならない。"],["辞めそうな人に業務を集中させないよう、仕事を減らす",-5,"一時しのぎ。業務の見える化が先。"]],"point":"強い経理組織：業務の見える化・標準化、ダブルチェック、ローテーション、育成計画。部長の仕事は「自分がいなくても回る組織」を作ること。"}]},{"rank":"CFO","years":"入社18年目〜","icon":"👑","intro":"最高財務責任者として、プライム市場への移行・M&A・投資家対応を率いる。会社の未来を数字で描く最終章。","events":[{"day":"CFO1年目","who":"監査法人","icon":"📋","tag":"内部統制","text":"社長の号令でプライム市場への移行を目指すことに。ところが監査法人から「子会社の承認の記録がほとんど残っていません。内部統制の『開示すべき重要な不備』になるおそれがあります」と言われた。","choices":[["子会社も含めて業務の流れとリスクを文書化し、承認・職務分掌などの統制を整えて、運用状況をテストしていく",20,"正解。上場会社は毎年、財務報告にかかる内部統制を経営者が評価して報告し、監査を受ける。子会社も対象になる。整備→運用→評価には時間がかかる。"],["期末直前に、まとめて承認の書類を作れば間に合う",-15,"統制が実際に運用されていた証拠（記録）が必要。後から作った書類では通用しないどころか、記録の改ざんになる。"],["厳しいことを言わない監査法人に変える",-20,"いわゆる「オピニオン・ショッピング」。上場会社が監査法人を交代するときは理由の開示が必要で、市場からも厳しく見られる。"]],"point":"J-SOX（内部統制報告制度）：上場会社は財務報告の信頼性を確保する内部統制を経営者が評価して報告し、監査人の監査を受ける。"},{"day":"CFO1年目","who":"社長","icon":"👔","tag":"M&A","text":"社長が同業の会社を買収したがっている。ところが、相手の会社が他社の借入の保証人になっているという噂がある。決算書には載っていない。","choices":[["財務・税務デューデリジェンスで契約書・保証・訴訟などを調べ、見つかったリスクを買収価格や契約条件に反映する",20,"正解。決算書に載っていない「簿外債務」は買収後に表面化すると大損害になる。調べて、価格や表明保証条項で手当てする。"],["社長が乗り気なので、調べずに進める",-20,"買収後に保証債務が現実になれば、会社の財産で払うことになる。"],["噂があるので、買収を即座に中止する",-5,"調べもせずに判断するのは早計。リスクを測って条件で調整するのがCFOの仕事。"]],"point":"デューデリジェンス（DD）：買収前に相手の財務・税務・法務を調べること。簿外債務・税務リスク・偶発債務の発見がカギ。"},{"day":"CFO2年目","who":"機関投資家","icon":"📊","tag":"IR","text":"決算説明会で、投資家から「今期は減益ですね。理由と今後の見通しは？」と厳しく質問された。","choices":[["減益の原因を数字で説明し、対策と見通しを示す。業績予想を変えるときは適時開示で全員に同時に公表する",20,"正解。悪いニュースほど早く・正確に・公平に。特定の人だけに重要な情報を伝えるのはフェア・ディスクロージャー・ルール違反になる。"],["「来期は必ず回復します」と楽観的な見通しだけ話す",-10,"根拠のない見通しは信頼を失う。外れたときの反動も大きい。"],["詳しいことは個別に親しい投資家にだけ話す",-20,"未公表の重要情報を一部にだけ伝えるのは、フェア・ディスクロージャー・ルールに反する。"]],"point":"IR（投資家向け広報）の基本：事実・原因・対策をセットで。重要な情報は適時開示で全員に同時に公表する。"},{"day":"CFO2年目","who":"内部通報窓口","icon":"📨","tag":"内部通報","text":"内部通報窓口に「子会社で、取引先と発注を回し合って売上を膨らませている（循環取引）」という通報が届いた。","choices":[["通報者を守ったうえで、監査役や外部の専門家も入れて独立した調査を始め、必要なら過去の決算を訂正する",25,"正解。通報者の保護は法律上の義務。調査は利害関係のない立場で行い、事実なら訂正と再発防止まで責任を持つ。"],["子会社の社長に事情を聞いて、任せる",-15,"当事者に調査を任せると、証拠隠しや口裏合わせの恐れがある。"],["誰が通報したのかをまず突き止める",-30,"通報者探しや不利益な扱いは公益通報者保護法で禁止されている。組織の自浄作用も失われる。"]],"point":"内部通報制度：通報者の秘密保持と不利益な取扱いの禁止が大前提。不正の早期発見に最も役立つ仕組みのひとつ。"},{"day":"CFO2年目","who":"社長","icon":"👔","tag":"最後の決断","text":"調査の結果、子会社の循環取引は事実だった。社長「プライム市場への移行審査の最中だ……この件、なんとか伏せておけないか？」","choices":[["すぐに適時開示し、過去の決算を訂正して、原因と再発防止策を示す。市場変更は見送ることを提案する",30,"CFOとしての最高の決断。プライム移行が遠のいても、隠した不正が後で発覚すれば上場廃止や刑事責任にもつながる。誠実さこそ会社の価値を守る。"],["審査が終わるまで伏せておき、移行後に静かに直す",-30,"重要な事実を知りながら開示しないのは、有価証券報告書の虚偽記載や開示義務違反になりうる。しかも未公表の重要事実を知る社員が株を売買すれば、インサイダー取引になる。"],["子会社の担当者だけの責任にして、本体には関係ないことにする",-20,"連結グループ全体の財務報告に責任を持つのがCFO。トカゲの尻尾切りでは再発する。"]],"point":"CFOの使命は「正しい数字で会社の未来を守ること」。上場会社の信頼は、悪いニュースをどれだけ早く正直に出せるかで決まる。一度失うと取り戻せない。"}]}],"promote":0.6,"drill2":[{"id":"j3_01","lv":"3級","tag":"現金","q":"現金の実際有高が帳簿残高より3,000円少なかった。原因はわからない。","dr":[["現金過不足",3000]],"cr":[["現金",3000]],"exp":"帳簿を実際の有高に合わせるため現金を減らし、原因がわかるまで「現金過不足」で一時的に処理する。"},{"id":"j3_02","lv":"3級","tag":"現金","q":"決算日。現金過不足（借方残高）3,000円のうち2,000円は通信費の記入もれと判明した。残りは原因不明。","dr":[["通信費",2000],["雑損",1000]],"cr":[["現金過不足",3000]],"exp":"原因がわかった分は正しい科目へ、決算までわからなかった分は「雑損」（貸方残高なら「雑益」）に振り替える。"},{"id":"j3_03","lv":"3級","tag":"預金","q":"決算日。当座預金勘定が30,000円の貸方残高になっている（当座借越契約あり）。","dr":[["当座預金",30000]],"cr":[["当座借越",30000]],"exp":"期中は当座預金で処理し、決算で貸方残高を負債の「当座借越」（または借入金）に振り替える。"},{"id":"j3_04","lv":"3級","tag":"債権","q":"売掛金50,000円を、得意先振出しの約束手形で回収した。","dr":[["受取手形",50000]],"cr":[["売掛金",50000]],"exp":"手形を受け取ったら資産の「受取手形」が増え、売掛金が減る。"},{"id":"j3_05","lv":"3級","tag":"債権","q":"得意先に対する売掛金80,000円について、電子記録債権の発生記録が行われた。","dr":[["電子記録債権",80000]],"cr":[["売掛金",80000]],"exp":"でんさいなどで発生記録されると、売掛金が「電子記録債権」に変わる。"},{"id":"j3_06","lv":"3級","tag":"貸倒れ","q":"前期に発生した売掛金40,000円が貸し倒れた。貸倒引当金の残高は30,000円ある。","dr":[["貸倒引当金",30000],["貸倒損失",10000]],"cr":[["売掛金",40000]],"exp":"前期以前の債権は、まず貸倒引当金を取り崩す。足りない分は「貸倒損失」。当期に発生した債権なら全額が貸倒損失。"},{"id":"j3_07","lv":"3級","tag":"貸倒れ","q":"決算日。売掛金の期末残高500,000円に2%の貸倒引当金を設定する（差額補充法）。貸倒引当金の残高は3,000円。","dr":[["貸倒引当金繰入",7000]],"cr":[["貸倒引当金",7000]],"exp":"必要額10,000円－残高3,000円＝7,000円を繰り入れる。"},{"id":"j3_08","lv":"3級","tag":"決算","q":"決算日。期首商品棚卸高は30,000円、期末商品棚卸高は40,000円。売上原価を仕入勘定で計算する。","dr":[["仕入",30000],["繰越商品",40000]],"cr":[["繰越商品",30000],["仕入",40000]],"exp":"「しーくり・くりしー」：期首の在庫を仕入に足し（仕入／繰越商品）、期末の在庫を仕入から引く（繰越商品／仕入）。"},{"id":"j3_09","lv":"3級","tag":"固定資産","q":"決算日。備品（取得原価600,000円、残存価額ゼロ、耐用年数5年）の減価償却を定額法・間接法で行う。","dr":[["減価償却費",120000]],"cr":[["備品減価償却累計額",120000]],"exp":"600,000円÷5年＝120,000円。間接法では備品を直接減らさず、累計額に積み上げる。"},{"id":"j3_10","lv":"3級","tag":"固定資産","q":"備品（取得原価600,000円、減価償却累計額360,000円）を200,000円で売却し、代金は月末に受け取る。","dr":[["備品減価償却累計額",360000],["未収入金",200000],["固定資産売却損",40000]],"cr":[["備品",600000]],"exp":"帳簿価額240,000円の備品を200,000円で売ったので40,000円の売却損。商品以外の売却代金の未収は「未収入金」。"},{"id":"j3_11","lv":"3級","tag":"経過勘定","q":"決算日。当期に支払った保険料のうち12,000円は翌期分である。","dr":[["前払保険料",12000]],"cr":[["保険料",12000]],"exp":"翌期分の費用は当期の費用から除き、資産の「前払保険料（前払費用）」にする。"},{"id":"j3_12","lv":"3級","tag":"経過勘定","q":"決算日。借入金の利息のうち当期分5,000円がまだ支払われていない。","dr":[["支払利息",5000]],"cr":[["未払利息",5000]],"exp":"当期分の費用は、未払いでも当期に計上する（発生主義）。負債は「未払利息（未払費用）」。"},{"id":"j3_13","lv":"3級","tag":"経過勘定","q":"決算日。受け取った家賃のうち30,000円は翌期分である。","dr":[["受取家賃",30000]],"cr":[["前受家賃",30000]],"exp":"翌期分の収益は当期の収益から除き、負債の「前受家賃（前受収益）」にする。"},{"id":"j3_14","lv":"3級","tag":"経過勘定","q":"決算日。貸付金の利息のうち当期分4,000円をまだ受け取っていない。","dr":[["未収利息",4000]],"cr":[["受取利息",4000]],"exp":"当期分の収益は、未収でも当期に計上する。資産は「未収利息（未収収益）」。"},{"id":"j3_15","lv":"3級","tag":"経過勘定","q":"期首。前期末に計上した前払保険料12,000円を、もとの科目に戻す（再振替仕訳）。","dr":[["保険料",12000]],"cr":[["前払保険料",12000]],"exp":"期首に決算整理の逆の仕訳をして、当期の費用に戻す。"},{"id":"j3_16","lv":"3級","tag":"現金","q":"小口現金係から、通信費3,000円・消耗品費2,000円の支払報告を受け、ただちに同額を小切手を振り出して補給した。","dr":[["通信費",3000],["消耗品費",2000]],"cr":[["当座預金",5000]],"exp":"報告と同時に補給する場合、小口現金の増減は相殺されるので、費用と当座預金だけを記録する。"},{"id":"j3_17","lv":"3級","tag":"債権","q":"商品10,000円を売り上げ、代金は他社が発行した商品券で受け取った。","dr":[["受取商品券",10000]],"cr":[["売上",10000]],"exp":"他社発行の商品券は、後で発行元に請求できる資産「受取商品券」。"},{"id":"j3_18","lv":"3級","tag":"その他","q":"店舗を借りる契約をし、敷金200,000円と1か月分の家賃100,000円を普通預金から支払った。","dr":[["差入保証金",200000],["支払家賃",100000]],"cr":[["普通預金",300000]],"exp":"敷金は退去時に戻ってくるので資産の「差入保証金」。家賃は費用。"},{"id":"j3_19","lv":"3級","tag":"前払・前受","q":"商品を注文し、内金20,000円を現金で支払った。","dr":[["前払金",20000]],"cr":[["現金",20000]],"exp":"商品を受け取る前に払ったお金は、資産の「前払金」。"},{"id":"j3_20","lv":"3級","tag":"前払・前受","q":"注文していた商品100,000円を受け取った。内金20,000円を差し引き、残額は掛けとした。","dr":[["仕入",100000]],"cr":[["前払金",20000],["買掛金",80000]],"exp":"仕入れたときに前払金を取り崩し、残りを買掛金にする。"},{"id":"j3_21","lv":"3級","tag":"給与","q":"従業員が個人で負担すべき保険料5,000円を、会社が現金で立て替えた。","dr":[["従業員立替金",5000]],"cr":[["現金",5000]],"exp":"後で返してもらうお金なので資産。給料から差し引いて回収することが多い。"},{"id":"j3_22","lv":"3級","tag":"給与","q":"給料300,000円から、所得税20,000円と従業員負担の社会保険料30,000円を差し引き、普通預金から支払った。","dr":[["給料",300000]],"cr":[["所得税預り金",20000],["社会保険料預り金",30000],["普通預金",250000]],"exp":"給料は総額で費用にする。差し引いた税金と保険料は、会社が後で納める「預り金」（負債）。"},{"id":"j3_23","lv":"3級","tag":"給与","q":"預かっていた社会保険料30,000円と、会社負担分30,000円を普通預金から納付した。","dr":[["社会保険料預り金",30000],["法定福利費",30000]],"cr":[["普通預金",60000]],"exp":"従業員負担分は預り金を減らし、会社負担分は費用の「法定福利費」。"},{"id":"j3_24","lv":"3級","tag":"税金","q":"法人税等の中間申告を行い、100,000円を普通預金から納付した。","dr":[["仮払法人税等",100000]],"cr":[["普通預金",100000]],"exp":"中間納付は、年税額が決まるまで「仮払法人税等」（資産）にしておく。"},{"id":"j3_25","lv":"3級","tag":"税金","q":"決算日。当期の法人税等が250,000円と計算された。中間納付額は100,000円。","dr":[["法人税、住民税及び事業税",250000]],"cr":[["仮払法人税等",100000],["未払法人税等",150000]],"exp":"年税額を費用にし、中間納付分を差し引いた残りを「未払法人税等」にする。"},{"id":"j3_26","lv":"3級","tag":"税金","q":"決算日。仮受消費税は80,000円、仮払消費税は50,000円だった（税抜方式）。","dr":[["仮受消費税",80000]],"cr":[["仮払消費税",50000],["未払消費税",30000]],"exp":"預かった消費税から払った消費税を差し引いた額を、納める義務として「未払消費税」にする。"},{"id":"j3_27","lv":"3級","tag":"純資産","q":"株主総会で、繰越利益剰余金から100,000円の配当と、10,000円の利益準備金の積立てが決まった。","dr":[["繰越利益剰余金",110000]],"cr":[["未払配当金",100000],["利益準備金",10000]],"exp":"配当はすぐには支払わないので「未払配当金」（負債）。積み立てた利益準備金は純資産の中で移るだけ。"},{"id":"j3_28","lv":"3級","tag":"純資産","q":"決算で、損益勘定で計算した当期純利益300,000円を振り替えた。","dr":[["損益",300000]],"cr":[["繰越利益剰余金",300000]],"exp":"当期純利益は、純資産の「繰越利益剰余金」に振り替えられる。"},{"id":"j3_29","lv":"3級","tag":"純資産","q":"会社の設立にあたり、株式100株を1株50,000円で発行し、払込金が普通預金に入金された。","dr":[["普通預金",5000000]],"cr":[["資本金",5000000]],"exp":"3級では払込金額の全額を「資本金」にする。"},{"id":"j3_30","lv":"3級","tag":"仮勘定","q":"内容不明の入金として処理していた50,000円は、得意先からの売掛金の回収と判明した。","dr":[["仮受金",50000]],"cr":[["売掛金",50000]],"exp":"内容がわかったら、仮受金を正しい科目に振り替える。"},{"id":"j3_31","lv":"3級","tag":"借入","q":"約束手形を振り出して200,000円を借り入れ、利息4,000円を差し引いた残額が当座預金に入金された。","dr":[["当座預金",196000],["支払利息",4000]],"cr":[["手形借入金",200000]],"exp":"お金を借りるために振り出した手形は、買掛金の支払いの手形とは区別して「手形借入金」。"},{"id":"j3_32","lv":"3級","tag":"決算","q":"決算日。通信費で処理した郵便切手のうち3,000円分が未使用で残っていた。","dr":[["貯蔵品",3000]],"cr":[["通信費",3000]],"exp":"未使用の切手や収入印紙は、決算で資産の「貯蔵品」に振り替える。"},{"id":"j3_33","lv":"3級","tag":"税金","q":"固定資産税40,000円を現金で納付した。","dr":[["租税公課",40000]],"cr":[["現金",40000]],"exp":"固定資産税や印紙税など、費用になる税金は「租税公課」。法人税等とは区別する。"},{"id":"j3_34","lv":"3級","tag":"売上","q":"商品50,000円を掛けで販売し、当社負担の送料2,000円を現金で支払った。","dr":[["売掛金",50000],["発送費",2000]],"cr":[["売上",50000],["現金",2000]],"exp":"当社が負担する送料は費用の「発送費」。"},{"id":"j3_35","lv":"3級","tag":"売上","q":"商品100,000円をクレジット払いで販売した。信販会社への手数料は2%で、販売時に計上する。","dr":[["クレジット売掛金",98000],["支払手数料",2000]],"cr":[["売上",100000]],"exp":"信販会社に対する債権は「クレジット売掛金」。手数料を差し引いた額で計上する。"},{"id":"j3_36","lv":"3級","tag":"売上","q":"掛けで売り上げた商品のうち5,000円分が品違いで返品された。","dr":[["売上",5000]],"cr":[["売掛金",5000]],"exp":"返品は売上の取り消し。売上と売掛金を減らす。"},{"id":"j2_01","lv":"2級","tag":"有価証券","q":"売買目的でA社株式100株を1株1,000円で購入し、手数料2,000円とともに代金は後日支払うことにした。","dr":[["売買目的有価証券",102000]],"cr":[["未払金",102000]],"exp":"手数料は取得原価に含める。有価証券の購入代金の未払いは「未払金」。"},{"id":"j2_02","lv":"2級","tag":"有価証券","q":"決算日。売買目的有価証券（帳簿価額102,000円）の時価は110,000円だった。","dr":[["売買目的有価証券",8000]],"cr":[["有価証券評価益",8000]],"exp":"売買目的有価証券は時価で評価し、差額は当期の損益にする。"},{"id":"j2_03","lv":"2級","tag":"有価証券","q":"決算日。その他有価証券（取得原価200,000円）の時価は230,000円だった（全部純資産直入法、税効果は考えない）。","dr":[["その他有価証券",30000]],"cr":[["その他有価証券評価差額金",30000]],"exp":"その他有価証券の評価差額は損益ではなく、純資産の「その他有価証券評価差額金」に直接入れる。"},{"id":"j2_04","lv":"2級","tag":"有価証券","q":"決算日。満期保有目的で額面1,000,000円の社債を980,000円で取得している（満期まで5年）。償却原価法（定額法）で当期の1年分を処理する。","dr":[["満期保有目的債券",4000]],"cr":[["有価証券利息",4000]],"exp":"額面との差額20,000円を5年で配分し、毎年4,000円ずつ帳簿価額を増やして利息として計上する。"},{"id":"j2_05","lv":"2級","tag":"商品","q":"決算日。帳簿棚卸数量100個、実地棚卸数量95個、原価@500円、正味売却価額@450円。棚卸減耗損と商品評価損を計上する。","dr":[["棚卸減耗損",2500],["商品評価損",4750]],"cr":[["繰越商品",7250]],"exp":"棚卸減耗損＝(100－95)個×500円＝2,500円。商品評価損＝95個×(500－450)円＝4,750円。"},{"id":"j2_06","lv":"2級","tag":"リース","q":"備品をリース契約（ファイナンス・リース、リース料は年120,000円×5年）で借り受けた。利子込み法で処理する。","dr":[["リース資産",600000]],"cr":[["リース債務",600000]],"exp":"ファイナンス・リースは買ったのと同じように扱う（売買処理）。利子込み法ではリース料総額で計上する。"},{"id":"j2_07","lv":"2級","tag":"固定資産","q":"決算日。自社利用のソフトウェア（取得原価500,000円、5年で定額法）を1年分償却する。","dr":[["ソフトウェア償却",100000]],"cr":[["ソフトウェア",100000]],"exp":"無形固定資産は累計額を使わず、直接減らす（直接法）。"},{"id":"j2_08","lv":"2級","tag":"固定資産","q":"国庫補助金300,000円を受け取って機械装置を取得した。補助金相当額の圧縮記帳（直接減額方式）を行う。","dr":[["固定資産圧縮損",300000]],"cr":[["機械装置",300000]],"exp":"補助金の受贈益に一度に税金がかからないよう、資産の帳簿価額を減らして費用（圧縮損）を立てる。"},{"id":"j2_09","lv":"2級","tag":"外貨","q":"商品10,000ドルを掛けで輸入した。取引時の為替相場は1ドル150円。","dr":[["仕入",1500000]],"cr":[["買掛金",1500000]],"exp":"外貨建ての取引は、取引した日の為替相場で円に換算する。"},{"id":"j2_10","lv":"2級","tag":"外貨","q":"輸入時（1ドル150円）に計上した買掛金10,000ドル（帳簿価額1,500,000円）を、1ドル155円のときに普通預金から支払った。","dr":[["買掛金",1500000],["為替差損益",50000]],"cr":[["普通預金",1550000]],"exp":"円安で支払額が50,000円増えた。差額は「為替差損益」（この場合は損）。"},{"id":"j2_11","lv":"2級","tag":"税効果","q":"決算日。貸倒引当金のうち100,000円が税務上損金に算入されなかった。法定実効税率は30%。","dr":[["繰延税金資産",30000]],"cr":[["法人税等調整額",30000]],"exp":"将来、税金が減る効果（将来減算一時差異×税率）を資産として計上する。"},{"id":"j2_12","lv":"2級","tag":"引当金","q":"決算日。翌期に支給する賞与のうち当期負担分200,000円を引当金として計上する。","dr":[["賞与引当金繰入",200000]],"cr":[["賞与引当金",200000]],"exp":"当期の働きに対応する賞与は、支払いが翌期でも当期の費用にする。"},{"id":"j2_13","lv":"2級","tag":"引当金","q":"決算日。当期の退職給付費用は150,000円と計算された。","dr":[["退職給付費用",150000]],"cr":[["退職給付引当金",150000]],"exp":"将来支払う退職金のうち当期に発生した分を、毎期少しずつ費用と引当金にする。"},{"id":"j2_14","lv":"2級","tag":"引当金","q":"機械の修繕を行い、修繕費80,000円を普通預金から支払った。前期末に修繕引当金100,000円を計上している。","dr":[["修繕引当金",80000]],"cr":[["普通預金",80000]],"exp":"引当金を設定していた支出は、費用ではなく引当金を取り崩す。"},{"id":"j2_15","lv":"2級","tag":"純資産","q":"配当1,000,000円を決めた。資本金10,000,000円、資本準備金1,000,000円、利益準備金1,200,000円。会社法の規定どおり利益準備金を積み立てる。","dr":[["繰越利益剰余金",1100000]],"cr":[["未払配当金",1000000],["利益準備金",100000]],"exp":"積立額は「配当の1/10」と「資本金の1/4－準備金合計」の小さいほう。100,000円と300,000円なので100,000円。"},{"id":"j2_16","lv":"2級","tag":"手形","q":"受取手形200,000円を銀行で割り引き、割引料3,000円を差し引いた残額が当座預金に入金された。","dr":[["当座預金",197000],["手形売却損",3000]],"cr":[["受取手形",200000]],"exp":"手形の割引は手形の売却とみなし、割引料は「手形売却損」。"},{"id":"j2_17","lv":"2級","tag":"手形","q":"仕入先への買掛金100,000円の支払いのため、得意先から受け取っていた約束手形を裏書譲渡した。","dr":[["買掛金",100000]],"cr":[["受取手形",100000]],"exp":"裏書譲渡で、持っていた手形が減り、買掛金が消える。"},{"id":"j2_18","lv":"2級","tag":"手形","q":"電子記録債権150,000円を取引銀行に140,000円で譲渡し、代金は普通預金に入金された。","dr":[["普通預金",140000],["電子記録債権売却損",10000]],"cr":[["電子記録債権",150000]],"exp":"額面より安く譲渡した差額は「電子記録債権売却損」。"},{"id":"j2_19","lv":"2級","tag":"固定資産","q":"建設中の本社建物の代金の一部2,000,000円を普通預金から支払った。","dr":[["建設仮勘定",2000000]],"cr":[["普通預金",2000000]],"exp":"完成前に支払った建設代金は「建設仮勘定」にためておく。完成するまで減価償却はしない。"},{"id":"j2_20","lv":"2級","tag":"固定資産","q":"本社建物（総額5,000,000円）が完成して引き渡された。建設仮勘定2,000,000円を振り替え、残額は月末に支払う。","dr":[["建物",5000000]],"cr":[["建設仮勘定",2000000],["未払金",3000000]],"exp":"完成したら建設仮勘定を本来の科目（建物）に振り替える。"},{"id":"j2_21","lv":"2級","tag":"収益認識","q":"商品の注文を受け、代金の一部50,000円を前もって現金で受け取った。","dr":[["現金",50000]],"cr":[["契約負債",50000]],"exp":"商品を引き渡す前に受け取った対価は、収益認識基準では「契約負債」（3級では前受金）。"},{"id":"j2_22","lv":"2級","tag":"連結","q":"P社はS社の株式100%を800,000円で取得した。S社の資本金は500,000円、利益剰余金は300,000円。投資と資本を相殺する。","dr":[["資本金",500000],["利益剰余金",300000]],"cr":[["子会社株式",800000]],"exp":"親会社の投資（子会社株式）と、子会社の資本を消し合う。グループ内の出資は外から見ると存在しないため。"},{"id":"j2_23","lv":"2級","tag":"連結","q":"P社はS社の株式80%を700,000円で取得した。S社の資本金は500,000円、利益剰余金は300,000円。","dr":[["資本金",500000],["利益剰余金",300000],["のれん",60000]],"cr":[["子会社株式",700000],["非支配株主持分",160000]],"exp":"S社の資本800,000円のうち20%（160,000円）は非支配株主のもの。親会社持分640,000円と投資700,000円の差額60,000円が「のれん」。"},{"id":"j2_24","lv":"2級","tag":"固定資産","q":"備品（取得原価400,000円、減価償却累計額360,000円）を除却した。処分価値は10,000円と見積もられた。","dr":[["備品減価償却累計額",360000],["貯蔵品",10000],["固定資産除却損",30000]],"cr":[["備品",400000]],"exp":"帳簿価額40,000円のうち、処分価値10,000円は「貯蔵品」、残り30,000円が除却損。"},{"id":"j2_25","lv":"2級","tag":"固定資産","q":"火災で倉庫（取得原価1,000,000円、減価償却累計額400,000円）が焼失した。保険契約があり、保険金額は確定していない。","dr":[["建物減価償却累計額",400000],["未決算",600000]],"cr":[["建物",1000000]],"exp":"保険金の額が決まるまで、帳簿価額を「未決算」にしておく。"},{"id":"j2_26","lv":"2級","tag":"本支店","q":"本店は、支店に現金100,000円を送った。本店の仕訳。","dr":[["支店",100000]],"cr":[["現金",100000]],"exp":"本店の帳簿では、支店への送金は「支店」勘定（支店への貸し）で記録する。支店側は「本店」勘定。"}],"mc2":[{"id":"m3_01","lv":"3級","tag":"試算表","q":"試算表では見つけられない誤りはどれ？","choices":["借方だけ転記した","金額を貸借で違えて転記した","勘定科目を取り違えて仕訳した","片方の金額を転記もれした"],"a":2,"exp":"貸借の金額が同じなら試算表の合計は一致してしまう。科目の取り違えや、仕訳そのものの漏れは見つけられない。"},{"id":"m3_02","lv":"3級","tag":"決算","q":"売上原価の計算として正しいものは？","choices":["期首商品＋当期仕入－期末商品","期末商品＋当期仕入－期首商品","当期仕入－期首商品","売上高－当期仕入"],"a":0,"exp":"売った商品の原価＝はじめにあった在庫＋買った分－残った在庫。"},{"id":"m3_03","lv":"3級","tag":"決算","q":"貸倒引当金は、貸借対照表でどう表示される？","choices":["負債の部に表示する","売掛金などから差し引く形で表示する","純資産の部に表示する","表示しない"],"a":1,"exp":"貸倒引当金は資産のマイナスを表す「評価勘定」。債権から控除して表示する。"},{"id":"m3_04","lv":"3級","tag":"帳簿","q":"得意先ごとの売掛金の明細を記録する帳簿は？","choices":["仕訳帳","総勘定元帳","売掛金元帳（得意先元帳）","現金出納帳"],"a":2,"exp":"売掛金元帳は補助元帳のひとつ。総勘定元帳の売掛金の合計と一致する。"},{"id":"m3_05","lv":"3級","tag":"伝票","q":"3伝票制で使う伝票の組み合わせは？","choices":["入金伝票・出金伝票・振替伝票","売上伝票・仕入伝票・振替伝票","入金伝票・出金伝票・仕入伝票","現金伝票・預金伝票・振替伝票"],"a":0,"exp":"現金の入金、出金、それ以外の取引の3つに分けて記録する。"},{"id":"m3_06","lv":"3級","tag":"固定資産","q":"定額法の減価償却費の計算式は？","choices":["（取得原価－残存価額）÷耐用年数","取得原価×耐用年数","帳簿価額×償却率÷2","取得原価÷残存価額"],"a":0,"exp":"毎年同じ額を費用にする方法。期中に取得したら月割りで計算する。"},{"id":"m3_07","lv":"3級","tag":"経過勘定","q":"前払費用・前受収益・未払費用・未収収益をまとめて何という？","choices":["仮勘定","経過勘定","評価勘定","統制勘定"],"a":1,"exp":"費用と収益を正しい期間に配分するための科目。決算で設定し、翌期首に再振替する。"},{"id":"m3_08","lv":"3級","tag":"財務諸表","q":"損益計算書に表示されないものはどれ？","choices":["売上原価","減価償却費","繰越利益剰余金","支払利息"],"a":2,"exp":"繰越利益剰余金は純資産なので貸借対照表に表示する。"},{"id":"m2_01","lv":"2級","tag":"収益認識","q":"収益認識の5つのステップの最初はどれ？","choices":["履行義務の識別","取引価格の算定","顧客との契約の識別","収益の認識"],"a":2,"exp":"①契約の識別 ②履行義務の識別 ③取引価格の算定 ④取引価格の配分 ⑤履行義務の充足による収益の認識。"},{"id":"m2_02","lv":"2級","tag":"連結","q":"連結貸借対照表で、非支配株主持分はどこに表示する？","choices":["負債の部","純資産の部","資産の部","注記のみ"],"a":1,"exp":"子会社の資本のうち親会社以外の株主の持分。純資産の部に表示する。"},{"id":"m2_03","lv":"2級","tag":"税効果","q":"税効果会計の対象にならないものはどれ？","choices":["貸倒引当金の損金算入限度超過額","減価償却費の償却限度超過額","交際費の損金不算入額","その他有価証券の評価差額"],"a":2,"exp":"交際費の損金不算入は将来も解消しない「永久差異」なので対象外。"},{"id":"m2_04","lv":"2級","tag":"リース","q":"ファイナンス・リース取引の借り手の会計処理は？","choices":["賃貸借処理","売買処理","処理しない","注記のみ"],"a":1,"exp":"実質的に購入と同じなので、リース資産とリース債務を計上する。"},{"id":"m2_05","lv":"2級","tag":"有価証券","q":"子会社株式・関連会社株式の期末の評価は？","choices":["時価で評価し差額は損益","時価で評価し差額は純資産","取得原価のまま（著しい下落時を除く）","償却原価法"],"a":2,"exp":"売却目的ではないので原則として取得原価で評価する。"},{"id":"m2_06","lv":"2級","tag":"工業簿記","q":"製造原価を形態別に分けた3つの要素は？","choices":["材料費・労務費・経費","直接費・間接費・販売費","固定費・変動費・準変動費","売上原価・販売費・一般管理費"],"a":0,"exp":"工業簿記の基本。さらにそれぞれを製品に直接結びつく直接費と、それ以外の間接費に分ける。"},{"id":"m2_07","lv":"2級","tag":"銀行勘定調整","q":"銀行勘定調整表で、当社の帳簿残高を修正する必要があるものは？","choices":["時間外預入","未取付小切手","連絡未通知の振込入金","未取立小切手"],"a":2,"exp":"入金の連絡が来ていなかったものは当社の記帳もれなので、帳簿を修正する。時間外預入や未取付小切手は銀行側のタイミングのずれ。"},{"id":"mp_01","lv":"実務","tag":"税金の期限","q":"法人税の確定申告の期限（延長の特例を受けていない場合）は？","choices":["事業年度終了の日の翌日から1か月以内","事業年度終了の日の翌日から2か月以内","事業年度終了の日の翌日から3か月以内","翌年3月15日"],"a":1,"exp":"原則2か月以内。会計監査人の監査などで決算が確定しない場合は、延長の特例で1か月延ばせる。"},{"id":"mp_02","lv":"実務","tag":"インボイス","q":"適格請求書発行事業者の登録番号の形式は？","choices":["T＋13桁の数字","J＋10桁の数字","法人番号の下8桁","12桁の数字のみ"],"a":0,"exp":"法人なら「T＋法人番号（13桁）」。取引先が登録事業者かどうかは国税庁の公表サイトで確認できる。"},{"id":"mp_03","lv":"実務","tag":"電子帳簿保存法","q":"メールで受け取ったPDFの請求書（電子取引）の保存方法として正しいのは？","choices":["印刷して紙で保存すればよい","電子データのまま、検索できる状態で保存する","受け取ったら削除してよい","取引先が保存するので不要"],"a":1,"exp":"電子取引のデータは、電子のまま保存するのが原則。改ざん防止と、日付・金額・取引先で検索できることが求められる。"},{"id":"mp_04","lv":"実務","tag":"印紙税","q":"売上代金の領収書（受取書）で、印紙税がかからないのはいくら未満？","choices":["1万円未満","3万円未満","5万円未満","10万円未満"],"a":2,"exp":"記載金額が5万円未満の受取書は非課税。電子で発行した領収書には印紙税はかからない。"},{"id":"mp_05","lv":"実務","tag":"交際費","q":"取引先との飲食費のうち、交際費から除いて会議費などで処理できるのは1人あたりいくら以下？（2024年4月以降の支出）","choices":["5,000円以下","10,000円以下","20,000円以下","金額の基準はない"],"a":1,"exp":"2024年4月以降の支出から、1人あたり10,000円以下の飲食費は一定の記録を残せば交際費から除外できる（社内の人だけの飲食は対象外）。"},{"id":"mp_06","lv":"実務","tag":"固定資産","q":"取得価額が10万円以上20万円未満の資産について、選べる処理は？","choices":["必ず耐用年数で減価償却","一括償却資産として3年で均等に償却できる","全額をその年の費用にしなければならない","資産に計上できない"],"a":1,"exp":"10万円未満は全額費用にできる。20万円未満は一括償却資産として3年で均等に償却する方法も選べる。"},{"id":"mp_07","lv":"実務","tag":"給与","q":"住民税の特別徴収（給与から天引き）は、いつからいつまでの12回？","choices":["1月〜12月","4月〜翌年3月","6月〜翌年5月","10月〜翌年9月"],"a":2,"exp":"前年の所得に対する住民税を、6月から翌年5月までの給与で天引きする。納付は原則、翌月10日まで。"},{"id":"mp_08","lv":"実務","tag":"給与","q":"年末調整を行う時期として一般的なのは？","choices":["1月の最初の給与","6月の賞与","12月の最後の給与（または賞与）","3月の確定申告と同時"],"a":2,"exp":"その年最後の給与で1年間の所得税を精算する。扶養控除等申告書や保険料控除の書類を事前に集める。"},{"id":"mp_09","lv":"実務","tag":"上場会社","q":"上場会社の決算短信の開示時期として、取引所が求めているのは？","choices":["期末後45日以内（30日以内がより望ましい）","期末後3か月以内","株主総会の後","期末後10日以内"],"a":0,"exp":"決算短信は45日以内の開示が要請され、30日以内がより望ましいとされる。有価証券報告書は期末後3か月以内に提出する。"},{"id":"mp_10","lv":"実務","tag":"保存期間","q":"法人税法上、帳簿や請求書などの保存期間は原則何年？","choices":["3年","5年","7年","永久"],"a":2,"exp":"原則7年。欠損金（赤字）が出た事業年度は10年。会社法では会計帳簿は10年保存。"},{"id":"mp_11","lv":"実務","tag":"法定調書","q":"報酬や給与の支払調書・源泉徴収票（法定調書）の提出期限は？","choices":["12月31日","1月31日","3月15日","5月31日"],"a":1,"exp":"前年分を1月31日までに税務署へ提出する。償却資産の申告（市町村）も1月31日まで。"},{"id":"mp_12","lv":"実務","tag":"月次決算","q":"月次決算を早く締めるために、最も効果が大きいことが多いのは？","choices":["締め日を延ばす","営業部などからの請求書・データの提出期限を決めて守ってもらう","全部手作業で確認する","試算表を作らない"],"a":1,"exp":"経理だけでは早くならない。他部署からの情報が遅れると全体が遅れるので、提出期限のルール化が効く。"},{"id":"mp_13","lv":"実務","tag":"消費税","q":"消費税の「仕入税額控除」を受けるために、原則として保存が必要なものは？","choices":["見積書","適格請求書（インボイス）と帳簿","注文書","納品書のみ"],"a":1,"exp":"インボイス制度では、適格請求書などの保存と帳簿の記載が必要（少額の特例などを除く）。"},{"id":"mp_14","lv":"実務","tag":"源泉徴収","q":"個人のデザイナーに報酬110,000円（税込、消費税額は区分して記載）を支払う。源泉徴収税額は？","choices":["10,210円","11,231円","0円","22,462円"],"a":0,"exp":"消費税が区分されていれば税抜100,000円×10.21%＝10,210円。100万円を超える部分は20.42%。"}]};

/* ═════════ 演出（パーティクル・波紋・カウントアップ） ═════════ */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX = (() => {
  const c = document.createElement('canvas'); c.id = 'fx'; document.body.append(c);
  const x = c.getContext('2d'), P = []; let W, H, dpr, raf = 0;
  const size = () => { dpr = Math.min(2, devicePixelRatio || 1); W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; };
  size(); addEventListener('resize', size);
  const loop = () => {
    x.clearRect(0, 0, W, H);
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; if (--p.life <= 0) { P.splice(i, 1); continue; }
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy;
      const a = Math.min(1, p.life / p.max * 1.5); x.globalAlpha = a; x.fillStyle = x.strokeStyle = p.col;
      if (p.k === 'rect') { x.save(); x.translate(p.x, p.y); x.rotate(p.r += p.vr); x.fillRect(-p.s, -p.s / 2, p.s * 2, p.s); x.restore(); }
      else if (p.k === 'ring') { x.lineWidth = 3 * dpr; x.beginPath(); x.arc(p.x, p.y, (p.max - p.life) * p.s, 0, 7); x.stroke(); }
      else { x.shadowColor = p.col; x.shadowBlur = 8 * dpr; x.beginPath(); x.arc(p.x, p.y, p.s * (.4 + a * .6), 0, 7); x.fill(); x.shadowBlur = 0; }
    }
    x.globalAlpha = 1; raf = P.length ? requestAnimationFrame(loop) : 0;
  };
  const add = p => { P.push(p); if (!raf) raf = requestAnimationFrame(loop); };
  return {
    burst(px, py, col = '#F6D88E', n = 24, sp = 7) { if (REDUCE) return; for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = (Math.random() * .8 + .2) * sp * dpr; add({ x:px * dpr, y:py * dpr, vx:Math.cos(a) * v, vy:Math.sin(a) * v, g:.12 * dpr, drag:.92, life:36 + Math.random() * 20, max:56, s:(2 + Math.random() * 3) * dpr, col }); } add({ x:px * dpr, y:py * dpr, vx:0, vy:0, g:0, drag:1, life:22, max:22, s:3.4 * dpr, col, k:'ring' }); },
    confetti(n = 120) { if (REDUCE) return; const cs = ['#F1C76A','#FF5A3C','#38D6A4','#7FB2FF','#C9A6FF','#FFFFFF']; for (let i = 0; i < n; i++) add({ x:W / 2 + (Math.random() - .5) * W * .4, y:H * .3, vx:(Math.random() - .5) * 16 * dpr, vy:(-Math.random() * 14 - 5) * dpr, g:.4 * dpr, drag:.985, life:110 + Math.random() * 40, max:150, s:(3 + Math.random() * 4) * dpr, col:cs[i % cs.length], k:'rect', r:Math.random() * 6, vr:(Math.random() - .5) * .3 }); },
    beam(a, b, col = '#F6D88E') { return new Promise(res => { if (REDUCE) return res(); const n = 16; for (let i = 0; i < n; i++) setTimeout(() => { const t = i / n, bend = Math.sin(t * Math.PI) * 40; add({ x:(a.x + (b.x - a.x) * t + bend) * dpr, y:(a.y + (b.y - a.y) * t) * dpr, vx:(Math.random() - .5) * dpr, vy:(Math.random() - .5) * dpr, g:0, drag:.9, life:16, max:16, s:(6 - t * 2) * dpr, col }); }, i * 11); setTimeout(res, n * 11 + 10); }); },
  };
})();
const center = el => { const r = el.getBoundingClientRect(); return { x:r.left + r.width / 2, y:r.top + r.height / 2 }; };
function tickUp(el, to, ms = 900) { const t0 = performance.now(); const f = t => { const k = Math.min(1, (t - t0) / ms), v = Math.round(to * (1 - Math.pow(1 - k, 3))); el.textContent = '+' + yen(v); if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }

  if (o.then) await run(o.then);
  await note(((o.point || point) ? `<div class="point">${esc(o.point || point)}</div>` : '') + fxHtml(o.fx));
  return i;
}

async function incident(tag) {
  const e = EV[tag], who0 = SPEAKER[tag] || 'akeno', who = P[who0].ch ? who0 : 'sumiya';
  await say(who0, who0 === 'narr' ? e.text : e.text.replace(/^[^「]*「/, '「'));
  const order = shuffle(e.choices.map((_, i) => i));
  const pick = order[await choose(order.map(i => ({ t:e.choices[i][0] })))];

const epDone = id => G.story.includes(id);
const chapsCleared = () => Math.min(6, ['e5', 'e10', 'e15', 'e20', 'e25', 'e30'].filter(epDone).length);
const nextEp = () => EPISODES.find(e => !epDone(e.id));
async function playEpisode(ep) {
  VN.skip = false;
  const r = await ep.run();
  if (r && r.win === false) { await result({ win:false, sub:`${ep.no}「${ep.title}」`, missed:r.missed, next:'もう一度挑戦する' }); return playEpisode(ep); }
  const first = !epDone(ep.id);
  if (first) { G.story.push(ep.id); G.daily.m.story++; }
  await result({ title:'エピソードクリア', sub:`${ep.no}「${ep.title}」`, stars:r && r.stars, missed:r && r.missed, ...(first ? ep.rew : { exp:10, coins:100 }), next:'次へ' });
  if (ep.id === 'e1' && !G.tutScout) await tutorialScout();
  if (ep.id === 'e35' && first) return ending();
  go('home');
}

const RATES = { 5:3, 4:17, 3:80 };
const PITY = 60;
function pull(n, guarantee4) {
  const out = [];
  for (let i = 0; i < n; i++) {
    G.pity++;
    const r = Math.random() * 100; let rar = r < RATES[5] ? 5 : r < RATES[5] + RATES[4] ? 4 : 3;
    if (G.pity >= PITY) rar = 5;
    if (guarantee4 && i === n - 1 && !out.some(c => CARD[c].r >= 4) && rar < 4) rar = 4;
    let pool = CARDS.filter(c => c.r === rar);
    if (rar === 5 && Math.random() < .5) pool = pool.filter(c => c.pickup);
    if (rar === 5) G.pity = 0;
    out.push(rnd(pool).id);
  }
  return out;
}
function addCards(ids) {
  const isNew = {};
  ids.forEach(id => { if (G.cards[id]) G.cards[id].dup = Math.min(5, G.cards[id].dup + 1); else { G.cards[id] = { lv:1, dup:0 }; isNew[id] = true; } });

  save(); return isNew;
}

  const rank = !r.win ? 'D' : score >= 95 ? 'S' : score >= 80 ? 'A' : score >= 65 ? 'B' : 'C';
  const mult = { S:2, A:1.6, B:1.3, C:1, D:.4 }[rank];

  if (r.win) G.daily.m.run++;

}

function tabs(on) {

      : `<button class="tab ${on === k ? 'on' : ''}" data-tab="${k}">${ICON[k]}${l}${dot ? '<span class="dot"></span>' : ''}</button>`; }).join('')}</nav>`;

function bindTabs() { document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { sfx('tap'); go(b.dataset.tab); }); const so = $('#soBtn'); if (so) so.onclick = () => go('scout'); }

const LB = [[50,'SO'],[300,'円'],[50,'SO'],[3,'研修資料'],[50,'SO'],[500,'円'],[150,'SO']];
function loginBonus() {
  const t = today(); if (G.login.last === t) return false;
  const y = new Date(Date.now() - 864e5), ys = `${y.getFullYear()}-${y.getMonth() + 1}-${y.getDate()}`;
  G.login.streak = G.login.last === ys ? G.login.streak + 1 : 1; G.login.last = t; G.login.total++;
  const day = ((G.login.total - 1) % 7) + 1, [rew, kind] = LB[day - 1];
  if (kind === 'SO') G.so += rew; else if (kind === '円') G.coins += rew; else G.mats += rew;

  modal(`<h2>ログインボーナス</h2><p class="muted small">${G.login.total}日目　連続 ${G.login.streak}日</p>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:12px 0">${LB.map(([r, k], i) => `<div style="text-align:center; font-size:.6rem; padding:6px 0; border-radius:8px; background:${i + 1 === day ? 'var(--gold)' : i + 1 < day ? 'var(--panel2)' : 'var(--panel)'}; color:${i + 1 === day ? '#2A1D05' : 'var(--muted)'}">${i + 1}日<br><b>${r}</b><br>${k === '研修資料' ? '資料' : k}</div>`).join('')}</div>
    <p style="text-align:center"><b style="color:var(--gold); font-size:1.2rem">${kind} +${rew}</b></p><button class="btn gold" id="lbok">受け取る</button>`, m => $('#lbok', m).onclick = () => { m.remove(); render(); });

}
const MISSIONS = [{ k:'story', t:'ストーリーを1話クリア', n:1, so:50 }, { k:'run', t:'月次決算ランをクリア', n:1, so:50 }, { k:'scout', t:'スカウトを1回する', n:1, so:30 }];

  const ep = nextEp(), hc = G.party[0] && CARD[G.party[0]] ? CARD[G.party[0]].char : G.home;

  $('#app').innerHTML = hud() + `<div class="home"><div class="bgx"></div><div class="dust"></div><div class="stand" id="stand">${portrait(hc)}</div><button class="tapzone" id="tz" aria-label="${esc(P[hc].name)}に話しかける"></button>

      <button class="lbanner" data-go="scout" style="--c1:#5A2414; --c2:#1E1026">${face('akeno') ? `<img src="${face('akeno')}" alt="">` : ''}<span>${free ? '無料1回' : 'ピックアップ'}</span><b>辞令封筒</b>${free ? '<span class="dot" style="top:6px; right:6px"></span>' : ''}</button>

      <div class="bsstrip glass">${STAT.map(([k, l, c]) => `<div><span>${l}</span><i><s style="width:0; background:var(${c})" data-w="${G.stat[k]}"></s></i></div>`).join('')}</div>
      <button class="story-cta shine" id="cta"><span><span class="k">${ep ? `STORY　${CHAPS[ep.ch - 1].no}「${CHAPS[ep.ch - 1].title}」` : 'STORY'}</span><b>${ep ? `${ep.no}「${ep.title}」` : 'エンディング'}</b><span class="small muted">${ep ? esc(ep.desc) : '終章「貸借一致」をもう一度見る'}</span></span><span class="go">PLAY</span></button>

  const home = $('.home'), stand = $('#stand');
  home.onpointermove = e => { const r = home.getBoundingClientRect(); const dx = (e.clientX - r.left) / r.width - .5, dy = (e.clientY - r.top) / r.height - .5; stand.style.transform = `translate(${-dx * 14}px,${-dy * 8}px)`; };
  $('#tz').onclick = () => { sfx('tap'); const old = $('.bubble'); if (old) old.remove(); const d = document.createElement('div'); d.className = 'bubble'; d.innerHTML = `<b>${esc(P[hc].name)}</b><span></span>`; home.append(d); const t = rnd(HOME_LINES[hc] || ['……']); let k = 0; const sp = d.querySelector('span'); const iv = setInterval(() => { sp.textContent = t.slice(0, ++k); if (k >= t.length) clearInterval(iv); }, 35); setTimeout(() => d.remove(), 3600); };
  if (G.tutScout) loginBonus();
}
function missionModal() {
  modal(`<h2>デイリーミッション</h2><p class="muted small">毎日0時に更新</p>${MISSIONS.map(m => { const v = Math.min(m.n, G.daily.m[m.k]), got = G.daily.claimed.includes(m.k);
    return `<div class="mis"><span class="t">${m.t}<i><s style="width:${v / m.n * 100}%"></s></i></span><button class="claim" data-k="${m.k}" ${v < m.n || got ? 'disabled' : ''}>${got ? '受取済' : 'SO ' + m.so}</button></div>`; }).join('')}`, md => {

  });

/* ストーリー一覧 */

    ${epDone('e35') ? `<button class="chaphead" id="endBtn" style="--c1:#5A4214; width:100%; text-align:left"><span>FINAL</span><b>終章「貸借一致」</b><span style="font-family:var(--f-body)">エンディングをもう一度見る</span></button>` : ''}

}

/* スカウト */
function viewScout() {
  const free = Date.now() >= G.freeTs;
  $('#app').innerHTML = hud() + `<div class="scroll side"><div class="sec">スカウト <small>辞令封筒</small></div>
    <div class="banner">${face('akeno') ? `<img src="${face('akeno')}" alt="">` : ''}<div class="t"><span>ピックアップ</span><b>★5「8月の第1週」<br>朱野志乃</b><p>試験前の1週間、彼女は誰とも話さない。</p></div></div>

    <details class="card rates" style="margin-top:8px"><summary class="small"><b>提供割合</b></summary><table><tr><td>★5</td><td>${RATES[5]}%（うちピックアップ ${RATES[5] / 2}%）</td></tr><tr><td>★4</td><td>${RATES[4]}%</td></tr><tr><td>★3</td><td>${RATES[3]}%</td></tr>

      <button class="card" data-buy="pass" style="display:flex; justify-content:space-between; align-items:center; text-align:left"><span><b>月間パス</b><br><span class="small muted">30日間、毎日SO 60（合計1,800）</span></span><span class="chip" style="background:var(--gold); color:#2A1D05; font-weight:900">¥610</span></button></div>

  $('.scroll').addEventListener('click', e => { const b = e.target.closest('[data-buy]'); if (!b) return; const v = b.dataset.buy === 'pass' ? 60 : +b.dataset.buy; G.so += v; save(); sfx('win'); toast(`SO +${v}（デモ）`); go('scout'); });

function viewParty() {
  const own = Object.keys(G.cards).sort((a, b) => CARD[b].r - CARD[a].r);

}
function cardModal(id) {
  const c = CARD[id], o = G.cards[id], p = cardPow(id), canLv = o.lv < maxLv(c.r);
  modal(`<div style="display:grid; grid-template-columns:110px 1fr; gap:12px; align-items:start">${cardHtml(id)}<div><div class="small" style="color:var(--r${c.r})">${'★'.repeat(c.r)}</div><h2>「${esc(c.title)}」<br>${esc(P[c.char].name)}</h2><p class="small muted">「${esc(c.quote)}」</p></div></div>
    <div class="card small" style="margin-top:10px; line-height:1.8">Lv ${o.lv}/${maxLv(c.r)}　限界突破 ${o.dup}/5<br>攻撃力 ${p.atk}　必殺技の威力 ×${p.ult.toFixed(2)}<br><b>必殺技「${esc(SKILL[c.char].name)}」</b>：${esc(SKILL[c.char].desc)}<br>絆 Lv.${bondLv(c.char)}</div>
    <div style="display:grid; gap:8px; margin-top:10px"><button class="btn gold" id="lvup" ${canLv && G.mats >= 1 && G.coins >= 100 ? '' : 'disabled'}>研修する（資料1・100円で Lv+3）</button>
    <button class="btn dark" id="setp">${G.party.includes(id) ? '編成から外す' : '編成に入れる'}</button></div>`, m => {
    $('#lvup', m).onclick = () => { G.mats--; G.coins -= 100; o.lv = Math.min(maxLv(c.r), o.lv + 3); save(); sfx('ok'); m.remove(); cardModal(id); };
    $('#setp', m).onclick = () => { if (G.party.includes(id)) G.party = G.party.filter(x => x !== id); else { G.party = G.party.filter(x => CARD[x].char !== c.char); if (G.party.length >= 2) G.party.shift(); G.party.push(id); } save(); m.remove(); go('party'); };
  });
}

/* ═════════ ルーター ═════════ */
let VIEW = 'home';
function go(v) { VIEW = v; daily(); regen(); save(); ({ home:viewHome, story:viewStory, run:runSetup, scout:viewScout, party:viewParty })[v](); }
const render = () => go(VIEW);
function boot() { daily(); if (!G.cold) return coldOpen(); if (!G.tutScout && epDone('e1')) return tutorialScout().then(() => go('home')); go('home'); }
setInterval(() => { const b = document.querySelector('.cur.sta span:last-child'); if (b) { regen(); b.textContent = `${G.sta}/${staMax()}`; } }, 30000);
boot();
</script>
