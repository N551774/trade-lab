<title>バランスシート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 縦長スマホの1画面ゲーム。上に人生のバランスシート、中央に人物、下に台詞。バトルは上に業務（敵）、下にコマンド。 */
:root{
  --bg:#101318; --bg2:#171B22; --panel:#1D222B; --panel2:#262C37; --line:#323A47; --ink:#EEF0F3; --muted:#9AA3B1;
  --gold:#D9B45B; --shu:#E0563C; --green:#4FBF8F; --blue:#6A9BE0; --violet:#A98BE6;
  --work:#6A9BE0; --family:#E59A5A; --health:#4FBF8F; --money:#D9B45B;
  --f-head:"Noto Serif JP","Hiragino Mincho ProN",serif; --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); overscroll-behavior:none; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.app{max-width:480px; margin:0 auto; height:100%; position:relative; overflow:hidden; display:flex; flex-direction:column}
.side{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 人生のバランスシート */
.bs{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; padding-block:10px 8px; font-size:.72rem; border-bottom:1px solid var(--line); background:var(--bg2)}
.bs .t{grid-column:1/-1; display:flex; justify-content:space-between; color:var(--muted); letter-spacing:.08em}
.bs .t b{font-family:var(--f-head); color:var(--ink); letter-spacing:.04em}
.meter{display:grid; grid-template-columns:2.6em 1fr 2.2em; align-items:center; gap:6px}
.meter i{height:6px; border-radius:6px; background:var(--panel2); overflow:hidden; display:block}
.meter i s{display:block; height:100%; border-radius:6px; transition:width .6s}
.meter em{font-style:normal; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted)}
.meter.flash{animation:flash .8s}
@keyframes flash{30%{transform:scale(1.04); filter:brightness(1.6)}}

/* 舞台 */
.stage{flex:1; position:relative; overflow:hidden; background:var(--scene, linear-gradient(#1A2130,#101318))}
.stage::after{content:""; position:absolute; inset:0; background:linear-gradient(transparent 55%, rgba(0,0,0,.55)); pointer-events:none}
.place{position:absolute; top:10px; left:max(16px,env(safe-area-inset-left,0px)); z-index:3; font-size:.72rem; letter-spacing:.12em; color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.35); padding:4px 10px; border-radius:6px}
.who{position:absolute; inset:auto 0 0 0; height:88%; display:flex; justify-content:center; align-items:flex-end; z-index:1}
.who .por{height:100%; max-width:90%; transition:opacity .35s, transform .35s}
.who .por.in{animation:porIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes porIn{from{opacity:0; transform:translateY(16px)}}
.who img{height:100%; width:auto; max-width:none; object-fit:contain; object-position:bottom}
.who img.cg{-webkit-mask-image:radial-gradient(70% 62% at 50% 42%, #000 55%, transparent 100%); mask-image:radial-gradient(70% 62% at 50% 42%, #000 55%, transparent 100%)}
.chap-title{position:absolute; inset:0; z-index:5; display:grid; place-items:center; text-align:center; background:#000; animation:fadeOut 2.8s forwards; pointer-events:none}
.chap-title b{display:block; font-family:var(--f-head); font-size:2.6rem; letter-spacing:.3em; padding-left:.3em}
.chap-title span{color:var(--muted); font-size:.85rem; letter-spacing:.2em}
@keyframes fadeOut{0%,70%{opacity:1}100%{opacity:0}}

/* 台詞 */
.box{position:relative; min-height:178px; background:var(--panel); border-top:1px solid var(--line); padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}
.name{display:inline-block; font-family:var(--f-head); font-weight:900; font-size:1rem; padding:2px 12px 2px 10px; border-left:4px solid var(--c, var(--gold)); margin-bottom:6px}
.name small{font-family:var(--f-body); font-weight:400; color:var(--muted); font-size:.7rem; margin-left:8px}
.text{font-size:1.02rem; line-height:1.85; min-height:3.7em; white-space:pre-wrap}
.text.narr{color:#C9CED8; font-family:var(--f-head)}
.next{position:absolute; right:max(18px,env(safe-area-inset-right,0px)); bottom:calc(12px + env(safe-area-inset-bottom,0px)); color:var(--gold); font-size:.8rem; animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.choices{display:grid; gap:8px; margin-top:6px}
.choice{text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; line-height:1.55; font-size:.92rem; transition:background .15s}
.choice:hover{background:#2E3542}
.choice small{display:block; color:var(--muted); font-size:.72rem; margin-top:2px}
.tap{position:absolute; inset:0; z-index:2}
.effects{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.fx{font-size:.75rem; padding:2px 8px; border-radius:6px; background:var(--panel2)}
.fx.up{color:var(--green)} .fx.down{color:var(--shu)}
.point{margin-top:8px; font-size:.84rem; line-height:1.7; background:rgba(217,180,91,.1); border-left:3px solid var(--gold); padding:8px 10px; border-radius:6px; color:#E7DFC8}
input.nm{width:100%; font:inherit; font-size:1.1rem; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); margin:6px 0 10px}
.btn{display:block; width:100%; text-align:center; padding:14px; border-radius:12px; font-weight:700; background:var(--gold); color:#1A1408}
.btn.ghost{background:var(--panel2); color:var(--ink); border:1px solid var(--line)}

/* バトル */
.battle{flex:1; display:flex; flex-direction:column; overflow:hidden}
.enemy{position:relative; padding-block:14px 10px; background:radial-gradient(120% 90% at 50% 0%, #2A2230, var(--bg) 70%); text-align:center}
.enemy .card{display:inline-block; min-width:62%; max-width:100%; background:#F4F1E8; color:#1B1B1B; border-radius:6px; padding:14px 16px 12px; box-shadow:0 10px 30px rgba(0,0,0,.5);
  transform:rotate(-1.5deg); transition:transform .2s}
.enemy .card .k{font-size:.66rem; letter-spacing:.2em; color:#7A6F5A}
.enemy .card b{display:block; font-family:var(--f-head); font-size:1.25rem; margin:2px 0 4px}
.enemy .card p{margin:0; font-size:.75rem; color:#5A5448}
.enemy .card.hit{animation:hit .4s}
@keyframes hit{20%{transform:translateX(-10px) rotate(-4deg); filter:brightness(1.4)}60%{transform:translateX(8px) rotate(2deg)}}
.hp{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; font-size:.72rem; color:var(--muted); margin-top:10px}
.hp i{height:8px; border-radius:8px; background:var(--panel2); overflow:hidden; display:block}
.hp i s{display:block; height:100%; transition:width .5s; border-radius:8px}
.dmg{position:absolute; left:50%; top:40%; font-family:var(--f-head); font-weight:900; font-size:2rem; color:var(--gold); text-shadow:0 2px 8px #000; animation:dmg .9s forwards; pointer-events:none}
@keyframes dmg{0%{transform:translate(-50%,10px) scale(.6); opacity:0}25%{transform:translate(-50%,-8px) scale(1.15); opacity:1}100%{transform:translate(-50%,-40px); opacity:0}}
.party{display:flex; gap:8px; padding-block:8px}
.mem{flex:1; display:flex; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 8px; min-width:0}
.mem .av{width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center; font-family:var(--f-head); font-weight:900; background:var(--c); color:#fff}
.mem div{min-width:0; font-size:.72rem}
.mem b{display:block; font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.log{flex:1; overflow-y:auto; font-size:.86rem; line-height:1.7; color:#C9CED8; padding-block:6px}
.log p{margin:0 0 4px}
.cmds{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-block:10px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--panel); border-top:1px solid var(--line)}
.cmd{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:left}
.cmd b{display:block; font-size:.95rem}
.cmd small{color:var(--muted); font-size:.7rem}
.cmd:disabled{opacity:.4; cursor:default}
.cmd.main{grid-column:1/-1; background:linear-gradient(135deg,#3A3220,#2A2418); border-color:#6B5A2E}
.cmd.main b{color:var(--gold)}
.flashred{position:fixed; inset:0; background:rgba(224,86,60,.28); pointer-events:none; animation:fr .45s forwards; z-index:50}
@keyframes fr{to{opacity:0}}

/* 問題 */
.q{position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column; max-width:480px; margin:0 auto; animation:porIn .25s}
.q .head{display:flex; align-items:center; gap:10px; padding-block:calc(10px + env(safe-area-inset-top,0px)) 8px; border-bottom:1px solid var(--line)}
.q .head b{font-size:.8rem; color:var(--muted); font-weight:500}
.q .body{flex:1; overflow-y:auto; padding-block:14px}
.q .kind{font-size:.72rem; letter-spacing:.14em; color:var(--gold)}
.q .qt{font-family:var(--f-head); font-weight:700; font-size:1.12rem; line-height:1.7; margin:6px 0 14px}
.opt{display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; line-height:1.55}
.opt.sel{border-color:var(--gold); background:#2E2A1E}
.opt.ok{border-color:var(--green); background:#1C3328}
.opt.ng{border-color:var(--shu); background:#3A211C}
.opt.gone{opacity:.25; text-decoration:line-through}
.cats{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.cats .opt{text-align:center; margin:0}
.acct{font-family:var(--f-head); font-size:1.9rem; font-weight:900; text-align:center; padding:26px 0; background:#F4F1E8; color:#1B1B1B; border-radius:6px; margin-bottom:14px}
.je{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px}
.zone{min-height:96px; border:1px dashed var(--line); border-radius:12px; padding:8px; display:flex; flex-direction:column; gap:6px}
.zone.on{border-style:solid; border-color:var(--gold); background:#221F17}
.zone h4{margin:0; font-size:.75rem; color:var(--muted); font-weight:500}
.zone.on h4{color:var(--gold)}
.chip{display:inline-block; padding:8px 12px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); font-size:.88rem; margin:3px}
.chip.used{visibility:hidden}
.bank{text-align:center}
.paper{background:#F4F1E8; color:#1B1B1B; border-radius:6px; padding:12px 14px; margin-bottom:12px}
.paper .pk{font-family:var(--f-head); font-weight:900; text-align:center; letter-spacing:.3em; border-bottom:1.5px solid #1B1B1B; padding-bottom:4px}
.paper table{width:100%; border-collapse:collapse; font-size:.82rem; margin-top:6px}
.paper td{padding:4px 2px; vertical-align:top}
.paper td:first-child{color:#6A6455; width:38%}
.q .foot{padding-block:10px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--bg2)}
.exp{font-size:.88rem; line-height:1.75; margin-bottom:10px}
.exp b.ok{color:var(--green)} .exp b.ng{color:var(--shu)}
table.ent{width:100%; border-collapse:collapse; font-size:.82rem; margin:6px 0}
table.ent td,table.ent th{padding:4px 6px; border-bottom:1px solid var(--line); text-align:left}
table.ent td.a{text-align:right; font-variant-numeric:tabular-nums}

/* タイトル */
.title{flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; background:radial-gradient(90% 60% at 50% 30%, #23293A, var(--bg))}
.title h1{font-family:var(--f-head); font-size:2.6rem; font-weight:900; letter-spacing:.12em; margin:0}
.title p{color:var(--muted); margin:0; line-height:1.8}
.title .sub{font-size:.75rem; letter-spacing:.3em; color:var(--gold)}
.ledger{font-family:var(--f-head); font-size:.9rem; color:#C9CED8; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:10px 0; display:grid; grid-template-columns:repeat(4,1fr); text-align:center}
.ledger span+span{border-left:1px solid var(--line)}
.end-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:6px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}}
</style>

<div class="app" id="app"></div>

","desc":"預金・貸付金から受け取る利息。"},"受取手数料":{"cat":"収益","desc":"仲介などで受け取る手数料。"},"受取家賃":{"cat":"収益","desc":"建物などを貸して受け取る家賃。"},"雑収入":{"cat":"収益","desc":"本業以外の少額・臨時の収益。"},"仕入":{"cat":"費用","desc":"販売するための商品を買ったときの費用（三分法）。"},"給料":{"cat":"費用","desc":"従業員に支払う給与（総支給額）。"},"法定福利費":{"cat":"費用","desc":"社会保険料などの会社負担分。"},"福利厚生費":{"cat":"費用","desc":"従業員全員を対象にした福利厚生の費用。"},"旅費交通費":{"cat":"費用","desc":"業務で移動したときの交通費・出張費。"},"通信費":{"cat":"費用","desc":"電話・インターネット・郵便などの費用。"},"水道光熱費":{"cat":"費用","desc":"電気・ガス・水道の料金。"},"消耗品費":{"cat":"費用","desc":"文房具など、使ってなくなるもの・10万円未満の物品。"},"支払家賃":{"cat":"費用","desc":"事務所・店舗などの家賃。（地代家賃とも言う）"},"広告宣伝費":{"cat":"費用","desc":"不特定多数への宣伝のための費用。"},"交際費":{"cat":"費用","desc":"取引先との接待・贈答の費用。（接待交際費とも言う）"},"会議費":{"cat":"費用","desc":"打ち合わせ・会議のための費用。"},"支払手数料":{"cat":"費用","desc":"振込手数料や専門家への報酬など。"},"保険料":{"cat":"費用","desc":"損害保険などの保険料。"},"租税公課":{"cat":"費用","desc":"費用になる税金・印紙代など。"},"減価償却費":{"cat":"費用","desc":"固定資産の取得価額を使う期間に配分した費用。"},"貸倒損失":{"cat":"費用","desc":"売掛金などが回収できなくなった損失。"},"支払利息":{"cat":"費用","desc":"借入金に対して払う利息。"},"雑費":{"cat":"費用","desc":"どの科目にも当てはまらない少額の費用。"},"法人税等":{"cat":"費用","desc":"当期の利益に対する法人税・住民税・事業税。"}},"drill":[{"id":"b01","tag":"基本","q":"商品 50,000円を仕入れ、代金は掛けとした。","dr":[["仕入",50000]],"cr":[["買掛金",50000]],"exp":"商品を買ったら費用の「仕入」が増える（借方）。後払いの義務は負債の「買掛金」が増える（貸方）。"},{"id":"b02","tag":"基本","q":"商品 80,000円を売り上げ、代金は掛けとした。","dr":[["売掛金",80000]],"cr":[["売上",80000]],"exp":"後で代金を受け取る権利は資産の「売掛金」（借方）。収益の「売上」が増える（貸方）。"},{"id":"b03","tag":"基本","q":"得意先から売掛金 80,000円が普通預金に振り込まれた。","dr":[["普通預金",80000]],"cr":[["売掛金",80000]],"exp":"預金（資産）が増えて借方、売掛金（資産）が減るので貸方。経理ではこれを「入金消込」と呼ぶ。"},{"id":"b04","tag":"基本","q":"仕入先への買掛金 50,000円を普通預金から振り込んだ。","dr":[["買掛金",50000]],"cr":[["普通預金",50000]],"exp":"負債の買掛金が減る → 借方。資産の預金が減る → 貸方。"},{"id":"b05","tag":"基本","q":"事務用のボールペンとノートを 3,300円で購入し、現金で支払った。","dr":[["消耗品費",3300]],"cr":[["現金",3300]],"exp":"文房具などすぐ使うものは「消耗品費」。10万円未満の物品も通常は消耗品費で処理する。"},{"id":"b06","tag":"基本","q":"営業先への電車代 1,200円を現金で支払った。","dr":[["旅費交通費",1200]],"cr":[["現金",1200]],"exp":"業務の移動にかかった費用は「旅費交通費」。"},{"id":"b07","tag":"基本","q":"今月の携帯電話代 8,800円が普通預金から引き落とされた。","dr":[["通信費",8800]],"cr":[["普通預金",8800]],"exp":"電話・ネット・郵便は「通信費」。引き落としは預金の減少（貸方）。"},{"id":"b08","tag":"基本","q":"事務所の今月分の家賃 100,000円を普通預金から支払った。","dr":[["支払家賃",100000]],"cr":[["普通預金",100000]],"exp":"家賃の支払いは費用の「支払家賃」（地代家賃）。"},{"id":"b09","tag":"基本","q":"振込手数料 440円が普通預金から引き落とされた。","dr":[["支払手数料",440]],"cr":[["普通預金",440]],"exp":"銀行の振込手数料は「支払手数料」。少額でも毎回きちんと記帳するのが経理の基本。"},{"id":"b10","tag":"基本","q":"会社設立にあたり株式を発行し、1,000,000円が普通預金に払い込まれた。","dr":[["普通預金",1000000]],"cr":[["資本金",1000000]],"exp":"株主からの出資は純資産の「資本金」が増える（貸方）。"},{"id":"b11","tag":"基本","q":"銀行から 1,000,000円を借り入れ、普通預金に入金された。","dr":[["普通預金",1000000]],"cr":[["借入金",1000000]],"exp":"返済義務は負債の「借入金」。お金は増えるが利益ではない点に注意。"},{"id":"b12","tag":"基本","q":"借入金のうち 100,000円と利息 2,000円を普通預金から返済した。","dr":[["借入金",100000],["支払利息",2000]],"cr":[["普通預金",102000]],"exp":"元本の返済は負債の減少、利息は費用の「支払利息」。借方が2行になる（複合仕訳）。"},{"id":"b13","tag":"基本","q":"業務用のパソコン 200,000円を購入し、代金は翌月末払いとした。","dr":[["備品",200000]],"cr":[["未払金",200000]],"exp":"10万円以上のPCは固定資産の「備品」。商品以外の後払いは「買掛金」ではなく「未払金」。"},{"id":"b14","tag":"基本","q":"取引先との会食代 22,000円を会社のクレジットカードで支払った（後日引き落とし）。","dr":[["交際費",22000]],"cr":[["未払金",22000]],"exp":"接待は「交際費」。カード払いは引き落とし日まで「未払金」で負債計上する。"},{"id":"b15","tag":"基本","q":"契約書に貼る収入印紙 2,000円を現金で購入した。","dr":[["租税公課",2000]],"cr":[["現金",2000]],"exp":"収入印紙は税金の一種なので「租税公課」。"},{"id":"b16","tag":"基本","q":"Web広告の掲載料 55,000円を普通預金から支払った。","dr":[["広告宣伝費",55000]],"cr":[["普通預金",55000]],"exp":"不特定多数に向けた宣伝は「広告宣伝費」。"},{"id":"t01","tag":"仮勘定・前受","q":"出張に行く従業員に、旅費の概算額 30,000円を現金で渡した。","dr":[["仮払金",30000]],"cr":[["現金",30000]],"exp":"使い道・金額がまだ確定しないので一時的に資産の「仮払金」で処理する。"},{"id":"t02","tag":"仮勘定・前受","q":"出張から戻った従業員の精算で、旅費は 26,000円とわかり、残りは現金で返金された（概算払い 30,000円）。","dr":[["旅費交通費",26000],["現金",4000]],"cr":[["仮払金",30000]],"exp":"確定した金額を旅費交通費へ振り替え、戻ってきた現金を計上。仮払金は全額消す。"},{"id":"t03","tag":"仮勘定・前受","q":"普通預金に、内容不明の入金 15,000円があった。","dr":[["普通預金",15000]],"cr":[["仮受金",15000]],"exp":"理由がわかるまで負債の「仮受金」で受けておく。"},{"id":"t04","tag":"仮勘定・前受","q":"先日の内容不明の入金 15,000円は、得意先からの売掛金の回収だと判明した。","dr":[["仮受金",15000]],"cr":[["売掛金",15000]],"exp":"仮受金を消して、正しい科目（売掛金の減少）に振り替える。"},{"id":"t05","tag":"仮勘定・前受","q":"得意先から商品の注文を受け、内金 10,000円を現金で受け取った。","dr":[["現金",10000]],"cr":[["前受金",10000]],"exp":"商品を渡す前なので売上ではない。商品を渡す義務として負債の「前受金」。"},{"id":"t06","tag":"仮勘定・前受","q":"内金 10,000円を受け取っていた商品 50,000円を引き渡し、残額は掛けとした。","dr":[["前受金",10000],["売掛金",40000]],"cr":[["売上",50000]],"exp":"引き渡した時点で売上を計上。受け取り済みの前受金を充当し、残りが売掛金。"},{"id":"t07","tag":"仮勘定・前受","q":"売掛金 50,000円について、得意先の承諾を得て電子記録債権の発生記録を行った。","dr":[["電子記録債権",50000]],"cr":[["売掛金",50000]],"exp":"売掛金が「でんさい」に置き換わる。資産から資産への振替。"},{"id":"p01","tag":"給与","q":"給料 300,000円を支給。源泉所得税 8,000円・住民税 12,000円・社会保険料（本人負担分）45,000円を差し引き、残額を普通預金から振り込んだ。","dr":[["給料",300000]],"cr":[["預り金",65000],["普通預金",235000]],"exp":"給料は総支給額で費用計上。天引き分は会社が後で納める義務があるので「預り金」（負債）。8,000＋12,000＋45,000＝65,000円。"},{"id":"p02","tag":"給与","q":"給与から預かっていた源泉所得税 8,000円と住民税 12,000円を普通預金から納付した。","dr":[["預り金",20000]],"cr":[["普通預金",20000]],"exp":"預り金を納付すると負債が減る。源泉所得税・住民税は原則、翌月10日までに納付。"},{"id":"p03","tag":"給与","q":"社会保険料を普通預金から納付した。本人負担分（預り金）45,000円、会社負担分 45,000円。","dr":[["預り金",45000],["法定福利費",45000]],"cr":[["普通預金",90000]],"exp":"本人負担分は預り金の減少、会社負担分は費用の「法定福利費」。社会保険料は翌月末に引き落とされる。"},{"id":"p04","tag":"給与","q":"従業員の健康診断の費用 11,000円を現金で支払った（全員が対象）。","dr":[["福利厚生費",11000]],"cr":[["現金",11000]],"exp":"全従業員が対象の健康診断は「福利厚生費」。社会保険料の会社負担（法定福利費）と区別する。"},{"id":"c01","tag":"消費税","q":"【税抜経理】商品を 110,000円（税込、うち消費税 10,000円）で仕入れ、代金は掛けとした。","dr":[["仕入",100000],["仮払消費税",10000]],"cr":[["買掛金",110000]],"exp":"税抜経理では本体価格を仕入、消費税部分を「仮払消費税」（資産）に分ける。"},{"id":"c02","tag":"消費税","q":"【税抜経理】商品を 220,000円（税込、うち消費税 20,000円）で売り上げ、代金は掛けとした。","dr":[["売掛金",220000]],"cr":[["売上",200000],["仮受消費税",20000]],"exp":"受け取った消費税は国に納める預かりもの → 「仮受消費税」（負債）。"},{"id":"c03","tag":"消費税","q":"【決算】仮受消費税 20,000円と仮払消費税 10,000円を相殺し、納付額を計上した。","dr":[["仮受消費税",20000]],"cr":[["仮払消費税",10000],["未払消費税",10000]],"exp":"仮受−仮払＝納付額。差額 10,000円を「未払消費税」として負債計上する。"},{"id":"c04","tag":"消費税","q":"【税抜経理】事務用品 5,500円（税込、うち消費税 500円）を現金で購入した。","dr":[["消耗品費",5000],["仮払消費税",500]],"cr":[["現金",5500]],"exp":"経費でも税抜経理なら消費税部分を分ける。"},{"id":"k01","tag":"決算","q":"【決算】備品について当期の減価償却費 40,000円を計上した（直接法）。","dr":[["減価償却費",40000]],"cr":[["備品",40000]],"exp":"固定資産は使った期間に費用配分する。直接法では資産（備品）を直接減らす。"},{"id":"k02","tag":"決算","q":"得意先が倒産し、当期に発生した売掛金 30,000円が回収不能となった。","dr":[["貸倒損失",30000]],"cr":[["売掛金",30000]],"exp":"回収できない売掛金は消して、費用の「貸倒損失」。（引当金がある場合は別処理）"},{"id":"k03","tag":"決算","q":"【決算】借入金の利息のうち、当期分なのに未払いのもの 3,000円を計上した。","dr":[["支払利息",3000]],"cr":[["未払費用",3000]],"exp":"発生主義：払っていなくても当期の費用は当期に計上。相手は「未払費用」。"},{"id":"k04","tag":"決算","q":"【決算】当期に支払った保険料のうち、翌期分 12,000円を前払費用に振り替えた。","dr":[["前払費用",12000]],"cr":[["保険料",12000]],"exp":"翌期分は当期の費用ではないので、資産の「前払費用」に移す。"},{"id":"k05","tag":"決算","q":"【決算】当期の法人税・住民税・事業税 120,000円を計上した（中間納付なし）。","dr":[["法人税等",120000]],"cr":[["未払法人税等",120000]],"exp":"申告・納付は決算日から2か月以内。それまでは「未払法人税等」として負債計上。"},{"id":"k06","tag":"決算","q":"【決算】貸付金の利息のうち、当期分なのに未収のもの 5,000円を計上した。","dr":[["未収収益",5000]],"cr":[["受取利息",5000]],"exp":"当期に発生した収益は受け取っていなくても計上（発生主義）。相手は「未収収益」。"}],"checks":{"l01":[{"q":"月次の仕事として最も適切なものは？","choices":["年末調整","売掛金の入金消込","法人税の申告","株主総会の招集"],"a":1,"exp":"入金消込は毎月の売掛金管理の中心業務。年末調整・法人税申告は年次。"},{"q":"仕訳の根拠となる請求書・領収書などを何と呼ぶ？","choices":["証憑（しょうひょう）","伝票","元帳","試算表"],"a":0,"exp":"取引の事実を証明する書類を証憑と呼ぶ。原則7年間の保存が必要。"}],"l02":[{"q":"貸借対照表の等式として正しいのは？","choices":["資産＝負債−純資産","資産＝負債＋純資産","収益＝費用＋資産","負債＝資産＋純資産"],"a":1,"exp":"資産の調達元が、他人から（負債）か自分たち（純資産）かを表す。"},{"q":"「未払金」はどの要素？","choices":["資産","負債","収益","費用"],"a":1,"exp":"将来支払う義務なので負債。"}],"l03":[{"q":"費用が増えたとき、仕訳のどちら側に書く？","choices":["借方（左）","貸方（右）"],"a":0,"exp":"費用のホームポジションは借方。"},{"q":"借入金を返済した。借入金はどちら側？","choices":["借方（左）","貸方（右）"],"a":0,"exp":"負債の減少は借方。"}],"l04":[{"q":"事務所用の机（備品）を後払いで買った。貸方の科目は？","choices":["買掛金","未払金","売掛金","前受金"],"a":1,"exp":"商品以外の後払いは未払金。"},{"q":"請求書と入金を突き合わせて売掛金を消す作業は？","choices":["棚卸","入金消込","年末調整","減価償却"],"a":1,"exp":"入金消込は売掛金管理の基本業務。"}],"l05":[{"q":"給与から天引きした源泉所得税の納付期限（原則）は？","choices":["当月末","翌月10日","翌月末","年末"],"a":1,"exp":"源泉所得税は原則、支払った月の翌月10日まで。"},{"q":"社会保険料の会社負担分の科目は？","choices":["福利厚生費","法定福利費","預り金","給料"],"a":1,"exp":"法律で負担が決まっている保険料なので法定福利費。"}],"l06":[{"q":"売上のときに受け取った消費税の科目は（税抜経理）？","choices":["仮払消費税","仮受消費税","租税公課","売上"],"a":1,"exp":"国に納めるために預かった税なので仮受消費税（負債）。"},{"q":"インボイスの登録番号の形式は？","choices":["T＋13桁","法人番号＋J","数字10桁","I＋8桁"],"a":0,"exp":"「T」に続けて13桁の数字（法人は法人番号と同じ数字）。"}],"l07":[{"q":"取得価額 300,000円、耐用年数5年の備品の定額法による年間償却費は？","choices":["30,000円","50,000円","60,000円","75,000円"],"a":2,"exp":"300,000 ÷ 5 ＝ 60,000円。"},{"q":"1年分の保険料を払ったが、一部が翌期分だった。決算で使う科目は？","choices":["未払費用","前払費用","前受収益","未収収益"],"a":1,"exp":"先に払った翌期分の費用は前払費用（資産）。"}],"l08":[{"q":"試算表で見つけられるミスは？","choices":["科目の選び間違い","取引の記帳もれ","借方と貸方の金額の不一致","貸借両方を同じ額で間違えた"],"a":2,"exp":"試算表は貸借の合計が一致するかを確かめる。他のミスは別のチェックが必要。"},{"q":"帳簿上の現金残高がマイナス。考えられることは？","choices":["問題ない","記帳もれ・誤記の可能性が高い","利益が出ている","借入金が多い"],"a":1,"exp":"現金がマイナスになることは現実にはありえない。入金の記帳もれなどを疑う。"}],"l09":[{"q":"本業の儲けを表す利益は？","choices":["売上総利益","営業利益","経常利益","当期純利益"],"a":1,"exp":"営業利益＝粗利から販売費及び一般管理費を引いたもの。"},{"q":"支払利息は P/L のどこに入る？","choices":["売上原価","販管費","営業外費用","特別損失"],"a":2,"exp":"本業以外の財務的な費用なので営業外費用。"}],"l10":[{"q":"中小企業がPCを1台28万円で購入。特例を使うとどう処理できる？","choices":["消耗品費で処理","全額をその期の損金にできる","3年で均等償却しかできない","必ず4年で減価償却"],"a":1,"exp":"中小企業者等の少額減価償却資産の特例（30万円未満）。"},{"q":"個人の講師への講演料 200,000円。源泉徴収税額は？","choices":["0円（不要）","10,000円","20,420円","40,840円"],"a":2,"exp":"200,000 × 10.21% ＝ 20,420円。"}],"l11":[{"q":"支払前に照合する「三点」の組み合わせは？","choices":["見積書・発注書・契約書","発注書・納品書（検収）・請求書","請求書・領収書・通帳","伝票・元帳・試算表"],"a":1,"exp":"注文した内容・届いた内容・請求された内容が一致しているかを確かめる。"},{"q":"振込データの作成と承認を別の人にする目的は？","choices":["作業を速くするため","ミスや不正を防ぐため","法律で全社に義務づけられているため","銀行の手数料を下げるため"],"a":1,"exp":"相互チェック（内部統制）のため。ひとりで完結できると、ミスも不正も発見されにくい。"}]},"terms":[{"q":"取引の発生した期間に収益・費用を計上する考え方は？","choices":["現金主義","発生主義","実現主義","保守主義"],"a":1,"exp":"現金の出入りではなく、発生した時点で計上する。企業会計の基本。"},{"q":"固定資産の取得価額を、使用する期間に配分して費用にする手続きは？","choices":["減価償却","棚卸","貸倒","引当"],"a":0,"exp":"建物・備品・車両など。土地は減価償却しない。"},{"q":"給与や報酬を支払う会社が、所得税を差し引いて国に納める制度は？","choices":["年末調整","源泉徴収","確定申告","特別徴収"],"a":1,"exp":"差し引いた所得税は原則、翌月10日までに納付。"},{"q":"1年間の源泉所得税の過不足を12月の給与などで精算する手続きは？","choices":["年末調整","確定申告","算定基礎届","年度更新"],"a":0,"exp":"従業員の扶養控除・保険料控除などを反映し、源泉所得税を精算する。"},{"q":"給与支払報告書・源泉徴収票などの法定調書の提出期限は？","choices":["12月31日","1月31日","3月15日","3月31日"],"a":1,"exp":"毎年1月31日まで。償却資産申告も同じく1月31日まで。"},{"q":"社会保険料の基準となる標準報酬月額を決めるため、毎年7月に提出する書類は？","choices":["算定基礎届","月額変更届","年度更新申告書","扶養控除等申告書"],"a":0,"exp":"4〜6月の報酬をもとに7月1日〜10日に提出する。"},{"q":"労働保険（労災・雇用保険）の保険料を申告・納付する毎年の手続きは？","choices":["算定基礎","年度更新","年末調整","賞与支払届"],"a":1,"exp":"毎年6月1日〜7月10日に行う。"},{"q":"法人税の確定申告の期限（原則）は？","choices":["決算日から1か月以内","決算日から2か月以内","決算日から3か月以内","翌年3月15日"],"a":1,"exp":"事業年度終了の翌日から2か月以内。延長の特例もある。"},{"q":"仕入税額控除を受けるために原則として保存が必要な書類は？","choices":["見積書","納品書","適格請求書（インボイス）","発注書"],"a":2,"exp":"2023年10月からインボイス制度が始まった。"},{"q":"電子帳簿保存法で、2024年1月から電子保存が義務になったのは？","choices":["紙の領収書","電子取引のデータ（メール添付の請求書など）","仕訳帳","現金出納帳"],"a":1,"exp":"電子で受け取った請求書等は、印刷保存ではなく電子データのまま保存する。"},{"q":"帳簿書類の保存期間（法人税法上の原則）は？","choices":["3年","5年","7年","永久"],"a":2,"exp":"原則7年。欠損金がある事業年度は10年。"},{"q":"すべての勘定科目の残高・合計を集計し、貸借の一致を確かめる表は？","choices":["精算表","試算表","元帳","伝票"],"a":1,"exp":"月次・年次の決算で必ず作成する。"},{"q":"勘定科目ごとに取引を集計した帳簿は？","choices":["仕訳帳","総勘定元帳","現金出納帳","補助簿"],"a":1,"exp":"仕訳帳と総勘定元帳を主要簿と呼ぶ。"},{"q":"売上高から売上原価を引いた利益は？","choices":["営業利益","経常利益","売上総利益（粗利）","当期純利益"],"a":2,"exp":"粗利。商品・サービスそのものの儲け。"},{"q":"流動資産 ÷ 流動負債 で計算する指標は？","choices":["自己資本比率","流動比率","ROE","売上高利益率"],"a":1,"exp":"短期的な支払能力を示す。一般に高いほど安全。"},{"q":"1年以内に現金化・支払期限が来るかで流動・固定を分ける基準は？","choices":["正常営業循環基準","1年基準（ワン・イヤー・ルール）","重要性の原則","継続性の原則"],"a":1,"exp":"営業取引で生じた売掛金・買掛金などは正常営業循環基準で流動になる。"},{"q":"一度採用した会計処理を、正当な理由なく変更してはいけないという原則は？","choices":["継続性の原則","保守主義の原則","明瞭性の原則","単一性の原則"],"a":0,"exp":"期間比較ができなくなるのを防ぐため。企業会計原則の一般原則のひとつ。"},{"q":"取引先と債権・債務の残高を確認し合う書類は？","choices":["残高確認書","納品書","見積書","検収書"],"a":0,"exp":"監査や決算時に、売掛金・買掛金の残高が正しいか確認するために使う。"},{"q":"中小企業の少額減価償却資産の特例で、一括で費用にできるのは1個いくら未満？","choices":["10万円未満","20万円未満","30万円未満","50万円未満"],"a":2,"exp":"青色申告の中小企業者等は30万円未満を一括損金算入できる（年間合計300万円まで）。10万円未満は通常の消耗品扱い。"},{"q":"支払期日・取引先・金額をまとめ、資金の出入りを予測する表は？","choices":["資金繰り表","試算表","精算表","予算実績表"],"a":0,"exp":"黒字倒産を防ぐために、経理が作成・管理する重要な表。"}],"docs":[{"id":"d1","kind":"請求書","title":"株式会社ソラ印刷 → 当社","fields":[["請求書番号","S-2031"],["発行日","2026年4月30日"],["宛名","株式会社○○ 御中"],["内容","会社案内パンフレット 印刷 1,000部"],["金額（税抜）","200,000円"],["消費税（10%）","20,000円"],["合計","220,000円"],["登録番号","（記載なし）"]],"issues":["登録番号（T＋13桁）がない","取引内容が不明確","消費税の計算が誤っている","宛名がない"],"answer":[0],"exp":"インボイスには登録番号の記載が必要。登録番号がないと、原則として仕入税額控除が受けられない（経過措置の範囲を除く）。取引先が登録事業者かどうか、国税庁の公表サイトで確認するのも実務の基本。"},{"id":"d2","kind":"領収書","title":"文具店のレシート（手書き領収書）","fields":[["日付","（空欄）"],["宛名","上様"],["金額","¥8,800-"],["但し書き","お品代として"],["発行者","まちの文具店 T1234567890123"]],"issues":["日付が空欄","但し書きが「お品代」で内容がわからない","宛名が「上様」","金額が1万円を超えている"],"answer":[0,1],"exp":"日付がないと、いつの取引か確認できない。「お品代」では何を買ったか分からないので、購入内容のわかるレシートか明細をもらう。小売店などの簡易インボイスは宛名の省略が認められているため「上様」自体は問題になりにくい（社内ルールで宛名を求める会社もある）。"},{"id":"d3","kind":"請求書","title":"株式会社カワセミ食品 → 当社","fields":[["請求書番号","K-551"],["発行日","2026年4月25日"],["登録番号","T9876543210987"],["内容","社内イベント用 お菓子詰め合わせ ※"],["8%対象 合計","54,000円（うち消費税 4,000円）"],["10%対象 合計","11,000円（うち消費税 1,000円）"],["請求合計","75,000円"],["備考","※は軽減税率対象"]],"issues":["登録番号がない","請求合計が明細の合計と一致しない","軽減税率対象の表示がない","税率ごとの消費税額がない"],"answer":[1],"exp":"54,000＋11,000＝65,000円なのに、請求合計は75,000円。請求書の計算ミスは意外と多いので、検算は必須。軽減税率の対象（※）や税率ごとの消費税額はきちんと書かれている。"},{"id":"d4","kind":"経費精算","title":"営業部メンバーの経費精算書","fields":[["日付","2026年4月13日（日）"],["内容","タクシー代"],["区間","銀座 → 自宅"],["時刻","23:40"],["金額","6,800円"],["目的","（空欄）"],["添付","領収書あり"]],"issues":["休日の利用で、業務目的が書かれていない","自宅までの利用で、業務との関係を確認する必要がある","領収書がない","金額が高すぎて精算できない"],"answer":[0,1],"exp":"休日・深夜・自宅まで、という条件が重なると私的利用の可能性もある。否定するのではなく「業務目的（誰と・何のため）」を書いてもらうのが実務。社内の経費規程（深夜タクシーのルールなど）も確認する。"},{"id":"d5","kind":"請求書","title":"合同会社ハヤブサ物流 → 当社","fields":[["請求書番号","HY-0098"],["発行日","2026年4月30日"],["宛名","株式会社○○ 御中"],["登録番号","T5555666677778"],["内容","4月分 配送料（明細別紙）"],["金額（税抜）","120,000円"],["消費税（10%）","12,000円"],["合計","132,000円"],["振込先","いつもと同じ口座"]],"issues":["登録番号がない","消費税の計算が誤っている","合計が誤っている","特に不備はない"],"answer":[3],"exp":"不備なし。「何もない」と判断できることも大事。疑いすぎて支払いを止めると、期日遅延になってしまう。あとは発注・納品の記録と照合して支払処理へ。"},{"id":"d6","kind":"経費精算","title":"営業部長の経費精算書","fields":[["日付","2026年4月20日"],["内容","取引先との会食（相手：株式会社ミドリ物産 2名）"],["参加人数","4名（当社2名）"],["金額","56,000円"],["申請科目","会議費"],["添付","領収書あり"]],"issues":["1人あたり14,000円で1万円を超えるので、会議費ではなく交際費","参加者の記録がない","領収書がない","社外の人との飲食は経費にできない"],"answer":[0],"exp":"56,000円÷4名＝14,000円。1人1万円を超える社外との飲食は交際費。相手先・人数の記録はきちんとある。科目の誤りは税務申告に影響するので、経理で正しく直す。"},{"id":"d7","kind":"請求書","title":"フリーランス・デザイナー（個人）→ 当社","fields":[["発行日","2026年4月28日"],["登録番号","T1111222233334"],["内容","Webバナー制作 5点"],["金額（税抜）","50,000円"],["消費税（10%）","5,000円"],["源泉徴収税","（記載なし）"],["ご請求額","55,000円"]],"issues":["個人へのデザイン料なのに、源泉徴収の計算がない","登録番号がない","消費税の計算が誤っている","特に不備はない"],"answer":[0],"exp":"請求書に書かれていなくても、個人へのデザイン料は支払う側に源泉徴収義務がある。50,000円×10.21%＝5,105円を差し引いて49,895円を支払い、翌月10日までに納付する（消費税額が明確に区分されていれば税抜金額を基準にできる）。"},{"id":"d8","kind":"請求書","title":"株式会社ツバメ商会 → 当社（PDFで受信）","fields":[["請求書番号","TB-7781"],["発行日","2026年4月30日"],["登録番号","T2222333344445"],["内容","事務用品一式"],["合計","33,000円（うち消費税 3,000円）"],["振込先","海外銀行の口座（前回までと異なる）"],["メール本文","「至急、本日中にお振込みください」"]],"issues":["振込先がいつもと違い、急がせている（詐欺の疑い）","登録番号がない","合計が誤っている","特に不備はない"],"answer":[0],"exp":"振込先の変更＋急がせる文面は、ビジネスメール詐欺の典型。登録済みの電話番号で取引先に確認するまで、支払いを止める。"}],"career":[{"rank":"新入社員","years":"入社1年目","icon":"🌱","intro":"経理部に配属された新入社員。まずは日々の業務と「経理の基本姿勢」を身につけよう。","events":[{"day":"4月1日（月）","who":"経理課長","icon":"🧑‍💼","tag":"心構え","text":"ようこそ経理課へ。最初に聞いておきたい。経理の仕事で一番大事なことは何だと思う？","choices":[["証憑（証拠書類）にもとづいて、期日どおり正確に処理すること",10,"そのとおり。「根拠」「期日」「正確さ」が経理の三本柱だ。"],["とにかく早く仕訳を入力すること",-5,"スピードも大事だが、根拠のない仕訳は後で必ず問題になる。"],["頼まれたら、なんでも経費にしてあげること",-10,"それをやると税務調査で否認され、会社が追徴課税を受けることになる。"]],"point":"経理は「証憑主義」。請求書・領収書・契約書などの根拠がない取引は記帳しない。"},{"day":"4月2日（火）","who":"営業部のメンバー","icon":"🧑‍💻","tag":"期ズレ","text":"3月28日に納品した案件、請求書をまだ出してなかった！ 今日出すから、4月の売上ってことでいいよね？","choices":[["納品は3月なので、3月の売上として計上します。請求書はすぐ発行しましょう",15,"正解。売上は「請求した日」ではなく「納品・役務提供した日」に計上する（出荷基準・検収基準など会社のルールに従う）。"],["請求書の日付が4月なので、4月の売上にします",-15,"これが「期ズレ」。3月決算の会社なら、前期の売上が今期にずれて決算が不正確になる。"],["入金されたときに売上にします",-10,"それは現金主義。会社の会計は発生主義が原則。"]],"point":"売上・費用の計上時期は「いつ請求したか」ではなく「いつ取引が発生したか」。月末・期末の計上もれ（期ズレ）は監査でも重点的に見られる。"},{"day":"4月5日（金）","who":"支払処理","icon":"🧾","tag":"二重払い","text":"同じ取引先から、郵送の請求書とPDFの請求書が届いた。金額は同じ 330,000円、請求書番号も同じ「INV-0412」。","choices":[["同じ請求書の重複なので、1回だけ支払う。請求書番号で支払済みかも確認する",15,"正解。二重払いは経理で一番多いミスのひとつ。請求書番号・金額・日付で突き合わせよう。"],["2通届いたので2回支払う",-20,"二重払い。返金してもらうのは手間がかかり、取引先にも迷惑。"],["念のため両方とも支払わない",-10,"支払遅延になってしまう。期日どおりに払うのも経理の大切な仕事。"]],"point":"支払前チェック：①請求書番号の重複 ②発注・納品（検収）との一致 ③金額・振込先 ④承認者の承認。"},{"day":"4月10日（水）","who":"カレンダー","icon":"📅","tag":"期限","text":"今日は10日。何か忘れていない？","choices":[["3月分の給与で預かった源泉所得税と住民税の納付期限！",15,"正解。毎月10日は源泉所得税・住民税の納付期限（納期の特例を受けていない場合）。遅れると延滞税などがかかる。"],["社会保険料の納付日",-5,"社会保険料は翌月末の口座振替。10日ではない。"],["特に何もない",-15,"源泉所得税の納付を忘れると、不納付加算税と延滞税がかかる。"]],"point":"毎月のルーティン期限：10日＝源泉所得税・住民税、月末＝社会保険料の引き落とし。"},{"day":"4月26日（金）","who":"月次締め","icon":"🔍","tag":"残高照合","text":"月末の預金残高照合。通帳の残高が、帳簿より 5,500円少ない。","choices":[["通帳の明細と帳簿を1件ずつ突き合わせて、記帳もれの引き落としを探す",15,"正解。口座振替の手数料やサブスク料金の引き落としの記帳もれがよくある原因。必ず原因を特定する。"],["差額を雑損失にして合わせる",-15,"原因を調べずに差額を埋めるのは最悪の対応。不正や大きなミスを見逃すことになる。"],["来月になれば合うかもしれないので、そのままにする",-10,"差異は放置すると原因がどんどん追えなくなる。"]],"point":"預金・現金・売掛金・買掛金は毎月「外部の証拠（通帳・取引先）」と残高を照合する。合わないときは、まず原因の特定。"}]},{"rank":"担当者","years":"入社2〜3年目","icon":"📗","intro":"ひとりで支払・入金・経費を任されるように。取引先や社内とのやりとりで判断力が試される。","events":[{"day":"4月3日（水）","who":"メール","icon":"📧","tag":"不正防止","text":"取引先「株式会社ミドリ物産」から急ぎのメール：「口座を変更しました。本日支払い分から、新しい口座（海外の銀行）へお振込みください。至急お願いします」","choices":[["登録済みの電話番号に電話して、担当者に直接確認する",20,"完璧。これは「ビジネスメール詐欺（BEC）」の典型的な手口。メール以外の、もともと知っている連絡先で確認するのが鉄則。"],["このメールに返信して、本当か確認する",-10,"メールが乗っ取られていたら、返信先も詐欺師。メールで確認しても意味がない。"],["至急とのことなので、口座を変更して振り込む",-25,"これで数千万円をだまし取られる被害が実際に起きている。急がせるのは詐欺の常套手段。"]],"point":"振込先の変更依頼は、必ずメール以外の既知の連絡先で確認。変更は書面＋上長承認など社内ルールに沿って行う。"},{"day":"4月8日（月）","who":"広報部","icon":"🎨","tag":"源泉徴収","text":"個人で活動しているデザイナーさんにロゴを作ってもらった。デザイン料 100,000円（税抜）の請求書が来たので、そのまま振り込んでほしいとのこと。","choices":[["個人へのデザイン料なので、源泉所得税（10.21%）を差し引いて支払う",20,"正解。個人へのデザイン料・原稿料・講演料・士業報酬などは源泉徴収が必要。100,000円 × 10.21% ＝ 10,210円を差し引き、翌月10日までに納付する。"],["請求どおり全額を振り込む",-15,"源泉徴収もれ。後から会社が不足分と不納付加算税を納めることになる。"],["法人と同じなので特に何もしない",-10,"法人への支払いは原則源泉徴収不要だが、個人への一定の報酬は必要。"]],"point":"源泉徴収が必要な報酬：原稿料・デザイン料・講演料・税理士/弁護士等の報酬など（支払先が個人の場合）。100万円以下は10.21%、超える部分は20.42%。"},{"day":"4月11日（木）","who":"入金確認","icon":"🏦","tag":"入金消込","text":"株式会社アオバ商事への請求 220,000円に対し、入金は 219,560円。440円足りない。","choices":[["振込手数料が差し引かれていると考え、契約条件を確認。当社負担で問題なければ支払手数料として処理する",15,"正解。契約で「振込手数料は買い手負担」なら先方に連絡、慣行で当社負担なら差額を費用処理する。"],["440円の未入金として、毎月督促し続ける",-5,"契約上請求できるなら連絡は必要だが、まず原因を推測・確認しよう。"],["差額は放置して、売掛金を全額消す",-15,"差額の仕訳をしないと売掛金や預金の残高が合わなくなる。"]],"point":"入金差額の原因あるある：振込手数料の差引、まとめ払い、値引き・相殺、過入金、別の会社名義での入金。"},{"day":"4月12日（金）","who":"営業部長","icon":"🍽️","tag":"交際費","text":"取引先と4人で会食して、飲食代は 36,000円でした。精算をお願いします。","choices":[["1人あたり9,000円。1万円以下の飲食費なので、参加者・人数などを記録すれば交際費から除外できる。記録を出してもらう",20,"正解。2024年4月以降、1人あたり1万円以下の飲食費は、相手先・人数などを記録すれば税務上の交際費から除外できる（会議費などで処理）。"],["飲食代はすべて会議費にする",-10,"1人1万円を超える接待は交際費。科目を変えても税務上は交際費として扱われる。"],["領収書だけあれば、記録はいらない",-5,"1万円基準の適用には、日付・参加者の氏名と関係・人数・金額・店名などの記録が必要。"]],"point":"交際費か会議費か：社外との飲食で1人1万円以下（2024年4月〜）なら記録の保存を条件に交際費から除外可。社内だけの飲食は対象外。"},{"day":"4月22日（月）","who":"メール","icon":"📎","tag":"電子帳簿保存法","text":"取引先から、請求書のPDFがメールで届いた。","choices":[["PDFのまま、取引日・取引先・金額で検索できるようにして保存する",15,"正解。電子帳簿保存法により、電子で受け取った請求書等は電子データのまま保存する（2024年1月から義務化）。"],["印刷して紙のファイルに綴じれば十分",-10,"紙に印刷しただけの保存は、電子取引データの保存としては認められない。"],["処理が終わったら削除する",-15,"請求書は原則7年間の保存義務がある。"]],"point":"電子取引データの保存要件：①改ざん防止（訂正削除の記録が残るシステム or 事務処理規程など） ②検索性（日付・金額・取引先）。"}]},{"rank":"主任","years":"入社4〜6年目","icon":"📘","intro":"月次決算の中心メンバーに。科目判断・決算処理・後輩指導を任される。","events":[{"day":"4月15日（月）","who":"総務部","icon":"💻","tag":"固定資産","text":"新しいノートPCを 250,000円（税抜）で1台購入しました。経理処理をお願いします。（当社は中小企業・青色申告）","choices":[["30万円未満なので、中小企業者等の少額減価償却資産の特例で、全額をその期の費用（損金）にできる",20,"正解。中小企業者等は30万円未満の資産を一括で損金算入できる（年間合計300万円まで）。固定資産台帳への記録と償却資産税の申告も忘れずに。"],["10万円以上なので、必ず4年で減価償却する",0,"原則はそのとおりだが、中小企業には特例がある。会社の方針で選ぶ。"],["消耗品費で処理する",-10,"消耗品費として一括処理できるのは原則10万円未満。"]],"point":"金額の目安：10万円未満＝消耗品費／20万円未満＝一括償却資産（3年均等）も可／30万円未満＝中小企業の特例／それ以上＝固定資産として減価償却。"},{"day":"4月17日（水）","who":"施設管理","icon":"🔧","tag":"修繕費","text":"壊れた空調の修理で 180,000円かかりました。元の状態に戻しただけです。","choices":[["元の状態に戻す修理で20万円未満なので、修繕費として費用処理する",15,"正解。原状回復の修理は修繕費。性能アップや耐用年数を延ばす支出は資本的支出（資産計上）になる。"],["高額なので建物（資産）に計上する",-10,"価値を高める改良ではないので、資産計上は不要。"],["消耗品費で処理する",-5,"修理代は修繕費が適切。"]],"point":"修繕費と資本的支出：原状回復・維持管理は修繕費、価値の向上・耐用年数の延長は資本的支出。20万円未満や3年以内の周期の修理は修繕費にできる形式基準もある。"},{"day":"3月31日（決算日）","who":"決算準備","icon":"📦","tag":"決算","text":"3月中に工事は完了しているが、業者からの請求書（約500,000円）がまだ届いていない。決算はどうする？","choices":[["作業は当期に完了しているので、見積額で未払計上する（請求書到着後に差額を調整）",20,"正解。費用も発生主義。請求書がなくても、当期に発生した費用は当期に計上する。"],["請求書が届いてから、翌期の費用にする",-15,"期ズレで当期の利益が過大になる。"],["決算を締めるのを待ってもらう",-5,"申告期限があるので、見積もりで計上して進めるのが実務。"]],"point":"決算での「未払計上」：期末までに納品・役務提供を受けたもので請求書が未着のものは、見積額で計上する。"},{"day":"4月30日（火）","who":"経理課長","icon":"🧑‍💼","tag":"月次分析","text":"月次試算表を見たら、広告宣伝費が先月の3倍になっている。明日の役員会に出すけど、大丈夫？","choices":[["増えた理由（キャンペーン実施など）を担当部署に確認し、コメントを添えて報告する",15,"正解。数字を作るだけでなく「なぜそうなったか」を説明できるのが経理の価値。誤計上（科目違い・二重計上）の発見にもつながる。"],["数字は正しく集計しているので、そのまま出す",-5,"集計が正しくても、科目間違いや二重計上が隠れているかもしれない。"],["目立つので、一部を翌月に回して平らにする",-25,"これは利益操作。絶対にやってはいけない。"]],"point":"月次分析の基本：前月比・前年同月比・予算比で大きく動いた科目は、原因を確認してコメントをつける。"},{"day":"入社3年目の春","who":"新入社員","icon":"🧑‍🎓","tag":"後輩指導","text":"新しく入った後輩が、10万円の応接テーブルを「消耗品費」で入力していた。どうする？","choices":[["なぜ備品（固定資産）になるのか理由を説明し、迷いやすい判断をチェックリストにまとめて共有する",15,"正解。直すだけでなく「なぜ」を伝え、仕組みで再発を防ぐのが主任の仕事。"],["黙って自分で修正しておく",-5,"後輩は同じミスを繰り返す。教える機会を逃している。"],["みんなの前で厳しく注意する",-10,"萎縮するとミスを隠すようになる。経理ではそれが一番怖い。"]],"point":"ミスの再発防止は「人を責める」より「仕組みで防ぐ」。チェックリスト・マニュアル・ダブルチェック。"}]},{"rank":"係長","years":"入社7〜9年目","icon":"📙","intro":"チームのまとめ役。監査・税務調査の窓口となり、チームの仕組みづくりも担う。","events":[{"day":"4月19日（金）","who":"社長","icon":"👔","tag":"公私混同","text":"この家族旅行のホテル代、会社の経費で落としておいて。","choices":[["業務に関係ない支出は経費にできないことを説明し、個人負担にしてもらう（会社が払った場合は役員への貸付などで処理）",20,"勇気ある正解。私的な支出を経費にすると、税務調査で否認され、役員賞与扱い・重加算税の対象になることも。会社と社長を守るのも経理の役目。"],["社長の指示なので、旅費交通費で処理する",-25,"粉飾・脱税に加担することになる。経理担当者も責任を問われかねない。"],["福利厚生費で処理する",-15,"家族旅行は福利厚生費にもならない。"]],"point":"経費になるのは「事業のための支出」だけ。立場が上の人の依頼でも、ルールにもとづいて説明できるのが信頼される経理。"},{"day":"係長1年目","who":"経費精算の確認","icon":"🕵️","tag":"社内不正","text":"部下Aさんのタクシー領収書を見ていたら、毎月同じタクシー会社で、領収書の連番が飛び飛びに続いている。金額は毎回ちょうど上限ぎりぎり。","choices":[["事実（日付・金額・連番）を整理して上長・内部監査に報告し、調査は会社の手続きに沿って進める",20,"正解。不正の疑いは、証拠を整理し、決められたルートで報告する。決めつけず、ひとりで抱え込まない。"],["本人をすぐに呼び出して問い詰め、チームにも共有する",-5,"まだ疑いの段階。証拠が散逸したり、名誉の問題になったりする。"],["気まずいので見なかったことにする",-25,"見逃すと不正は拡大する。発見できる立場の人が動かないと、組織は守れない。"]],"point":"不正の兆候：同じパターンの繰り返し、上限ぎりぎりの金額、連番の領収書、休日・深夜の多用。発見したら事実を整理して正式なルートで報告。"},{"day":"係長1年目","who":"税務調査官","icon":"🏛️","tag":"税務調査","text":"税務調査で調査官から「この 120,000円の会議費、相手は誰で何の会議ですか？」と聞かれた。すぐには思い出せない。","choices":[["「確認してお答えします」と伝え、証憑と記録を調べて事実を回答する",15,"正解。わからないことを推測で答えるのは厳禁。記録にもとづいて正確に回答する。"],["たぶん○○社との打ち合わせだったと思います、とその場で答える",-10,"推測の回答が事実と違うと、全体の信頼性を疑われる。"],["関係する資料を見せないようにする",-25,"調査の妨げは重いペナルティの対象。誠実な対応が結局一番の近道。"]],"point":"税務調査対応：①聞かれたことに事実で答える ②わからないことは持ち帰って確認 ③日頃から証憑と記録を整理しておくのが最大の対策。"},{"day":"係長1年目","who":"監査法人","icon":"📋","tag":"債権管理","text":"監査法人から「期末の売掛金のうち、1年以上入金がない取引先がありますね」と指摘された。","choices":[["営業部と回収状況・相手の経営状態を確認し、回収可能性に応じて貸倒引当金の計上や貸倒処理を検討する",15,"正解。回収できない可能性がある債権は、資産として過大にならないよう評価する。"],["そのうち入金されるはずなので、何もしない",-10,"回収できない売掛金を資産に残すと、資産と利益が過大になる。"],["指摘された分だけ、こっそり消しておく",-15,"根拠なく消すのも誤り。確認・判断・承認の手続きが必要。"]],"point":"売掛金は「年齢調べ（エイジング）」で滞留を管理。長期滞留は回収可能性を評価し、貸倒引当金・貸倒損失を検討する。"},{"day":"係長2年目","who":"経理部長","icon":"🧑‍💼","tag":"決算早期化","text":"うちの月次決算は締めに15日かかっている。経営陣から「もっと早く数字がほしい」と言われた。どう改善する？","choices":[["締めのスケジュールと作業を洗い出し、見積計上の活用・残高照合の前倒し・他部署からの資料提出期限の設定で短縮する",15,"正解。早期化は「作業の並べ替え」と「他部署を巻き込むルールづくり」がカギ。"],["全員で残業して乗り切る",-5,"一時的には早くなっても続かない。仕組みが変わっていない。"],["チェック作業を省いて早くする",-15,"早くても間違った数字では意味がない。"]],"point":"決算早期化のコツ：①作業の標準化・マニュアル化 ②締め日前に終わる作業は前倒し ③請求書・経費の提出期限を全社ルールに ④重要性の低いものは見積もりで計上。"}]},{"rank":"課長","years":"入社10〜14年目","icon":"💼","intro":"経理課を率いる管理職。会社のお金と計画を守り、他部門とも渡り合う。","events":[{"day":"課長1年目","who":"資金繰り表","icon":"💰","tag":"資金繰り","text":"資金繰り表を更新したら、大口の入金が翌月にずれ込み、来月末の支払い（仕入代金・給与）に約3,000万円足りないことがわかった。","choices":[["すぐに経営陣へ報告し、取引銀行に短期借入や当座貸越の相談をする。並行して入金の前倒し交渉も検討する",20,"正解。資金不足は「早く気づいて早く動く」がすべて。銀行は直前の相談を嫌う。"],["仕入先への支払いを、連絡せずに遅らせる",-15,"信用を一気に失い、取引停止につながりかねない。"],["支払日の前日まで様子を見る",-20,"直前では銀行も対応できない。利益が出ていても資金が尽きれば倒産する（黒字倒産）。"]],"point":"資金繰り表で「いつ・いくら足りないか」を数か月先まで予測するのが課長の重要任務。"},{"day":"課長1年目","who":"営業本部長","icon":"📈","tag":"売上の押し込み","text":"期末直前、営業本部長から「目標まで少し足りない。取引先に大量出荷して今期の売上にして、来期に返品してもらう約束はついてるから」と言われた。","choices":[["返品前提の出荷は売上の実態がなく計上できないと説明し、必要なら上層部や監査役にも相談する",20,"正解。いわゆる「押し込み販売」。返品が前提なら売上計上は認められず、粉飾につながる。"],["本部長の指示なので、出荷どおり売上に計上する",-25,"粉飾決算に加担することになる。発覚すれば会社も担当者も重い責任を負う。"],["売上には計上するが、メモだけ残しておく",-15,"メモを残しても不正な計上であることは変わらない。"]],"point":"売上は「実態」で判断。期末の異常な出荷、翌期の大量返品、異例の取引条件は、監査でも重点的に確認される。"},{"day":"課長2年目","who":"予算会議","icon":"🎯","tag":"予算管理","text":"各部から出てきた来期予算を積み上げたら、会社の利益目標に5,000万円届かない。","choices":[["各部の前提（単価・数量・人員計画）を確認し、経営方針と照らし合わせて各部と調整する",15,"正解。経理は数字の「つじつま合わせ」ではなく、前提を確認して実現可能な計画にするファシリテーター。"],["経理の判断で各部の経費を一律カットする",-10,"現場の納得がない予算は達成されない。"],["売上予算を目標に合うように上乗せしておく",-15,"根拠のない予算は、未達になったときに誰も責任を持てない。"]],"point":"予算管理：前提を明確にした予算を作り、毎月「予算と実績の差（予実差異）」を分析して打ち手につなげる。"},{"day":"課長2年目","who":"経理チーム","icon":"🤖","tag":"経理DX","text":"請求書の受け取り・入力・支払いの処理に毎月チームで100時間以上かかっている。どう改善する？","choices":[["今の業務フローを洗い出してムダを見直した上で、電子請求書の受領や自動仕訳などのシステムを導入し、効果を測る",15,"正解。「業務の見直し→システム化→効果測定」の順番が大事。"],["高機能なシステムを入れれば全部解決する",-5,"今の非効率なフローのままシステム化すると、ムダも一緒に自動化される。"],["人を増やして対応する",0,"短期的には有効でも、根本的な解決にはならない。"]],"point":"経理DX：ペーパーレス化（電子帳簿保存法対応）、銀行明細の自動取込、請求書の電子受領、自動仕訳など。まずは業務フローの見直しから。"}]},{"rank":"経理部長","years":"入社15〜17年目","icon":"🏆","intro":"経営陣の一員として、会社の数字に最終責任を持つ立場。最後の試練に挑もう。","events":[{"day":"経理部長1年目","who":"社長（経営会議）","icon":"👔","tag":"利益とキャッシュ","text":"社長「今期は過去最高益なのに、なぜ会社の現金は減ったんだ？ 経理のミスじゃないのか？」","choices":[["キャッシュフロー計算書をもとに、売掛金・在庫の増加、設備投資、借入返済などで現金が出ていったことを説明する",20,"正解。利益と現金は一致しない。その差を経営者にわかる言葉で説明できるのが経理部長。"],["申し訳ありません、確認します（とりあえず謝る）",-10,"ミスではない。根拠を示して説明するべき場面。"],["会計とはそういうものです、と答える",-15,"経営者が判断できるように、具体的に説明する責任がある。"]],"point":"利益が出ても現金が減る主な理由：売掛金の増加（未回収）、在庫の増加、設備投資、借入金の返済、法人税の支払い。"},{"day":"経理部長1年目","who":"社長","icon":"👔","tag":"粉飾の誘惑","text":"社長「このままだと、公表済みの業績予想を大きく下回る。株価は暴落するし、銀行との融資契約の条件（財務制限条項）にも引っかかる。年間契約の売上、今期に全部入れれば予想どおりだろ？」","choices":[["年間契約の売上は契約期間に応じて計上するしかないと説明し、業績予想の修正をすぐに適時開示して、銀行にも改善計画を説明することを提案する",25,"最高の答え。サブスクの売上はサービスを提供した期間に応じて計上する。業績予想から大きくずれる見込みになったら、速やかに修正を開示するのが上場会社の義務。隠せば株主を欺くことになる。"],["言われたとおり、年間契約の売上を今期に一括で計上する",-30,"まだ提供していないサービスの売上を前倒しする粉飾。有価証券報告書の虚偽記載として、会社も役員も重い責任を問われる。"],["今期の費用の一部を来期に回す",-25,"これも利益操作。監査・税務調査で発覚し、会社の信用を失う。"]],"point":"上場会社は、売上・利益の見込みが公表済みの業績予想から一定以上ずれる場合（売上高は10%、利益は30%が目安）、すぐに修正を開示する必要がある。悪いニュースほど早く・正確に。"},{"day":"経理部長2年目","who":"人事部","icon":"👥","tag":"組織づくり","text":"経理部で退職が続き、「あの人しかわからない業務」があちこちにある。","choices":[["業務の棚卸しとマニュアル化を進め、ジョブローテーションと育成計画で属人化を解消する",15,"正解。属人化はミス・不正・業務停止のリスク。仕組みとして引き継げる組織が強い。"],["部長自ら全部の業務を覚えて対応する",-10,"部長が倒れたら全部止まる。根本解決にならない。"],["辞めそうな人に業務を集中させないよう、仕事を減らす",-5,"一時しのぎ。業務の見える化が先。"]],"point":"強い経理組織：業務の見える化・標準化、ダブルチェック、ローテーション、育成計画。部長の仕事は「自分がいなくても回る組織」を作ること。"}]},{"rank":"CFO","years":"入社18年目〜","icon":"👑","intro":"最高財務責任者として、プライム市場への移行・M&A・投資家対応を率いる。会社の未来を数字で描く最終章。","events":[{"day":"CFO1年目","who":"監査法人","icon":"📋","tag":"内部統制","text":"社長の号令でプライム市場への移行を目指すことに。ところが監査法人から「子会社の承認の記録がほとんど残っていません。内部統制の『開示すべき重要な不備』になるおそれがあります」と言われた。","choices":[["子会社も含めて業務の流れとリスクを文書化し、承認・職務分掌などの統制を整えて、運用状況をテストしていく",20,"正解。上場会社は毎年、財務報告にかかる内部統制を経営者が評価して報告し、監査を受ける。子会社も対象になる。整備→運用→評価には時間がかかる。"],["期末直前に、まとめて承認の書類を作れば間に合う",-15,"統制が実際に運用されていた証拠（記録）が必要。後から作った書類では通用しないどころか、記録の改ざんになる。"],["厳しいことを言わない監査法人に変える",-20,"いわゆる「オピニオン・ショッピング」。上場会社が監査法人を交代するときは理由の開示が必要で、市場からも厳しく見られる。"]],"point":"J-SOX（内部統制報告制度）：上場会社は財務報告の信頼性を確保する内部統制を経営者が評価して報告し、監査人の監査を受ける。"},{"day":"CFO1年目","who":"社長","icon":"👔","tag":"M&A","text":"社長が同業の会社を買収したがっている。ところが、相手の会社が他社の借入の保証人になっているという噂がある。決算書には載っていない。","choices":[["財務・税務デューデリジェンスで契約書・保証・訴訟などを調べ、見つかったリスクを買収価格や契約条件に反映する",20,"正解。決算書に載っていない「簿外債務」は買収後に表面化すると大損害になる。調べて、価格や表明保証条項で手当てする。"],["社長が乗り気なので、調べずに進める",-20,"買収後に保証債務が現実になれば、会社の財産で払うことになる。"],["噂があるので、買収を即座に中止する",-5,"調べもせずに判断するのは早計。リスクを測って条件で調整するのがCFOの仕事。"]],"point":"デューデリジェンス（DD）：買収前に相手の財務・税務・法務を調べること。簿外債務・税務リスク・偶発債務の発見がカギ。"},{"day":"CFO2年目","who":"機関投資家","icon":"📊","tag":"IR","text":"決算説明会で、投資家から「今期は減益ですね。理由と今後の見通しは？」と厳しく質問された。","choices":[["減益の原因を数字で説明し、対策と見通しを示す。業績予想を変えるときは適時開示で全員に同時に公表する",20,"正解。悪いニュースほど早く・正確に・公平に。特定の人だけに重要な情報を伝えるのはフェア・ディスクロージャー・ルール違反になる。"],["「来期は必ず回復します」と楽観的な見通しだけ話す",-10,"根拠のない見通しは信頼を失う。外れたときの反動も大きい。"],["詳しいことは個別に親しい投資家にだけ話す",-20,"未公表の重要情報を一部にだけ伝えるのは、フェア・ディスクロージャー・ルールに反する。"]],"point":"IR（投資家向け広報）の基本：事実・原因・対策をセットで。重要な情報は適時開示で全員に同時に公表する。"},{"day":"CFO2年目","who":"内部通報窓口","icon":"📨","tag":"内部通報","text":"内部通報窓口に「子会社で、取引先と発注を回し合って売上を膨らませている（循環取引）」という通報が届いた。","choices":[["通報者を守ったうえで、監査役や外部の専門家も入れて独立した調査を始め、必要なら過去の決算を訂正する",25,"正解。通報者の保護は法律上の義務。調査は利害関係のない立場で行い、事実なら訂正と再発防止まで責任を持つ。"],["子会社の社長に事情を聞いて、任せる",-15,"当事者に調査を任せると、証拠隠しや口裏合わせの恐れがある。"],["誰が通報したのかをまず突き止める",-30,"通報者探しや不利益な扱いは公益通報者保護法で禁止されている。組織の自浄作用も失われる。"]],"point":"内部通報制度：通報者の秘密保持と不利益な取扱いの禁止が大前提。不正の早期発見に最も役立つ仕組みのひとつ。"},{"day":"CFO2年目","who":"社長","icon":"👔","tag":"最後の決断","text":"調査の結果、子会社の循環取引は事実だった。社長「プライム市場への移行審査の最中だ……この件、なんとか伏せておけないか？」","choices":[["すぐに適時開示し、過去の決算を訂正して、原因と再発防止策を示す。市場変更は見送ることを提案する",30,"CFOとしての最高の決断。プライム移行が遠のいても、隠した不正が後で発覚すれば上場廃止や刑事責任にもつながる。誠実さこそ会社の価値を守る。"],["審査が終わるまで伏せておき、移行後に静かに直す",-30,"重要な事実を知りながら開示しないのは、有価証券報告書の虚偽記載や開示義務違反になりうる。しかも未公表の重要事実を知る社員が株を売買すれば、インサイダー取引になる。"],["子会社の担当者だけの責任にして、本体には関係ないことにする",-20,"連結グループ全体の財務報告に責任を持つのがCFO。トカゲの尻尾切りでは再発する。"]],"point":"CFOの使命は「正しい数字で会社の未来を守ること」。上場会社の信頼は、悪いニュースをどれだけ早く正直に出せるかで決まる。一度失うと取り戻せない。"}]}],"promote":0.6};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function portrait(id, expr = 'normal') {
  const p = P[id]; if (!p || id === 'narr' || id === 'you') return '';

  // 仮の影絵（人物の色）

    <path d="M30 380 C34 280 80 232 150 228 C220 232 266 280 270 380Z" fill="url(#g-${id})"/>

/* ───────── 状態 ───────── */
const KEY = 'balance-sheet-v1';
const NEW = () => ({ name:'', stat:{ work:30, family:50, health:70, money:20 }, aff:{}, ch:0, step:0, flags:{}, know:0, cleared:[] });
let G = (() => { try { return { ...NEW(), ...JSON.parse(localStorage.getItem(KEY)) }; } catch (e) { return NEW(); } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} };
const nm = s => s.replaceAll('{name}', G.name || 'あなた');
const STAT = [['work','仕事','--work'],['family','家族','--family'],['health','元気','--health'],['money','貯金','--money']];
const clamp = v => Math.max(0, Math.min(100, v));
function bump(fx) {
  for (const [k, v] of Object.entries(fx || {})) {
    if (k in G.stat) G.stat[k] = clamp(G.stat[k] + v);
    else if (k.startsWith('aff_')) { const c = k.slice(4); G.aff[c] = clamp((G.aff[c] ?? 30) + v); }
  }
  save(); drawBS(Object.keys(fx || {}));
}
const fxHtml = fx => `<div class="effects">${Object.entries(fx || {}).map(([k, v]) => {
  const lab = STAT.find(s => s[0] === k)?.[1] || (k.startsWith('aff_') ? `${P[k.slice(4)].name.split(' ')[0]}の信頼` : k);
  return `<span class="fx ${v >= 0 ? 'up' : 'down'}">${lab} ${v >= 0 ? '+' : ''}${v}</span>`; }).join('')}</div>`;

/* ───────── 画面の骨組み ───────── */
function shell(inner) {
  $('#app').innerHTML = `<div class="bs side" id="bs"></div>${inner}`;
  drawBS();
}
function drawBS(flash = []) {
  const el = $('#bs'); if (!el) return;
  const ch = CHAPTERS[G.ch];
  el.innerHTML = `<div class="t"><span>人生のバランスシート</span><b>${ch ? `${ch.no}「${ch.title}」` : ''}</b></div>` + STAT.map(([k, l, c]) =>
    `<div class="meter ${flash.includes(k) ? 'flash' : ''}"><span>${l}</span><i><s style="width:${G.stat[k]}%; background:var(${c})"></s></i><em>${G.stat[k]}</em></div>`).join('');
}

/* ───────── ノベル（台詞）エンジン ───────── */
let tapResolve = null;
function stageHtml(scene, place) {
  return `<div class="stage" style="--scene:${scene || ''}"><div class="place" id="place">${esc(place || '')}</div><div class="who" id="who"></div></div>
    <div class="box side" id="box"><div id="nameplate"></div><div class="text" id="text"></div><div id="extra"></div><div class="next" id="nx" hidden>▼</div></div>`;
}
let curWho = null;
function setWho(id, expr) {
  const w = $('#who'); if (!w) return;
  if (id === null) { w.innerHTML = ''; curWho = null; return; }
  if (id === 'narr' || id === 'you') return;
  if (curWho !== id + expr) { w.innerHTML = portrait(id, expr); curWho = id + expr; }
}
async function say(id, text, expr = 'normal') {
  setWho(id, expr);
  const p = P[id], np = $('#nameplate'), tx = $('#text'), nx = $('#nx'); $('#extra').innerHTML = '';
  np.innerHTML = id === 'narr' ? '' : `<span class="name" style="--c:${p.c}">${esc(id === 'you' ? (G.name || 'あなた') : p.name)}${p.role ? `<small>${esc(p.role)}</small>` : ''}</span>`;
  tx.className = 'text' + (id === 'narr' ? ' narr' : '');
  const full = nm(text); tx.textContent = ''; nx.hidden = true;
  let i = 0, done = false;
  await new Promise(res => {
    const tick = setInterval(() => { i += 2; tx.textContent = full.slice(0, i); if (i >= full.length) { clearInterval(tick); done = true; nx.hidden = false; } }, 28);
    tapResolve = () => { if (!done) { clearInterval(tick); tx.textContent = full; done = true; nx.hidden = false; return; } tapResolve = null; res(); };
  });
}
async function choose(opts) {
  $('#nx').hidden = true;
  const ex = $('#extra');
  return new Promise(res => {
    ex.innerHTML = `<div class="choices">${opts.map((o, i) => `<button class="choice" data-i="${i}">${esc(nm(o.t))}${o.hint ? `<small>${esc(o.hint)}</small>` : ''}</button>`).join('')}</div>`;
    ex.onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; ex.onclick = null; ex.innerHTML = ''; res(+b.dataset.i); };
  });
}
async function note(html) { // 解説や数値の変化を見せて、タップで進む
  $('#extra').innerHTML = html; $('#nx').hidden = false;
  await new Promise(res => { tapResolve = () => { tapResolve = null; res(); }; });
}
document.addEventListener('click', e => { if (e.target.closest('#box') && !e.target.closest('button,input') && tapResolve) tapResolve(); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && tapResolve && !e.target.closest('input,button')) { e.preventDefault(); tapResolve(); } });

/* 台本の実行。行の形：['人物', '台詞', '表情'] / {place, scene} / {fn} */
async function run(lines) {
  for (const l of lines) {
    if (Array.isArray(l)) await say(l[0], l[1], l[2]);
    else if (l.place !== undefined) { const p = $('#place'); if (p) p.textContent = l.place; if (l.scene) $('.stage').style.setProperty('--scene', l.scene); if (l.clear) setWho(null); }
    else if (l.fn) await l.fn();
  }
}

/* ───────── 事件（選択肢） ───────── */
const SPEAKER = { 心構え:'sumiya', 期ズレ:'hayase', 二重払い:'akeno', 期限:'akeno', 残高照合:'sumiya' };
const EV = Object.fromEntries(DATA.career.flatMap(s => s.events).map(e => [e.tag, e]));
async function incident(tag) {
  const e = EV[tag], who = SPEAKER[tag] || 'akeno';
  await say(who, e.text.replace(/^[^「]*「/, '「').replace(/^(?!「)/, ''));
  const order = shuffle(e.choices.map((_, i) => i));
  const pick = order[await choose(order.map(i => ({ t:e.choices[i][0] })))];
  const [t, pts, fb] = e.choices[pick], best = Math.max(...e.choices.map(c => c[1]));
  const fx = { work: Math.round(pts / 2), [`aff_${who}`]: pts === best ? 8 : -4 };
  bump(fx);
  await say(who, pts === best ? rnd(['……なるほど。それでいい。','助かった。その判断で合ってる。','さすがだね。']) : pts < 0 ? rnd(['……本気で言ってる？','それは、まずいな。','ちょっと待って。']) : 'うーん、悪くはないけど……', pts === best ? 'happy' : pts < 0 ? 'angry' : 'normal');
  await note(`<div class="point"><b>${pts === best ? '◎ ベストな判断' : pts < 0 ? '× 危ない判断' : '△ もう一歩'}</b>　${esc(fb)}<br><span style="color:var(--muted)">実務ポイント：${esc(e.point)}</span></div>${fxHtml(fx)}`);
}
const rnd = a => a[Math.floor(Math.random() * a.length)];

/* ───────── 業務バトル（コマンド制） ───────── */
const A = DATA.accounts, CATS = ['資産','負債','純資産','収益','費用'];

const docs = Object.fromEntries(DATA.docs.map(d => [d.id, d]));
const Qs = {

  cat: a => ({ t:'cat', acct:a }),
  mcq: o => ({ t:'mcq', ...o }),
  doc: id => ({ t:'doc', ...docs[id] }),
  chk: (l, i) => ({ t:'mcq', ...DATA.checks[l][i] }),
};
const SKILLS = {
  akeno:{ name:'朱書きチェック', cost:1, desc:'次の問題で、まちがいの選択肢を消す' },
  sumiya:{ name:'そろばん検算', cost:2, desc:'次の正解のダメージが2倍' },
  hayase:{ name:'勢いで押し切る', cost:1, desc:'相手の次の攻撃を1回止める' },
};
async function battle(cfg) {
  // cfg: { enemy, kind, desc, hp, atk, pool:()=>[q], party:['akeno'], taunts:[] }
  let hp = cfg.hp, mp = 2, buff = {}, qi = 0, pool = shuffle(cfg.pool()), combo = 0;
  const party = cfg.party || [];
  shell(`<div class="battle"><div class="enemy side" id="en"></div><div class="party side" id="pt"></div><div class="log side" id="log"></div><div class="cmds side" id="cm"></div></div>`);
  const log = t => { const p = document.createElement('p'); p.innerHTML = t; $('#log').prepend(p); };
  const drawEnemy = () => { $('#en').innerHTML = `<div class="card" id="ecard"><div class="k">${esc(cfg.kind)}</div><b>${esc(cfg.enemy)}</b><p>${esc(cfg.desc)}</p></div>
    <div class="hp"><span>残り</span><i><s style="width:${hp / cfg.hp * 100}%; background:var(--shu)"></s></i><span>${hp}/${cfg.hp}</span></div>`; };
  const drawParty = () => { $('#pt').innerHTML = `<div class="mem" style="--c:${P.you.c}"><span class="av">${esc((G.name || 'あ')[0])}</span><div><b>${esc(G.name || 'あなた')}</b>元気 ${G.stat.health} ／ 気力 ${'●'.repeat(mp)}${'○'.repeat(Math.max(0, 4 - mp))}</div></div>`
    + party.map(id => `<div class="mem" style="--c:${P[id].c}"><span class="av" ${face(id) ? `style="background:url(${face(id)}) center 12%/cover"` : ''}>${face(id) ? '' : P[id].ch}</span><div><b>${esc(P[id].name)}</b>${esc(SKILLS[id].name)}</div></div>`).join(''); };
  drawEnemy(); drawParty(); drawBS();
  log(`<b>${esc(cfg.enemy)}</b> が あらわれた。`);
  return new Promise(resolve => {
    const cmds = () => {
      $('#cm').innerHTML = `<button class="cmd main" data-c="atk"><b>処理する</b><small>問題に答えて片づける</small></button>`
        + party.map(id => `<button class="cmd" data-c="sk:${id}" ${mp < SKILLS[id].cost ? 'disabled' : ''}><b>${esc(SKILLS[id].name)}</b><small>${esc(P[id].name.split(' ')[0])}／気力${SKILLS[id].cost}　${esc(SKILLS[id].desc)}</small></button>`).join('')
        + `<button class="cmd" data-c="coffee" ${G.stat.money < 2 ? 'disabled' : ''}><b>缶コーヒー</b><small>元気+12　貯金−2</small></button>`;
      $('#cm').onclick = async e => {
        const b = e.target.closest('[data-c]'); if (!b || b.disabled) return;
        const c = b.dataset.c; $('#cm').onclick = null;
        if (c === 'coffee') { bump({ health:12, money:-2 }); drawParty(); log('缶コーヒーを飲んだ。元気が少し戻った。'); return enemyTurn(); }
        if (c.startsWith('sk:')) {
          const id = c.slice(3); mp -= SKILLS[id].cost; buff[id] = true; drawParty();
          log(`<b>${esc(P[id].name)}</b>の「${esc(SKILLS[id].name)}」！`);
          if (id === 'hayase') log('相手の次の攻撃を止めた。');
          return cmds();
        }
        // 処理する → 問題
        if (qi >= pool.length) { pool = shuffle(cfg.pool()); qi = 0; }
        const q = pool[qi++];
        const ok = await ask(q, { hint: buff.akeno, title: cfg.enemy });
        buff.akeno = false;
        if (ok) {
          combo++; G.know++;
          let d = 22 + Math.min(10, Math.floor(G.know / 5)) + (combo >= 3 ? 8 : 0);
          if (buff.sumiya) { d *= 2; buff.sumiya = false; }
          hp = Math.max(0, hp - d); mp = Math.min(4, mp + 1);
          drawEnemy(); $('#ecard').classList.add('hit');
          const dm = document.createElement('div'); dm.className = 'dmg'; dm.textContent = d; $('#en').append(dm); setTimeout(() => dm.remove(), 900);
          log(`処理完了！ ${combo >= 3 ? `<b>${combo}連続</b>で ` : ''}${d} 件を片づけた。`);
          drawParty();
          if (hp <= 0) { await sleep(700); return finish(true); }
        } else { combo = 0; log('処理ミス……。やり直しが発生した。'); }
        enemyTurn();
      };
    };
    const enemyTurn = async () => {
      await sleep(350);
      if (buff.hayase) { buff.hayase = false; log(`${esc(P.hayase.name)}が勢いで押し切った。相手は動けない。`); return cmds(); }
      const d = cfg.atk + Math.floor(Math.random() * 4);
      bump({ health: -d }); drawParty();
      const fl = document.createElement('div'); fl.className = 'flashred'; document.body.append(fl); setTimeout(() => fl.remove(), 500);
      log(`<span style="color:var(--shu)">${esc(rnd(cfg.taunts))}</span>　元気 −${d}`);
      if (G.stat.health <= 0) { await sleep(600); return finish(false); }
      cmds();
    };
    const finish = win => { save(); resolve(win); };
    cmds();
  });
}

/* 問題の出題（全画面） */
function ask(q, o = {}) {
  return new Promise(resolve => {
    const el = document.createElement('div'); el.className = 'q';
    let sel = null, picked = [], placed = { 借方:[], 貸方:[] }, side = '借方';
    const right = q.t === 'je' ? [...new Set([...q.dr, ...q.cr].map(x => x[0]))] : [];
    const bank = q.t === 'je' ? shuffle([...right, ...shuffle(Object.keys(A).filter(a => !right.includes(a) && right.some(r => A[r].cat === A[a].cat))).slice(0, 3), ...shuffle(Object.keys(A).filter(a => !right.includes(a))).slice(0, 1)]) : [];
    const gone = new Set();
    if (o.hint) {
      if (q.t === 'mcq') shuffle(q.choices.map((_, i) => i).filter(i => i !== q.a)).slice(0, Math.max(0, q.choices.length - 2)).forEach(i => gone.add(i));
      if (q.t === 'cat') shuffle(CATS.filter(c => c !== A[q.acct].cat)).slice(0, 3).forEach(c => gone.add(c));
    }
    const kind = { je:'仕訳を切る', cat:'勘定科目の区分', mcq:'判断', doc:'証憑チェック' }[q.t];
    const body = () => {
      if (q.t === 'mcq') return `<div class="qt">${esc(q.q)}</div>` + q.choices.map((c, i) => `<button class="opt ${sel === i ? 'sel' : ''} ${gone.has(i) ? 'gone' : ''}" data-i="${i}" ${gone.has(i) ? 'disabled' : ''}>${esc(c)}</button>`).join('');
      if (q.t === 'cat') return `<div class="acct">${esc(q.acct)}</div><div class="cats">` + CATS.map(c => `<button class="opt ${sel === c ? 'sel' : ''} ${gone.has(c) ? 'gone' : ''}" data-c="${c}" ${gone.has(c) ? 'disabled' : ''}>${c}</button>`).join('') + '</div>';
      if (q.t === 'doc') return `<div class="paper"><div class="pk">${esc(q.kind)}</div><div style="text-align:center; font-size:.72rem; color:#6A6455">${esc(q.title)}</div><table>${q.fields.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div>`
        + `<div class="kind" style="margin-bottom:6px">問題があるものをすべて選ぶ（なければ選ばない）</div>` + q.issues.map((s, i) => `<button class="opt ${picked.includes(i) ? 'sel' : ''}" data-t="${i}">${esc(s)}</button>`).join('');
      return `<div class="qt">${esc(q.q)}</div><div class="je">${['借方','貸方'].map(s => `<div class="zone ${side === s ? 'on' : ''}" data-z="${s}"><h4>${s}（${s === '借方' ? '左' : '右'}）${side === s ? '　← ここに入る' : ''}</h4>${placed[s].map(a => `<button class="chip" data-p="${s}|${esc(a)}">${esc(a)}</button>`).join('')}</div>`).join('')}</div>`
        + `<div class="bank">${bank.map(a => `<button class="chip ${placed.借方.includes(a) || placed.貸方.includes(a) ? 'used' : ''}" data-b="${esc(a)}">${esc(a)}</button>`).join('')}</div>`;
    };
    const can = () => q.t === 'mcq' || q.t === 'cat' ? sel !== null : q.t === 'je' ? placed.借方.length && placed.貸方.length : true;
    const draw = () => {
      el.innerHTML = `<div class="head side"><b>${esc(o.title || '')}</b></div><div class="body side"><div class="kind">${kind}</div>${body()}</div>
        <div class="foot side"><button class="btn" id="go" ${can() ? '' : 'disabled style="opacity:.4"'}>${q.t === 'doc' && !picked.length ? '問題なし' : '決定'}</button></div>`;
      $('#go', el).onclick = () => can() && judge();
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.id === 'go' || el.dataset.done) return;
      if (b.dataset.i) sel = +b.dataset.i; else if (b.dataset.c) sel = b.dataset.c;
      else if (b.dataset.t) { const i = +b.dataset.t; picked = picked.includes(i) ? picked.filter(x => x !== i) : [...picked, i]; }
      else if (b.dataset.b) { if (!placed.借方.includes(b.dataset.b) && !placed.貸方.includes(b.dataset.b)) placed[side].push(b.dataset.b); }
      else if (b.dataset.p) { const [s, a] = b.dataset.p.split('|'); placed[s] = placed[s].filter(x => x !== a); }
      else return;
      draw();
    });
    el.addEventListener('click', e => { const z = e.target.closest('[data-z]'); if (z && !e.target.closest('button') && !el.dataset.done) { side = z.dataset.z; draw(); } });
    const judge = () => {
      let ok;
      if (q.t === 'mcq') ok = sel === q.a; else if (q.t === 'cat') ok = sel === A[q.acct].cat;
      else if (q.t === 'doc') { const f = a => a.filter(i => !/特に不備はない/.test(q.issues[i])).sort().join(); ok = f(q.answer) === f(picked); }
      else { const s = x => [...new Set(x.map(y => y[0]))].sort().join(); ok = s(q.dr) === [...placed.借方].sort().join() && s(q.cr) === [...placed.貸方].sort().join(); }
      el.dataset.done = 1;
      let exp = '';
      if (q.t === 'mcq') exp = `正解：<b>${esc(q.choices[q.a])}</b><br>${esc(q.exp)}`;
      else if (q.t === 'cat') exp = `<b>${esc(q.acct)}</b>は<b>${A[q.acct].cat}</b>。${esc(A[q.acct].desc)}`;
      else if (q.t === 'doc') exp = `正解：<b>${q.answer.map(i => esc(q.issues[i])).join('／')}</b><br>${esc(q.exp)}`;
      else { const n = Math.max(q.dr.length, q.cr.length); exp = `<table class="ent"><tr><th>借方</th><th></th><th>貸方</th><th></th></tr>${Array.from({length:n}, (_, i) => `<tr><td>${q.dr[i] ? esc(q.dr[i][0]) : ''}</td><td class="a">${q.dr[i] ? yen(q.dr[i][1]) : ''}</td><td>${q.cr[i] ? esc(q.cr[i][0]) : ''}</td><td class="a">${q.cr[i] ? yen(q.cr[i][1]) : ''}</td></tr>`).join('')}</table>${esc(q.exp)}`; }
      $('.foot', el).innerHTML = `<div class="exp"><b class="${ok ? 'ok' : 'ng'}">${ok ? '○ 処理完了' : '× 処理ミス'}</b><br>${exp}</div><button class="btn" id="cont">戦闘に戻る</button>`;
      $('#cont', el).onclick = () => { el.remove(); resolve(ok); };
    };
    draw(); document.body.append(el);
  });
}

      <p style="color:var(--muted); margin:6px 0 0; font-size:.88rem">次は 2章「仮勘定」。支払・入金の担当として、振込詐欺のメール、個人への報酬、そして過労で倒れた先での出会いが待っている。</p></div>`);
    await note(`<p style="color:var(--muted); font-size:.85rem">このデモは1章までです。2章以降は制作中です。</p><button class="btn ghost" id="again" style="margin-top:8px">最初からやり直す</button>`);
  },
];
async function afterBattle(win, helper) {
  shell(stageHtml(SCN.office, ''));
  if (win) {
    bump({ work:+6, [`aff_${helper}`]:+6 });
    await run([[helper, helper === 'akeno' ? 'おつかれ。……あなた、伸びるよ。' : '検算も合っています。おつかれさまでした。', 'happy']]);
  } else {
    bump({ health:+40, family:-6, work:-4 });
    await run([['narr','気がつくと、デスクに突っ伏して朝を迎えていた。'], [helper, '……残りは、わたしたちで片づけておいた。今日は帰って寝なさい。', 'sad']]);
    await note(`<div class="point">元気が尽きると、仲間が助けてくれるが、仕事と家族の数値が下がる。缶コーヒーやスキルで元気を保とう。</div>`);
  }
}

/* ───────── 進行 ───────── */
async function play() {
  while (G.step < STEPS.length) {
    await STEPS[G.step]();
    G.step++; save();
  }
  title();
}
function title() {
  $('#app').innerHTML = `<div class="title side">
    <div class="sub">経理ラボ　ストーリーモード</div>
    <h1>バランスシート</h1>
    <div class="ledger"><span>仕事</span><span>家族</span><span>元気</span><span>貯金</span></div><p style="font-family:var(--f-head); color:var(--ink)">人生の左右は、釣り合うか。</p>
    <p>新入社員からCFOへ。仕事と人生の両方で、答えのない選択を重ねていく約30年の物語。</p>
    <p style="font-size:.8rem">登場する人物・会社はすべて架空です。</p>
    <button class="btn" id="start">${G.step > 0 ? '続きから' : 'はじめる'}</button>
    ${G.step > 0 ? '<button class="btn ghost" id="reset">最初から</button>' : ''}</div>`;
  $('#start').onclick = () => play();
  const r = $('#reset'); if (r) r.onclick = () => { G = NEW(); save(); title(); };
}
document.addEventListener('click', e => { if (e.target.id === 'again') { G = NEW(); save(); title(); } });
title();
</script>
